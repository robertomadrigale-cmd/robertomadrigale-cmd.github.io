<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pulso a la Vista</title>
<meta name="description" content="Entrenamiento de pulso y tiempo para bateristas: ejercicios, medidor de precisión con micrófono, metrónomo, grooves y pistas sin batería.">
<meta name="theme-color" content="#0b1016" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eef3f1" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pulso">
<link rel="preload" href="fonts/source-sans-3-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/barlow-condensed-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Concept: sala de ensayo nocturna — la cuadrícula de ritmo como regla visual, turquesa para lo que se toca y coral para el 1. */
@font-face{font-family:'Barlow Condensed';font-weight:800;font-display:swap;src:url(fonts/barlow-condensed-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Source Sans 3';font-weight:400;font-display:swap;src:url(fonts/source-sans-3-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Source Sans 3';font-weight:600;font-display:swap;src:url(fonts/source-sans-3-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Source Sans 3';font-weight:700;font-display:swap;src:url(fonts/source-sans-3-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:600;font-display:swap;src:url(fonts/ibm-plex-mono-latin-600-normal.woff2) format('woff2')}
:root{
  --font-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --font-body:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;
  --accent:#2cc4b0;--accent-ink:#04201c;
  --bg:#0b1016;--surface:#131b25;--surface2:#1b2633;--fg:#eef1ec;--muted:#93a3b0;--line:#26394a;
  --glass:rgba(13,19,27,.74);--accent-text:#4fd8c4;--root:#ea6f50;--good:#62c394;--bad:#ea6f50;--blue:#6db3e0;
  --nav-h:64px;color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef3f1;--surface:#ffffff;--surface2:#dde8e5;--fg:#13202a;--muted:#536673;--line:#c6d6d2;--glass:rgba(244,249,247,.8);--accent-text:#0b7a6c;--root:#bf4128;--good:#2b8559;--bad:#bf4128;--blue:#2f7cae;color-scheme:light}}
:root[data-theme="light"]{--bg:#eef3f1;--surface:#ffffff;--surface2:#dde8e5;--fg:#13202a;--muted:#536673;--line:#c6d6d2;--glass:rgba(244,249,247,.8);--accent-text:#0b7a6c;--root:#bf4128;--good:#2b8559;--bad:#bf4128;--blue:#2f7cae;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:400 17px/1.6 var(--font-body);min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
h1,h2{font-family:var(--font-display);font-weight:800;text-transform:uppercase;line-height:.95;letter-spacing:.005em;text-wrap:balance}
h1{font-size:clamp(38px,9vw,60px)}
h2{font-size:clamp(28px,6.5vw,40px)}
h3{font:700 19px/1.25 var(--font-body)}
:focus-visible{outline:3px solid var(--accent-text);outline-offset:2px}
/* shell */
.shell{display:flex;min-height:100vh}
.side{display:none}
main{flex:1;min-width:0;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 72px)}
.topbar{position:sticky;top:0;z-index:20;background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.topbar .in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:56px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.topbar .ttl{flex:1;min-width:0;font:600 13px var(--font-mono);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid transparent;background:none;display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:hover{background:var(--surface)}
.icon-btn svg{width:22px;height:22px}
.page{max-width:880px;margin:0 auto;padding-block:24px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab{height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font:600 11px var(--font-body);letter-spacing:.02em}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent-text)}
@media (min-width:900px){
  .tabs{display:none}
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;width:236px;flex:none;padding:24px 14px;border-right:1px solid var(--line);background:var(--surface)}
  .side .brand{display:flex;align-items:center;gap:10px;font:600 13px var(--font-mono);letter-spacing:.14em;text-transform:uppercase;padding:6px 10px 22px}
  .side .brand svg{width:26px;height:26px}
  .side a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;text-decoration:none;color:var(--muted);font-weight:600}
  .side a svg{width:22px;height:22px}
  .side a:hover{background:var(--surface2);color:var(--fg)}
  .side a[aria-current="page"]{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent-text)}
  main{padding-bottom:96px}
}
/* mini reproductor */
.player{position:fixed;z-index:29;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 10px);width:min(560px,calc(100% - 24px));display:flex;align-items:center;gap:10px;background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:8px 8px 8px 14px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
@media (min-width:900px){.player{bottom:18px;left:calc(50% + 118px)}}
.player .pl{flex:1;min-width:0;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .dotlive{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
/* elementos */
.eyebrow{font:600 12px var(--font-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--accent-text)}
.sub{color:var(--muted);font-size:18px;max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}
.hl{background:linear-gradient(transparent 62%,color-mix(in srgb,var(--accent) 38%,transparent) 62%);color:var(--accent-text);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{border-color:var(--good);color:var(--good)}
.btn.ok.on{background:var(--good);color:#0b1a12;border-color:var(--good)}
.btn svg{width:18px;height:18px;flex:none}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font:800 34px/1 var(--font-display)}
.stat span{font:500 12px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.tool{display:flex;gap:14px;align-items:center;text-decoration:none;color:var(--fg)}
.tool .ic{width:48px;height:48px;border-radius:14px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent-text);display:grid;place-items:center;flex:none}
.tool .ic svg{width:26px;height:26px}
.tool b{display:block;font-size:17px}
.tool span{font-size:14px;color:var(--muted)}
a.card:hover{border-color:var(--accent)}
.list{display:flex;flex-direction:column;gap:10px}
.lrow{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--fg);padding:14px 16px}
.mn{font:800 22px var(--font-display);background:var(--accent);color:var(--accent-ink);border-radius:9px;min-width:40px;height:40px;display:grid;place-items:center;flex:none}
.mn.done{background:var(--good);color:#0b1a12}
.lrow .mt{flex:1;min-width:0}
.lrow .mt b{display:block;line-height:1.25}
.lrow .mt span{font-size:14px;color:var(--muted)}
.lrow .cnt{font:500 12px var(--font-mono);color:var(--muted);white-space:nowrap}
.parth{margin-top:10px}
/* lección */
.lhead{display:flex;flex-direction:column;gap:12px}
.lead{font:800 26px/1.05 var(--font-display);text-transform:uppercase;color:var(--accent-text);text-wrap:balance}
.prose{max-width:66ch}
.blockh{font:600 12px var(--font-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--accent-text);margin-bottom:10px}
.widget{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.controls{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.cl{display:block;font:500 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font:600 14px var(--font-body);padding:8px 12px;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;display:inline-flex;align-items:baseline;gap:6px}
.chip i{font:500 10px var(--font-mono);font-style:normal;opacity:.7}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cap{margin-top:10px;font-size:15px;color:var(--muted)}
.cap b{color:var(--fg)}
.pbtn{font:600 14px var(--font-body);padding:8px 14px;min-height:40px;border-radius:10px;border:1px solid var(--accent);background:transparent;color:var(--accent-text);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.pbtn::before{content:"";border-left:9px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent}
.pbtn:hover{background:color-mix(in srgb,var(--accent) 15%,transparent)}
.row-act{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.box{border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.box ul,.box ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.box li::marker{color:var(--accent-text)}
.trick{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
/* ejercicio */
.ex{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:16px;background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.ex.done{border-left-color:var(--good)}
.ex .eh{display:flex;align-items:flex-start;gap:12px}
.ex .tag{font:600 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent-text)}
.ex.done .tag{color:var(--good)}
.ex h3{margin-top:2px}
.ex .meta{font:500 12px var(--font-mono);color:var(--muted);white-space:nowrap;margin-left:auto;padding-top:2px}
.ex ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.ex ol li::marker{font:600 13px var(--font-mono);color:var(--accent-text)}
.goal{font-size:15px;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px dashed var(--line)}
.goal b{color:var(--good)}
.exbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.minimet{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:12px;padding:3px;background:var(--bg)}
.minimet .v{font:600 14px var(--font-mono);min-width:64px;text-align:center}
.minimet .icon-btn{width:36px;height:36px;border-radius:9px}
.tm{font:600 15px var(--font-mono);font-variant-numeric:tabular-nums}
/* mástil */
.fbwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.fb{display:block;width:100%;height:auto;margin:0 auto}
.fb .wood{fill:var(--surface2)}
.fb .fret{stroke:var(--line);stroke-width:1.6}
.fb .nut{stroke:var(--muted);stroke-width:5}
.fb .str{stroke:var(--muted);opacity:.9}
.fb .inlay{fill:var(--line)}
.fb .num{fill:var(--muted);font:500 11px var(--font-mono);text-anchor:middle}
.fb .slab{fill:var(--muted);font:500 11px var(--font-mono);text-anchor:middle;dominant-baseline:central}
.fb .mute{fill:var(--muted);font:700 15px var(--font-body);text-anchor:middle;dominant-baseline:central}
.fb .zone{fill:var(--accent);opacity:.14}
.fb .dot{fill:var(--accent)}
.fb .dot.root{fill:var(--root)}
.fb .dot.dim{fill:none;stroke:var(--muted);stroke-width:1.5}
.fb .dot.faint{fill:var(--accent);opacity:.28}
.fb .dot.blue{fill:var(--blue)}
.fb .dot.good{fill:var(--good)}
.fb .dot.bad{fill:var(--bad)}
.fb .dot.ct{fill:var(--accent)}
.fb .dtxt{fill:var(--accent-ink);font:700 11px var(--font-body);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.fb .dtxt.sm{font-size:9px}
.fb .dtxt.r{fill:#fff}
.fb .dtxt.dm{fill:var(--muted);font-weight:600}
.fb .dg{cursor:pointer}
.fb .cell{fill:transparent;cursor:pointer}
.fb .cell:hover{fill:color-mix(in srgb,var(--accent) 22%,transparent)}
.hint{display:none;font:500 11px var(--font-mono);color:var(--muted);margin:0 0 4px}
@media (max-width:640px){.hint{display:block}}
.strip{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.nt{display:flex;flex-direction:column;align-items:center;min-width:44px;padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);line-height:1.15}
.nt b{font-size:16px}.nt small{font:500 10px var(--font-mono);color:var(--muted)}
.nt.r{border-color:var(--root)}
.ts{font:700 12px var(--font-mono);width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.ts.t{background:var(--accent);color:var(--accent-ink)}
.ts.s{background:var(--root);color:#fff}
.hrow{display:grid;grid-template-columns:44px 1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.hrow .rn{font:800 20px var(--font-display);color:var(--accent-text)}
.hrow .sy{font-weight:700;font-size:18px}
.hrow .no{font-size:13px;color:var(--muted)}
.fn{font:600 10px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.fn.T{color:var(--good);border-color:var(--good)}.fn.S{color:var(--accent-text);border-color:var(--accent)}.fn.D{color:var(--root);border-color:var(--root)}
.pchip{display:flex;flex-direction:column;align-items:center;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);min-width:64px}
.pchip b{font-size:18px}.pchip small{font:500 11px var(--font-mono);color:var(--muted)}
.pchip.T{border-color:var(--good)}.pchip.S{border-color:var(--accent)}.pchip.D{border-color:var(--root)}
.pchip.cur{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.pchip.cur small{color:var(--accent-ink)}
.cc circle{fill:var(--bg);stroke:var(--line);stroke-width:1.5;cursor:pointer}
.cc text{fill:var(--fg);font:700 15px var(--font-body);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.cc.m circle{fill:var(--surface)}
.cc.m text{font-size:12px;font-weight:600;fill:var(--muted)}
.cc.nb circle{stroke:var(--accent);stroke-width:2.5}
.cc.sel circle{fill:var(--accent);stroke:var(--accent)}
.cc.sel text{fill:var(--accent-ink)}
.cc.m.sel circle{fill:var(--root);stroke:var(--root)}.cc.m.sel text{fill:#fff}
.cctr{fill:var(--muted);font:500 11px var(--font-mono);text-anchor:middle}
.order{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:12px 0 0;padding:0}
.order li{border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14px;background:var(--bg)}
.order li.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.order b{font-family:var(--font-display);font-size:18px;margin-right:6px}
select{font:600 15px var(--font-body);padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);min-height:42px;max-width:100%}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:6px}
.steps label{display:flex;flex-direction:column;gap:4px;font:500 11px var(--font-mono);color:var(--muted)}
.gl{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.gl div{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}
.gl b{display:block;color:var(--accent-text)}
.gl span{font-size:15px;color:var(--muted)}
/* herramientas */
.big{font:800 clamp(64px,18vw,112px)/1 var(--font-display);font-variant-numeric:tabular-nums;text-align:center}
.beats{display:flex;justify-content:center;gap:10px;margin:8px 0}
.beats i{width:22px;height:22px;border-radius:50%;background:var(--line);transition:background .06s}
.beats i.acc{outline:2px solid var(--accent);outline-offset:2px}
.beats i.on{background:var(--accent)}
.beats i.on.acc{background:var(--root)}
input[type=range]{width:100%;accent-color:var(--accent);height:32px}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.gauge{width:100%;max-width:420px}
.gauge .tickm{stroke:var(--muted);stroke-width:2}
.gauge .needle{stroke:var(--accent);stroke-width:4;stroke-linecap:round;transition:transform .12s}
.gauge.in .needle{stroke:var(--good)}
.gauge .lab{fill:var(--muted);font:500 12px var(--font-mono);text-anchor:middle}
.tnote{font:800 92px/1 var(--font-display)}
.tnote small{font-size:30px;color:var(--muted);margin-left:4px}
.strs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;width:100%;max-width:460px}
.strs button{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.strs button small{font:500 10px var(--font-mono);color:var(--muted)}
.strs button.on{border-color:var(--good);color:var(--good)}
.msg{padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:15px}
.msg.err{border-color:var(--bad)}
.game-top{display:flex;align-items:center;gap:12px;justify-content:space-between}
.gq{font:800 64px/1 var(--font-display);text-align:center}
.notes12{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}

.gh{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:space-between}

.ggrid{display:grid;gap:3px 0;align-items:center}
.glab{font:600 11px var(--font-mono);color:var(--muted);letter-spacing:.06em}
.glab.muted{color:var(--accent-text)}
.gc{height:30px;display:grid;place-items:center;border-left:1px solid transparent;background:var(--bg)}

.spark{width:140px;height:36px;flex:none}

/* ---------- mástil (SVG) ---------- */
function fretboard(o){

/* ---------- motor de audio ---------- */

function noiseBuf(){

const SEQ={id:null,label:'',timer:null,next:0,step:0,dur:null,on:null,ui:null};

const METERS={'2/4':{b:2,acc:[0]},'3/4':{b:3,acc:[0]},'4/4':{b:4,acc:[0]},'6/8':{b:6,acc:[0,3]}};

const SCALES2={bl:{semis:[0,3,5,6,7,10],n:'Blues'},pm:{semis:[0,3,5,7,10],n:'Pentatónica menor'},pM:{semis:[0,2,4,7,9],n:'Pentatónica mayor'},M:{semis:[0,2,4,5,7,9,11],n:'Mayor'},dor:{semis:[0,2,3,5,7,9,10],n:'Dórico'}};
const TRK={k:3,p:'pop',st:'rock',bpm:96,bar:-1,nod:true,click:true};
function trkChord(i){const[off,t]=PROG2[TRK.p].it[i];return{pc:(KEYS[TRK.k].pc+off)%12,t,off}}
function trkName(i){const c=trkChord(i);return pcName(c.pc,[5,10,3,8,1].includes(c.pc)&&KEYS[TRK.k].a<=0).us+CT[c.t].suf}
function trkStart(ui){
  const S=STYLES[TRK.st],P=PROG2[TRK.p],L=S.steps;
  return seqStart('trk','Pista · '+KEYS[TRK.k].us+' '+S.n,()=>(TRK.st==='ranchera'?60/TRK.bpm/2:60/TRK.bpm/2),(s,t)=>{
    const bar=Math.floor(s/L)-1,i=s%L,dur=60/TRK.bpm/2;
    if(bar<0){if(i%2===0)tick(t,i===0?'acc':'beat');return}
    if(TRK.click&&i%2===0)tick(t,i===0?'acc':'beat');
    MUTE_DR=!!TRK.nod;try{
    const ci=bar%P.it.length,c=trkChord(ci),root=36+((c.pc-0+12)%12),semis=CT[c.t].semis;
    const low=root<40?root+12:root,ch=semis.slice(0,4).map(x=>low+12+x);
    const strum=(v,len,sh)=>ch.forEach((m,j)=>pluck(m,t+j*(sh||.018),len,v));
    if(TRK.st==='rock'){
      if(i===0||i===4||i===5)kick(t,.85);if(i===2||i===6)snare(t,.42);hat(t,i%2?.09:.15);
      bassNote(low+(i===7?7:0),t,dur*.9,.36);
      if(i===0||i===4)strum(.13,dur*3.6);if(i===3||i===7)strum(.07,dur*.8,.01);
    }else if(TRK.st==='balada'){
      if(i===0||i===5)kick(t,.7);if(i===4)snare(t,.32);hat(t,.07);
      if(i===0||i===4)bassNote(low,t,dur*3.8,.34);
      const arp=[0,2,1,3,2,1,3,2].map(k=>ch[Math.min(k,ch.length-1)]);pluck(arp[i],t,dur*2.5,.15);
    }else if(TRK.st==='cumbia'){
      guiro(t,i%2===0);if(i===0||i===4)kick(t,.6);if(i===3||i===7)noise(t,.08,'bandpass',900,.25,1.5);
      if(i===0)bassNote(low,t,dur*1.6,.42);if(i===3)bassNote(low+7,t,dur*.9,.34);if(i===4)bassNote(low+7,t,dur*1.6,.38);if(i===6)bassNote(low+12,t,dur*.9,.3);
      if(i%2===1)strum(.1,dur*.7,.008);
    }else{
      if(i===0){kick(t,.7);bassNote(low+(bar%2?7:0),t,dur*1.8,.44)}
      if(i===2||i===4){strum(.12,dur*.8,.006);hat(t,.1)}
    }
    }finally{MUTE_DR=false}
  },s=>{const bar=Math.floor(s/L)-1;if(s%L===0){TRK.bar=bar;if(ui)ui(bar<0?-1:bar%P.it.length,bar<0?'cuenta':'')}});
}
/* ---------- temporizador de ejercicios ---------- */
const TMR={id:null,end:0,total:0,iv:null,paused:0};
function tmrStart(id,secs){
  tmrStop(true);
  Object.assign(TMR,{id,total:secs,end:Date.now()+secs*1000,paused:0});
  TMR.iv=setInterval(tmrTick,250);wake(true);emitState();tmrTick();
}
function tmrLeft(){return TMR.id?Math.max(0,Math.ceil(((TMR.paused||TMR.end)-(TMR.paused?0:Date.now()))/1000)):0}
function tmrTick(){
  if(!TMR.id)return;
  const left=TMR.paused?TMR.paused/1000:Math.max(0,(TMR.end-Date.now())/1000);
  document.dispatchEvent(new CustomEvent('tmr',{detail:{id:TMR.id,left:Math.ceil(left),total:TMR.total}}));
  if(left<=0&&!TMR.paused){const id=TMR.id;tmrStop();bell();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}document.dispatchEvent(new CustomEvent('tmrdone',{detail:{id}}))}
}
function tmrPause(){if(!TMR.id)return;if(TMR.paused){TMR.end=Date.now()+TMR.paused;TMR.paused=0}else TMR.paused=Math.max(0,TMR.end-Date.now());emitState();tmrTick()}
function tmrStop(silent){if(TMR.iv)clearInterval(TMR.iv);TMR.iv=null;TMR.id=null;TMR.paused=0;if(!silent){wake(false);emitState()}}
/* ---------- pantalla encendida ---------- */
let WL=null;
async function wake(on){
  try{
    const need=on||SEQ.id||TMR.id;
    if(need&&!WL&&navigator.wakeLock){WL=await navigator.wakeLock.request('screen');WL.addEventListener('release',()=>{WL=null})}
    else if(!need&&WL){await WL.release();WL=null}
  }catch(e){WL=null}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&(SEQ.id||TMR.id))wake(true)});
function emitState(){document.dispatchEvent(new CustomEvent('playstate'))}

/* ---------- sonidos de batería ---------- */
function metal(t,dur,v,hp,freqs){
  const g=AC.createGain(),f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hp;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  (freqs||[205.3,304.4,369.6,522.7,540,800]).forEach(fr=>{const o=AC.createOscillator();o.type='square';o.frequency.value=fr*1.8;o.connect(f);o.start(t);o.stop(t+dur+.05)});
  f.connect(g);g.connect(out());
}
function tom(t,f0,v){
  const o=AC.createOscillator(),g=AC.createGain();o.type='sine';
  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f0*.62,t+.3);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.45);o.connect(g);g.connect(out());o.start(t);o.stop(t+.5);
  noise(t,.03,'bandpass',f0*6,v*.3,1);
}
function rim(t,v){
  const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=1750;
  g.gain.setValueAtTime(v*.7,t);g.gain.exponentialRampToValueAtTime(.0001,t+.035);o.connect(g);g.connect(out());o.start(t);o.stop(t+.05);
  noise(t,.02,'highpass',3000,v*.4);
}
function cowbell(t,v){const g=AC.createGain(),f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=900;g.gain.setValueAtTime(v*.5,t);g.gain.exponentialRampToValueAtTime(.0001,t+.25);[540,800].forEach(fr=>{const o=AC.createOscillator();o.type='square';o.frequency.value=fr;o.connect(f);o.start(t);o.stop(t+.3)});f.connect(g);g.connect(out())}

const ROW_ORDER=['cr','rd','hh','cb','t1','t2','sn','rim','ft','bd','hf'];
const VEL={X:1,x:.72,o:.8,g:.22};
const COUNT={1:[''],2:['','y'],3:['','ta','ti'],4:['','e','y','a']};
const gSteps=g=>g.meter*g.sub*(g.bars||1);
function grooveGrid(g,opts){
  opts=opts||{};const n=gSteps(g),rows=ROW_ORDER.filter(r=>g.rows[r]);
  const cols=`grid-template-columns:44px repeat(${n},minmax(18px,1fr))`;
  let h=`<div class="gwrap"><div class="ggrid" style="${cols};min-width:${44+n*20}px">`;
  rows.forEach(r=>{
    const muted=opts.muted&&opts.muted.includes(r);
    h+=`<div class="glab${muted?' muted':''}" title="${ROWS[r].n}">${ROWS[r].a}</div>`;
    for(let i=0;i<n;i++){
      const c=g.rows[r][i]||'-',beat=i%g.sub===0,bar=i%(g.sub*g.meter)===0;
      h+=`<div class="gc${beat?' b':''}${bar&&i?' bar':''}" data-i="${i}">${c==='-'?'':`<span class="gn ${c==='X'?'acc':c==='g'?'gh':c==='o'?'op':''}${muted?' you':''}"></span>`}</div>`;
    }
  });
  h+=`<div class="glab"></div>`;
  for(let i=0;i<n;i++){const p=i%g.sub,b=Math.floor(i/g.sub)%g.meter+1;h+=`<div class="gcount${p===0?' b':''}" data-i="${i}">${p===0?b:COUNT[g.sub][p]}</div>`}
  return h+'</div></div>';
}
/* reproductor de grooves */
const GP={id:null,g:null,bpm:80,click:true,muted:[]};
function grooveStart(id,g,opts,ui){
  Object.assign(GP,{id,g,bpm:opts.bpm||g.bpm,click:opts.click!==false,muted:opts.muted||[]});
  const n=gSteps(g);
  return seqStart('grv',g.n+' · '+GP.bpm+' bpm',()=>60/GP.bpm/g.sub,(s,t)=>{
    const count=g.meter*g.sub;
    if(s<count){if(s%g.sub===0)tick(t,s===0?'acc':'beat');return}
    const i=(s-count)%n;
    if(GP.click&&i%g.sub===0)tick(t,i%(g.sub*g.meter)===0?'acc':'beat');
    for(const r in g.rows){const c=g.rows[r][i];if(c&&c!=='-'&&!GP.muted.includes(r))ROWS[r].play(t,VEL[c]||.72,c)}
  },s=>{const count=g.meter*g.sub;if(ui)ui(s<count?-1:(s-count)%n,s<count)});
}

 E({id:'2c',t:'Cuenta mientras tocas el groove',min:3,steps:['Pon el rock básico.','Tócalo contando «1 y 2 y 3 y 4 y» en voz alta, sin parar.','Si te equivocas, no te detengas: sigue contando y reengancha en el 1.'],goal:'Dos minutos seguidos tocando y contando.',groove:'rock'}),
 {box:'Errores comunes',ul:['Contar solo en la cabeza: en voz alta se nota cuando te sales.','Acelerar al pasar a semicorcheas: el pulso es el mismo.','Detenerte al equivocarte: en la banda nadie se detiene.']},
 {trick:['Negras «1 2 3 4» · corcheas «1 y 2 y» · tresillos «1 ta ti» · semicorcheas «1 e y a».','La subdivisión llena el espacio y estabiliza el tempo.','Contar en voz alta es entrenamiento, no muleta.']}]},
{id:3,part:1,title:'El click en otros lugares',sub:'2 y 4, solo el 1, contratiempo',lead:'Cambiar dónde suena el click te obliga a sostener tú el resto.',
 blocks:[
 {p:'Con el click en los cuatro tiempos, el metrónomo hace el trabajo. Si suena solo en el 2 y el 4, tú pones el 1 y el 3. Si suena solo en el 1, sostienes tres tiempos solo. Y si suena en el contratiempo, aprendes a sentir el «y» como parte del pulso.'},
 E({id:'3a',t:'Click en 2 y 4',min:4,steps:['El click suena donde va la tarola.','Toca el rock básico haciendo que tu tarola tape el click.','Si dejas de oír el click, vas perfecto.'],goal:'Tu tarola cubre el click durante dos minutos.',met:{bpm:80,mode:'24'},groove:'rock'}),
 E({id:'3b',t:'Click solo en el 1',min:4,steps:['Ahora el click suena una vez por compás.','Toca corcheas en el hi-hat con bombo en 1 y 3 y tarola en 2 y 4.','Escucha si el click cae justo con tu bombo del 1.'],goal:'Ocho compases seguidos con el 1 encima del click.',met:{bpm:80,mode:'1'}}),
 E({id:'3c',t:'Click en contratiempo',min:4,steps:['El click suena en el «y» de cada tiempo.','Toca negras con el bombo, entre los clicks.','Cuando lo sientas estable, toca el rock básico.'],goal:'No te confundes y el click nunca se convierte en tu tiempo.',met:{bpm:70,mode:'off'}}),
 {box:'Errores comunes',ul:['Perderse al arrancar con el click en 2 y 4: cuenta dos compases antes de entrar.','Mover el pulso para que el click cuadre: el click no se mueve, tú sí.']},
 {trick:['Click en 2 y 4 = tu tarola lo tapa.','Click en el 1 = sostienes tres tiempos solo.','Click en contratiempo = el «y» también es pulso.']}]},
{id:4,part:2,title:'Click intermitente',sub:'Sostener el pulso en silencio',lead:'El click se calla. Tú no.',
 blocks:[
 {p:'Es el ejercicio más directo para baterías que se corren: el metrónomo suena unos compases y desaparece otros. Durante el silencio solo cuenta tu reloj. Al regresar el click sabes al instante si te moviste.'},
 E({id:'4a',t:'4 compases sí, 4 no',min:4,steps:['Toca el rock básico con el click.','Cuando se calle, sigue contando en voz alta.','Al volver, fíjate si caes encima.'],goal:'Caes encima del click tres veces seguidas.',met:{bpm:80,gapOn:4,gapOff:4},groove:'rock'}),
 E({id:'4b',t:'2 sí, 2 no',min:4,steps:['El click se calla la mitad del tiempo.','Mantén el volumen parejo: tocar más fuerte acelera.'],goal:'Dos minutos sin desfasarte.',met:{bpm:80,gapOn:2,gapOff:2}}),
 E({id:'4c',t:'1 sí, 3 no',min:4,steps:['Ahora el click solo da un compás de referencia.','Toca el groove completo tres compases solo.','Cuando lo domines, prueba a 70 y a 100 bpm.'],goal:'Caes encima del click en tres tempos distintos.',met:{bpm:80,gapOn:1,gapOff:3}}),
 E({id:'4d',t:'Mídelo',min:3,steps:['Abre el medidor en modo click intermitente.','Toca corcheas en el hi-hat con bombo y tarola.','Compara la consistencia con click y sin click.'],goal:'La diferencia entre las dos es menor a 10 ms.',timing:{mode:'gap',bpm:80,grid:2}}),
 {trick:['Empieza con 4 y 4; baja a 2 y 2; luego 1 y 3.','En el silencio cuenta en voz alta.','Volumen parejo = tempo parejo.']}]},
{id:5,part:2,title:'El hi-hat como reloj',sub:'La mano que no cambia',lead:'Si el hi-hat es parejo, todo lo demás tiene dónde apoyarse.',
 blocks:[
 {p:'En la mayoría de los grooves la mano del hi-hat toca siempre lo mismo. Es tu reloj visible: si esa mano se acelera o cambia de volumen, todo el groove se mueve. Primero haz que el hi-hat sea parejo, luego agrega los pies.'},
 {groove:'e'},
 E({id:'5a',t:'Solo hi-hat, dos minutos',min:3,steps:['Corcheas en el hi-hat cerrado, con el mismo volumen todas.','Acentúa los tiempos (1, 2, 3, 4) un poco más fuerte.','No toques nada más hasta que el click y tu mano suenen como uno.'],goal:'Dos minutos sin un golpe más fuerte que otro.',met:{bpm:80,sub:2}}),
 {groove:'hhbd'},{groove:'rock'},
 E({id:'5b',t:'Agrega los pies y la tarola',min:4,steps:['Toca el hi-hat con bombo en 1 y 3.','Cuando esté estable, agrega la tarola en 2 y 4: es el rock básico.','Si el hi-hat se mueve al agregar algo, vuelve al paso anterior.'],goal:'El hi-hat suena igual con y sin bombo y tarola.',groove:'hhbd'}),
 {groove:'rock16'},
 E({id:'5c',t:'Semicorcheas con una mano',min:4,steps:['Toca el groove a semicorcheas con una sola mano en el hi-hat.','Empieza a 70 bpm; si la mano se tensa, baja el tempo.','Acentúa los tiempos para no perder el 1.'],goal:'Un minuto relajado a 80 bpm.',groove:'rock16'}),
 E({id:'5d',t:'Mide tu hi-hat',min:3,steps:['Abre el medidor con rejilla de corcheas.','Toca solo hi-hat un minuto.','Repite tocando el rock básico y compara.'],goal:'Tu consistencia queda por debajo de 15 ms.',timing:{mode:'click',bpm:90,grid:2}}),
 {trick:['La mano del hi-hat es el reloj.','Primero parejo, luego rápido.','Si algo nuevo mueve el hi-hat, regresa un paso.']}]},
{id:6,part:2,title:'El bolsillo',sub:'Bombo, tarola y el bajo',lead:'Tocar a tiempo es estar en el mismo lugar que el bajo.',
 blocks:[
 {p:'El «bolsillo» es cuando el groove se siente cómodo y estable. Depende de dos cosas: que el bombo coincida con el bajo y que la tarola caiga siempre en el mismo punto del 2 y el 4. Una tarola que a veces llega antes y a veces después hace que la banda se sienta insegura.'},
 {groove:'rock2'},{groove:'rock3'},
 E({id:'6a',t:'Bombos sincopados',min:4,steps:['Toca el rock con bombo doble y luego el de bombo en el «y».','Cuenta las corcheas en voz alta para colocar el bombo del «y».','El hi-hat no cambia.'],goal:'Los dos grooves sin que el hi-hat se mueva.',groove:'rock3'}),
 E({id:'6b',t:'Toca tú la tarola',min:4,steps:['En el reproductor, silencia la tarola.','La app toca hi-hat y bombo; tú solo tocas la tarola en 2 y 4.','Haz que tu tarola encaje exacto en el hueco.'],goal:'Tu tarola suena como parte del groove grabado.',groove:'rock'}),
 E({id:'6c',t:'Encaja con el bajo',min:5,steps:['Inicia la pista sin batería: bajo y acordes.','Toca el rock básico y pon el bombo donde suena el bajo.','Escucha más al bajo que a ti.'],goal:'Cuatro vueltas sin que el bombo y el bajo se separen.',track:{k:3,p:'pop',st:'rock',bpm:92}}),
 {groove:'half'},
 E({id:'6d',t:'Medio tiempo con la banda',min:4,steps:['Inicia la pista de balada.','Toca el medio tiempo: tarola solo en el 3.','No aceleres el espacio largo entre tarolas.'],goal:'La tarola cae siempre en el mismo punto.',track:{k:1,p:'pop',st:'balada',bpm:72}}),
 {trick:['Bombo = bajo.','Tarola en el mismo punto del 2 y 4, siempre.','En medio tiempo, el espacio se cuenta, no se adivina.']}]},
{id:7,part:3,title:'Fills sin correr',sub:'Salir y llegar al 1 a tiempo',lead:'El fill termina cuando llega el 1, no antes.',
 blocks:[
 {p:'Los fills son donde más se acelera: más notas, más energía y la prisa por llegar al platillo. La regla: el fill dura exactamente lo que dura, y el 1 siguiente cae en su lugar. Practícalos dentro de un groove, nunca sueltos.'},
 {groove:'fill1'},
 E({id:'7a',t:'Fill de 1 tiempo',min:4,steps:['Tres compases y medio de groove y un tiempo de semicorcheas en la tarola.','Cuenta «4 e y a» en voz alta durante el fill.','El platillo y el bombo caen juntos en el 1.'],goal:'El 1 después del fill cae encima del click diez veces seguidas.',groove:'fill1'}),
 {groove:'fill2'},
 E({id:'7b',t:'Fill de 2 tiempos',min:4,steps:['El fill empieza en el tiempo 3 y baja por los toms.','Mantén las semicorcheas parejas al cambiar de tambor.','No adelantes el tom de piso.'],goal:'Ocho repeticiones sin adelantar el 1.',groove:'fill2'}),
 {groove:'fill4'},
 E({id:'7c',t:'Fill de compás completo',min:5,steps:['Un compás de groove y uno de fill por todos los tambores.','El bombo marca negras debajo del fill: es tu ancla.','Entra con platillo en el 1.'],goal:'Tu bombo no se acelera durante el fill.',groove:'fill4'}),
 E({id:'7d',t:'Mide tus fills',min:3,steps:['Abre el medidor con rejilla de semicorcheas.','Toca tres compases de groove y uno de fill, repetido.','Fíjate si la tendencia se va hacia «adelantado».'],goal:'Tu tendencia queda dentro de ±10 ms.',timing:{mode:'click',bpm:80,grid:4}}),
 {box:'Errores comunes',ul:['Practicar el fill solo, sin el groove antes y después.','Tocar el fill más fuerte que el groove: lo fuerte acelera.','Llegar al platillo antes del 1 por la emoción.']},
 {trick:['Cuenta el fill en voz alta.','Bombo en negras debajo del fill = ancla.','El fill es tan largo como dice, ni un poco menos.']}]},
{id:8,part:3,title:'Tempos lentos y rápidos',sub:'Los dos extremos del control',lead:'Lento es más difícil que rápido.',
 blocks:[
 {p:'En tempo lento hay mucho espacio entre golpes y la tentación es llenarlo antes de tiempo. La solución es subdividir por dentro: piensa semicorcheas aunque toques negras. En tempo rápido el riesgo es tensarse; se gana velocidad subiendo poco a poco, nunca saltando.'},
 {groove:'slow'},
 E({id:'8a',t:'Groove a 56',min:4,steps:['Toca el groove lento con el click.','Cuenta «1 e y a» en silencio todo el tiempo.','Deja que las notas duren: no te apures al siguiente golpe.'],goal:'Dos minutos a 56 sin adelantarte.',groove:'slow'}),
 E({id:'8b',t:'Más lento todavía',min:4,steps:['Click a 50 con semicorcheas audibles.','Toca el rock básico encima.','Cambia el click a solo negras y mantén la sensación.'],goal:'Sostienes el groove a 50 con click en negras.',met:{bpm:50,sub:4}}),
 E({id:'8c',t:'Entrenador de velocidad',min:5,steps:['El click empieza en 80 y sube 4 bpm cada 4 compases.','Toca el rock básico sin parar.','Detente cuando el groove deje de sonar relajado y anota el tempo.'],goal:'Tu tempo máximo relajado sube semana a semana.',met:{bpm:80,tr:{step:4,every:4,max:140}},groove:'rock'}),
 E({id:'8d',t:'Mide el tempo lento',min:3,steps:['Abre el medidor a 56 bpm con rejilla de corcheas.','Toca el groove lento un minuto.','Compara con tu resultado a 90.'],goal:'Tu consistencia a 56 es casi igual que a 90.',timing:{mode:'click',bpm:56,grid:2}}),
 {trick:['Lento: subdivide por dentro.','Rápido: sube de 4 en 4, relajado.','Si te tensas, baja 10 bpm.']}]},
{id:9,part:3,title:'Dinámica sin perder el tiempo',sub:'Fuerte no es rápido',lead:'Cambiar el volumen sin cambiar el tempo.',
 blocks:[
 {p:'El oído asocia fuerte con rápido y suave con lento. Por eso los coros se aceleran y los puentes se arrastran. Entrenar volumen y tempo por separado es lo que te permite subir la energía de la banda sin subir los bpm.'},
 E({id:'9a',t:'Fuerte y suave',min:4,steps:['Cuatro compases de rock básico fuerte y cuatro suave, alternando.','El click no cambia: tú tampoco.','Fíjate en el cambio de fuerte a suave: ahí se arrastra.'],goal:'Los cambios de volumen no mueven el tempo.',met:{bpm:84}}),
 E({id:'9b',t:'Crescendo en semicorcheas',min:4,steps:['Ocho compases de semicorcheas en la tarola, de muy suave a muy fuerte.','Luego ocho de fuerte a suave.','Mantén las manos sueltas en lo fuerte.'],goal:'El crescendo no acelera.',met:{bpm:70,sub:4}}),
 {groove:'ghost'},
 E({id:'9c',t:'Notas fantasma',min:4,steps:['Las notas fantasma son golpes muy suaves en la tarola, casi sin levantar la baqueta.','Toca el groove con fantasmas y la tarola fuerte en 2 y 4.','Las fantasmas también van a tiempo: cuéntalas.'],goal:'Se escuchan claras la diferencia de volumen y el tiempo parejo.',groove:'ghost'}),
 {trick:['Fuerte ≠ rápido; suave ≠ lento.','Del coro al puente es donde se arrastra.','Manos sueltas para tocar fuerte sin acelerar.']}]},
{id:10,part:4,title:'Ternarios',sub:'Shuffle, 6/8, 12/8 y 3/4',lead:'Cuando el pulso se divide en tres.',
 blocks:[
 {p:'En los ritmos ternarios cada tiempo se divide en tres partes iguales: se cuenta «1 ta ti». El shuffle toca la primera y la tercera. La balada en 6/8, el blues lento en 12/8 y el vals ranchero en 3/4 viven de esa sensación.'},
 E({id:'10a',t:'Cuenta tresillos',min:3,steps:['Click con tresillos audibles.','Toca tresillos en la tarola contando «1 ta ti».','Luego toca solo la primera y la tercera: es el shuffle.'],goal:'Pasas de tresillos a shuffle sin perder el pulso.',met:{bpm:70,sub:3}}),
 {groove:'shuffle'},
 E({id:'10b',t:'Shuffle con click',min:4,steps:['Toca el shuffle con el click.','No conviertas el shuffle en corcheas: la nota corta va pegada al siguiente tiempo.'],goal:'Dos minutos de shuffle estable.',groove:'shuffle'}),
 {groove:'b68'},{groove:'vals'},
 E({id:'10c',t:'Balada en 6/8',min:4,steps:['Toca la balada en 6/8: seis corcheas por compás, dos pulsos.','La tarola cae en el segundo pulso (el 4 de las seis).','No aceleres el espacio largo.'],goal:'Sientes los dos pulsos grandes del 6/8.',groove:'b68'}),
 E({id:'10d',t:'Vals ranchero con banda',min:4,steps:['Inicia la pista ranchera.','Bombo en el 1, tarola y hi-hat en el 2 y el 3.','El 1 de cada compás va con el bajo.'],goal:'Ocho compases sin adelantar el «pa-pa».',track:{k:1,p:'ranchera',st:'ranchera',bpm:120}}),
 {trick:['Ternario: «1 ta ti».','Shuffle: primera y tercera del tresillo.','6/8: seis corcheas, dos pulsos.','Vals: «pum-pa-pa».']}]},
{id:11,part:4,title:'Ritmos que pide la banda',sub:'Cumbia, polka, dembow, balada',lead:'Cada estilo tiene su pulso; ninguno perdona correr.',
 blocks:[
 {p:'Los estilos que más se tocan en una banda versátil tienen algo en común: son repetitivos, y por eso cualquier cambio de tempo se nota. Practícalos con click y con pista hasta que puedas tocarlos diez minutos sin moverte.'},
 {groove:'cumbia'},
 E({id:'11a',t:'Cumbia con la banda',min:5,steps:['Inicia la pista de cumbia sin batería.','Toca la cumbia básica: aro en 2 y 4, hi-hat con acento en el «y».','Mantén el bombo junto al bajo.'],goal:'Cinco minutos sin acelerar.',track:{k:3,p:'menor',st:'cumbia',bpm:92}}),
 {groove:'polka'},
 E({id:'11b',t:'Polka norteña',min:4,steps:['Bombo en los tiempos, tarola en los contratiempos.','Empieza a 110 y sube de 5 en 5 hasta 130.','La tarola nunca se adelanta al «y».'],goal:'Dos minutos a 130 limpios.',groove:'polka'}),
 {groove:'dembow'},
 E({id:'11c',t:'Dembow',min:4,steps:['Bombo en las cuatro negras.','La tarola cae en el «a» del 1 y en el «y» del 2, igual en 3 y 4.','Cuenta «1 e y a» para colocarla.'],goal:'El patrón de tarola suena igual en cada compás.',groove:'dembow'}),
 {groove:'pop'},
 E({id:'11d',t:'Balada pop con la banda',min:4,steps:['Inicia la pista de balada.','Toca la balada pop con aro.','No llenes los espacios: la balada respira.'],goal:'Cuatro vueltas sin acelerar al llegar al coro.',track:{k:1,p:'pop',st:'balada',bpm:72}}),
 {trick:['Cumbia: aro en 2 y 4, acento en el «y».','Polka: bombo en tiempos, tarola en contratiempos.','Dembow: «1 e y a» para la tarola.']}]},
{id:12,part:4,title:'Tocar con la banda',sub:'Cuentas, tempos y ensayo con click',lead:'El tiempo de la banda empieza en tu cuenta de entrada.',
 blocks:[
 {p:'La mayoría de los cambios de tempo de una banda empiezan antes de la primera nota: una cuenta de entrada más rápida que la canción. Llevar los tempos anotados y contar siempre igual elimina la mitad del problema.'},
 E({id:'12a',t:'Arma tu setlist',min:10,steps:['Abre la herramienta Setlist.','Agrega las canciones de la banda con su tempo; usa «Marcar tempo» sobre la grabación original.','Revisa el tempo de cada una antes del ensayo.'],goal:'Tienes el tempo de todas las canciones guardado.'}),
 E({id:'12b',t:'Cuenta de entrada',min:3,steps:['Pon el metrónomo al tempo de la canción.','Cuenta en voz alta «1… 2… 1, 2, 3, 4» con el click.','Practica la cuenta sin click y compruébala con el metrónomo.'],goal:'Tu cuenta sin click coincide con el tempo real.',met:{bpm:90}}),
 E({id:'12c',t:'Canción completa con click',min:6,steps:['Toca una canción completa del setlist con click en audífonos.','Repite con click intermitente de 4 y 4.','Marca en qué parte te cuesta más.'],goal:'Terminas la canción encima del click.',met:{bpm:90,gapOn:4,gapOff:4}}),
 E({id:'12d',t:'Graba el ensayo y compara',min:5,steps:['Graba el siguiente ensayo.','Marca el tempo al inicio y al final de cada canción.','Compara con el ensayo que mediste en la lección 1.'],goal:'La diferencia entre inicio y final es menor a 3 bpm.'}),
 {trick:['La cuenta de entrada decide el tempo.','Lleva los tempos anotados.','Ensaya con click en audífonos al menos una vez por semana.']}]}
];
const PARTS2=[{n:1,t:'Medir y contar',m:[1,2,3]},{n:2,t:'Sostener',m:[4,5,6]},{n:3,t:'Controlar',m:[7,8,9]},{n:4,t:'Tocar',m:[10,11,12]}];
const ALLEX=[];LESSONS.forEach(l=>l.blocks.forEach(b=>{if(b.ex){b.ex.lesson=l.id;ALLEX.push(b.ex)}}));
const GLOS=[['Pulso','El latido parejo de la canción.'],['Tempo','La velocidad del pulso, en pulsos por minuto (bpm).'],['Correr','Ir delante del pulso: acelerar sin querer.'],['Arrastrar','Ir detrás del pulso: frenar sin querer.'],['Subdivisión','Dividir cada pulso en partes iguales: corcheas, tresillos, semicorcheas.'],['Negra','Una nota por pulso.'],['Corchea','Dos notas por pulso: «1 y».'],['Tresillo','Tres notas por pulso: «1 ta ti».'],['Semicorchea','Cuatro notas por pulso: «1 e y a».'],['Contratiempo','El «y»: la mitad entre dos pulsos.'],['Backbeat','La tarola en el 2 y el 4.'],['Bolsillo','La sensación de groove estable y cómodo, junto con el bajo.'],['Fill','Frase corta que conecta dos partes de la canción.'],['Nota fantasma','Golpe muy suave en la tarola que da textura.'],['Acento','Golpe más fuerte que los demás.'],['Shuffle','Ritmo ternario que toca la primera y tercera nota del tresillo.'],['Rudimento','Patrón básico de manos: sencillo, doble, paradiddle.'],['Click intermitente','Metrónomo que suena unos compases y se calla otros.'],['Milisegundo (ms)','La milésima parte de un segundo. ±10 ms se siente a tiempo.'],['Consistencia','Qué tan iguales son tus desviaciones: mientras más baja, más estable.'],['Cuenta de entrada','Los números que dices antes de empezar: fijan el tempo.']];

   <p class="cap" data-x="msg" data-id="${x.id}" hidden></p>
  </article>`;
}
function paintEx(root){
  $$('[data-x]',root||document).forEach(b=>{
    const id=b.dataset.id,x=ALLEX.find(z=>z.id===id),k=b.dataset.x;if(!x)return;
    if(k==='met'){const on=SEQ.id==='met'&&OWNER==='ex:'+id;b.innerHTML=on?IC.stop+'Detener':IC.play+'Metrónomo';b.classList.toggle('on',on)}
    else if(k==='trk'){const on=SEQ.id==='trk'&&OWNER==='ex:'+id;b.innerHTML=on?IC.stop+'Detener pista':IC.band+'Tocar con la banda';b.classList.toggle('on',on)}
    else if(k==='trkcur'){if(!(SEQ.id==='trk'&&OWNER==='ex:'+id))b.textContent='detenida'}
    else if(k==='bpmv')b.textContent=(DB.bpm[id]||x.met.bpm)+' bpm';
    else if(k==='tmr'){const on=TMR.id==='ex:'+id;b.innerHTML=IC.timer+`<span class="tm">${on?fmt(TMR.paused?TMR.paused/1000:(TMR.end-Date.now())/1000)+(TMR.paused?' · en pausa':''):fmt(x.min*60)}</span>`;b.classList.toggle('on',on)}
    else if(k==='done'){const d=!!DB.done[id];b.innerHTML=IC.check+(d?'Hecho':'Marcar como hecho');b.classList.toggle('on',d);b.setAttribute('aria-pressed',String(d));const card=b.closest('.ex');if(card)card.classList.toggle('done',d)}
  });
}
document.addEventListener('playstate',()=>{paintEx();paintPlayer()});
document.addEventListener('tmr',e=>{if(e.detail.id.startsWith('ex:')){const b=document.querySelector(`[data-x="tmr"][data-id="${e.detail.id.slice(3)}"]`);if(b)b.querySelector('.tm').textContent=fmt(e.detail.left)+(TMR.paused?' · en pausa':'')}paintPlayer()});
document.addEventListener('tmrdone',e=>{
  if(!e.detail.id.startsWith('ex:'))return;const id=e.detail.id.slice(3);
  if(SEQ.id&&OWNER==='ex:'+id)seqStop();
  const m=document.querySelector(`[data-x="msg"][data-id="${id}"]`);
  if(m){m.hidden=false;m.innerHTML='<b>Tiempo cumplido.</b> Si alcanzaste el objetivo, márcalo como hecho; si no, repítelo mañana.'}
  paintEx();
});
function exAction(b){
  const id=b.dataset.id,x=ALLEX.find(z=>z.id===id),k=b.dataset.x;if(!x)return false;
  if(k==='done'){if(DB.done[id])delete DB.done[id];else{DB.done[id]=true;markDay()}save();paintEx();refreshProgress();return true}
  if(k==='met'){if(SEQ.id==='met'&&OWNER==='ex:'+id)seqStop();else{OWNER='ex:'+id;Object.assign(MET,{bpm:DB.bpm[id]||x.met.bpm,sub:x.met.sub||1,meter:x.met.meter||'4/4'});metStart((({bpm,...o})=>o)(x.met))}paintEx();return true}
  if(k==='bpm'){const v=Math.max(30,Math.min(240,(DB.bpm[id]||x.met.bpm)+ +b.dataset.d));DB.bpm[id]=v;save();if(SEQ.id==='met'&&OWNER==='ex:'+id){MET.bpm=v;SEQ.label='Metrónomo '+v;emitState()}paintEx();return true}
  if(k==='trk'){
    if(SEQ.id==='trk'&&OWNER==='ex:'+id)seqStop();
    else{OWNER='ex:'+id;Object.assign(TRK,x.track,{nod:true,click:true});const cur=document.querySelector(`[data-x="trkcur"][data-id="${id}"]`);trkStart((ci,lab)=>{if(cur)cur.textContent=lab==='cuenta'?'cuenta inicial':'sonando '+trkName(ci)})}
    paintEx();return true}
  if(k==='tmr'){if(TMR.id==='ex:'+id)tmrPause();else tmrStart('ex:'+id,x.min*60);paintEx();return true}
  if(k==='timing'){Object.assign(TM,x.timing);location.hash='#/practicar/medidor';return true}
  return false;
}
/* ---------- mini reproductor ---------- */
function paintPlayer(){
  let p=$('#player');
  const on=(SEQ.id&&SEQ.id!=='tim'&&OWNER!=='rt')||(TMR.id&&TMR.id!=='rt');
  if(!on){if(p)p.remove();return}
  if(!p){p=document.createElement('div');p.id='player';p.className='player';document.body.appendChild(p)}
  const lab=SEQ.id&&SEQ.id!=='tim'?SEQ.label:'Temporizador';
  const t=TMR.id&&TMR.id!=='rt'?' · '+fmt(TMR.paused?TMR.paused/1000:(TMR.end-Date.now())/1000):'';
  const href=SEQ.id==='met'&&OWNER==='tool'?'#/practicar/metronomo':SEQ.id==='trk'&&OWNER==='tool'?'#/practicar/banda':'';
  p.innerHTML=`<span class="dotlive"></span><span class="pl">${esc(lab+t)}</span>${href?`<a class="btn sm" href="${href}">Abrir</a>`:''}<button class="btn sm" data-pl="stop">${IC.stop}Detener</button>`;
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-pl="stop"]');if(b){seqStop();tmrStop();paintPlayer();paintEx()}});
/* ---------- vistas ---------- */
const greet=()=>{const h=new Date().getHours();return h<12?'Buenos días':h<19?'Buenas tardes':'Buenas noches'};
let DEFERRED=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();DEFERRED=e;if(location.hash===''||location.hash==='#/')route()});
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const standalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function profileCard(){
  const S=(DB.ses||[]).filter(s=>s.mode!=='free'),F=(DB.ses||[]).filter(s=>s.mode==='free');
  if(!S.length&&!F.length)return`<a class="card tool" href="#/leccion/1"><span class="ic">${IC.target}</span><span><b>Haz la prueba de diagnóstico</b><span>Tres pruebas de un minuto con el micrófono para conocer tu punto de partida.</span></span></a>`;
  const last=S[S.length-1],first=S[0];
  const spark=S.slice(-14).map(s=>s.sd),mx=Math.max(30,...spark);
  const sp=spark.length>1?`<svg viewBox="0 0 140 36" class="spark" aria-label="Consistencia por sesión"><polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="${spark.map((v,i)=>(i/(spark.length-1)*136+2).toFixed(1)+','+(34-v/mx*30).toFixed(1)).join(' ')}"/></svg>`:'';
  return`<div class="card"><div class="row" style="justify-content:space-between"><p class="eyebrow">Tu perfil de tiempo</p><a class="btn sm" href="#/practicar/medidor">${IC.target}Medir</a></div>
  ${last?`<div class="statrow" style="margin-top:10px"><div class="stat"><b>${Math.round(last.mean)>0?'+':''}${Math.round(last.mean)}</b><span>ms · ${tendTxt(last.mean).toLowerCase()}</span></div><div class="stat"><b>${Math.round(last.sd)}</b><span>ms consistencia</span></div><div class="stat"><b>${Math.round(last.pct)}%</b><span>en el bolsillo</span></div></div>`:''}
  ${F.length?`<p class="cap">Sin click: ${Math.round(F[F.length-1].drift)>0?'+':''}${Math.round(F[F.length-1].drift)} bpm de deriva en la última prueba.</p>`:''}
  ${S.length>1?`<div class="row" style="justify-content:space-between;margin-top:6px"><span class="cap" style="margin:0">Consistencia: empezaste en ${Math.round(first.sd)} ms; ahora ${Math.round(last.sd)} ms. Menos es mejor.</span>${sp}</div>`:''}</div>`;
}
function viewHome(){
  const nx=nextEx(),[d,t]=doneCount();
  const inst=standalone()||DB.hideInstall?'':DEFERRED?`<div class="card install"><div><h3>Instala la app</h3><p class="cap" style="margin:4px 0 0">Ábrela desde tu pantalla de inicio y úsala sin internet.</p></div><div class="row"><button class="btn pri" data-h="install">${IC.down}Instalar</button><button class="btn sm" data-h="hideinst">Ahora no</button></div></div>`:isIOS?`<div class="card install"><div><h3>Instala la app en tu iPhone o iPad</h3><p class="cap" style="margin:4px 0 0">En Safari toca el botón Compartir y elige «Agregar a inicio».</p></div><button class="btn sm" data-h="hideinst">Entendido</button></div>`:'';
  return{title:'Pulso a la Vista',html:`
  <div class="lhead"><span class="eyebrow">${greet()}</span><h1>Tu práctica de hoy</h1></div>
  <div class="card statrow"><div class="stat"><b>${streak()}</b><span>días de racha</span></div><div class="stat"><b>${weekMins()}</b><span>min esta semana</span></div><div class="stat"><b>${d}<small style="font-size:18px;color:var(--muted)">/${t}</small></b><span>ejercicios</span></div></div>
  ${profileCard()}
  ${nx?`<a class="card tool" href="#/leccion/${nx.lesson}/${nx.id}"><span class="ic">${IC.play}</span><span style="flex:1;min-width:0"><b>Continuar: ${nx.t}</b><span>Lección ${nx.lesson} · ${LESSONS.find(l=>l.id===nx.lesson).title}</span></span></a>`:`<div class="card"><h3>Completaste todos los ejercicios</h3><p class="cap">Repite las pruebas del medidor cada semana para ver tu avance.</p></div>`}
  <a class="card tool" href="#/practicar/rutina"><span class="ic">${IC.cal}</span><span><b>Rutina de 15 minutos</b><span>Calentamiento, pulso, lección y banda con temporizador.</span></span></a>
  ${inst}
  <div><p class="eyebrow" style="margin-bottom:10px">Herramientas</p><div class="grid2">${toolCards()}</div></div>
  <div class="card" style="display:flex;flex-direction:column;gap:12px">
    <div class="row" style="justify-content:space-between"><span class="cl" style="margin:0">Tema</span><div class="seg">${[['auto','Automático'],['dark','Oscuro'],['light','Claro']].map(([v,l])=>`<button data-theme-set="${v}" aria-pressed="${DB.theme===v}">${l}</button>`).join('')}</div></div>
    <div class="row" style="justify-content:space-between"><span class="cl" style="margin:0">Progreso guardado en este dispositivo</span><span id="rstw"><button class="btn sm" data-h="reset">Reiniciar progreso</button></span></div>
  </div>
  <p class="foot">Pulso a la Vista · funciona sin conexión</p>`,
  mount(r){
    r.addEventListener('click',async e=>{
      const th=e.target.closest('[data-theme-set]');if(th){DB.theme=th.dataset.themeSet;save();applyTheme();$$('[data-theme-set]',r).forEach(x=>x.setAttribute('aria-pressed',String(x===th)));return}
      const b=e.target.closest('[data-h]');if(!b)return;const a=b.dataset.h;
      if(a==='install'&&DEFERRED){DEFERRED.prompt();try{await DEFERRED.userChoice}catch(_){}DEFERRED=null;route()}
      else if(a==='hideinst'){DB.hideInstall=true;save();route()}
      else if(a==='reset'){$('#rstw',r).innerHTML='<span class="row"><span class="cap" style="margin:0">¿Borrar ejercicios, racha y mediciones? El setlist se conserva.</span><button class="btn sm" data-h="reset-yes" style="border-color:var(--bad);color:var(--bad)">Sí, borrar</button><button class="btn sm" data-h="reset-no">Cancelar</button></span>'}
      else if(a==='reset-yes'){DB.done={};DB.secs={};DB.days={};DB.bpm={};DB.ses=[];save();route()}
      else if(a==='reset-no')route();
    });
  }};
}
const TOOLS=[['medidor','Medidor de precisión','El micrófono mide si vas adelantado o atrasado.',IC.target],['metronomo','Metrónomo','Click intermitente, 2 y 4, contratiempo y entrenador de velocidad.',IC.play2],['banda','Tocar con la banda','Bajo y acordes sin batería: rock, balada, cumbia, ranchera.',IC.band],['setlist','Setlist','El tempo de cada canción, listo para el ensayo.',IC.list]];
const toolCards=()=>TOOLS.map(([k,n,d,ic])=>`<a class="card tool" href="#/practicar/${k}"><span class="ic">${ic}</span><span><b>${n}</b><span>${d}</span></span></a>`).join('');
function viewLessons(){
  return{title:'Lecciones',html:`<div class="lhead"><span class="eyebrow">12 lecciones · ${ALLEX.length} ejercicios</span><h1>Lecciones</h1><p class="sub">Un plan para dejar de correr y arrastrar: medir, contar, sostener el pulso sin click y llevarlo a la banda.</p></div>
  ${PARTS2.map(p=>`<div class="list"><p class="eyebrow parth">Parte ${p.n} · ${p.t}</p>${p.m.map(i=>{const l=LESSONS.find(x=>x.id===i),[d,t]=doneCount(i);return`<a class="card lrow" href="#/leccion/${i}"><span class="mn ${d===t?'done':''}">${i}</span><span class="mt"><b>${l.title}</b><span>${l.sub}</span></span><span class="cnt">${d}/${t}</span></a>`}).join('')}</div>`).join('')}
  <a class="card tool" href="#/glosario"><span class="ic">${IC.book}</span><span><b>Glosario</b><span>Los términos del tiempo y el pulso, en idioma humano.</span></span></a>`};
}
function refreshProgress(){const el=$('#lprog');if(!el)return;const l=+el.dataset.l,[d,t]=doneCount(l);el.querySelector('i').style.width=(d/t*100)+'%';const c=$('#lcnt');if(c)c.textContent=`${d} de ${t} ejercicios hechos`}
function viewLesson(id,exId){
  const l=LESSONS.find(x=>x.id===id);if(!l)return viewLessons();
  const body=l.blocks.map(b=>{
    if(b.groove)return grooveCard(b.groove);
    if(b.ex)return exCard(b.ex);
    if(b.box)return`<div class="box"><p class="blockh">${b.box}</p><ul>${b.ul.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
    if(b.trick)return`<div class="box trick"><p class="blockh">Hoja de trucos</p><ul>${b.trick.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
    if(b.p)return`<p class="prose">${b.p}</p>`;
    return'';
  }).join('');
  const prev=LESSONS.find(x=>x.id===id-1),next=LESSONS.find(x=>x.id===id+1),[d,t]=doneCount(id);
  return{title:'Lección '+id,back:'#/lecciones',html:`
  <div class="lhead"><span class="eyebrow">Lección ${id} · Parte ${l.part}</span><h1>${l.title}</h1><p class="lead">${l.lead}</p>
  <div><div class="bar" id="lprog" data-l="${id}"><i style="width:${d/t*100}%"></i></div><p class="cap" id="lcnt" style="margin-top:6px">${d} de ${t} ejercicios hechos</p></div></div>
  ${body}
  <div class="row" style="justify-content:space-between">${prev?`<a class="btn" href="#/leccion/${prev.id}">${IC.back}Lección ${prev.id}</a>`:'<span></span>'}${next?`<a class="btn pri" href="#/leccion/${next.id}">Lección ${next.id}</a>`:''}</div>`,
  mount(r){
    mountGrooves(r);paintEx(r);
    if(exId){const el=$('#ex-'+exId,r);if(el)setTimeout(()=>el.scrollIntoView({block:'start',behavior:'smooth'}),60)}
  }};
}
function viewPractice(){
  return{title:'Practicar',html:`<div class="lhead"><span class="eyebrow">Herramientas</span><h1>Practicar</h1></div>
  <a class="card tool" href="#/practicar/rutina"><span class="ic">${IC.cal}</span><span><b>Rutina diaria</b><span>10, 15 o 30 minutos guiados con temporizador.</span></span></a>
  <div class="grid2">${toolCards()}</div>`};
}
let GSEL='Básicos',GID='rock';
function viewGrooves(){
  return{title:'Grooves',html:`<div class="lhead"><span class="eyebrow">${Object.keys(G).length} grooves</span><h1>Grooves</h1><p class="sub">Escucha, baja el tempo y silencia una pieza para tocarla tú.</p></div>
  <div class="chips" id="gcat">${GCATS.map(c=>`<button class="chip" data-c="${c}" aria-pressed="${c===GSEL}">${c}</button>`).join('')}</div>
  <div class="chips" id="glist"></div><div id="gone"></div>`,
  mount(r){
    const one=()=>{const h=$('#gone',r);cleanupIn(h);h.innerHTML=grooveCard(GID);mountGrooves(h)};
    const list=()=>{const ids=Object.keys(G).filter(k=>G[k].cat===GSEL);if(!ids.includes(GID))GID=ids[0];$('#glist',r).innerHTML=ids.map(k=>`<button class="chip" data-g="${k}" aria-pressed="${k===GID}">${G[k].n}</button>`).join('');one()};
    r.addEventListener('click',e=>{const c=e.target.closest('[data-c]');if(c){GSEL=c.dataset.c;$$('[data-c]',r).forEach(x=>x.setAttribute('aria-pressed',String(x===c)));if(SEQ.id==='grv')seqStop();list();return}
      const g=e.target.closest('[data-g]');if(g){GID=g.dataset.g;$$('[data-g]',r).forEach(x=>x.setAttribute('aria-pressed',String(x===g)));if(SEQ.id==='grv')seqStop();one()}});
    list();
  }};
}
function viewGlossary(){return{title:'Glosario',back:'#/lecciones',html:`<div class="gl">${GLOS.map(g=>`<div><b>${g[0]}</b><span>${g[1]}</span></div>`).join('')}</div>`}}
/* ---------- enrutador ---------- */
const NAV=[['#/','Inicio',IC.home,''],['#/lecciones','Lecciones',IC.book,'leccion'],['#/practicar','Practicar',IC.target,'practicar'],['#/grooves','Grooves',IC.drum,'grooves']];
let UNMOUNT=null;
function route(){
  const h=location.hash.replace(/^#\/?/,''),p=h.split('/');
  let v;
  if(!p[0])v=viewHome();
  else if(p[0]==='lecciones')v=viewLessons();
  else if(p[0]==='leccion')v=viewLesson(+p[1],p[2]);
  else if(p[0]==='glosario')v=viewGlossary();
  else if(p[0]==='grooves')v=viewGrooves();
  else if(p[0]==='practicar')v=({metronomo:viewMetronome,medidor:viewTiming,banda:viewBand,setlist:viewSetlist,rutina:viewRoutine}[p[1]]||viewPractice)();
  else v=viewHome();
  if(UNMOUNT){try{UNMOUNT()}catch(e){}UNMOUNT=null}
  const pg=$('#page');cleanupIn(pg);
  if(SEQ.id==='grv')seqStop();
  const sec=p[0]===''?'':p[0]==='lecciones'||p[0]==='glosario'?'leccion':p[0];
  $$('[data-nav]').forEach(a=>{const on=a.dataset.nav===sec;if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  $('#ttl').textContent=v.title;
  const bk=$('#back');bk.hidden=!v.back;if(v.back)bk.href=v.back;
  pg.innerHTML=v.html;
  document.title=v.title==='Pulso a la Vista'?v.title:v.title+' · Pulso a la Vista';
  if(v.mount)UNMOUNT=v.mount(pg)||null;
  if(!(p[0]==='leccion'&&p[2]))window.scrollTo(0,0);
  paintPlayer();
}
document.addEventListener('click',e=>{const x=e.target.closest('[data-x]');if(x)exAction(x)});
/* ---------- arranque ---------- */
document.body.insertAdjacentHTML('afterbegin',`<div class="shell">
 <nav class="side" aria-label="Secciones"><div class="brand">${IC.drum}Pulso a la Vista</div>${NAV.map(([h,l,ic,k])=>`<a href="${h}" data-nav="${k}">${ic}${l}</a>`).join('')}</nav>
 <main><header class="topbar"><div class="in"><a class="icon-btn" id="back" href="#/" aria-label="Volver" hidden>${IC.back}</a><span class="ttl" id="ttl"></span></div></header><div class="page" id="page"></div></main>
</div>
<nav class="tabs" aria-label="Secciones">${NAV.map(([h,l,ic,k])=>`<a class="tab" href="${h}" data-nav="${k}">${ic}${l}</a>`).join('')}</nav>`);
window.addEventListener('hashchange',route);
route();
/* Actualizaciones: busca versión nueva al abrir y al volver a la app; avisa cuando está lista. */
function showUpdate(){
  if(document.getElementById('upd'))return;
  const d=document.createElement('div');d.id='upd';d.className='player upd';
  d.innerHTML='<span class="dotlive"></span><span class="pl">Hay una versión nueva de la app</span><button class="btn sm pri" id="updgo">Actualizar</button>';
  document.body.appendChild(d);d.querySelector('#updgo').onclick=()=>location.reload();
}
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  let hadCtl=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadCtl){hadCtl=true;return}showUpdate()});
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
      const chk=()=>reg.update().catch(()=>{});
      document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk()});
      setInterval(chk,30*60*1000);chk();
    }).catch(()=>{});
  });
}
