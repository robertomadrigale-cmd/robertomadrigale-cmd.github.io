const LESSONS=[
{id:1,title:'Tu primer sonido',sub:'Postura y apagado de cuerdas',hue:220,blocks:[
 {aim:['Sostener el bajo sin cargar la muñeca.','Tocar una cuerda y apagar las demás.']},
 {step:'Paso 1',t:'Acomoda el instrumento',p:'La cuerda es el alambre que vibra; el mástil es la parte larga donde apoyas los dedos. Un traste es cada espacio entre las barras metálicas del mástil. Ajusta la correa para que el bajo no se caiga al soltar las manos. Mantén los hombros sueltos y la muñeca sin doblarla de más. Si algo duele, detente y reajusta.'},
 {step:'Paso 2',t:'Un sonido, luego silencio',p:'Pulsar significa jalar y soltar suavemente una cuerda con la yema. Al aire significa tocar sin pisar ningún traste: se escribe 0. Apagar es detener la vibración con un contacto suave. Ejemplo resuelto: pulsa Mi, la cuerda 4, al aire; apoya luego la yema sobre ella sin empujarla contra el mástil. Escucharás Mi y después silencio. Los números de cuerda se cuentan desde la más delgada: 1 Sol, 2 Re, 3 La, 4 Mi; en cinco cuerdas agregas 5 Si.'},
 {key:'Deja sonar solo la cuerda que elegiste. Apoya el pulgar en una cuerda más grave y los dedos libres sobre las que no tocas.'},
 E({id:'b1-apagar',t:'Mi y silencio',notes:[[4,0],[4,0],[4,0],[4,0]],steps:['Apoya el pulgar sin tensarlo.','Pulsa Mi con índice y medio alternados.','Apaga cada sonido antes del siguiente toque.'],goal:'Cuatro sonidos separados, sin zumbidos de otras cuerdas.'}),
 E({id:'b1-cuerdas',t:'Conoce tus cuerdas',notes:[[4,0],[3,0],[2,0],[1,0]],five:[[5,0],[4,0],[3,0],[2,0],[1,0]],steps:['Escucha el ejemplo.','Toca cada cuerda al aire en el orden mostrado.','Apaga la cuerda anterior al cambiar.'],goal:'Nombras las cuerdas y dejas sonar una a la vez.'}),
 E({id:'b1-turnos',t:'Sonido largo, silencio claro',notes:[[4,0,2],[3,0,2],[2,0,2],[1,0,2]],five:[[5,0,2],[4,0,2],[3,0,2],[2,0,2],[1,0,2]],steps:['Cuenta dos pulsos mientras suena cada cuerda.','Apaga justo antes de cambiar.','Comprueba que no quede otra cuerda vibrando.'],goal:'Sostienes cada nota y haces cuatro cambios limpios.'}),
 {check:[['¿Qué significa el traste 0?','Cuerda al aire: no presionas el mástil.'],['¿Cómo apagas una nota?','Toca la cuerda suavemente para detener su vibración.']]},
 {errors:['Apretar de más: usa solo la presión necesaria.','Levantar todos los dedos al cambiar: deja uno tocando la cuerda que debe callar.']},
 {trick:['Cuerda 1 = la más delgada, Sol.','Pulsa, escucha, apaga.','El micrófono califica altura y momento; revisa tú la postura y el apagado.']}
]},
{id:2,title:'Lee tu primera línea',sub:'Tablatura y dedos',hue:240,blocks:[
 {aim:['Leer cuerda y traste en una tablatura.','Ubicar cada dedo sin estirar de más.']},
 {step:'Paso 1',t:'Las líneas son cuerdas',p:'La tablatura es un dibujo de las cuerdas con números de traste. La línea de arriba es Sol, cuerda 1; la de abajo es Mi en cuatro cuerdas o Si en cinco. Se lee de izquierda a derecha. Un guion indica que no hay un nuevo toque en esa columna; aquí cada columna sigue la duración indicada en el paso a paso.'},
 {step:'Paso 2',t:'Un dedo por traste',p:'Dedo 1 = índice, 2 = medio, 3 = anular y 4 = meñique de la mano que pisa. Una posición es la zona del mástil que cubres sin mover esa mano. Ejemplo resuelto: en la cuerda Mi, posición 1, traste 1 con índice, 2 con medio, 3 con anular y 4 con meñique. El 0 no lleva dedo. Si el alcance es incómodo, mueve la mano; no fuerces la separación.'},
 {key:'El número grande es el traste; la insignia pequeña en el punto es el dedo.'},
 E({id:'b2-dedos',t:'Cuatro dedos',notes:[[4,1],[4,2],[4,3],[4,4]],steps:['Localiza la cuerda Mi.','Pisa junto a la barra metálica, sin quedar encima.','Sigue 1, 2, 3, 4 con la mano relajada.'],goal:'Lees cuatro números y eliges los dedos correspondientes.'}),
 E({id:'b2-tab',t:'Cambia de línea',notes:[[3,0],[3,2],[2,0],[2,2]],steps:['Lee primero la línea y después el número.','Toca La al aire y traste 2.','Pasa a Re al aire y traste 2.'],goal:'Cambias de cuerda sin confundirla con el traste.'}),
 E({id:'b2-escalera',t:'Escalera en dos cuerdas',notes:[[4,1],[4,2],[4,3],[4,4],[3,1],[3,2],[3,3],[3,4]],steps:['Lee los cuatro trastes de la cuerda Mi.','Cambia a La y repite la misma digitación.','Mueve solo lo necesario y conserva la mano relajada.'],goal:'Relacionas línea, traste y dedo en dos cuerdas.'}),
 {check:[['¿Un 3 en la línea La significa cuerda 3?','Significa traste 3 de la cuerda La; la línea identifica la cuerda.'],['¿Qué dedo usa una cuerda al aire?','Ninguno de la mano que pisa.']]},
 {errors:['Leer de abajo hacia arriba como una lista: sigue las columnas de izquierda a derecha.','Confundir dedo 4 con cuerda 4: revisa la leyenda.']},
 {trick:['Línea = cuerda; número = traste.','Los puntos muestran la nota y su dedo.','Usa Anterior y Siguiente para escuchar una nota a la vez.']}
]},
{id:3,title:'La raíz al pulso',sub:'Tu lugar dentro del grupo',hue:260,blocks:[
 {aim:['Mantener una velocidad estable.','Sostener la nota que da nombre al acorde.']},
 {step:'Paso 1',t:'Pulso, tempo y compás',p:'El pulso es el paso regular de la música. El tempo es su velocidad; bpm significa pulsos por minuto: a 60 bpm hay uno por segundo. Un compás agrupa pulsos; en 4/4 contamos 1, 2, 3, 4 y volvemos al 1. Una nota de un pulso se llama negra; de dos, blanca. El silencio es tiempo que cuentas sin tocar.'},
 {step:'Paso 2',t:'Encuentra la raíz',p:'Un acorde es un conjunto de notas que suenan juntas. Su raíz es la nota que le da nombre. El bajo puede sostener esa raíz mientras otros instrumentos completan el acorde. Ejemplo resuelto: para acompañar un acorde de La, toca La, cuerda 3 al aire, en cada número de la cuenta 1, 2, 3, 4.'},
 {key:'Primero cuenta parejo; después toca. Una sola nota a tiempo sostiene a toda la banda.'},
 E({id:'b3-raiz',t:'Cuatro pasos en La',notes:[[3,0],[3,0],[3,0],[3,0]],steps:['Escucha los cuatro pulsos de entrada.','Toca La en cada pulso.','Mantén la cuenta aunque una nota no salga.'],goal:'Aciertas al menos 80 % en una ronda.'}),
 E({id:'b3-largas',t:'Deja espacio',notes:[[3,0,2],[3,0,2],[4,0,2],[4,0,2]],steps:['Cuenta dos pulsos por nota.','La suena dos veces; luego cambia a Mi.','Apaga al llegar la nota siguiente.'],goal:'No aceleras cuando sostienes una nota.'}),
 E({id:'b3-cambios',t:'Raíces en cada pulso',notes:[[3,3],[3,3],[4,3],[4,3],[3,0],[3,0],[4,0],[4,0]],steps:['Cuenta dos Do, dos Sol, dos La y dos Mi.','Cambia de posición sin detener la cuenta.','Vuelve al pulso siguiente si una nota no sale.'],goal:'Mantienes ocho pulsos mientras cambias de raíz.'}),
 {check:[['¿Cuántos segundos dura un pulso a 60 bpm?','Un segundo.'],['¿Cuál es la raíz de un acorde de Mi?','Mi.']]},
 {errors:['Seguir una nota equivocada con prisa: regresa al pulso siguiente.','Tocar cada vez más fuerte: mantén una fuerza cómoda.']},
 {trick:['Cuenta de entrada = preparación antes de tocar.','4/4 = grupos de cuatro pulsos.','Una nota larga también necesita una cuenta estable.']}
]},
{id:4,title:'Raíz y quinta',sub:'Tololoche, ranchera y polka',hue:290,blocks:[
 {aim:['Encontrar una quinta desde una raíz.','Alternar dos notas en compases de tres y cuatro pulsos.']},
 {step:'Paso 1',t:'Mide el salto',p:'Un semitono es la distancia de un traste. Un tono son dos semitonos. Un intervalo es la distancia entre dos notas. La quinta justa está siete semitonos arriba de la raíz. Ejemplo resuelto: Sol, cuerda 4 traste 3, más siete semitonos es Re; lo encuentras en cuerda 3 traste 5. En cuerdas vecinas de este bajo, la quinta queda dos trastes adelante.'},
 {step:'Paso 2',t:'Alterna con intención',p:'El tololoche es un contrabajo acústico usado en música regional; aquí practicas su función con bajo eléctrico, sin imitar su timbre. En una polka puedes alternar raíz en 1 y quinta en 3 de un compás de cuatro pulsos. Una ranchera en vals agrupa tres pulsos: toca una nota en 1 y cuenta 2, 3; cambia de nota en el siguiente 1.'},
 {key:'Raíz y quinta forman una base clara. El compás decide cuándo alternarlas.'},
 E({id:'b4-polka',t:'Sol y Re',bpm:80,notes:[[4,3,2],[3,5,2],[4,3,2],[3,5,2]],steps:['Pon el dedo 1 en Sol, traste 3.','Toca Re con dedo 3, cuerda 3 traste 5.','Alterna cada dos pulsos.'],goal:'Cambias entre raíz y quinta sin perder la cuenta.'}),
 E({id:'b4-vals',t:'Ranchera en tres',beats:3,bpm:90,notes:[[3,0,3],[4,0,3],[3,0,3],[4,0,3]],steps:['Cuenta 1, 2, 3.','Toca La en el primer compás y Mi en el segundo.','Mi es la quinta de La en una altura más grave.'],goal:'Se siente el inicio de cada grupo de tres.'}),
 E({id:'b4-dos-pares',t:'Dos pares de raíz y quinta',bpm:76,notes:[[3,3,2],[2,5,2],[4,3,2],[3,5,2]],steps:['Toca Do y su quinta Sol.','Mueve la mano para tocar Sol grave y su quinta Re.','Da dos pulsos a cada nota.'],goal:'Reconoces la misma relación desde dos raíces.'}),
 {check:[['¿Cuántos semitonos separan raíz y quinta justa?','Siete hacia arriba.'],['Desde Sol en cuerda 4 traste 3, ¿dónde está Re?','Cuerda 3 traste 5.']]},
 {errors:['Tocar una nota en cada número del vals cuando buscas espacio: sostén tres pulsos.','Cambiar de cuerda sin apagar: evita que raíz y quinta se encimen.']},
 {trick:['Raíz = R. Quinta = 5.','En una cuerda: +7 trastes.','En la cuerda más aguda vecina: +2 trastes.']}
]},
{id:5,title:'Octavas y caminos cortos',sub:'Aproximaciones cromáticas',hue:315,blocks:[
 {aim:['Encontrar la misma nota más aguda.','Llegar a una raíz desde un traste vecino.']},
 {step:'Paso 1',t:'La misma nota en otra altura',p:'Una octava es el salto de doce semitonos: el nombre se repite, pero más agudo o más grave. Ejemplo resuelto: Sol en cuerda 4 traste 3 tiene su octava aguda en cuerda 2 traste 5. Los números pequeños de Mi1 o Sol2 indican la octava; no son dedos ni cuerdas.'},
 {step:'Paso 2',t:'Acércate por un semitono',p:'Cromático significa avanzar por semitonos. Una aproximación cromática es una nota vecina que conduce a la siguiente nota importante. Sostenido (♯) sube un semitono y bemol (♭) baja uno. Ejemplo resuelto: para llegar a La en cuerda 4 traste 5, toca Sol♯ en traste 4 justo antes y resuelve en La. Resolver significa llegar a la nota de destino.'},
 {key:'La nota de paso crea movimiento; la raíz de llegada debe escucharse clara.'},
 E({id:'b5-octava',t:'Sol abajo y arriba',notes:[[4,3],[2,5],[4,3],[2,5]],steps:['Localiza Sol grave con dedo 1.','Salta dos cuerdas a Sol agudo con dedo 3.','Apaga las cuerdas que atraviesas.'],goal:'Reconoces el mismo nombre en dos alturas.'}),
 E({id:'b5-croma',t:'Llega a La',notes:[[4,3],[4,4],[4,5,2],[4,4],[4,5,3]],steps:['Toca Sol, Sol♯ y La.','Sostén La dos pulsos.','Repite Sol♯ y termina en La durante tres pulsos.'],goal:'La llegada a La suena estable.'}),
 E({id:'b5-octava-la',t:'La en dos alturas',notes:[[4,5],[2,7],[4,5],[2,7]],steps:['Toca La grave en cuerda 4, traste 5.','Salta a La agudo en cuerda 2, traste 7.','Regresa sin dejar cuerdas abiertas sonando.'],goal:'Encuentras otra octava y conservas el mismo nombre de nota.'}),
 {check:[['¿Cuántos semitonos tiene una octava?','Doce.'],['¿Qué ocurre entre Mi y Fa?','Ya hay un semitono; Mi♯ suena como Fa. También Si♯ = Do, Fa♭ = Mi y Do♭ = Si. Son nombres equivalentes según el contexto.']]},
 {errors:['Quedarte en la nota cromática por accidente: recuerda el destino.','Confundir una octava con una cuerda vecina: salta dos cuerdas y dos trastes.']},
 {trick:['Octava: dos cuerdas más agudas y dos trastes adelante.','Cromático = de traste en traste.','Mi♯ = Fa · Si♯ = Do · Fa♭ = Mi · Do♭ = Si.']}
]},
{id:6,title:'Dibuja el acorde',sub:'Arpegios mayores y menores',hue:340,blocks:[
 {aim:['Tocar las notas de un acorde una por una.','Distinguir una tercera mayor de una menor.']},
 {step:'Paso 1',t:'Tercera y arpegio',p:'La tercera mayor está cuatro semitonos sobre la raíz; la tercera menor está tres. Una tríada es un acorde de tres notas: raíz, tercera y quinta. Mayor y menor describen qué tercera tiene. Un arpegio toca esas notas una tras otra. Ejemplo resuelto: Do mayor = Do, Mi, Sol. Desde Do en cuerda 3 traste 3, Mi está en cuerda 2 traste 2 y Sol en cuerda 2 traste 5.'},
 {step:'Paso 2',t:'Cambia una sola nota',p:'Do menor = Do, Mi♭, Sol: baja la tercera un traste, de Mi a Mi♭, y conserva raíz y quinta. En la posición 1, el dedo 1 toca traste 1 y el 3 toca traste 3. Si una nota queda fuera de los cuatro trastes de tu posición, desplaza la mano completa; el paso a paso muestra el dedo nuevo.'},
 {key:'La tercera decide si esta tríada es mayor o menor. La raíz y la quinta siguen iguales.'},
 E({id:'b6-mayor',t:'Do mayor',notes:[[3,3],[2,2],[2,5],[3,3]],steps:['Di Do, Mi, Sol, Do.','Escucha el arpegio.','Toca cada nota y cambia de posición al llegar a traste 5.'],goal:'Ubicas raíz, tercera mayor y quinta.'}),
 E({id:'b6-menor',t:'Do menor',notes:[[3,3],[2,1],[2,5],[3,3]],steps:['Baja Mi un traste: ahora es Mi♭.','Conserva Do y Sol.','Compara con el ejercicio anterior.'],goal:'Cambias el carácter del acorde moviendo solo la tercera.'}),
 E({id:'b6-terceras',t:'Compara las terceras',notes:[[3,3],[2,2],[3,3],[2,1],[3,3,2]],steps:['Toca Do y Mi para escuchar la tercera mayor.','Vuelve a Do y toca Mi♭ para escuchar la menor.','Termina en Do y sostén dos pulsos.'],goal:'Distingues cuál nota cambia entre mayor y menor.'}),
 {check:[['¿Qué diferencia hay entre acorde y arpegio?','En el acorde pueden sonar juntas sus notas; en el arpegio las tocas una a una.'],['¿Qué tercera tiene Do menor?','Mi♭, a tres semitonos de Do.']]},
 {errors:['Estirar para evitar todo cambio: mueve la mano con calma.','Bajar también la quinta al pasar a menor: solo cambia la tercera.']},
 {trick:['Mayor: 0, 4, 7 semitonos desde la raíz.','Menor: 0, 3, 7.','Toca una nota a la vez y escucha la diferencia.']}
]},
{id:7,title:'Un mapa para moverte',sub:'Escalas y caja pentatónica',hue:190,blocks:[
 {aim:['Construir una escala mayor.','Usar cinco notas dentro de una zona cómoda.']},
 {step:'Paso 1',t:'La receta de la escala',p:'Una escala es una familia de notas ordenadas por altura. La escala mayor usa saltos de 2, 2, 1, 2, 2, 2, 1 semitonos. Un grado es el lugar de una nota dentro de esa familia: primero, segundo, tercero. Ejemplo resuelto: desde Do obtienes Do, Re, Mi, Fa, Sol, La, Si y Do. Una tonalidad es el conjunto de notas organizado alrededor de una nota principal, como Do mayor.'},
 {step:'Paso 2',t:'Cinco notas en una caja',p:'Pentatónica significa escala de cinco notas. La pentatónica menor de La contiene La, Do, Re, Mi y Sol: distancias 0, 3, 5, 7 y 10 semitonos desde La. Una caja es una manera de distribuirlas por cuerdas dentro de pocos trastes. Ejemplo resuelto: La y Do en cuerda 4 trastes 5 y 8; Re y Mi en cuerda 3 trastes 5 y 7; Sol y La en cuerda 2 trastes 5 y 7.'},
 {key:'La caja es un mapa, no una obligación de tocar todas las notas en cada frase.'},
 E({id:'b7-mayor',t:'Escala de Do',notes:[[3,3],[3,5],[2,2],[2,3],[2,5],[1,2],[1,4],[1,5]],steps:['Escucha y di los nombres.','Toca lento; mueve la mano cuando lo indique el dedo.','Vuelve a escuchar si dudas de un salto.'],goal:'Reconoces los dos semitonos: Mi–Fa y Si–Do.'}),
 E({id:'b7-penta',t:'Caja de La menor',notes:[[4,5],[4,8],[3,5],[3,7],[2,5],[2,7]],steps:['Empieza con dedo 1 en traste 5.','Usa dedo 4 en traste 8 y dedo 3 en traste 7.','Al llegar a La agudo, apaga y respira.'],goal:'Tocas la caja sin perder la posición.'}),
 E({id:'b7-mayor-baja',t:'Escala de Do al regresar',notes:[[1,5],[1,4],[1,2],[2,5],[2,3],[2,2],[3,5],[3,3]],steps:['Empieza en Do agudo.','Di Si, La, Sol, Fa, Mi y Re mientras bajas.','Termina en Do grave sin acelerar.'],goal:'Recorres la escala mayor en sentido descendente.'}),
 {check:[['¿Cuántas notas distintas tiene una pentatónica?','Cinco; la octava repite el nombre de la raíz.'],['¿La receta mayor cambia al empezar en Sol?','No. Mantiene los mismos saltos desde la nueva raíz.']]},
 {errors:['Memorizar solo los dedos: di también los nombres.','Correr al subir: usa un tempo que permita notas limpias.']},
 {trick:['Mayor: 2–2–1–2–2–2–1.','Pentatónica menor: raíz, +3, +5, +7, +10.','Un patrón cambia de tono al mover todas sus notas la misma distancia.']}
]},
{id:8,title:'El ritmo de cada género',sub:'Siete formas de acompañar',hue:205,blocks:[
 {aim:['Distinguir dónde empieza cada nota.','Probar siete líneas originales con su intención rítmica.']},
 {step:'Paso 1',t:'Parte el pulso',p:'Una corchea dura medio pulso. Cuenta «1 y 2 y 3 y 4 y»: los números caen en el pulso y las «y» entre pulsos. Una síncopa pone énfasis entre pulsos o sostiene una nota a través del siguiente. Groove es el patrón de notas, silencios y acentos que se repite y da movimiento.'},
 {step:'Paso 2',t:'Escucha antes de copiar',p:'Ejemplo resuelto de cumbia: La dura un pulso y medio, Mi medio, luego Mi un pulso y medio y La agudo medio. Cuenta los ocho medios pulsos para saber dónde cambiar. Son propuestas para practicar: cada región y cada grupo puede usar variantes. En Tocar con la banda puedes cambiar el género y escuchar sus demás instrumentos.'},
 {key:'El género no depende solo de las notas: importa cuánto duran y dónde entran.'},
 E({id:'b8-cumbia',t:'Cumbia: ida y vuelta',bpm:85,notes:[[3,0,1.5],[2,2,.5],[2,2,1.5],[1,2,.5]],steps:['Cuenta números y «y».','Entra en La; cambia a Mi después de «2».','Termina con La agudo justo antes del nuevo 1.'],goal:'Mantienes los cambios de un pulso y medio.'}),
 E({id:'b8-banda',t:'Banda: raíz y quinta',bpm:100,notes:[[4,3,2],[3,5,2],[4,3,2],[3,5,2]],steps:['Piensa en un apoyo firme en 1.','Alterna Sol y Re en 1 y 3.','Deja espacio para los metales.'],goal:'Sostienes el patrón sin añadir notas.'}),
 E({id:'b8-norteno',t:'Norteño: regreso a la raíz',bpm:100,notes:[[4,3,2],[3,5],[4,2],[4,3,4]],steps:['Toca Sol y luego Re.','Usa Fa♯, traste 2, para acercarte a Sol.','Llega a Sol en el inicio del siguiente compás.'],goal:'La aproximación desemboca en la raíz.'}),
 E({id:'b8-rock',t:'Rock: ocho motores',bpm:90,notes:Array.from({length:8},()=>[4,0,.5]),steps:['Alterna índice y medio.','Toca en cada número y cada «y».','Busca la misma fuerza en todos los golpes.'],goal:'Ocho Mi constantes sin acelerarte.'}),
 E({id:'b8-balada',t:'Balada: deja respirar',bpm:68,notes:[[3,3,4],[4,3,4],[3,0,4],[4,1,4]],steps:['Toca Do y cuenta cuatro.','Sigue Sol, La y Fa, cuatro pulsos cada uno.','Apaga antes del siguiente cambio.'],goal:'Cuatro notas largas con entradas claras.'}),
 E({id:'b8-reggaeton',t:'Reggaetón: base firme',bpm:85,notes:[[3,0,2],[3,0],[2,2],[3,0,2],[3,0],[2,2]],steps:['Sostén La durante 1 y 2.','Repite La en 3 y toca Mi en 4.','Deja que la batería de la banda complete el patrón.'],goal:'Distingues una nota larga de dos cortas.'}),
 E({id:'b8-bossa',t:'Bossa: llegada anticipada',bpm:90,notes:[[3,3,1.5],[4,3,.5],[3,3,1.5],[4,3,.5]],steps:['Toca Do en 1 y Sol en «2 y».','Regresa a Do en 3.','Sol entra en «4 y», sin empujar el tempo.'],goal:'Las anticipaciones llegan entre pulsos.'}),

function mergeVal(a,b){
  if(a==null)return b;if(b==null)return a;
  if(typeof a==='number'&&typeof b==='number')return Math.max(a,b);
  if(typeof a==='boolean'||typeof b==='boolean')return!!(a||b);
  if(Array.isArray(a)||Array.isArray(b))return(Array.isArray(a)&&a.length>=(Array.isArray(b)?b.length:0))?a:b;
  if(typeof a==='object'&&typeof b==='object'){const o=Object.assign({},a);for(const k in b)o[k]=mergeVal(a[k],b[k]);return o}
  return a;
}

  return{title:'Grabadora',back:'#/practicar',html:`<div class="kplay tplay">${toolHead('rec','Grabadora','Escúchate')}
  <div class="card center"><div class="recdot" id="rdot"></div><div class="big" id="rtime" style="font-size:72px">0:00</div>
   <div><span class="cl">Acompañamiento mientras grabas</span><div class="seg" id="racc">${[['none','Ninguno'],['met','Metrónomo'],['trk','Pista']].map(([v,l])=>`<button data-acc="${v}" aria-pressed="${(DB.recAcc||'none')===v}">${l}</button>`).join('')}</div></div>
   <div id="raccopt" class="raccopt"></div><div id="rmsg"></div></div>
  <div class="card"><span class="cl">Tus tomas · se guardan en este dispositivo</span><div id="rlist" class="takes"></div></div>
  ${toolDock(`<span class="tm" id="rdm"></span><div class="ktrans"><button class="kplayb rec" id="rgo"></button></div><span></span>`)}</div>`,
  mount(r){
    const go=$('#rgo',r);
    const paint=()=>{go.innerHTML=playLbl(!!REC.mr,'Grabar','Detener y guardar','<i class="rec-i"></i>');go.setAttribute('aria-label',REC.mr?'Detener y guardar':'Grabar');$('#rdot',r).classList.toggle('on',!!REC.mr);$('#rdm',r).textContent=REC.mr?'Grabando…':'Lista para grabar';const m=$('#tmeta',r);if(m)m.textContent='Grábate y escúchate después'};
    const list=async()=>{REC.urls.forEach(u=>URL.revokeObjectURL(u));REC.urls=[];const ts=await takesAll();const el=$('#rlist',r);if(!el)return;
      el.innerHTML=ts.length?ts.map(t=>{const u=URL.createObjectURL(t.blob);REC.urls.push(u);const d=new Date(t.date);return`<div class="take"><div class="row" style="justify-content:space-between"><b>Toma del ${d.toLocaleDateString('es-MX',{day:'numeric',month:'short'})} · ${d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}</b><span class="tm">${fmt(t.dur)}</span></div><audio controls preload="metadata" src="${u}"></audio><div class="row"><a class="btn sm" href="${u}" download="mades-toma-${t.id}.${t.type.includes('mp4')?'m4a':'webm'}">${IC.down}Descargar</a><span data-dw="${t.id}"><button class="btn sm" data-del="${t.id}">${IC.x}Borrar</button></span></div></div>`}).join(''):'<p class="cap">Todavía no tienes tomas. Graba la primera.</p>'};
    const accOn=()=>SEQ.id&&(OWNER==='rec'||OWNER==='recprev');
    const accStart=own=>{const a=DB.recAcc||'none';OWNER=own;if(a==='met')metStart({bpm:MET.bpm,meter:MET.meter,sub:1});else if(a==='trk')trkStart()};
    // opciones del acompañamiento: tempo y compás del metrónomo, o tono, progresión, estilo y tempo de la pista
    const opts=()=>{
      const a=DB.recAcc||'none',el=$('#raccopt',r);
      if(a==='none'){el.innerHTML='';return}
      const bpm=a==='met'?MET.bpm:TRK.bpm;
      el.innerHTML=`<div class="row" style="justify-content:center"><button class="btn sm" data-rb="-5" aria-label="Bajar 5">−5</button><button class="btn sm" data-rb="-1" aria-label="Bajar 1">−1</button><b class="kkey" id="rbpm">${bpm}</b><span class="cl" style="margin:0">bpm</span><button class="btn sm" data-rb="1" aria-label="Subir 1">+1</button><button class="btn sm" data-rb="5" aria-label="Subir 5">+5</button></div>
       <input type="range" id="rbr" min="${a==='met'?30:50}" max="${a==='met'?240:200}" value="${bpm}" aria-label="Tempo">
       ${a==='met'?chipRow('meter','Compás',Object.keys(METERS).map(v=>({v,l:v})),MET.meter)
        :chipRow('k','Tonalidad',KEYS.map((x,i)=>({v:i,l:x.es,s:x.us})),TRK.k)+chipRow('p','Progresión',Object.keys(PROG2).map(v=>({v,l:PROG2[v].n})),TRK.p)+chipRow('st','Estilo',Object.keys(STYLES).map(v=>({v,l:STYLES[v].n})),TRK.st)}
       <div class="row" style="justify-content:center"><button class="btn sm" id="rprev">${accOn()&&OWNER==='recprev'?IC.stop+'Detener':IC.play+'Escuchar antes de grabar'}</button></div>`;
    };
    const setBpm=v=>{const a=DB.recAcc;if(a==='met'){MET.bpm=Math.max(30,Math.min(240,Math.round(v)));DB.met=MET.bpm;if(SEQ.id==='met')SEQ.label='Metrónomo '+MET.bpm}else{TRK.bpm=Math.max(50,Math.min(200,Math.round(v)))}save();const b=$('#rbpm',r);if(b)b.textContent=a==='met'?MET.bpm:TRK.bpm;const g=$('#rbr',r);if(g)g.value=a==='met'?MET.bpm:TRK.bpm};
    const restartAcc=()=>{if(accOn()){const own=OWNER;seqStop();accStart(own)}};
    const stopRec=()=>{if(REC.mr&&REC.mr.state!=='inactive')REC.mr.stop();clearInterval(REC.iv);if(SEQ.id&&(OWNER==='rec'||OWNER==='recprev'))seqStop()};
    go.onclick=async()=>{
      $('#rmsg',r).innerHTML='';
      if(REC.mr){stopRec();return}
      if(!window.MediaRecorder||!navigator.mediaDevices){$('#rmsg',r).innerHTML='<p class="msg err">Este navegador no puede grabar audio. Prueba con Chrome o Safari actualizados.</p>';return}
      try{REC.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:true}})}catch(e){$('#rmsg',r).innerHTML='<p class="msg err">No se pudo usar el micrófono. Permítelo en los ajustes del navegador.</p>';return}
      const type=['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||'';
      REC.mr=new MediaRecorder(REC.stream,type?{mimeType:type}:{});REC.chunks=[];REC.t0=Date.now();
      REC.mr.ondataavailable=e=>{if(e.data&&e.data.size)REC.chunks.push(e.data)};
      REC.mr.onstop=async()=>{const blob=new Blob(REC.chunks,{type:REC.mr.mimeType||type||'audio/webm'}),dur=(Date.now()-REC.t0)/1000;REC.stream.getTracks().forEach(t=>t.stop());REC.mr=null;REC.stream=null;paint();
        if(dur>.8){try{await takePut({date:Date.now(),dur,blob,type:blob.type});DB.recs=(DB.recs||0)+1;save();toast(logo()+'<span>Toma guardada</span>')}catch(e){const m=$('#rmsg',r);if(m)m.innerHTML='<p class="msg err">No se pudo guardar la toma en este dispositivo. Revisa que el navegador no esté en modo privado y que tenga espacio.</p>'}}
        else{const m=$('#rmsg',r);if(m)m.innerHTML='<p class="msg">La toma fue muy corta y no se guardó.</p>'}
        if(!blob.size){const m=$('#rmsg',r);if(m)m.innerHTML='<p class="msg err">El micrófono no entregó sonido. Revisa que no lo esté usando otra app.</p>'}
        list();opts()};
      REC.mr.start(500);
      if(SEQ.id)seqStop();accStart('rec');opts();
      REC.iv=setInterval(()=>{const t=$('#rtime',r);if(t)t.textContent=fmt((Date.now()-REC.t0)/1000)},250);paint();
    };
    r.addEventListener('click',async e=>{
      const a=e.target.closest('[data-acc]');if(a){const was=accOn()?OWNER:null;if(was)seqStop();DB.recAcc=a.dataset.acc;save();$$('[data-acc]',r).forEach(x=>x.setAttribute('aria-pressed',String(x===a)));if(was==='rec')accStart('rec');opts();return}
      const rb=e.target.closest('[data-rb]');if(rb){setBpm((DB.recAcc==='met'?MET.bpm:TRK.bpm)+ +rb.dataset.rb);if(DB.recAcc==='trk')restartAcc();return}
      const cs=e.target.closest('[data-set]');if(cs){const k=cs.dataset.set;if(k==='meter'){MET.meter=cs.dataset.v;DB.meter=MET.meter}else{TRK[k]=k==='k'?+cs.dataset.v:cs.dataset.v;if(k==='st')TRK.bpm=STYLES[TRK.st].bpm}save();restartAcc();opts();return}
      if(e.target.closest('#rprev')){if(accOn()&&OWNER==='recprev')seqStop();else if(!REC.mr){if(SEQ.id)seqStop();accStart('recprev')}opts();return}
      const d=e.target.closest('[data-del]');if(d){d.parentNode.innerHTML=`<button class="btn sm" data-delok="${d.dataset.del}" style="border-color:var(--bad);color:var(--bad)">Sí, borrar</button>`;return}
      const k=e.target.closest('[data-delok]');if(k){await takeDel(+k.dataset.delok);list()}
    });
    r.addEventListener('input',e=>{if(e.target.id==='rbr'){setBpm(+e.target.value)}});
    r.addEventListener('change',e=>{if(e.target.id==='rbr'&&DB.recAcc==='trk')restartAcc()});
    paint();list();opts();
    return()=>{stopRec();REC.urls.forEach(u=>URL.revokeObjectURL(u));REC.urls=[]};
  }};
}

function backupCode(){return'MGH1:'+btoa(unescape(encodeURIComponent(JSON.stringify(DB))))}
function restoreCode(txt){
  txt=String(txt||'').trim();let o=null;
  try{o=txt.startsWith('MGH1:')?JSON.parse(decodeURIComponent(escape(atob(txt.slice(5))))):JSON.parse(txt)}catch(e){return false}
  if(!o||typeof o!=='object'||typeof o.done!=='object')return false;
  Object.keys(DB).forEach(k=>delete DB[k]);Object.assign(DB,{done:{},secs:{},days:{},game:{},bpm:{},theme:'auto'},o);save();applyTheme();return true;
}

const FIGST={};
const midiOf=(s,f)=>OPEN_MIDI[s]+f;
function figState(x){
  if(!FIGST[x.id])FIGST[x.id]={updown:true,per:1,guide:true,mic:false,beats:x.fig.beats||4};
  return FIGST[x.id];
}
const figBpm=x=>DB.bpm[x.id]||x.bpm||(x.fig.type==='chords'?70:60);
function seqData(F){
  const seen={},dots=[],seq=[];
  F.arr.forEach(([s,f,t,k])=>{const key=s+'-'+f;if(!seen[key]){seen[key]=1;dots.push({s,f,t:t==null?nm((OPEN_PC[s]+f)%12):t,k:k||'note'})}seq.push([s,f])});
  return{dots,seq};
}
function chordBoard(F,i){
  const [name,frets]=F.list[i],to=Math.max(5,...F.list.map(c=>Math.max(...c[1].filter(v=>v!=null))+1)),d=[],m=[];
  const{fg,barre}=chordFing(frets);
  frets.forEach((f,j)=>{const s=INST.n-j;if(f==null){m.push(s);return}d.push({s,f,t:nm((OPEN_PC[s]+f)%12),k:'note',fg:fg[s]})});
  return fretboard({to,dots:d,muted:m,barre,label:'Acorde '+name});
}
const chordMidiF=frets=>frets.map((f,j)=>f==null?null:OPEN_MIDI[INST.n-j]+f).filter(v=>v!=null);
// cada opción del ejercicio es un interruptor: ícono, valor actual y qué es; al tocarlo cambia al otro valor
const FTOG={updown:[['Ida y vuelta',true],['Solo ida',false],'Recorrido','<path d="M4 8h13l-3-3M20 16H7l3 3"/>'],per:[['1 por pulso',1],['2 por pulso',2],'Notas','<path d="M8 18V6l8-2v12"/><circle cx="6" cy="18" r="2"/><circle cx="14" cy="16" r="2"/>'],
  guide:[['Con guía',true],['Solo click',false],'Guía','<path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"/>'],mic:[['Sin calificar',false],['Con micrófono',true],'Calificar','<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>'],
  beats:[['4 pulsos',4],['2 pulsos',2],'Por acorde','<path d="M4 6h16M4 12h16M4 18h16"/><path d="M9 4v16"/>']};
function figTog(x,k){const st=figState(x),[a,b,lab,ic]=FTOG[k],cur=String(st[k])===String(a[1])?a:b,nxt=cur===a?b:a,on=k==='mic'?st.mic:null;
  return`<button class="ftog${on?' on':''}" data-fx="opt" data-k="${k}" data-v="${nxt[1]}" data-id="${x.id}" aria-label="${lab}: ${cur[0]}. Toca para cambiar a ${nxt[0]}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ic}</svg><b>${k==='guide'&&x.fig.type!=='seq'&&cur[1]?'Con rasgueo':cur[0]}</b><small>${lab}</small></button>`}
function figHTML(x){
  const F=x.fig,st=figState(x),ownBpm=!x.bpm;
  const bpmCtl=ownBpm?`<span class="minimet"><button class="icon-btn" data-fx="bpm" data-d="-5" data-id="${x.id}" aria-label="Bajar tempo">${IC.minus}</button><span class="v" data-fx="bpmv" data-id="${x.id}">${figBpm(x)} bpm</span><button class="icon-btn" data-fx="bpm" data-d="5" data-id="${x.id}" aria-label="Subir tempo">${IC.plus}</button></span>`:'';
  const opts=(F.type==='seq'?['updown','per','guide','mic']:['beats','guide']).map(k=>figTog(x,k)).join('');
  const board=F.type==='seq'?(()=>{const{dots}=seqData(F);if(!F.nofg)autoFingers(dots);return fretboard(Object.assign({dots,label:'Diagrama del ejercicio'},F.o))})():
    `<div class="chnow"><b data-fx="chname" data-id="${x.id}">${F.list[0][0]}</b><span data-fx="chnext" data-id="${x.id}">${F.list.length>1?'Sigue: '+F.list[1][0]:''}</span></div><div data-fx="chboard" data-id="${x.id}">${chordBoard(F,0)}</div><div class="chlist">${F.list.map((c,i)=>`<span class="pchip sm" data-fx="chip" data-i="${i}" data-id="${x.id}"><b>${c[0]}</b></span>`).join('')}</div>`;
  // transporte: escuchar, botón redondo «seguir al pulso» y tempo; abajo el estado

function figLight(id,s,f){
  const el=document.querySelector(`[data-fig="${id}"]`);if(!el)return;
  el.classList.add('playing');
  $$('.dg.on',el).forEach(d=>d.classList.remove('on'));
  if(s!=null)$$(`.dg[data-s="${s}"][data-f="${f}"]`,el).forEach(d=>d.classList.add('on'));
}
function figChord(id,F,i){
  const q=k=>document.querySelector(`[data-fx="${k}"][data-id="${id}"]`);
  const b=q('chboard');if(!b)return;
  b.innerHTML=chordBoard(F,i);q('chname').textContent=F.list[i][0];
  q('chnext').textContent=F.list.length>1?'Sigue: '+F.list[(i+1)%F.list.length][0]:'';
  $$(`[data-fx="chip"][data-id="${id}"]`).forEach(c=>c.classList.toggle('cur',+c.dataset.i===i));
}
function figStatus(id,t){const e=document.querySelector(`[data-fx="st"][data-id="${id}"]`);if(e)e.textContent=t}
function figStop(){if(SEQ.id==='fig')seqStop()}
function figStart(x,preview){
  if(INST.id==='bajo'&&x.fig.type==='seq')return bassFigStart(x,preview);
  const F=x.fig,st=figState(x),own='fig:'+x.id+(preview?':p':'');
  OWNER=own;
  if(F.type==='seq'){
    const {seq}=seqData(F);
    const order=preview||!st.updown||seq.length<3?seq:seq.concat(seq.slice(1,-1).reverse());
    const per=preview?1:st.per,count=preview?0:4*per;
    seqStart('fig',(preview?'Escuchando · ':'Siguiendo · ')+x.t,()=>preview?.75:60/figBpm(x)/per,(s,t)=>{
      if(s<count){if(s%per===0)tick(t,s===0?'acc':'beat');return}
      const k=s-count;if(preview&&k>=order.length)return;
      const i=k%order.length;
      if(!preview&&k%per===0)tick(t,(k/per)%4===0?'acc':'beat');
      if(preview||(st.guide&&!st.mic))pluck(midiOf(order[i][0],order[i][1]),t,preview?.6:60/figBpm(x)/per*1.5,.22);
    },s=>{
      if(s<count){figLight(x.id,null);figStatus(x.id,'Cuenta: '+(Math.floor(s/per)+1));return}
      const k=s-count;
      if(preview&&k>=order.length){if(OWNER===own)seqStop();return}
      const i=k%order.length;
      if(!preview&&st.mic)fmStep(x,i,order);
      figLight(x.id,order[i][0],order[i][1]);

/* ---------- calificar con micrófono: escucha la nota en cada paso ---------- */
const FM={id:null,target:null,prev:null,hits:0,total:0,round:0,last:-1,run:0,ownMic:false,results:[]};
async function fmStart(x){
  if(!TUN.stream){
    toast('Activando el micrófono… toca cerca del teléfono.');
    let err=null;await tunerStart(fmPitch,e=>{err=e});
    if(err||!TUN.stream){toast({denied:'El micrófono está bloqueado. Permite el acceso en los ajustes del navegador.',nomic:'No se encontró un micrófono.',nosupport:'Este navegador no permite usar el micrófono aquí.'}[err]||'No se pudo activar el micrófono.',5000);return}
    FM.ownMic=true;
  }
  Object.assign(FM,{id:x.id,target:null,prev:null,hits:0,total:0,round:0,last:-1,run:0,results:[]});
  const el=document.querySelector(`[data-fig="${x.id}"]`);if(el)$$('.dg',el).forEach(d=>d.classList.remove('hit','miss'));
  figStart(x,false);paintFig();
}
function fmDot(t,cls){const el=document.querySelector(`[data-fig="${FM.id}"]`);if(!el||!t)return;$$(`.dg[data-s="${t.s}"][data-f="${t.f}"]`,el).forEach(d=>{d.classList.remove('hit','miss');d.classList.add(cls)})}
function fmClose(t){if(!t||t.done)return;t.done=true;FM.total++;if(t.hit){FM.hits++;fmDot(t,'hit')}else fmDot(t,'miss')}
function fmStep(x,i,order){
  if(i===0&&FM.total>0&&FM.last!==-1){fmClose(FM.prev&&FM.prev.t);fmClose(FM.target);FM.prev=null;FM.target=null;fmRound(x)}
  if(FM.target){const p=FM.target;FM.prev={t:p,until:performance.now()+280};setTimeout(()=>{if(FM.prev&&FM.prev.t===p){fmClose(p);FM.prev=null}},300)}
  const [s,f]=order[i];FM.target={s,f,m:midiOf(s,f),hit:false,done:false};FM.last=i;
}
function fmRound(x){
  FM.round++;const pct=Math.round(FM.hits/FM.total*100);FM.results.push(pct);
  DB.figbest=DB.figbest||{};if(!DB.figbest[x.id]||pct>DB.figbest[x.id]){DB.figbest[x.id]=pct;save()}
  toast(`Ronda ${FM.round}: ${FM.hits} de ${FM.total} notas (${pct} %)${pct>=90?' · ¡excelente!':pct>=70?' · vas bien':' · baja el tempo y repite'}`,3500);
  FM.hits=0;FM.total=0;
  setTimeout(()=>{const el=document.querySelector(`[data-fig="${x.id}"]`);if(el)$$('.dg',el).forEach(d=>d.classList.remove('hit','miss'))},700);
}
function fmFinish(){if(FM.target&&!FM.target.done&&FM.target.hit)fmClose(FM.target);FM.target=null;FM.prev=null}
function fmSummary(){const best=(DB.figbest||{})[FM.id];const last=FM.results.length?FM.results[FM.results.length-1]:Math.round(FM.hits/Math.max(1,FM.total)*100);return`Última ronda: ${last} %`+(best!=null?` · mejor: ${best} %`:'')}
function fmPitch(fr){
  if(!fr||!FM.id||!(SEQ.id==='fig'&&OWNER==='fig:'+FM.id)){FM.run=0;return}
  const n=Math.round(69+12*Math.log2(fr/440)),pc=((n%12)+12)%12;
  FM.run=(FM.lastPc===pc)?FM.run+1:1;FM.lastPc=pc;if(FM.run<2)return;
  const ok=t=>t&&!t.hit&&!t.done&&(INST.id==='bajo'?t.m===n:(t.m%12)===pc);
  if(ok(FM.target)){FM.target.hit=true;fmDot(FM.target,'hit')}
  else if(FM.prev&&performance.now()<FM.prev.until&&ok(FM.prev.t)){FM.prev.t.hit=true;fmDot(FM.prev.t,'hit')}
}

function sayText(html){

  const rw=tok=>{const m=tok.match(/^(VII|VI|IV|V|III|II|I|vii|vi|iv|iii|ii)(.*)$/);return ROM[m[1].toUpperCase()]+(m[2]==='°'||m[2]==='ø'?' disminuido':m[2]==='7'?' siete':m[2]==='maj7'?' mayor siete':'')};

  t=t.replace(/\((?:[x\d]{6}|[x\d]{2,}(?:[–-][x\d]+){2,}|x{0,2}\d+(?:[–-]\d+){3,})\)/g,'');
  t=t.replace(/\b(Do|Re|Mi|Fa|Sol|La|Si)([♯♭]?)m7♭5\b/g,'$1$2 menor siete bemol cinco').replace(/\b(Do|Re|Mi|Fa|Sol|La|Si)([♯♭]?)m7\b/g,'$1$2 menor siete').replace(/\b(Do|Re|Mi|Fa|Sol|La|Si)([♯♭]?)m\b/g,'$1$2 menor');
  t=t.replace(/maj7/g,' mayor siete').replace(/m7♭5/g,' menor siete bemol cinco');
  t=t.replace(/♭(\d+)ª?/g,(m,n)=>(ORD[n]||n)+' bemol').replace(/♯(\d+)ª?/g,(m,n)=>(ORD[n]||n)+' aumentada');

const sentences=html=>{const t=String(html).replace(/<[^>]+>/g,'');return t.split(/(?<=[.!?])\s+(?=[A-ZÁÉÍÓÚÑ¿«0-9])/).map(s=>s.trim()).filter(Boolean)};
const NOTEPC={do:0,re:2,mi:4,fa:5,sol:7,la:9,si:11};
function mentions(text){
  const ev=[];let m;
  const r1=/cuerda (\d)[^.;]{0,40}?traste (\d+)/gi;while((m=r1.exec(text)))ev.push({i:m.index+m[0].length-m[2].length,s:+m[1],f:+m[2]});
  const r2=/cuerda (\d):? trastes? ((?:\d+(?:, | y )?)+)/gi;while((m=r2.exec(text))){const base=m.index+m[0].indexOf(m[2]);let n,r=/\d+/g;while((n=r.exec(m[2])))ev.push({i:base+n.index,s:+m[1],f:+n[0]})}
  const r3=/\b(Do|Re|Mi|Fa|Sol|La|Si)( sostenido| bemol)? \((\d+)\)/g;while((m=r3.exec(text))){let pc=NOTEPC[m[1].toLowerCase()];if(m[2]===' sostenido')pc=(pc+1)%12;if(m[2]===' bemol')pc=(pc+11)%12;ev.push({i:m.index,f:+m[3],pc})}

function speak(text,onB){

/* ---------- pulso visual: barra de tiempos, acento en el 1, destello y modo silencioso ---------- */
const PULSE={n:4,beat:0,count:0,hideT:null,el:null};
const acc1=()=>DB.acc1!==false;
/* Todos los clicks de la app pasan por aquí. v: 'bar' (tiempo 1), 'beat' o null (subdivisión). */
function tick(t,kind,v){
  if(v===undefined)v=kind==='acc'?'bar':kind==='beat'?'beat':null;
  if(!DB.metMute){
    const k=kind==='acc'&&!acc1()?'beat':kind;
    tickSound(t,k);
  }
  if(!v||!AC)return;
  const lat=((AC.outputLatency||0)+(AC.baseLatency||0))*1000;
  setTimeout(()=>pulseBeat(v==='bar'),Math.max(0,(t-AC.currentTime)*1000+lat));
}
function pulseBeat(isBar){
  if(isBar){if(PULSE.count>0&&PULSE.count<=12)PULSE.n=PULSE.count;PULSE.count=1;PULSE.beat=0}
  else{PULSE.count++;PULSE.beat=Math.min(PULSE.beat+1,11);if(PULSE.beat>=PULSE.n)PULSE.n=PULSE.beat+1}
  paintPulse();
  if(DB.flash)flash(isBar&&acc1());
  clearTimeout(PULSE.hideT);PULSE.hideT=setTimeout(hidePulse,1700);
}
function pulseHTML(){
  return`<span class="pnum">${PULSE.beat+1}</span><span class="pdots">${Array.from({length:PULSE.n},(_,i)=>`<i class="${i===PULSE.beat?'on':''}${i===0&&acc1()?' one':''}"></i>`).join('')}</span>
  <span class="ptog"><button data-pulse="acc1" aria-pressed="${acc1()}" title="Resaltar el tiempo 1">1</button><button data-pulse="flash" aria-pressed="${!!DB.flash}" title="Destello en cada pulso">${IC.pulseflash}</button><button data-pulse="mute" aria-pressed="${!!DB.metMute}" title="Solo visual, sin click">${DB.metMute?IC.mute:IC.sound}</button></span>`;
}

/* ---------- karaoke sobre la grabación original: la app escucha la canción y se sincroniza sola ----------
   1) decodifica a ~11 kHz mono; 2) flujo espectral → tempo (autocorrelación, prefiere el bpm esperado) y pulsos
   (programación dinámica, Ellis 2007); 3) croma por pulso; 4) alinea con DTW la sucesión de acordes de la canción,
   pulso a pulso, contra los pulsos reales (probando los tonos más probables: capo o afinación medio tono abajo).
   5) voz: en las mezclas de estudio la voz va al centro y las guitarras a los lados; cuando (L+R) sube contra (L−R)
   en la banda de la voz, alguien canta. Así la letra espera en las partes solo musicales y las sílabas se reparten
   en lo que de verdad se canta. En grabaciones mono no hay pista y se usa solo lo demás.
   Resultado: el tiempo real donde empieza cada renglón, la rejilla de pulsos y la voz por pulso. */
const SR_AN=11025,SYNC_OFS=.018;

  for(let len=2;len<=n;len<<=1){const a=-2*Math.PI/len,wr=Math.cos(a),wi=Math.sin(a),h=len>>1;
    for(let i=0;i<n;i+=len){let cr=1,ci=0;for(let k=0;k<h;k++){const p=i+k,q=p+h,tr=re[q]*cr-im[q]*ci,ti=re[q]*ci+im[q]*cr;re[q]=re[p]-tr;im[q]=im[p]-ti;re[p]+=tr;im[p]+=ti;const nr=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=nr}}}
}
const hannW=n=>{const w=new Float32Array(n);for(let i=0;i<n;i++)w[i]=.5-.5*Math.cos(2*Math.PI*i/n);return w};
const syncIdle=()=>new Promise(r=>setTimeout(r,0));
function decodeAB(ctx,ab){return new Promise((res,rej)=>{const p=ctx.decodeAudioData(ab,res,rej);if(p&&p.then)p.then(res,rej)})}
async function syncDecode(blob){
  const ab=await blob.arrayBuffer(),OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;let buf=null;
  // el contexto de 11 kHz ya entrega el audio remuestreado (si el navegador no lo permite, se usa el normal)
  try{buf=await decodeAB(new OAC(1,1,SR_AN),ab.slice(0))}catch(e){}
  if(!buf){ac();buf=await decodeAB(AC,ab)}

async function syncAnalyze(x,sr,bpm0,prog,xs){

    let s=0;for(let k=2;k<N1/2;k++){const m=Math.log(1+100*Math.sqrt(re[k]*re[k]+im[k]*im[k])),df=m-prev[k];if(df>0){s+=df;if(k<=kLo)lf[f]+=df}prev[k]=m}od[f]=s;

    for(let k=1;k<N2/2;k++){const p=pcOf[k];const m=Math.sqrt(re[k]*re[k]+im[k]*im[k]);en[f]+=m;if(p>=0)(lowB[k]?bassC:chroma)[f*12+p]+=m;if(k>=k1&&k<=k2)vm[f]+=m}

// croma promedio de cada tramo de la rejilla (normalizado), con su energía
// solo las ventanas que caen casi enteras dentro del tramo, para no «oír» el acorde antes de que suene
function gridChroma(A,grid){

// voz por pulso (0 a 1), relativa a la misma canción; null si no se distingue (mono o mezcla muy angosta)

/* DTW con inicio y final libres en la grabación (intro y final sin letra no cuestan).

function syncDTW(X,C,BS,E,k,pen,LY,V){

// posición (en pulsos, con fracción) de un tiempo dentro de la rejilla, y su inversa
function gridIdx(g,t){const n=g.length;if(n<2)return 0;if(t<=g[0])return(t-g[0])/(g[1]-g[0]);if(t>=g[n-1])return n-1+(t-g[n-1])/(g[n-1]-g[n-2]);

const RMOT=matchMedia('(prefers-reduced-motion: reduce)');
function beatPulse(root,strong){
  if(RMOT.matches||document.hidden)return;const a=root.querySelector('.kamb'),p=root.querySelector('.kplayb');
  if(a&&a.animate)a.animate([{opacity:strong?.9:.72,transform:`scale(${strong?1.07:1.04})`},{opacity:.45,transform:'scale(1)'}],{duration:strong?560:400,easing:'cubic-bezier(.2,.7,.3,1)'});
  if(p&&p.animate)p.animate([{transform:`scale(${strong?1.09:1.05})`},{transform:'scale(1)'}],{duration:strong?300:240,easing:'ease-out'});
}

function toolMount(r,vals){
  const openP=k=>{const box=$('.kpanels',r);if(!box)return;const cur=box.hidden?null:box.dataset.open;$$('.ktool',r).forEach(b=>b.setAttribute('aria-pressed','false'));
    if(!k||cur===k){box.hidden=true;box.dataset.open='';return}box.hidden=false;box.dataset.open=k;$$('.kpanel',r).forEach(p=>p.hidden=p.dataset.p!==k);$(`.ktool[data-panel="${k}"]`,r).setAttribute('aria-pressed','true')};
  const paint=()=>{const v=vals();for(const k in v){const e=k==='meta'?$('#tmeta',r):$('#tv-'+k,r);if(e)e.textContent=v[k]}};
  r.addEventListener('click',e=>{const pb=e.target.closest('[data-panel]');if(pb){openP(pb.dataset.panel);return}if(e.target.closest('[data-pclose]')){openP(null);return}setTimeout(paint,0)});
  paint();return paint;
}

    const setBpm=v=>{MET.bpm=Math.max(30,Math.min(240,Math.round(v)));DB.met=MET.bpm;save();if(SEQ.id==='met')SEQ.label='Metrónomo '+MET.bpm;paint();emitState()};

    rg.oninput=()=>setBpm(+rg.value);

    $('#tap',r).onclick=()=>{const n=performance.now();if(TAPS.length&&n-TAPS[TAPS.length-1]>2000)TAPS.length=0;TAPS.push(n);if(TAPS.length>5)TAPS.shift();const tb=$('#tap',r);if(ac())tick(AC.currentTime+.01,'beat');if(TAPS.length>=2){const d=(TAPS[TAPS.length-1]-TAPS[0])/(TAPS.length-1);setBpm(60000/d);tb.textContent='Marcar tempo · '+TAPS.length+' toques'}else tb.textContent='Sigue tocando al pulso…';clearTimeout(tb._t);tb._t=setTimeout(()=>{tb.textContent='Marcar tempo'},2200)};

/* ---------- afinador ---------- */
const TUN={stream:null,an:null,src:null,iv:null,buf:null,hist:[]};
function detectPitch(buf,sr){
  if(INST.id==='bajo')return bassPitch(buf,sr);
  let n=buf.length,rms=0;for(let i=0;i<n;i++)rms+=buf[i]*buf[i];rms=Math.sqrt(rms/n);
  if(rms<.01)return -1;
  let r1=0,r2=n-1;const th=.2;
  for(let i=0;i<n/2;i++)if(Math.abs(buf[i])<th){r1=i;break}
  for(let i=1;i<n/2;i++)if(Math.abs(buf[n-i])<th){r2=n-i;break}
  const b=buf.subarray(r1,r2);n=b.length;
  const maxLag=Math.min(n-1,Math.floor(sr/60)),c=new Float32Array(maxLag+2);
  for(let l=0;l<=maxLag+1;l++){let s=0;for(let j=0;j<n-l;j++)s+=b[j]*b[j+l];c[l]=s}
  let d=0;while(d<maxLag&&c[d]>c[d+1])d++;
  let mv=-1,mp=-1;for(let i=d;i<=maxLag;i++)if(c[i]>mv){mv=c[i];mp=i}
  if(mp<1)return -1;
  let T=mp;const x1=c[T-1],x2=c[T],x3=c[T+1],a=(x1+x3-2*x2)/2,bb=(x3-x1)/2;if(a)T=T-bb/(2*a);
  const f=sr/T;return f>60&&f<1200?f:-1;
}
async function tunerStart(onData,onErr){
  if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){onErr('nosupport');return}
  try{
    const s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const c=ac();TUN.stream=s;TUN.src=c.createMediaStreamSource(s);TUN.an=c.createAnalyser();TUN.an.fftSize=INST.fft;
    TUN.src.connect(TUN.an);TUN.buf=new Float32Array(TUN.an.fftSize);TUN.hist=[];

  else if(p[0]==='practicar')v=({metronomo:viewMetronome,afinador:viewTuner,juego:viewGame,pistas:viewTracks,rutina:viewRoutine,reto:viewReto,grabar:viewRecorder,lento:viewSlow}[p[1]]||viewPractice)();
  else if(p[0]==='logros')v=viewAch();
  else if(p[0]==='cancionero')v=p[1]==='ver'?viewSongPlay(p[2]||'',p[3]==='lento'):p[1]==='editar'?viewSongEdit(p[2]||'nueva'):viewSongbook();
  else if(p[0]==='referencia')v=({canciones:viewSongs,notas:viewNotes,acordes:viewChords,explorar:viewExplore,glosario:viewGlossary}[p[1]]||viewReference)();
  else v=viewHome();
  if(UNMOUNT){try{UNMOUNT()}catch(e){}UNMOUNT=null}
  if(SEQ.id==='fig')seqStop();
  const sec=p[0]===''?'':(p[0]==='lecciones'||p[0]==='punteo')?'leccion':p[0]==='acordes'?'referencia':p[0]==='logros'?'practicar':p[0];
  $$('[data-nav]').forEach(a=>{const on=a.dataset.nav===sec;if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  if(INST.id==='bajo')v=bassAdaptView(v);
  $('#ttl').textContent=v.title;
  const bk=$('#back');bk.hidden=!v.back;if(v.back)bk.href=v.back;
  // página nueva en cada vista: así no se acumulan los clics de vistas anteriores
  const old=$('#page'),pg=old.cloneNode(false);old.replaceWith(pg);pg.innerHTML=v.html;
  document.title=v.title===INST.nombre?v.title:v.title+' · '+INST.nombre;
  if(v.mount)UNMOUNT=v.mount(pg)||null;
  if(!(p[0]==='leccion'&&p[2]))window.scrollTo(0,0);
  paintPlayer();
}
/* ---------- clics globales ---------- */
document.addEventListener('click',e=>{
  const x=e.target.closest('[data-x]');if(x&&exAction(x))return;
  const dg=e.target.closest('.dg');
  if(dg&&dg.dataset.s&&!e.target.closest('#gamehost,#rtgame')){playNotes([OPEN_MIDI[+dg.dataset.s]+ +dg.dataset.f],'chord');return}
  const pl=e.target.closest('[data-play]');if(pl){const L=pl.dataset.play.split(',').map(Number),st=+pl.dataset.step||.5;playNotes(L,pl.dataset.mode,st);lightSequence(pl,L,pl.dataset.mode,st);return}
  const sq=e.target.closest('[data-seq]');if(sq){playSeq(sq.dataset.seq.split('|').map(c=>c.split('.').map(Number)),+sq.dataset.beat||1)}
});

document.body.insertAdjacentHTML('afterbegin',`<div class="shell">
 <nav class="side" aria-label="Secciones"><div class="brand"><span class="logo">${logo()}</span>Om<br>${INST.corto}</div>${NAV.map(([h,l,ic,k])=>`<a href="${h}" data-nav="${k}">${ic}${l}</a>`).join('')}</nav>
 <main><header class="topbar"><div class="in"><a class="icon-btn" id="back" href="#/" aria-label="Volver" hidden>${IC.back}</a><span class="ttl" id="ttl"></span></div></header><div class="page" id="page"></div></main>
</div>
<nav class="tabs" aria-label="Secciones">${NAV.map(([h,l,ic,k])=>`<a class="tab" href="${h}" data-nav="${k}">${ic}${l}</a>`).join('')}</nav>`);
checkAch(true);persist();
window.addEventListener('hashchange',route);
route();
/* Actualizaciones: busca versión nueva al abrir y al volver a la app; avisa cuando está lista. */
function showUpdate(){
  if(document.getElementById('upd'))return;
  const d=document.createElement('div');d.id='upd';d.className='player upd';
  d.innerHTML='<span class="dotlive"></span><span class="pl">Hay una versión nueva de la app</span><button class="btn sm pri" id="updgo">Actualizar</button>';
  document.body.appendChild(d);d.querySelector('#updgo').onclick=()=>location.reload();
}
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  let hadCtl=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadCtl){hadCtl=true;return}if(!SEQ.id&&!TMR.id)location.reload();else showUpdate()});
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
      const chk=()=>reg.update().catch(()=>{});
      document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk()});
      setInterval(chk,30*60*1000);chk();
    }).catch(()=>{});
  });
}

/* Marca Om. Copia local: esta app todavía no concatena mastil/comun/. */
function omLogo({color='#2f7bff',size=64}={}){
  omLogo.seq=(omLogo.seq||0)+1;const id='omg'+omLogo.seq,n=Number(size)||64;
  return`<svg class="om-logo" viewBox="0 0 108 64" width="${n}" height="${Math.round(n*.6)}" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f7bff"/><stop offset="1" stop-color="#ff4fa3"/></linearGradient></defs><g fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="28" cy="32" r="27" stroke="${color}" stroke-width="1.5" opacity=".12"/><circle cx="28" cy="32" r="21" stroke="${color}" stroke-width="2" opacity=".3"/><circle cx="28" cy="32" r="14" stroke="${color}" stroke-width="8"/><path d="M54 47V27c0-5 3.2-8 7.5-8s7.5 3 7.5 8v20V27c0-5 3.2-8 7.5-8s7.5 3 7.5 8v20" stroke="url(#${id})" stroke-width="8.5"/></g></svg>`;
}
function automatiaMark(){return'<span class="automatia-mark" style="white-space:nowrap">by AutomaT<span style="color:#2ec4b6">IA</span></span>'}
