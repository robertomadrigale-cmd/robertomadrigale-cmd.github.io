    const node=c.createConvolver(), gain=c.createGain(); node.buffer=room(c); gain.gain.value=wet;
    node.connect(gain); gain.connect(destination); return node;
  }
  return {ac,unlockAudio,outLat,room,reverb};
})();
const ac=RokaAudio.ac, unlockAudio=RokaAudio.unlockAudio, outLat=RokaAudio.outLat;

/* Manifiestos ampliables; no se copian muestras ni se cambia su licencia. */
const PACKS = {
  guitarra:{id:'guitarra',nombre:'Guitarra acústica',autor:'Nicholaus Brosowsky',licencia:'CC BY 3.0',url:'https://github.com/nbrosowsky/tonejs-instruments',credito:'tonejs-instruments. Recortes a 3 s, mono, MP3 64 kbps; afinación corregida al reproducir.',tipo:'instrumento',base:'../samples/',notas:Object.fromEntries([
    ['D2',38,2],['E2',40,-3],['Fs2',42,1],['Gs2',44,-5],['As2',46,2],['C3',48,-4],['D3',50,2],['E3',52,-3],['Fs3',54,3],['Gs3',56,-13],['As3',58,11],['C4',60,6],['D4',62,2],['E4',64,-3],['Fs4',66,17],['Gs4',68,3],['As4',70,11],['C5',72,6],['D5',74,-21]

  bajo:{id:'bajo',nombre:'Bajo eléctrico',autor:'Nicholaus Brosowsky',licencia:'CC BY 3.0',url:'https://github.com/nbrosowsky/tonejs-instruments',credito:'tonejs-instruments. Recortes a 2.4 s, mono, MP3 56 kbps; afinación corregida al reproducir.',tipo:'instrumento',base:'../samples/',notas:Object.fromEntries([

  ].map(([n,m,cents])=>[m,{archivo:'b-'+n+'.mp3',cents}]))},
  bateria:{id:'bateria',nombre:'Black Pearl · AVL Drumkits',autor:'Glen MacArthur',licencia:'CC BY-SA 3.0',url:'https://www.bandshed.net/avldrumkits/',credito:'19 golpes. Capas de fuerza seleccionadas, recortes de 0.2–2.2 s con desvanecido, normalización, mono, MP3 64 kbps. Las muestras modificadas conservan CC BY-SA 3.0.',tipo:'bateria',base:'../samples/',golpes:Object.fromEntries('kick1 kick2 snare1 snare2 rim hat1 hat2 hatp hato ride bell crash tom ftom clap tamb cow mara click'.split(' ').map(n=>[n,'d-'+n+'.mp3']))}

const SAMPLE_CACHE='roka-estudio-muestras-v1';
const loadedPacks=new Map(), pendingPacks=new Map();
async function loadPack(id) {
  if(loadedPacks.has(id)) return loadedPacks.get(id);
  if(pendingPacks.has(id)) return pendingPacks.get(id);
  const manifest=PACKS[id]; if(!manifest) throw Error('Pack desconocido: '+id);

    const ctx=ac(), samples={}; let cache;
    try { if(globalThis.caches) cache=await caches.open(SAMPLE_CACHE); } catch(_) {}
    const entries=Object.entries(manifest.notas||manifest.golpes);
    // Cuatro decodificaciones simultáneas como máximo en teléfonos.
    let cursor=0;
    await Promise.all(Array.from({length:4},async()=>{
      while(cursor<entries.length) {
        const [key,value]=entries[cursor++], meta=typeof value==='string'?{archivo:value,cents:0}:value;
        const url=new URL(manifest.base+meta.archivo,document.baseURI).href;
        let response=cache && await cache.match(url);
        if(!response) { response=await fetch(url); if(!response.ok) throw Error('No se pudo cargar '+meta.archivo); if(cache) await cache.put(url,response.clone()); }

  })();

}
function sampleVoice(sample,midiDelta,t,dur,vel,options={}) {

  const src=c.createBufferSource(), gain=c.createGain(), filter=c.createBiquadFilter();

  const length=Math.max(.01,Math.min(dur,(sample.buf.duration-sample.off)/src.playbackRate.value));
  const end=t+length, release=Math.min(.07,length*.25);
  gain.gain.setValueAtTime(0,t); gain.gain.linearRampToValueAtTime(Math.max(0,vel)*sample.norm,t+.001);

  src.connect(filter); filter.connect(gain);
  let output=gain;
  if(c.createStereoPanner) { const p=c.createStereoPanner(); p.pan.value=options.pan||0; gain.connect(p); output=p; }
  output.connect(destination);
  if(options.wet>0 && options.reverb) { const send=c.createGain(); send.gain.value=options.wet; output.connect(send); send.connect(options.reverb); }

function playSample(pack,nota,t,dur,vel,options={}) {
  const p=typeof pack==='string'?loadedPacks.get(pack):pack;
  if(!p) throw Error('Carga el pack antes de tocarlo.');
  const keys=Object.keys(p.samples).map(Number), nearest=keys.reduce((a,b)=>Math.abs(b-nota)<Math.abs(a-nota)?b:a);
  return sampleVoice(p.samples[nearest],nota-nearest,t,dur,vel,options);
}
function drumHit(nombre,t,vel=.7,options={}) {
  const p=loadedPacks.get(options.pack||'bateria'), s=p && p.samples[nombre];
  if(!s) throw Error('Golpe no disponible: '+nombre);
  return sampleVoice(s,0,t,s.buf.duration,vel,options);
}

/* Metales y teclados CC0 (VSCO 2 Community Edition, Versilian Studios; piano y órgano de Simon Dalzell / Ivy Audio).

  mk('trombon','Trombón tenor','tbn',[[41,1],[46,-1],[50,-1],[53,-1],[60,0],[61,0],[63,1]]);
  mk('tuba','Tuba','tuba',[[34,1],[39,5],[41,-3],[46,5],[50,-10],[53,-2],[58,13]]);
  mk('piano','Piano vertical','piano',[[33,-2],[37,-10],[41,6],[45,-6],[49,-1],[53,0],[57,2],[61,2],[65,1],[69,2],[73,5],[77,5],[81,8]],{autor:'Simon Dalzell (Ivy Audio) · Versilian Studios'});
  mk('organo','Órgano de tubos','organ',[[30,4],[33,2],[36,3],[39,0],[42,1],[45,-1],[48,-3],[51,-2],[54,0],[57,0],[60,-1],[63,-2],[66,0]],{autor:'Simon Dalzell (Ivy Audio) · Versilian Studios'});

/* Teoría mínima compartida: nombres de notas, tonalidades y acordes por grado (I, ii, V7, ♭VII…). */
const NOTE_ES=['Do','Do♯','Re','Mi♭','Mi','Fa','Fa♯','Sol','La♭','La','Si♭','Si'];
const NOTE_US=['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const pcMod=n=>((n%12)+12)%12;
const noteName=(pc,us)=>(us?NOTE_US:NOTE_ES)[pcMod(pc)];
// «La», «Fa#», «Sib», «C», «Bb», «am» → clase de altura (y menor si termina en m)
function parseKey(s){
  if(s==null)return null;s=String(s).trim();const minor=/m(enor)?$/i.test(s)&&!/^mi$/i.test(s);s=s.replace(/\s*m(enor)?$/i,'');
  const es={do:0,re:2,mi:4,fa:5,sol:7,la:9,si:11},us={c:0,d:2,e:4,f:5,g:7,a:9,b:11};
  const m=s.toLowerCase().match(/^(do|re|mi|fa|sol|la|si|[a-g])\s*([#♯b♭])?/);if(!m)return null;
  let pc=(es[m[1]]??us[m[1]]);if(m[2]==='#'||m[2]==='♯')pc++;if(m[2]==='b'||m[2]==='♭')pc--;return{pc:pcMod(pc),minor};
}
const SCALE_MAJ=[0,2,4,5,7,9,11],SCALE_MIN=[0,2,3,5,7,8,10];
const ROMAN={i:0,ii:1,iii:2,iv:3,v:4,vi:5,vii:6};
// grado → {pc, q:'maj'|'min'|'dim'|'7'|'m7'} en la tonalidad (keyPc, menor)
function chordOf(deg,keyPc,minor){
  const m=String(deg).match(/^([♭b#♯]?)(vii|vi|v|iv|iii|ii|i)(°|7|m7|maj7)?$/i);if(!m)return{pc:keyPc,q:'maj'};
  const idx=ROMAN[m[2].toLowerCase()],sc=minor?SCALE_MIN:SCALE_MAJ;let pc=keyPc+sc[idx];
  if(m[1]==='b'||m[1]==='♭')pc--;if(m[1]==='#'||m[1]==='♯')pc++;
  const upper=m[2]===m[2].toUpperCase();let q=m[3]==='°'?'dim':upper?'maj':'min';if(m[3]==='7')q=upper?'7':'m7';if(m[3]==='m7')q='m7';if(m[3]==='maj7')q='maj7';
  return{pc:pcMod(pc),q,deg};

const QUAL={maj:[0,4,7],min:[0,3,7],dim:[0,3,6],'7':[0,4,7,10],m7:[0,3,7,10],maj7:[0,4,7,11]};

// valida que cada línea mida un compás exacto (beats×4 celdas) y use solo símbolos conocidos
function beatCheck(b){
  const errs=[],L=b.beats*4,ok={drum:/^[Xx-]+$/,b:/^[R357OA.\-]+$/,g:/^[DdUuXx0-4.\-]+$/,x:/^[Xx.\-]+$/};
  for(const[pn,p]of Object.entries(b.parts))for(const[k,v]of Object.entries(p)){
    const re=k==='b'?ok.b:k==='g'?ok.g:k==='x'?ok.x:ok.drum;
    if(!re.test(v))errs.push(`${b.id}.${pn}.${k}: símbolo desconocido`);
    if(v.length!==L&&!(re===ok.drum&&v.length<L))errs.push(`${b.id}.${pn}.${k}: mide ${v.length}, debe medir ${L}`);
  }
  return errs;
}

/* Genera un beat en pistas separadas (batería, bajo, armonía, metales) con OfflineAudioContext y los packs grabados.
   renderBeat({id, parte:'A'|'B'|'F', compases, bpm, tono:{pc,minor}, prog:índice}) → {bateria,bajo,armonia,metales, dur, acordes}
   Los AudioBuffer resultantes se usan como clips en cualquier app (estudio, bajo, batería…). */
const DRUM_MAP={k:['kick2','kick1',.95,-.03,.04],s:['snare2','snare1',.72,.04,.22],r:['rim','rim',.6,.1,.12],l:['clap','clap',.55,-.05,.2],
  h:['hat2','hat1',.4,.3,.06],o:['hato','hato',.42,.3,.15],p:['hatp','hatp',.35,.3,.05],y:['ride','ride',.4,-.25,.14],c:['crash','crash',.5,-.2,.22],
  t:['tom','tom',.6,.15,.18],f:['ftom','ftom',.65,-.15,.18],m:['mara','mara',.38,.2,.08],a:['tamb','tamb',.38,-.2,.1],w:['cow','cow',.4,.12,.1]};
const BEAT_PACKS=b=>['bateria',b.inst.bajo||'bajo',b.inst.arm,b.inst.met?'trompeta':null,b.inst.met?'trombon':null].filter(Boolean);
async function beatPacks(b){await Promise.all(BEAT_PACKS(b).map(id=>loadPack(id)))}
function beatChords(b,tono,progIdx,compases){
  const prog=b.prog[progIdx%b.prog.length]||b.prog[0],key=tono||parseKey(b.key);
  return Array.from({length:compases},(_,i)=>chordOf(prog[i%prog.length],key.pc,key.minor));
}
// pequeñas variaciones para que no suene a máquina (siempre las mismas para el mismo beat: generador con semilla)
function rng(seed){let s=seed|0||1;return()=>((s=Math.imul(s^s>>>15,2246822507)^Math.imul(s^s>>>13,3266489909))>>>0)/4294967296}
async function renderBeat(o){
  const b=beatById(o.id);if(!b)throw Error('Beat desconocido: '+o.id);
  await beatPacks(b);
  const bpm=o.bpm||b.bpm[2],comp=o.compases||4,part=b.parts[o.parte||'A']||b.parts.A,L=b.beats*4,step=60/bpm/4;
  const chords=beatChords(b,o.tono,o.prog||0,comp),dur=comp*L*step+1.2,sr=44100;
  const swing=t=>t; // reservado: swing por estilo
  const make=async(fill)=>{const c=new OfflineAudioContext(2,Math.ceil(dur*sr),sr),bus=c.createGain();bus.connect(c.destination);
    const rev=RokaAudio.reverb(c,bus,.9);const any=fill(c,bus,rev);if(!any)return null;return c.startRendering()};
  const R=rng((o.seed||7)+comp*31+bpm);
  const tAt=(bar,i)=>bar*L*step+i*step+(i%4===2?b.swing*step:0);
  const lineFor=k=>Object.prototype.hasOwnProperty.call(part,k)?part[k]:null;
  // batería
  const bateria=await make((c,bus,rev)=>{let n=0;
    for(let bar=0;bar<comp;bar++)for(const k of Object.keys(DRUM_MAP)){const line=lineFor(k);if(!line)continue;const[strong,soft,lvl,pan,wet]=DRUM_MAP[k];
      for(let i=0;i<line.length;i++){const ch=line[i];if(ch!=='X'&&ch!=='x')continue;
        const hum=(bar===0&&i===0)||k==='k'&&i===0?0:(R()-.5)*.010,v=(ch==='X'?1:.62)*lvl*(.92+R()*.16);
        drumHit(ch==='X'?strong:soft,Math.max(0,tAt(bar,i)+hum),v,{context:c,destination:bus,pan,reverb:rev,wet});n++}}
    // crash de entrada en estilos con platillo
    if(o.entrada&&/rock|pop|banda|polka|norteno/.test(b.id)){drumHit('crash',0,.45,{context:c,destination:bus,pan:-.2,reverb:rev,wet:.2});n++}
    return n});
  // bajo (o tuba)
  const bp=b.inst.bajo||'bajo',bLo=bp==='tuba'?34:28;
  const bajo=await make((c,bus,rev)=>{const line=lineFor('b');if(!line)return 0;let n=0;
    for(let bar=0;bar<comp;bar++){const ch=chords[bar],nx=chords[(bar+1)%comp],root=pcIn(ch.pc,bLo),tones=chordTones(ch);
      for(let i=0;i<line.length;i++){const s=line[i];if(!'R357OA'.includes(s))continue;
        let j=i+1;while(j<line.length&&line[j]==='.')j++;
        const m=s==='R'?root:s==='3'?root+tones[1]:s==='5'?root+7:s==='O'?root+12:s==='7'?root+10:pcIn(nx.pc,bLo)-1;
        playSample(bp,m,tAt(bar,i)+(R()-.5)*.008,(j-i)*step*.95,(i%4===0?.9:.72)*(.94+R()*.12),{context:c,destination:bus,lowpass:b.id==='trap'||b.id==='reggaeton'?600:2400,reverb:rev,wet:.04});n++}}
    return n});
  // armonía (guitarra, piano u órgano)
  const ap=b.inst.arm;
  const armonia=!ap?null:await make((c,bus,rev)=>{const line=lineFor('g');if(!line)return 0;let n=0;
    for(let bar=0;bar<comp;bar++){const ch=chords[bar],tones=chordTones(ch),r=pcIn(ch.pc,ap==='guitarra'?47:48);
      const voic=[r,...tones.slice(1).map(x=>r+x),r+12],arp=[r-12+ (ap==='guitarra'?12:0),r+tones[1],r+tones[2],r+12,r+12+tones[1]];
      for(let i=0;i<line.length;i++){const s=line[i];if(s==='-'||s==='.')continue;let j=i+1;while(j<line.length&&line[j]==='.')j++;
        const t=tAt(bar,i)+(R()-.5)*.008,len=Math.max(step*.9,(j-i)*step*.98),acc=i%4===0?1:.8;
        if(/[0-4]/.test(s)){playSample(ap,arp[+s],t,Math.max(len,step*3),.5*acc*(.9+R()*.2),{context:c,destination:bus,reverb:rev,wet:.18,pan:.15});n++;continue}
        const strong=s==='D'||s==='U'||s==='X',up=s==='U'||s==='u',mute=s==='x'&&ap==='guitarra';
        const notes=up?[...voic].reverse().slice(0,3):voic,gap=ap==='guitarra'?(strong?.011:.016):.004;
        notes.forEach((m,q)=>{playSample(ap,m,t+q*gap,mute?.06:len,(strong?.5:.32)*acc*(.9+R()*.2),{context:c,destination:bus,reverb:rev,wet:ap==='organo'?.22:.15,pan:ap==='guitarra'?.15:0,lowpass:mute?1800:9000});n++})}}
    return n});
  // metales (trompeta arriba, trombón abajo)
  const metales=!b.inst.met?null:await make((c,bus,rev)=>{const line=lineFor('x');if(!line)return 0;let n=0;
    for(let bar=0;bar<comp;bar++){const ch=chords[bar],tones=chordTones(ch),tp=pcIn(ch.pc+tones[1],64),tp2=pcIn(ch.pc+tones[2],64),tb=pcIn(ch.pc,48);
      for(let i=0;i<line.length;i++){const s=line[i];if(s!=='X'&&s!=='x')continue;let j=i+1;while(j<line.length&&line[j]==='.')j++;
        const len=Math.min(.9,Math.max(step*1.6,(j-i)*step*.95)),v=(s==='X'?.55:.38)*(.92+R()*.14),t=tAt(bar,i)+(R()-.5)*.01;
        playSample('trompeta',tp,t,len,v,{context:c,destination:bus,reverb:rev,wet:.2,pan:-.2});playSample('trompeta',tp2,t+.006,len,v*.85,{context:c,destination:bus,reverb:rev,wet:.2,pan:.2});
        playSample('trombon',tb,t+.004,len,v*.9,{context:c,destination:bus,reverb:rev,wet:.18,pan:0});n+=3}}
    return n});
  return{bateria,bajo,armonia,metales,dur:comp*L*step,acordes:chords.map(c=>chordLabel(c)),beat:b};
}

function omLogo({color='#2f7bff',size=64}={}){

let DB={done:{},secs:{},days:{},bpm:{},gbpm:{},stars:{},best:{},hist:[],ses:[],songs:[],seen:{},spd:{},sess:null,played:0,
  theme:'estudio',met:80,meter:'4/4',sub:1,sens:2,lat:null,clickLvl:0,tapLat:0,input:'tap',click:true};
try{Object.assign(DB,JSON.parse(localStorage.getItem(DBK)||'{}'))}catch(e){}
function save(){try{localStorage.setItem(DBK,JSON.stringify(DB))}catch(e){}}
const today=(d)=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function markDay(){DB.days[today()]=true;save()}
function streak(){let n=0;const d=new Date();if(!DB.days[today(d)])d.setDate(d.getDate()-1);while(DB.days[today(d)]){n++;d.setDate(d.getDate()-1)}return n}
function bestStreak(){const ks=Object.keys(DB.days).filter(k=>DB.days[k]).sort();let b=0,c=0,prev=null;
  ks.forEach(k=>{const d=new Date(k+'T12:00:00');if(prev&&Math.round((d-prev)/864e5)===1)c++;else c=1;prev=d;b=Math.max(b,c)});return b}
function weekMins(){let s=0;const d=new Date();for(let i=0;i<7;i++){s+=DB.secs[today(d)]||0;d.setDate(d.getDate()-1)}return Math.round(s/60)}
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
const sd=a=>{if(a.length<2)return 0;const m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)*(x-m),0)/(a.length-1))};
const med=a=>{if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y);return s[Math.floor(s.length/2)]};
const tendTxt=m=>Math.abs(m)<5?'A tiempo':m<0?'Adelantado':'Atrasado';
function toast(html,ms){
  let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('role','status');document.body.appendChild(t)}
  t.innerHTML=html;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),ms||3200);
}
/* Progreso de «Pulso a la Vista» (la app vieja) en este mismo dispositivo: se suma sin borrar nada. */
function oldProgress(){try{const o=JSON.parse(localStorage.getItem(OLDK)||'null');return o&&typeof o==='object'?o:null}catch(e){return null}}
function importOld(){
  const o=oldProgress();if(!o)return false;
  for(const k of ['done','bpm','gbpm'])Object.assign(DB[k],o[k]||{});
  for(const k in o.secs||{})DB.secs[k]=Math.max(DB.secs[k]||0,o.secs[k]);
  for(const k in o.days||{})if(o.days[k])DB.days[k]=true;
  const seen=new Set(DB.ses.map(s=>s.ts));DB.ses=DB.ses.concat((o.ses||[]).filter(s=>!seen.has(s.ts))).sort((a,b)=>a.ts-b.ts).slice(-120);
  const names=new Set(DB.songs.map(s=>s.n));(o.songs||[]).forEach(s=>{if(!names.has(s.n))DB.songs.push(s)});
  if(DB.lat==null&&o.lat!=null){DB.lat=o.lat;DB.clickLvl=o.clickLvl||0}
  if(o.sens)DB.sens=o.sens;
  DB.imported=Date.now();save();return true;
}

/* ---------- motor de audio: kit grabado del núcleo (drumHit/sampleVoice), síntesis de respaldo, click, secuenciador y metrónomo ---------- */
let MASTER=null,ROOMB=null,NOISEB=null,KIT=null,KITP=null,UNLOCKED=false;
const AC=()=>ac();
function out(){
  const c=ac();
  if(!MASTER){const comp=c.createDynamicsCompressor();comp.threshold.value=-8;comp.ratio.value=3;comp.attack.value=.004;
    MASTER=c.createGain();MASTER.gain.value=.9;MASTER.connect(comp);comp.connect(c.destination);ROOMB=RokaAudio.reverb(c,MASTER,.5)}
  return MASTER;
}

function kitLoad(){if(!KITP)KITP=loadPack('bateria').then(p=>{KIT=p;emitState();return p}).catch(()=>{KIT=false;return null});return KITP}

  if(UNLOCKED)return;UNLOCKED=true;
  unlockAudio().catch(()=>{});try{if(navigator.audioSession)navigator.audioSession.type='play-and-record'}catch(e){}
  out();kitLoad();
}

function noiseBuf(){const c=ac();if(NOISEB)return NOISEB;const b=c.createBuffer(1,c.sampleRate*.6,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return NOISEB=b}
function noise(t,dur,type,freq,v,q){const c=ac(),s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=noiseBuf();f.type=type;f.frequency.value=freq;if(q)f.Q.value=q;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(out());s.start(t);s.stop(t+dur+.02)}
function osc(t,type,f0,f1,dur,v,fd){const c=ac(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+(fd||dur*.4));
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(out());o.start(t);o.stop(t+dur+.03)}
function metal(t,dur,v,hp){const c=ac(),g=c.createGain(),f=c.createBiquadFilter();f.type='highpass';f.frequency.value=hp;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  [205.3,304.4,369.6,522.7,540,800].forEach(fr=>{const o=c.createOscillator();o.type='square';o.frequency.value=fr*1.8;o.connect(f);o.start(t);o.stop(t+dur+.05)});f.connect(g);g.connect(out())}

/* Quién toca cada golpe: D/I = mano derecha/izquierda, PD/PI = pie derecho/izquierdo (baterista diestro). */
const LIMB={D:'Mano derecha',I:'Mano izquierda',PD:'Pie derecho',PI:'Pie izquierdo'};
function limbOf(g,row,i){
  if(row==='bd')return'PD';if(row==='hf')return'PI';
  const rows=Object.keys(g.rows),cyms=['hh','rd','cr','cb'];
  if(g.hands&&(row==='sn'||rows.length===1))return g.hands[i]==='I'?'I':'D';
  // un solo instrumento rápido (tresillos, semicorcheas): manos alternadas
  if(rows.length===1&&g.sub>=3)return i%2?'I':'D';
  if(cyms.includes(row))return'D';
  // fills: si en ese golpe no suena ningún platillo, las manos se alternan
  const cymNow=cyms.some(r=>g.rows[r]&&g.rows[r][i]&&g.rows[r][i]!=='-');
  if(['t1','t2','ft'].includes(row)||!cymNow&&g.cat==='Fills')return i%2?'I':'D';
  return'I';
}
const cellName=(g,i)=>{const p=i%g.sub,b=Math.floor(i/g.sub)%g.meter+1;return p===0?String(b):(p===1&&g.sub===2||p===2&&g.sub===4?'y':COUNT[g.sub][p])+(p?' del '+b:'')};
// texto de dónde cae cada instrumento («Tarola · mano izquierda: 2 y 4»)
function rowDesc(g,row){
  const line=g.rows[row],n=line.length,on=[...line].map((c,i)=>c!=='-'?i:-1).filter(i=>i>=0),bars=g.bars||1,per=n/bars;
  const first=on.filter(i=>i<per);
  let where;
  if(on.length===n)where={1:'todos los tiempos',2:'corcheas parejas',3:'tresillos parejos',4:'semicorcheas parejas'}[g.sub];
  else if(first.length>6)where='casi todas las '+({2:'corcheas',3:'notas del tresillo',4:'semicorcheas'}[g.sub]||'notas');
  else{const names=first.map(i=>cellName(g,i));where=names.length?names.length===1?'en el '+names[0]:'en '+names.slice(0,-1).join(', ')+' y '+names[names.length-1]:'';
    if(bars>1&&on.some(i=>i>=per))where+=(where?'; ':'')+'en el compás 2 cambia (míralo en la rejilla)'}
  const limbs=[...new Set(on.map(i=>limbOf(g,row,i)))].map(l=>LIMB[l].toLowerCase()).join(' y ');
  return{row,n:ROWS[row].n,limbs,where};
}

/* Portada de cada groove: el patrón mismo, dibujado como puntos (bombo abajo, tarola en medio, platillos arriba). */
const CATHUE={'Subdivisión':200,'Rudimentos':262,'Básicos':218,'Fills':320,'Ternarios':28,'Estilos':160};
function grooveArt(id,label){
  const g=G[id],n=Math.min(16,g.meter*g.sub),lanes=[['hh','rd','cr','cb','hf'],['sn','rim','t1','t2','ft'],['bd']];let m='';
  lanes.forEach((rs,li)=>{const y=22+li*26;for(let i=0;i<n;i++){const on=rs.some(r=>g.rows[r]&&g.rows[r][i]&&g.rows[r][i]!=='-'),x=6+i*(88/Math.max(1,n-1));
    m+=on?`<circle cx="${x.toFixed(1)}" cy="${y}" r="${li===2?5:li===1?4.2:3.2}" fill="#fff" stroke="none" opacity="${li===0?.75:1}"/>`:`<circle cx="${x.toFixed(1)}" cy="${y}" r="1.2" fill="#fff" stroke="none" opacity=".3"/>`}});
  return coverArt(CATHUE[g.cat]||218,m,label,'g'+id+(label||''));
}

const BARS={rud:4,groove:8,prec:8,band:8};

/* ---------- rejilla que se ilumina, batería vista desde arriba y reproductor de grooves ---------- */
// Rejilla: un bloque por compás; filas = instrumentos, columnas = golpes; abajo la cuenta y quién toca (D/I/pies)
function grooveGrid(g,o){
  o=o||{};const n=gSteps(g),bars=g.bars||1,per=n/bars,rows=ROW_ORDER.filter(r=>g.rows[r]);
  let h=`<div class="dgrid" style="--n:${per}">`;
  for(let b=0;b<bars;b++){
    h+=`<div class="dbar">${bars>1?`<span class="dbn">Compás ${b+1}</span>`:''}`;
    rows.forEach(r=>{const muted=o.muted&&o.muted.includes(r);
      h+=`<div class="drow${muted?' you':''}" data-row="${r}"><span class="dlab" title="${ROWS[r].n}">${ROWS[r].a}</span>`;
      for(let j=0;j<per;j++){const i=b*per+j,c=g.rows[r][i]||'-',beat=j%g.sub===0;
        h+=`<span class="dc${beat?' b':''}" data-i="${i}">${c==='-'?'':`<i class="dn ${c==='X'?'acc':c==='g'?'gh':c==='o'?'op':''}"></i>`}</span>`}
      h+='</div>'});
    h+=`<div class="drow dcount"><span class="dlab"></span>`;
    for(let j=0;j<per;j++){const p=j%g.sub,bt=Math.floor(j/g.sub)%g.meter+1;h+=`<span class="dk${p===0?' b':''}" data-i="${b*per+j}">${p===0?bt:COUNT[g.sub][p]}</span>`}
    h+='</div>';
    if(o.limbs!==false){h+=`<div class="drow dlimb"><span class="dlab" title="Manos">${IC.hand}</span>`;
      for(let j=0;j<per;j++){const i=b*per+j,ls=[...new Set(rows.filter(r=>g.rows[r][i]&&g.rows[r][i]!=='-'&&!['bd','hf'].includes(r)).map(r=>limbOf(g,r,i)))];
        h+=`<span class="dk" data-i="${i}">${ls.join('')}</span>`}
      h+='</div>'}
    h+='</div>';
  }
  return h+'</div>';
}
// ilumina la columna i (−1 apaga) y hace destellar las notas que suenan

  if(i<0)return;$$(`.dgrid [data-i="${i}"]`,root).forEach(x=>{x.classList.add('now');const d=x.firstElementChild;if(d&&d.animate&&!RMOT.matches)d.animate([{transform:'scale(1.45)'},{transform:'scale(1)'}],{duration:180,easing:'ease-out'})});

/* Batería vista desde arriba: cada pieza se ilumina al sonar, con la mano o el pie que la toca. */
const KITPOS={cr:[62,38,27],hh:[44,118,24],t1:[128,62,23],t2:[188,60,23],rd:[272,52,33],cb:[226,104,11],sn:[110,148,29],ft:[250,150,33],bd:[176,180,0],hf:[40,176,0]};

  let s=`<svg class="kit ${extra||''}" viewBox="0 0 320 215" role="img" aria-label="Batería vista desde arriba: se ilumina lo que suena y quién lo toca">`;
  s+=`<rect class="kbo" data-r="bd" x="132" y="166" width="88" height="34" rx="12"/><text class="kpl" x="176" y="188">Bombo</text>`;
  s+=`<rect class="kbo kped" data-r="hf" x="18" y="164" width="46" height="26" rx="8"/><text class="kpl" x="41" y="181">Pedal</text>`;
  ['cr','rd','hh','cb'].forEach(r=>{const[x,y,rr]=KITPOS[r];s+=`<circle class="kcy${used.has(r)?' use':''}" data-r="${r}" cx="${x}" cy="${y}" r="${rr}"/>`});
  ['t1','t2','sn','ft'].forEach(r=>{const[x,y,rr]=KITPOS[r];s+=`<circle class="kdr${used.has(r)||r==='sn'&&used.has('rim')?' use':''}" data-r="${r}" cx="${x}" cy="${y}" r="${rr}"/>`});
  [['cr','Platillo'],['hh','Hi-hat'],['t1','Tom 1'],['t2','Tom 2'],['rd','Ride'],['sn','Tarola'],['ft','Tom de piso']].forEach(([r,n])=>{const[x,y,rr]=KITPOS[r];s+=`<text class="kpl" x="${x}" y="${y+rr+12}">${n}</text>`});
  Object.keys(KITPOS).forEach(r=>{const[x,y]=KITPOS[r];s+=`<text class="klimb" data-l="${r}" x="${x}" y="${(r==='bd'||r==='hf'?y-21:y+5)}"></text>`});

const LIMBS_HTML=`<div class="limbs">${Object.entries(LIMB).map(([k,n])=>`<span data-limb="${k}">${n}</span>`).join('')}</div>`;
function kitFlash(root,row,limb){

      ['dur','Duración',chipRow('dur','',[{v:30,l:'30 s'},{v:60,l:'60 s'},{v:120,l:'2 min'}],TM.dur)],
      ['in','Cómo te escucho',chipRow('in','',[{v:'tap',l:'Toques en pantalla'},{v:'mic',l:'Micrófono'}],DB.input)+`<p class="cap">El micrófono mide cuándo golpeas, no qué pieza. Con toques, usa cualquier botón.</p>`]])}
    <div class="card center" id="tmain"></div><div class="card" id="tres" hidden></div>
    <details class="card coach-settings"><summary>Ajustes del micrófono</summary><p class="cap">La calibración mide el retraso del teléfono escuchando su propio click por la bocina. Hazla una vez en cada dispositivo, en silencio y sin audífonos.</p>
      <div class="row"><button class="btn sm" id="tcal">Calibrar</button><span class="cap" id="tcalst"></span></div>
      ${chipRow('sens','Sensibilidad',[{v:1,l:'Baja (batería fuerte)'},{v:2,l:'Media'},{v:3,l:'Alta (pad)'}],DB.sens||2)}</details>
    <p class="cap">Usa audífonos de cable para el click si puedes: así el micrófono escucha solo tus golpes.</p></div>`,
  mount(r){
    const main=$('#tmain',r),res=$('#tres',r);let run=null,stopT=null,unp=null;
    const pv=toolMount(r,()=>({mode:{click:'Click',gap:'Intermitente',free:'Sin click'}[TM.mode],grid:GRIDS[TM.grid],tempo:TM.bpm,dur:TM.dur+' s',in:DB.input==='mic'?'Micrófono':'Toques',meta:TM.bpm+' bpm · '+GRIDS[TM.grid].toLowerCase()}));
    const calst=()=>{$('#tcalst',r).textContent=DB.lat!=null?`Retraso medido: ${Math.round(DB.lat*1000)} ms`:'Sin calibrar (se usa un estimado)'};
    const useMic=()=>DB.input==='mic';
    const idle=(msg)=>{if(unp){unp();unp=null}
      main.innerHTML=useMic()&&!MIC.ready?`<p class="sub">El micrófono escucha tus golpes y los compara con el pulso.</p><button class="btn pri" id="tmic">${IC.mic}Activar micrófono</button>`:
        `${useMic()?`<div class="meter"><i id="mlv"></i></div><p class="cap">Golpea la tarola: la barra debe moverse.</p>`:`<p class="cap">Toca el botón grande (o la barra espaciadora) junto con el click.</p>`}<button class="kplayb" id="tgo" aria-label="Empezar prueba">${IC.play}<span>Empezar</span></button>`;
      if(msg)main.insertAdjacentHTML('beforeend',`<p class="msg${msg.err?' err':''}">${msg.t}</p>`)};
    const live=()=>{
      if(!run)return;const hs=run.hits,offs=hs.filter(h=>!h.hid).map(h=>h.off),rec=offs.slice(-16),m=mean(rec);const left=fmt(Math.max(0,run.end-ac().currentTime));
      const pad=useMic()?'':`<button class="pad pad-tar big" data-pad="tar"><b>Toca aquí</b><small>o Espacio</small></button>`;
      if(TM.mode==='free'){const b=run.pts.length?run.pts[run.pts.length-1].b:TM.bpm;main.innerHTML=`<span class="cl">Tu tempo ahora</span><div class="big">${Math.round(b)}</div><p class="cap">Objetivo ${TM.bpm} bpm · ${hs.length} golpes · ${left}</p>${driftSVG(run.pts,TM.bpm,TM.dur)}${pad}<button class="btn" id="tstop">${IC.stop}Detener</button>`;return}
      main.innerHTML=`<span class="cl">${run.count?'Cuenta de entrada…':run.hidNow?'Click en silencio · sigue tocando':'Tendencia'}</span><div class="big">${m!=null?(m>0?'+':'')+Math.round(m):'—'}<small> ms</small></div><p class="cap"><b>${m!=null?tendTxt(m):'Esperando golpes'}</b> · ${hs.length} golpes · ${left}</p>${stripSVG(hs)}${pad}<button class="btn" id="tstop">${IC.stop}Detener</button>`;
    };
    const finish=()=>{
      if(!run)return;clearTimeout(stopT);if(SEQ.id==='tim')seqStop();MIC.onHit=null;const R=run;run=null;
      const vis=R.hits.filter(h=>!h.hid).map(h=>h.off),hid=R.hits.filter(h=>h.hid).map(h=>h.off);
      const S={d:today(),ts:Date.now(),mode:TM.mode,bpm:TM.bpm,grid:TM.grid,n:R.hits.length};
      if(TM.mode==='free'){const bs=R.pts.map(p=>p.b);if(bs.length<6)S.n=0;S.start=med(bs.slice(0,6));S.endb=med(bs.slice(-6));S.drift=S.endb-S.start;S.avg=mean(bs)}
      else{S.mean=mean(vis)||0;S.sd=sd(vis);S.pct=vis.length?vis.filter(o=>Math.abs(o)<=30).length/vis.length*100:0;if(TM.mode==='gap'){S.meanH=mean(hid);S.sdH=sd(hid)}}
      if(S.n>=8){DB.ses=(DB.ses||[]).concat([S]).slice(-120);if(S.mode!=='free')DB.hist.push({d:today(),ts:S.ts,id:'medidor',k:'prec',s:S.pct/100,ms:Math.round(S.mean),sd:Math.round(S.sd),bpm:S.bpm});markDay();save()}
      res.hidden=false;res.innerHTML=S.n>=8?sesHTML(S,true):'<p class="msg err">Detecté muy pocos golpes para calcular un resultado. Acerca el teléfono, sube la sensibilidad en «Ajustes del micrófono» y vuelve a intentarlo.</p>';idle();
    };
    const start=()=>{
      res.hidden=true;const step=60/TM.bpm/TM.grid,beat=60/TM.bpm;
      run={hits:[],pts:[],T0:0,end:0,count:true,hidNow:false,win:[],prev:null,est:step};
      seqStart('tim','Medidor · '+TM.bpm+' bpm',()=>beat,(s,t)=>{
        if(s<4){tick(t,s===0?'acc':'beat');if(s===0){run.T0=t+4*beat;run.end=run.T0+TM.dur}return}
        if(TM.mode==='free')return;
        const bar=Math.floor((s-4)/4);if(TM.mode==='gap'&&bar%4>=2)return;
        tick(t,(s-4)%4===0?'acc':'beat');
      },s=>{if(!run)return;run.count=s<4;run.hidNow=TM.mode==='gap'&&s>=4&&Math.floor((s-4)/4)%4>=2;live()});
      const onHit=(tc)=>{
        if(!run)return;if(tc<run.T0-step/2||tc>run.end)return;
        if(TM.mode==='free'){
          if(run.prev!=null){const ioi=tc-run.prev,k=Math.max(1,Math.round(ioi/run.est));if(ioi>.06&&ioi<3&&k<=4){run.win.push(ioi/k);if(run.win.length>8)run.win.shift();run.est=med(run.win);const b=60/(run.est*TM.grid);if(b>20&&b<400)run.pts.push({t:tc-run.T0,b})}}
          run.prev=tc;run.hits.push({t:tc});
        }else{const n=Math.round((tc-run.T0)/step),off=(tc-(run.T0+n*step))*1000,bar=Math.floor(Math.floor(n/TM.grid)/4);run.hits.push({t:tc,off,hid:TM.mode==='gap'&&bar%4>=2})}
        live();
      };
      if(useMic())MIC.onHit=t=>onHit(t-micLat());else unp=padsMount(main,t=>onHit(t));
      stopT=setTimeout(finish,(4*beat+TM.dur+.3)*1000+300);live();
    };
    r.addEventListener('click',async e=>{
      const b=e.target.closest('button');if(!b||b.dataset.pad)return;
      if(b.id==='tmic'){const k=await micStart();if(k!=='ok')idle({err:1,t:MICERR[k]});else idle(DB.lat==null?{t:'Recomendado: abre «Ajustes del micrófono» y calibra una vez.'}:null)}
      else if(b.id==='tgo')start();
      else if(b.id==='tstop')finish();
      else if(b.id==='tcal'){if(!MIC.ready){const k=await micStart();if(k!=='ok'){$('#tcalst',r).textContent=MICERR[k];return}idle()}$('#tcalst',r).textContent='Escuchando el click… no hagas ruido.';calibrate(ok=>{calst();if(!ok)$('#tcalst',r).textContent='No escuché el click. Sube el volumen y quita los audífonos. Por ahora se usa un estimado.'})}
      else if(b.dataset.tq){TM.bpm=Math.max(40,Math.min(220,TM.bpm+ +b.dataset.tq));$('#tbv',r).textContent=TM.bpm+' bpm';pv()}
      else if(b.dataset.set){const k=b.dataset.set;if(k==='sens'){DB.sens=+b.dataset.v;save();micThreshold()}else if(k==='in'){DB.input=b.dataset.v;save();if(!run)idle()}else TM[k]=k==='mode'?b.dataset.v:+b.dataset.v;$$(`[data-set="${k}"]`,r).forEach(x=>x.setAttribute('aria-pressed',String(x===b)));pv()}
    });
    const lv=()=>{const m=$('#mlv',r);if(m)m.style.width=Math.min(100,MIC.lv*250)+'%'};document.addEventListener('miclv',lv);
    calst();idle();
    return()=>{document.removeEventListener('miclv',lv);if(run)finish();if(unp)unp();micStop()};
  }};
}
/* ---------- tocar con la banda: el groove en la rejilla, la banda sin batería y tú encima ---------- */
function studioURL(beatId,bpm,tono){const b=beatById(beatId),k=tono||parseKey(b.key);return`../estudio/#/nueva?tono=${encodeURIComponent(noteName(k.pc)+(k.minor?'m':''))}&bpm=${bpm}&genero=${beatId}&desde=bateria`}

      ['sty','Estilo de la banda','<div id="bsty"></div>'],['tempo','Tempo',tempoBox('bbpm',st.bpm+' bpm')],
      ['snd','Sonido',`<div class="chips"><button class="chip" data-o="click" aria-pressed="true">Click</button><button class="chip" data-o="guide" aria-pressed="false">Batería guía</button></div><p class="cap">La batería guía toca el groove por ti para escucharlo; apágala para tocarlo tú.</p>`]])}
    <div class="card"><div class="gridbox" id="bgrid"></div><p class="cap" id="bch"></p></div>

    ${toolDock(`<button class="kplayb" id="bgo"></button>`)}</div>`,
  mount(r){

      $('#bsty',r).innerHTML=chipRow('sty','',bandBeats(g()).map(b=>({v:b.id,l:b.n})),st.sty);$('#bstudio',r).href=studioURL(st.sty,st.bpm);pv()};
    const stop=()=>{grooveStop();gridNow(r,-1)};

      try{res=await bandRender(st.sty,st.bpm,parseKey(beat.key))}catch(e){res=null;toast('No se pudo preparar la banda.')}busy=false;
      if(!res)return paint();
      const per=gSteps(g()),bars=res.bars;
      grooveRun({id:'band',g:g(),bpm:st.bpm,click:()=>st.click,drums:()=>st.guide,band:res,label:'Banda · '+beat.n,
        onStep:(i,L)=>{lightStep(r,g(),i);const k=Math.floor((L*per+i)/g().sub/res.beat.beats)%bars;$('#bch',r).textContent='Acorde: '+res.acordes[k]+' · '+beat.n}});
      paint()};
    const restart=()=>{if(on()){stop();start()}else paint()};

/* ---------- setlist: el tempo de cada canción de tu banda ---------- */

    const form=()=>{const s=SLEDIT?songs().find(x=>x.id===SLEDIT):null,f={n:s?s.n:'',bpm:s?s.bpm:100,m:s?s.m:'4/4'};
      $('#slf',r).innerHTML=`<h3>${s?'Editar canción':'Agregar canción'}</h3><div class="slform">

      <div><span class="cl">Compás</span><div class="chips">${Object.keys(METERS).map(v=>`<button class="chip" data-fm="${v}" aria-pressed="${v===f.m}">${v}</button>`).join('')}</div></div>

        SLEDIT=null;save();list();form()}

      else if(b.id==='sldelyes'){DB.songs=songs().filter(x=>x.id!==SLEDIT);SLEDIT=null;save();list();form()}

    });

      const b=e.target.closest('[data-sl]');if(!b)return;const S=songs(),i=S.findIndex(x=>x.id===b.dataset.id),s=S[i];if(!s)return;const a=b.dataset.sl;

    <section class="card coach-settings"><h2>Micrófono</h2><p class="cap">${DB.lat!=null?'Retraso medido: '+Math.round(DB.lat*1000)+' ms.':'Sin calibrar.'} Calibra en el medidor (Ajustes del micrófono).</p><a class="btn" href="#/practicar/precision">${IC.target}Ir al medidor</a></section>
    ${oldProgress()?`<section class="card coach-settings"><h2>Pulso a la Vista</h2><p class="cap">${DB.imported>0?'Ya trajiste tu progreso de la app anterior.':'Hay progreso de la app anterior en este dispositivo.'}</p><button class="btn" data-imp>${IC.down}Traer mi progreso</button></section>`:''}
    <section class="card coach-settings"><h2>Créditos</h2><p class="cap">Batería grabada: «${esc(k.nombre)}» de ${esc(k.autor)}, licencia ${k.licencia} (<a href="${k.url}" target="_blank" rel="noopener">${k.url}</a>). ${esc(k.credito)} Bajo y guitarra de la banda: tonejs-instruments (CC BY 3.0); metales, piano y órgano: VSCO 2 CE (CC0).</p>
      <p class="cap">Grooves y lecciones vienen de Pulso a la Vista. Om Batería es parte de la familia Om (guitarra, voz, estudio).</p></section>`,
  mount(r){
    r.addEventListener('change',e=>{const k=e.target.dataset.pref;if(!k)return;DB[k]=k==='clickVol'?+e.target.value:e.target.value;save();if(k==='theme')applyTheme()});
    let un=null;
    r.addEventListener('click',e=>{
      if(e.target.closest('[data-imp]')){importOld();toast('Listo: tu progreso ya está aquí.');route();return}
      if(e.target.closest('#tcal')){const c=ac(),t0=c.currentTime+.6,ticks=Array.from({length:8},(_,i)=>t0+i*.6),offs=[],pad=$('#tpad',r);pad.hidden=false;
        const mm=DB.metMute;DB.metMute=false;ticks.forEach(t=>tick(t,'acc'));DB.metMute=mm;$('#tst',r).textContent='Toca junto con cada click…';
        un=padsMount(pad,t=>{const raw=t+(DB.tapLat||0),near=ticks.reduce((a,b)=>Math.abs(b-raw)<Math.abs(a-raw)?b:a);if(Math.abs(near-raw)<.3)offs.push(raw-near)});
        setTimeout(()=>{if(un){un();un=null}pad.hidden=true;if(offs.length>=5){DB.tapLat=Math.max(-.1,Math.min(.25,med(offs)));save();$('#tst',r).textContent='Listo. Ajuste: '+Math.round(DB.tapLat*1000)+' ms'}else $('#tst',r).textContent='Muy pocos toques; inténtalo de nuevo.'},(t0-c.currentTime+8*.6+.4)*1000)}});
    return()=>{if(un)un()};
  }};
}
function viewLocked(id){const l=lvlOf(id);return{title:'Nivel '+l,back:'#/grooves',html:`<div class="card coach-center"><span class="coach-lock">${LOCK}</span><h1>Nivel ${l} · ${LEVELS[l]}</h1><p>Te faltan ${Math.max(0,10-levelStars(l-1))} estrellas del nivel ${l-1} para practicar «${esc(G[id].n)}» con calificación.</p><p class="cap">Gana una estrella con 50 %, dos con 70 % y tres con 85 %.</p><div class="row how-actions"><a class="btn" href="#/groove/${id}">Escucharlo</a><a class="btn pri" href="#/grooves">Ver grooves</a></div></div>`}}
/* ---------- enrutador ---------- */
const NAV=[['#/','Hoy',IC.home,''],['#/grooves','Grooves',IC.grid,'grooves'],['#/lecciones','Lecciones',IC.book,'lecciones'],['#/practicar','Practicar',IC.drum,'practicar'],['#/progreso','Progreso',IC.cal,'progreso']];
let UNMOUNT=null;
function route(){
  const raw=location.hash.replace(/^#\/?/,''),[path,qs]=raw.split('?'),p=path.split('/'),q=new URLSearchParams(qs||'');
  if(UNMOUNT){try{UNMOUNT()}catch(e){}UNMOUNT=null}
  grooveStop();
  let v=null;
  if(!p[0])v=viewHome();
  else if(p[0]==='sesion')v=viewCoach();
  else if(p[0]==='grooves')v=viewGrooves();
  else if(p[0]==='groove')v=viewGroove(p[1]);
  else if(p[0]==='lecciones')v=viewLessons();
  else if(p[0]==='leccion')v=viewLesson(+p[1]);
  else if(p[0]==='glosario')v=viewGlossary();
  else if(p[0]==='progreso')v=viewProgress();
  else if(p[0]==='ajustes')v=viewSettings();
  else if(p[0]==='practicar'){
    if(p[1]==='ej'&&G[p[2]])v=levelOpen(lvlOf(p[2]))||q.get('k')==='band'?viewCoach(p[2],q.get('k')||(['rudS','rudD','para','acc'].includes(p[2])?'rud':'groove')):viewLocked(p[2]);
    else v=({metronomo:viewMetronome,precision:viewTiming,medidor:viewTiming,banda:()=>viewBand(q),setlist:viewSetlist}[p[1]]||viewPractice)();
  }
  if(!v)v=viewHome();
  document.documentElement.classList.toggle('fs',!!v.fs);
  const section=p[0]==='groove'?'grooves':p[0]==='leccion'||p[0]==='glosario'?'lecciones':p[0]==='sesion'?'':p[0];
  $$('[data-nav]').forEach(a=>{if(a.dataset.nav===section)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  $('#ttl').textContent=v.title;const back=$('#back');back.hidden=!v.back;if(v.back)back.href=v.back;
  const old=$('#page'),pg=old.cloneNode(false);old.replaceWith(pg);pg.innerHTML=v.html;document.title=v.title+' · Om Batería';
  if(v.mount)UNMOUNT=v.mount(pg)||null;window.scrollTo(0,0);
}
document.body.insertAdjacentHTML('afterbegin',`<div class="shell"><nav class="side" aria-label="Secciones"><div class="brand"><span class="logo">${logo()}</span>Om<br>Batería</div>${NAV.map(([h,l,ic,k])=>`<a href="${h}" data-nav="${k}">${ic}${l}</a>`).join('')}</nav><main><header class="topbar"><div class="in"><a class="icon-btn" id="back" href="#/" aria-label="Volver" hidden>${IC.back}</a><span class="ttl" id="ttl"></span><a class="icon-btn" href="#/ajustes" aria-label="Ajustes">${IC.cog}</a></div></header><div class="page" id="page"></div></main></div><nav class="tabs" aria-label="Secciones">${NAV.map(([h,l,ic,k])=>`<a class="tab" href="${h}" data-nav="${k}">${ic}${l}</a>`).join('')}</nav>`);
save();window.addEventListener('hashchange',route);route();
/* Actualizaciones: busca versión nueva al abrir y al volver a la app; avisa cuando está lista. */
function showUpdate(){
  if(document.getElementById('upd'))return;
  const d=document.createElement('div');d.id='upd';d.className='player upd';
  d.innerHTML='<span class="dotlive"></span><span class="pl">Hay una versión nueva de la app</span><button class="btn sm pri" id="updgo">Actualizar</button>';
  document.body.appendChild(d);d.querySelector('#updgo').onclick=()=>location.reload();
}
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  let hadCtl=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadCtl){hadCtl=true;return}if(!SEQ.id&&!MIC.stream)location.reload();else showUpdate()});
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
      const chk=()=>reg.update().catch(()=>{});
      document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk()});
      setInterval(chk,30*60*1000);chk();
    }).catch(()=>{});
  });
}


</script>
