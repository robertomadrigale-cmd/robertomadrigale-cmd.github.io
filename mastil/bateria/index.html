<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Om Batería</title>
<meta name="description" content="Tu coach de batería: sesión diaria, grooves, rudimentos, precisión con el micrófono o con toques, y tocar con la banda. Gratis y sin internet.">

<meta property="og:title" content="Om Batería · Toca a tiempo">

<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Om Batería">
<style>
/* Concept: estudio nocturno — mástil como regla visual, barras de vidrio, ámbar para lo que se toca y rojo para la raíz. */
@font-face{font-family:'Barlow Condensed';font-weight:800;font-display:swap;src:url(../fonts/barlow-condensed-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Source Sans 3';font-weight:400;font-display:swap;src:url(../fonts/source-sans-3-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Source Sans 3';font-weight:600;font-display:swap;src:url(../fonts/source-sans-3-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Source Sans 3';font-weight:700;font-display:swap;src:url(../fonts/source-sans-3-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;font-display:swap;src:url(../fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:600;font-display:swap;src:url(../fonts/ibm-plex-mono-latin-600-normal.woff2) format('woff2')}
:root{
  --font-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --font-body:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;
  --accent:#e8a23a;--accent-ink:#1b1305;
  --bg:#0c111c;--surface:#151d30;--surface2:#1d2843;--fg:#f2ede3;--muted:#98a4bd;--line:#2a3857;
  --glass:rgba(16,22,36,.72);--accent-text:#f0b24f;--root:#ea6f50;--good:#62c394;--bad:#ea6f50;--blue:#6db3e0;
  --nav-h:64px;color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4efe4;--surface:#fffaf1;--surface2:#ebe2cf;--fg:#1a2236;--muted:#586380;--line:#d6cab0;--glass:rgba(250,246,238,.78);--accent-text:#955700;--root:#bf4128;--good:#2b8559;--bad:#bf4128;--blue:#2f7cae;color-scheme:light}}
:root[data-theme="light"]{--bg:#f4efe4;--surface:#fffaf1;--surface2:#ebe2cf;--fg:#1a2236;--muted:#586380;--line:#d6cab0;--glass:rgba(250,246,238,.78);--accent-text:#955700;--root:#bf4128;--good:#2b8559;--bad:#bf4128;--blue:#2f7cae;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{background-image:var(--art,none);background-attachment:fixed;background-repeat:no-repeat;background-size:100% 100%}
.card,.ex,.widget{box-shadow:inset 0 1px 0 color-mix(in srgb,var(--fg) 5%,transparent),0 10px 28px -20px rgba(0,0,0,.6)}
.glow{background:linear-gradient(95deg,var(--fg) 20%,var(--accent-text) 60%,var(--root));-webkit-background-clip:text;background-clip:text;color:transparent}
/* selector de temas */
.thgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.thm{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px;border-radius:14px;border:2px solid var(--line);background:var(--ts);color:var(--tf);cursor:pointer;min-width:0}
.thm .thp{display:flex;gap:6px;align-items:flex-end;width:100%;height:52px;border-radius:9px;margin-bottom:6px;padding:8px;background:var(--tart),var(--tb);border:1px solid color-mix(in srgb,var(--tf) 12%,transparent)}
.thm .thp i{width:16px;height:16px;border-radius:50%;background:var(--ta)}
.thm .thp i:nth-child(2){background:var(--tr)}
.thm .thp i:nth-child(3){width:auto;flex:1;height:4px;border-radius:4px;align-self:center;background:var(--tm)}
.thm b{font:800 18px/1.05 var(--font-display);text-transform:uppercase;letter-spacing:.01em}
.thm small{font-size:12px;color:var(--tm);line-height:1.25}
.thm[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.thm.auto{--tb:var(--bg);--ts:var(--surface);--tf:var(--fg);--tm:var(--muted);--ta:var(--accent);--tr:var(--root);--tart:linear-gradient(90deg,#0c111c 50%,#f4efe4 50%)}
body{font:400 17px/1.6 var(--font-body);min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
h1,h2{font-family:var(--font-display);font-weight:800;text-transform:uppercase;line-height:.95;letter-spacing:.005em;text-wrap:balance}
h1{font-size:clamp(38px,9vw,60px)}
h2{font-size:clamp(28px,6.5vw,40px)}
h3{font:700 19px/1.25 var(--font-body)}
:focus-visible{outline:3px solid var(--accent-text);outline-offset:2px}
/* shell */
.shell{display:flex;min-height:100vh}
.side{display:none}
main{flex:1;min-width:0;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 72px)}
.topbar{position:sticky;top:0;z-index:20;background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.topbar .in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:56px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.topbar .ttl{flex:1;min-width:0;font:600 13px var(--font-mono);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid transparent;background:none;display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:hover{background:var(--surface)}
.icon-btn svg{width:22px;height:22px}
.page{max-width:880px;margin:0 auto;padding-block:24px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab{height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font:600 11px var(--font-body);letter-spacing:.02em}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent-text)}
@media (min-width:900px){
  .tabs{display:none}
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;width:236px;flex:none;padding:24px 14px;border-right:1px solid var(--line);background:var(--surface)}
  .side .brand{display:flex;align-items:center;gap:10px;font:600 13px var(--font-mono);letter-spacing:.14em;text-transform:uppercase;padding:6px 10px 22px}
  .side .brand svg{width:26px;height:26px}
  .side a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;text-decoration:none;color:var(--muted);font-weight:600}
  .side a svg{width:22px;height:22px}
  .side a:hover{background:var(--surface2);color:var(--fg)}
  .side a[aria-current="page"]{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent-text)}
  main{padding-bottom:96px}
}
/* mini reproductor */
.player{position:fixed;z-index:29;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 10px);width:min(560px,calc(100% - 24px));display:flex;align-items:center;gap:10px;background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:8px 8px 8px 14px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
@media (min-width:900px){.player{bottom:18px;left:calc(50% + 118px)}}
.player .pl{flex:1;min-width:0;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .dotlive{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
/* elementos */
.eyebrow{font:600 12px var(--font-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--accent-text)}
.sub{color:var(--muted);font-size:18px;max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}
.hl{background:linear-gradient(transparent 62%,color-mix(in srgb,var(--accent) 38%,transparent) 62%);color:var(--accent-text);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{border-color:var(--good);color:var(--good)}
.btn.ok.on{background:var(--good);color:#0b1a12;border-color:var(--good)}
.btn svg{width:18px;height:18px;flex:none}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font:800 34px/1 var(--font-display)}
.stat span{font:500 12px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.tool{display:flex;gap:14px;align-items:center;text-decoration:none;color:var(--fg)}
.tool .ic{width:48px;height:48px;border-radius:14px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent-text);display:grid;place-items:center;flex:none}
.tool .ic svg{width:26px;height:26px}
.tool b{display:block;font-size:17px}
.tool span{font-size:14px;color:var(--muted)}
a.card:hover{border-color:var(--accent)}
.list{display:flex;flex-direction:column;gap:10px}
.lrow{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--fg);padding:14px 16px}
.mn{font:800 22px var(--font-display);background:var(--accent);color:var(--accent-ink);border-radius:9px;min-width:40px;height:40px;display:grid;place-items:center;flex:none}
.mn.done{background:var(--good);color:#0b1a12}
.lrow .mt{flex:1;min-width:0}
.lrow .mt b{display:block;line-height:1.25}
.lrow .mt span{font-size:14px;color:var(--muted)}
.lrow .cnt{font:500 12px var(--font-mono);color:var(--muted);white-space:nowrap}
.parth{margin-top:10px}
/* lección */
.lhead{display:flex;flex-direction:column;gap:12px}
.lead{font:800 26px/1.05 var(--font-display);text-transform:uppercase;color:var(--accent-text);text-wrap:balance}
.prose{max-width:66ch}
.blockh{font:600 12px var(--font-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--accent-text);margin-bottom:10px}
.widget{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.controls{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.cl{display:block;font:500 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font:600 14px var(--font-body);padding:8px 12px;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;display:inline-flex;align-items:baseline;gap:6px}
.chip i{font:500 10px var(--font-mono);font-style:normal;opacity:.7}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cap{margin-top:10px;font-size:15px;color:var(--muted)}
.cap b{color:var(--fg)}
.pbtn{font:600 14px var(--font-body);padding:8px 14px;min-height:40px;border-radius:10px;border:1px solid var(--accent);background:transparent;color:var(--accent-text);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.pbtn::before{content:"";border-left:9px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent}
.pbtn:hover{background:color-mix(in srgb,var(--accent) 15%,transparent)}
.row-act{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.box{border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.box ul,.box ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.box li::marker{color:var(--accent-text)}
.trick{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
/* ejercicio */
.ex{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:16px;background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.ex.done{border-left-color:var(--good)}
.ex .eh{display:flex;align-items:flex-start;gap:12px}
.ex .tag{font:600 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent-text)}
.ex.done .tag{color:var(--good)}
.ex h3{margin-top:2px}
.ex .meta{font:500 12px var(--font-mono);color:var(--muted);white-space:nowrap;margin-left:auto;padding-top:2px}
.ex ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.ex ol li::marker{font:600 13px var(--font-mono);color:var(--accent-text)}
.goal{font-size:15px;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px dashed var(--line)}
.goal b{color:var(--good)}
.exbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.minimet{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:12px;padding:3px;background:var(--bg)}
.minimet .v{font:600 14px var(--font-mono);min-width:64px;text-align:center}
.minimet .icon-btn{width:36px;height:36px;border-radius:9px}
.tm{font:600 15px var(--font-mono);font-variant-numeric:tabular-nums}
/* mástil */
.fbwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.fb{display:block;width:100%;height:auto;margin:0 auto}
.fb .wood{fill:var(--surface2)}
.fb .fret{stroke:var(--line);stroke-width:1.6}
.fb .nut{stroke:var(--muted);stroke-width:5}
.fb .str{stroke:var(--muted);opacity:.9}
.fb .inlay{fill:var(--line)}
.fb .num{fill:var(--muted);font:500 11px var(--font-mono);text-anchor:middle}
.fb .slab{fill:var(--muted);font:500 11px var(--font-mono);text-anchor:middle;dominant-baseline:central}
.fb .mute{fill:var(--muted);font:700 15px var(--font-body);text-anchor:middle;dominant-baseline:central}
.fb .zone{fill:var(--accent);opacity:.14}
.fb .dot{fill:var(--accent)}
.fb .dot.root{fill:var(--root)}
.fb .dot.dim{fill:none;stroke:var(--muted);stroke-width:1.5}
.fb .dot.faint{fill:var(--accent);opacity:.28}
.fb .dot.blue{fill:var(--blue)}
.fb .dot.good{fill:var(--good)}
.fb .dot.bad{fill:var(--bad)}
.fb .dot.ct{fill:var(--accent)}
.fb .dtxt{fill:var(--accent-ink);font:700 11px var(--font-body);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.fb .dtxt.sm{font-size:9px}
.fb .dtxt.r{fill:var(--root-ink,#fff)}
.fb .dtxt.dm{fill:var(--muted);font-weight:600}
.fb .dg{cursor:pointer}
.fb .cell{fill:transparent;cursor:pointer}
.fb .cell:hover{fill:color-mix(in srgb,var(--accent) 22%,transparent)}
.hint{display:none;font:500 11px var(--font-mono);color:var(--muted);margin:0 0 4px}
@media (max-width:640px){.hint{display:block}}
.strip{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.nt{display:flex;flex-direction:column;align-items:center;min-width:44px;padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);line-height:1.15}
.nt b{font-size:16px}.nt small{font:500 10px var(--font-mono);color:var(--muted)}
.nt.r{border-color:var(--root)}
.ts{font:700 12px var(--font-mono);width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.ts.t{background:var(--accent);color:var(--accent-ink)}
.ts.s{background:var(--root);color:var(--root-ink,#fff)}
.hrow{display:grid;grid-template-columns:44px 1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.hrow .rn{font:800 20px var(--font-display);color:var(--accent-text)}
.hrow .sy{font-weight:700;font-size:18px}
.hrow .no{font-size:13px;color:var(--muted)}
.fn{font:600 10px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.fn.T{color:var(--good);border-color:var(--good)}.fn.S{color:var(--accent-text);border-color:var(--accent)}.fn.D{color:var(--root);border-color:var(--root)}
.pchip{display:flex;flex-direction:column;align-items:center;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);min-width:64px}
.pchip b{font-size:18px}.pchip small{font:500 11px var(--font-mono);color:var(--muted)}
.pchip.T{border-color:var(--good)}.pchip.S{border-color:var(--accent)}.pchip.D{border-color:var(--root)}
.pchip.cur{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.pchip.cur small{color:var(--accent-ink)}
.cc circle{fill:var(--bg);stroke:var(--line);stroke-width:1.5;cursor:pointer}
.cc text{fill:var(--fg);font:700 15px var(--font-body);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.cc.m circle{fill:var(--surface)}
.cc.m text{font-size:12px;font-weight:600;fill:var(--muted)}
.cc.nb circle{stroke:var(--accent);stroke-width:2.5}
.cc.sel circle{fill:var(--accent);stroke:var(--accent)}
.cc.sel text{fill:var(--accent-ink)}
.cc.m.sel circle{fill:var(--root);stroke:var(--root)}.cc.m.sel text{fill:var(--root-ink,#fff)}
.cctr{fill:var(--muted);font:500 11px var(--font-mono);text-anchor:middle}
.order{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:12px 0 0;padding:0}
.order li{border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14px;background:var(--bg)}
.order li.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.order b{font-family:var(--font-display);font-size:18px;margin-right:6px}
select{font:600 15px var(--font-body);padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);min-height:42px;max-width:100%}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:6px}
.steps label{display:flex;flex-direction:column;gap:4px;font:500 11px var(--font-mono);color:var(--muted)}
.gl{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.gl div{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}
.gl b{display:block;color:var(--accent-text)}
.gl span{font-size:15px;color:var(--muted)}
/* herramientas */

/* diagramas que siguen el pulso */

/* ---------- Roka Guitar for All: marca y pulido ---------- */

.logo{display:inline-grid;flex:none}.logo svg{width:100%;height:100%}

/* aviso flotante */

.song{display:flex;flex-direction:column;gap:12px}

.judge.p{color:var(--accent)}.judge.g{color:var(--good)}.judge.m{color:var(--bad)}

/* cancionero karaoke */
.tab{font-size:10.5px}
.lrow.top{gap:10px;flex-wrap:wrap}.lrow.top .mt{min-width:180px}
.card.note{border-color:color-mix(in srgb,var(--accent) 50%,var(--line));background:color-mix(in srgb,var(--accent) 8%,var(--surface));font-size:15px}
.khead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}

.kchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.kchip{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--fg)}
.kchip b{font-size:15px}
.mch{width:56px;height:58px}.mch line{stroke:var(--muted);stroke-width:1}.mch circle{fill:var(--accent)}.mch circle.o{fill:none;stroke:var(--muted);stroke-width:1.2}.mch text{fill:var(--muted);font:600 9px var(--font-mono);text-anchor:middle}.mch .fr{text-anchor:start}
.karaoke{--kz:1;display:flex;flex-direction:column;gap:4px;padding:16px 12px 45vh;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-size:calc(21px * var(--kz));overflow-wrap:anywhere}
.kl{padding:6px 8px;border-radius:12px;cursor:pointer;transition:background .2s,opacity .3s;line-height:1.2}

.wd{display:inline-block;white-space:nowrap;vertical-align:bottom;margin-bottom:4px}
.pc{display:inline-flex;flex-direction:column;vertical-align:bottom}
/* acorde a mitad de palabra: flota sobre la sílaba sin abrir hueco */

/* ===================== acabado sobrio (v3) =====================
   Tipografía del sistema, jerarquía por peso y tamaño (no por mayúsculas),
   superficies con bordes finos y sombras suaves, íconos de trazo delgado. */
:root{
  --font-display:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI Variable Display','Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI Variable Text','Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  --font-mono:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI Variable Text','Segoe UI',Roboto,sans-serif;
  --hair:color-mix(in srgb,var(--fg) 9%,transparent);
  --r:18px;
}
body{font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
h1,h2{font-family:var(--font-display);font-weight:700;text-transform:none;letter-spacing:-.025em;line-height:1.08}
h1{font-size:clamp(30px,6.4vw,44px)}

h3{font-weight:600;font-size:18px;letter-spacing:-.01em}
.glow{background:none;-webkit-background-clip:initial;background-clip:initial;color:inherit}
.eyebrow{font:600 13px var(--font-body);letter-spacing:0;text-transform:none;color:var(--accent-text)}
.cl,.blockh{font:600 11px var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.blockh{color:var(--accent-text)}
.sub{font-size:17px;line-height:1.5}
.lead{font:600 20px/1.3 var(--font-display);text-transform:none;letter-spacing:-.01em}
.foot{font:500 12px var(--font-body)}
.tm,.stat b,.big,.kkey,.gq,.tnote,.hud b{font-variant-numeric:tabular-nums}
/* barra superior y navegación */
.topbar .ttl{font:600 15px var(--font-body);letter-spacing:-.01em;text-transform:none}
.tabs .tab{font:500 10.5px var(--font-body);letter-spacing:0}
.tab svg{width:23px;height:23px}
.side{background:color-mix(in srgb,var(--surface) 70%,var(--bg))}
@media (min-width:900px){.side .brand{font:600 15px/1.2 var(--font-body);letter-spacing:-.01em;text-transform:none;padding:4px 10px 26px}.side a{font-weight:500;font-size:15px}.side .brand .logo{width:30px;height:30px}}
/* superficies */
.card,.ex,.widget,.box,.fig{border-color:var(--hair);border-radius:var(--r)}
.card,.ex,.widget{box-shadow:0 1px 2px rgba(0,0,0,.18),0 8px 24px -18px rgba(0,0,0,.5)}
.ex{border-left:1px solid var(--hair)}
.ex.done{border-left-color:var(--hair)}

a.card:hover,.btn:hover{border-color:color-mix(in srgb,var(--fg) 22%,transparent)}
/* botones, chips y segmentados */
.btn{border-radius:12px;border-color:var(--hair);background:var(--surface2);font-weight:600;font-size:15px;letter-spacing:-.01em;transition:transform .12s,filter .12s,background .12s}
.btn:active{transform:scale(.97)}
.btn.pri,.btn.on{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.btn.sm{font-size:13.5px;border-radius:10px}
.btn svg{width:17px;height:17px}
.chip{border-radius:999px;border-color:transparent;background:var(--surface2);font-weight:500;font-size:13.5px;min-height:36px;padding:7px 14px}
.chip i{font:500 10px var(--font-body);opacity:.6}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:transparent}
.seg{border:0;background:var(--surface2);border-radius:11px;padding:3px}
.seg button{font-size:13.5px;font-weight:500;border-radius:8px;color:var(--fg);opacity:.75}
.seg button[aria-pressed="true"]{background:var(--surface);opacity:1;box-shadow:0 1px 3px rgba(0,0,0,.25),0 0 0 .5px var(--hair)}
select,textarea{border-color:var(--hair);background:var(--surface2);border-radius:10px}
/* listas e íconos de herramienta */
.tool .ic{background:var(--surface2);color:var(--fg);border-radius:12px;width:44px;height:44px}
.tool .ic svg{width:22px;height:22px}
.tool b{font-weight:600;font-size:16px;letter-spacing:-.01em}
.mn{font:600 16px var(--font-body);background:var(--surface2);color:var(--fg);border-radius:50%;min-width:36px;height:36px}
.mn.done{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.lrow .cnt{font:500 13px var(--font-body)}
.stat b{font:700 30px/1 var(--font-display);letter-spacing:-.02em}
.stat span{font:500 12px var(--font-body);letter-spacing:0;text-transform:none}
.bar{height:4px}
/* inicio */
.brandhero .logo{width:52px;height:52px;filter:none}
.cta{border-color:var(--hair);background:var(--surface)}
.cta b{font:700 24px/1.15 var(--font-display);text-transform:none;letter-spacing:-.02em}
.cta .ic{width:52px;height:52px;border-radius:14px;box-shadow:none}
.cta:hover{transform:none}
.thm{border-width:1px;border-color:var(--hair);border-radius:16px}
.thm b{font:600 15px/1.2 var(--font-body);text-transform:none;letter-spacing:-.01em}
.thm .thp{border-radius:10px}
.thm .thp i{width:12px;height:12px}
.thm[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 45%,transparent)}
/* números grandes */
.big{font:200 clamp(64px,17vw,104px)/1 var(--font-display);letter-spacing:-.04em}
.tnote{font:300 88px/1 var(--font-display);letter-spacing:-.03em}
.gq{font:600 56px/1 var(--font-display);letter-spacing:-.02em}
.kkey{font:600 24px/1 var(--font-display);letter-spacing:-.01em}
.hrow .rn,.rt-step .n{font:600 18px var(--font-body)}
.song-pick b,.song-h b{font:600 18px/1.2 var(--font-display);text-transform:none;letter-spacing:-.01em}
.lv{font:600 10px var(--font-body);letter-spacing:.05em;border-color:currentColor}
.hud b{font:700 26px/1 var(--font-display);letter-spacing:-.02em}
.hud small{font:600 10px var(--font-body);letter-spacing:.06em}
.judge{font:700 40px/1 var(--font-display);text-transform:none;letter-spacing:-.02em}
/* estrellas y medallas */
.stars{gap:3px}.stars i svg{width:16px;height:16px;fill:var(--line)}.stars i.on svg{fill:var(--accent)}
.stars i{text-shadow:none}.result .stars i svg{width:26px;height:26px}
.medal{width:52px;height:52px;border:1px solid var(--hair);background:var(--surface2);color:var(--muted)}
.medal svg{width:24px;height:24px}
.medal.on{background:color-mix(in srgb,var(--accent) 16%,var(--surface));color:var(--accent-text);border-color:color-mix(in srgb,var(--accent) 40%,transparent);box-shadow:none}
.medal.sm{width:36px;height:36px}.medal.sm svg{width:18px;height:18px}
.ach{border-color:var(--hair);opacity:.55}.ach.on{opacity:1;border-color:var(--hair)}
.ach b{font-weight:600}.ach small{font:500 11px var(--font-body)}
#toast{border-color:var(--hair);border-radius:14px;font-weight:500;box-shadow:0 12px 40px rgba(0,0,0,.35);padding:10px 16px 10px 12px}
#toast>svg{width:26px;height:26px}
#toast small{font:600 10px var(--font-body);letter-spacing:.06em}
/* cancionero */
.pc .kc{font:600 .74em/1.3 var(--font-body);letter-spacing:-.01em}
.klab{font:600 11px var(--font-body);letter-spacing:.08em;color:var(--accent-text)}
.karaoke{border-color:var(--hair)}
.kchip{border-color:var(--hair)}
.card.note{background:var(--surface);border-color:var(--hair);box-shadow:inset 3px 0 0 var(--accent)}
/* mástil */
.fb .num,.fb .slab{font:500 10.5px var(--font-body)}
.fb .dtxt{font:600 10.5px var(--font-body)}
.nt small,.pchip small,.fn,.strs button small,.steps label{font-family:var(--font-body)}
@media (min-width:900px){.side a[aria-current="page"]{background:var(--surface2);color:var(--fg)}.side a[aria-current="page"] svg{color:var(--accent-text)}}
.tab[aria-current="page"]{color:var(--accent-text)}

/* cancionero: panel de tono, rasgueo y acorde */
.kwrap{display:flex;flex-direction:column;gap:12px}
.kside{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--hair);box-shadow:0 1px 2px rgba(0,0,0,.18),0 8px 24px -18px rgba(0,0,0,.5)}
.ks-row{display:flex;gap:20px;align-items:flex-end}
.ks-row>div{display:flex;flex-direction:column;gap:2px}
.ks-row .cl{margin:0}
.ks-key{font:700 28px/1 var(--font-display);letter-spacing:-.02em;color:var(--accent-text)}
.ks-num{font:600 22px/1 var(--font-display);font-variant-numeric:tabular-nums}
.ks-row small{font-size:12px;color:var(--muted)}
.ks-capo,.ks-tip{margin:0;font-size:13px;line-height:1.45;color:var(--muted)}
.kpat{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:4px;margin:8px 0 6px}
.kpat .sl{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 6px;border-radius:10px;background:var(--surface2);color:var(--fg);transition:background .08s,color .08s,transform .08s}
.kpat .sl svg{width:22px;height:22px}
.kpat .sl.acc{color:var(--accent-text)}
.kpat .sl small{font:500 11px var(--font-body);color:var(--muted)}
.kpat .sl .rest{height:22px;line-height:22px;color:var(--muted);font-weight:700}
.kpat .sl .bass,.kpat .sl .str{height:22px;min-width:22px;display:grid;place-items:center;border-radius:50%;font:700 12px var(--font-body);border:1.5px solid currentColor}
.kpat .sl .bass{color:var(--accent-text)}
.kpat .sl.on{background:var(--accent);color:var(--accent-ink);transform:translateY(-2px)}
.kpat .sl.on small,.kpat .sl.on .rest{color:var(--accent-ink)}
.ks-chord{display:flex;align-items:center;gap:12px}
.ks-chord .mch{width:64px;height:66px}
.ks-chord b{font:700 26px/1 var(--font-display);letter-spacing:-.02em}
/* teléfono: el panel queda arriba de la letra y se queda fijo mientras bajas */
@media (max-width:899px){
  .kside{order:-1;position:sticky;top:calc(56px + env(safe-area-inset-top,0px) + 6px);z-index:6;padding:10px 12px;gap:6px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3)}
  .kside .ks-tip,.kside .ks-capo{display:none}
  .kside .kpat{margin:4px 0 0}
  .kside .kpat .sl{padding:5px 0 4px}
  .kside .kpat .sl svg{width:18px;height:18px}
  .kside .ks-row{gap:16px}
  .kside .ks-key{font-size:22px}.kside .ks-num{font-size:18px}
  .kside .ks-ch{position:absolute;top:8px;right:12px}
  .kside .ks-ch .cl{display:none}
  .kside .ks-chord{gap:8px}.kside .ks-chord .mch{width:40px;height:42px}.kside .ks-chord b{font-size:20px}
}
@media (min-width:900px){
  .kwrap{display:grid;grid-template-columns:minmax(0,1fr) 270px;align-items:start;gap:16px}
  .kside{position:sticky;top:76px}
}

.player.upd{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:40}

/* narrador */
.narr{box-shadow:0 0 0 2px var(--accent),0 0 22px color-mix(in srgb,var(--accent) 30%,transparent);border-radius:14px;transition:box-shadow .2s}
li.narr{box-shadow:none;background:color-mix(in srgb,var(--accent) 16%,transparent);border-radius:8px}
.goal.narr{box-shadow:0 0 0 2px var(--good)}
.narrating .dg{opacity:.3;transition:opacity .15s}
.narrating .dg.lit{opacity:1}
.narrating .dg.lit circle{transform:scale(1.32);transform-box:fill-box;transform-origin:center;stroke:var(--fg);stroke-width:2.2}
.player.narrbar{flex-wrap:wrap;gap:6px;padding:8px;z-index:35}
.narrbar .pl{flex:1;min-width:120px;font-size:14px;font-weight:500}
.narrbar .icon-btn{width:40px;height:40px}
.narrbar .icon-btn.pri{background:var(--accent);color:var(--accent-ink)}
.narrbar .seg button{padding:5px 9px;font-size:13px}

/* arte de época: capa fija semitransparente detrás del contenido + tarjetas de vidrio */
#artbg{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:var(--artimg,none);background-size:cover;background-position:center top;opacity:var(--arto,.6)}
.shell{position:relative;z-index:1}
html.arty .card,html.arty .widget,html.arty .ex,html.arty .box,html.arty .gl div,html.arty .kside,html.arty .cta,html.arty .lrow{background-color:color-mix(in srgb,var(--surface) 74%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.35);backdrop-filter:blur(14px) saturate(1.35)}
html.arty .fig{background-color:color-mix(in srgb,var(--bg) 70%,transparent)}
html.arty .lhead,html.arty p.prose,html.arty div.prose{background-color:color-mix(in srgb,var(--bg) 66%,transparent);-webkit-backdrop-filter:blur(12px) saturate(1.3);backdrop-filter:blur(12px) saturate(1.3);padding:14px 16px;border-radius:16px}
.thm .thp{background:var(--timg,none) center/cover,var(--tart),var(--tb)}
@media (prefers-reduced-transparency:reduce){#artbg{opacity:.25}}

/* barra de pulso y destello */
#pulsebar{position:fixed;z-index:38;left:50%;top:calc(env(safe-area-inset-top,0px) + 62px);transform:translate(-50%,-140%);display:flex;align-items:center;gap:12px;padding:8px 10px 8px 14px;border-radius:999px;background:color-mix(in srgb,var(--surface2) 86%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border:1px solid var(--line);box-shadow:0 10px 28px rgba(0,0,0,.35);transition:transform .25s ease;max-width:calc(100% - 24px)}
#pulsebar.show{transform:translate(-50%,0)}
@media (min-width:900px){#pulsebar{left:calc(50% + 118px)}}
#pulsebar .pnum{font:700 26px/1 var(--font-body);font-variant-numeric:tabular-nums;min-width:22px;text-align:center}
#pulsebar.isone .pnum{color:var(--root)}
#pulsebar .pdots{display:flex;gap:8px;align-items:center}
#pulsebar .pdots i{width:14px;height:14px;border-radius:50%;background:var(--line);transition:transform .06s,background .06s}
#pulsebar .pdots i.one{width:18px;height:18px;box-shadow:0 0 0 2px color-mix(in srgb,var(--root) 55%,transparent)}
#pulsebar .pdots i.on{background:var(--accent);transform:scale(1.25)}
#pulsebar .pdots i.on.one{background:var(--root)}
#pulsebar .ptog{display:flex;gap:4px;margin-left:4px;padding-left:8px;border-left:1px solid var(--line)}
#pulsebar .ptog button{width:32px;height:32px;border-radius:50%;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;font:700 14px var(--font-body);cursor:pointer}
#pulsebar .ptog button svg{width:17px;height:17px}
#pulsebar .ptog button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
#flash{position:fixed;inset:0;z-index:37;pointer-events:none;background:var(--accent);opacity:0}
#flash.go{animation:flashb .22s ease-out}
#flash.go.strong{background:var(--root);animation:flashs .28s ease-out}
@keyframes flashb{0%{opacity:.10}100%{opacity:0}}
@keyframes flashs{0%{opacity:.2}100%{opacity:0}}
.beats i.acc{outline:2px solid var(--root);outline-offset:2px}
.beats i.on.acc{background:var(--root)}

/* detalles de márgenes: botones sin partirse, íconos alineados, nada se sale */
.chips{align-items:center}
.btn,.chip{white-space:nowrap;align-items:center;max-width:100%}
.btn svg,.chip svg{width:18px;height:18px;flex:none}
.chip svg{width:16px;height:16px}
.row>*,.exbar>*,.figbar>*{min-width:0}
.rt-step>div{min-width:0;overflow-wrap:anywhere}
.strs{grid-template-columns:repeat(6,minmax(0,1fr))}
.strs button{min-width:0;padding:0 2px}
.kwrap>*{min-width:0}
#pulsebar .pdots{flex-wrap:wrap;min-width:0}
.narrbar .pl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
p,li,h1,h2,h3,.cap,.sub{overflow-wrap:anywhere}

.karaoke{min-width:0;max-width:100%}
.karaoke .kl{min-width:0;max-width:100%}
.seg{flex-wrap:wrap;max-width:100%}
.seg button{white-space:nowrap}
.minimet{flex-wrap:wrap;max-width:100%}
@media (max-width:360px){.minimet .v{min-width:52px;font-size:13px}.minimet .icon-btn{width:32px;height:32px}.exbar{gap:6px}}
.strs button{font-size:clamp(13px,3.6vw,16px)}

/* calificación con micrófono */
.fig .dg.hit circle{fill:var(--good)}
.fig .dg.miss circle{fill:var(--bad)}
.fig.playing .dg.hit,.fig.playing .dg.miss{opacity:1}
.fig .dg.hit .dtxt,.fig .dg.miss .dtxt{fill:#fff}

/* cámara lenta */
.slname{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:52vw}
.sltrack{position:relative;height:10px;border-radius:9px;background:var(--surface2)}
.sltrack .slab{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--accent) 45%,transparent);border-radius:9px}
.sltrack .slpos{position:absolute;top:-4px;width:4px;height:18px;margin-left:-2px;border-radius:2px;background:var(--fg)}
label.btn{cursor:pointer}
/* bienvenida */
.onb{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;padding:12px;padding-bottom:max(12px,env(safe-area-inset-bottom,0px));-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
@media (min-width:700px){.onb{align-items:center}}
.onbc{width:min(560px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.onbc .chip{white-space:normal}
.lrow.plan{padding:10px 4px;border-radius:12px}
.lrow.plan:hover{background:var(--surface2)}

/* cuenta y modo maestro */
.clg{border-top:1px solid var(--line);padding-top:12px;margin-top:6px;display:flex;flex-direction:column;gap:10px}
.cltable{display:flex;flex-direction:column;overflow-x:auto}
.clr{display:grid;grid-template-columns:minmax(0,1.8fr) repeat(3,minmax(0,1fr));gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.clr.h{font:600 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:0}
.clname{display:flex;flex-direction:column;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.clname small{font-weight:400;color:var(--muted);font-size:12px}

.inp{font:500 16px var(--font-body);padding:10px 12px;border-radius:10px;border:1px solid var(--hair,var(--line));background:var(--surface2);color:var(--fg);min-height:44px;width:100%;max-width:100%;box-sizing:border-box}
.inp:focus{outline:2px solid var(--accent);outline-offset:1px}
input[type=time].inp{width:auto}

/* ===================== estudio (v4) =====================
   Inspirado en apps de músico (Moises, etc.): negro profundo, superficies planas con borde fino,
   más aire entre secciones, listas agrupadas, color solo donde importa y el pulso como riel lateral. */
:root[data-theme="clasico"]{--bg:#09090b;--surface:#141417;--surface2:#1e1e22;--line:#2a2a2f;--glass:rgba(9,9,11,.78)}
:root{--r:20px;--hair:color-mix(in srgb,var(--fg) 8%,transparent)}
.page{gap:20px;padding-block:28px 40px}
@media (max-width:899px){.page{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}}
.lhead{margin-bottom:2px}
.lhead h1{font-size:clamp(32px,8vw,46px);letter-spacing:-.035em}
.lhead .sub{color:var(--muted)}
/* superficies planas: en oscuro sin sombras, solo borde fino */
.card,.ex,.widget{box-shadow:none;background:var(--surface);border:1px solid var(--hair)}
:root[data-theme="claro"] .card,:root[data-theme="claro"] .ex,:root[data-theme="claro"] .widget,
:root[data-theme="rocknroll"] .card,:root[data-theme="surf"] .card,:root[data-theme="indie"] .card{box-shadow:0 1px 2px rgba(0,0,0,.05),0 10px 30px -22px rgba(0,0,0,.35)}
.card{padding:20px}
/* barra superior y pestañas de vidrio */
.topbar{border-bottom:1px solid var(--hair);background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6)}
.tabs{border-top:1px solid var(--hair);background:color-mix(in srgb,var(--bg) 70%,transparent);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6)}
.tabs .tab{color:var(--muted);gap:3px}
.tabs .tab svg{padding:3px 14px;width:52px;height:30px;border-radius:999px;box-sizing:border-box;transition:background .2s}
.tabs .tab[aria-current="page"]{color:var(--fg);font-weight:600}
.tabs .tab[aria-current="page"] svg{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent-text)}
/* chips: el activo se tiñe del color del tema en vez de negro/blanco */
.chip{background:var(--surface2);color:var(--fg);border:1px solid transparent}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 17%,transparent);color:var(--accent-text);border-color:color-mix(in srgb,var(--accent) 42%,transparent);font-weight:600}
.chips{gap:8px}
.cl{margin-bottom:8px;display:block}
/* segmentados tipo iOS */
.seg{background:var(--surface2);border:0;padding:3px;border-radius:12px}
.seg button{border-radius:9px}
.seg button[aria-pressed="true"]{background:color-mix(in srgb,var(--fg) 14%,var(--surface));color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.25)}
/* botones */
.btn{min-height:44px}
.btn.sm{min-height:36px}
.btn.pri{box-shadow:0 8px 24px -12px color-mix(in srgb,var(--accent) 80%,transparent)}
/* listas agrupadas: herramientas y referencias en un solo bloque con separadores */
@media (max-width:699px){
  .grid2:has(> .tool){gap:0;background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);overflow:hidden}
  .grid2:has(> .tool) > .tool{border:0;border-radius:0;box-shadow:none;background:transparent;padding:14px 16px}
  .grid2:has(> .tool) > .tool + .tool{border-top:1px solid var(--hair)}
  html.arty .grid2:has(> .tool){background-color:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
  html.arty .grid2:has(> .tool) > .tool{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
}
.tool{padding:16px 18px}
.tool > span:last-child{flex:1;min-width:0}
.tool::after{content:'';flex:none;width:8px;height:8px;border-right:2px solid var(--muted);border-top:2px solid var(--muted);transform:rotate(45deg);opacity:.5;margin-right:4px}
.tool b{font-weight:600;font-size:16px;color:var(--fg)}
.tool span span{font-size:13.5px;color:var(--muted);line-height:1.4}
/* íconos con color propio, como en Ajustes de iPhone */
.tool .ic{width:40px;height:40px;border-radius:11px;background:color-mix(in srgb,var(--ich,var(--accent)) 18%,transparent);color:var(--ich,var(--accent-text))}
.tool .ic svg{width:21px;height:21px}
.grid2 > .tool:nth-child(6n+1){--ich:#ff9f0a}.grid2 > .tool:nth-child(6n+2){--ich:#64d2ff}.grid2 > .tool:nth-child(6n+3){--ich:#bf5af2}
.grid2 > .tool:nth-child(6n+4){--ich:#ff6482}.grid2 > .tool:nth-child(6n+5){--ich:#30d158}.grid2 > .tool:nth-child(6n){--ich:#5e9cff}
:root[data-theme="claro"] .grid2 > .tool .ic{--ich-l:1;filter:saturate(1.1) brightness(.85)}
/* metrónomo: dial circular con los tiempos alrededor */
.metstage{padding:26px 20px 22px;gap:18px;display:flex;flex-direction:column;align-items:stretch}
.dial{--D:min(72vw,280px);position:relative;width:var(--D);height:var(--D);margin:4px auto 0;border-radius:50%;
  background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--fg) 7%,var(--surface2)),var(--surface) 72%);
  box-shadow:inset 0 0 0 1px var(--hair),0 0 0 12px color-mix(in srgb,var(--surface2) 55%,transparent),0 30px 60px -30px rgba(0,0,0,.6)}
.dial .beats{position:absolute;inset:0;margin:0;display:block}
.dial .beats i{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:color-mix(in srgb,var(--fg) 16%,transparent);outline:0;
  transform:rotate(calc(360deg / var(--n) * var(--k))) translateY(calc(var(--D) / -2 + 24px));transition:background .08s,box-shadow .08s,scale .08s}
.dial .beats i.acc{background:color-mix(in srgb,var(--root) 45%,transparent);width:18px;height:18px;margin:-9px;outline:0}
.dial .beats i.on{background:var(--accent);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 22%,transparent),0 0 22px var(--accent);scale:1.35}
.dial .beats i.on.acc{background:var(--root);box-shadow:0 0 0 5px color-mix(in srgb,var(--root) 25%,transparent),0 0 24px var(--root)}
.dial .dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.dial .big{font-size:calc(var(--D) * .3);font-weight:250;letter-spacing:-.05em}
.mstep .btn{min-width:56px;border-radius:999px}
.metstage input[type=range]{margin:2px 6px}
/* pulso visual: riel vertical a la derecha */
#pulsebar{left:auto;right:calc(env(safe-area-inset-right,0px) + 8px);top:50%;transform:translate(170%,-50%);flex-direction:column;align-items:center;gap:10px;
  width:46px;padding:12px 0 8px;border-radius:999px;background:color-mix(in srgb,var(--surface2) 82%,transparent);border:1px solid var(--hair);
  box-shadow:0 12px 40px -12px rgba(0,0,0,.6);transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s;visibility:hidden}
#pulsebar.show{transform:translate(0,-50%);visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
@media (min-width:900px){#pulsebar{left:auto;right:24px}}
#pulsebar .pnum{font-size:22px;min-width:0}
#pulsebar .pdots{flex-direction:column;flex-wrap:nowrap;gap:6px}
#pulsebar .pdots i{width:8px;height:24px;border-radius:5px;background:color-mix(in srgb,var(--fg) 16%,transparent);box-shadow:none;transform:none;transition:background .06s,width .06s}

/* barra de abajo: en teléfonos angostos las 5 pestañas caben sin cortarse */

.kamb{-webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 30%,#000 35%,transparent 100%);mask-image:radial-gradient(ellipse 70% 60% at 50% 30%,#000 35%,transparent 100%)}
/* ===================== letra en «modo concierto» (estilo Apple Music) =====================
   mientras suena: el renglón actual grande y brillante, el siguiente a media luz, los demás tenues y desenfocados;
   cada sílaba se llena de izquierda a derecha en lo que dura (--sd) */
.karaoke .kl{transition:opacity .45s ease,filter .45s ease,background .2s,font-size .3s ease}
.karaoke.live .kl{opacity:.32;filter:blur(.8px)}
.karaoke.live .kl.past{opacity:.24}
.karaoke.live .kl.nxt{opacity:.62;filter:none}
.karaoke.live .kl.cur{opacity:1;filter:none;background:none;box-shadow:none;font-size:1.07em}
.karaoke.live .kl.cur .pc i{color:transparent;text-shadow:none;background:linear-gradient(90deg,var(--fg) 0 50%,color-mix(in srgb,var(--fg) 36%,transparent) 50% 100%);background-size:200% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;transition:background-position var(--sd,.25s) linear}
.karaoke.live .kl.cur .pc.lit i{color:transparent;text-shadow:none;background-position:0 0}
.karaoke.live .kl.cur .pc .kc{color:var(--accent-text)}
.karaoke.live .klab,.karaoke.live .kgap{opacity:.3}
@media(prefers-reduced-motion:reduce){.karaoke.live .kl{filter:none}.karaoke .kl{transition:none}}
/* ===================== interior de las lecciones con el mismo estilo =====================
   ejercicio como una pista: número en círculo, el diagrama al centro, transporte con botón redondo,
   opciones como interruptores con su valor, pasos numerados y la meta en verde */
.ex{border:1px solid var(--hair,var(--line));border-radius:20px;padding:18px;gap:14px;background:var(--surface)}
.ex.done{border-color:color-mix(in srgb,var(--good) 45%,var(--hair,var(--line)))}
.ex .eh{align-items:center;gap:14px}
.exn{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 17px var(--font-body);color:var(--accent-text,var(--accent));background:color-mix(in srgb,var(--accent) 14%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 45%,transparent)}
.exn svg{width:20px;height:20px}
.ex.done .exn{color:#04130b;background:var(--good);box-shadow:none}
.eht{min-width:0}
.ex .tag{color:var(--muted);letter-spacing:.02em;text-transform:none;font:600 12.5px var(--font-body)}
.ex.done .tag{color:var(--good)}
.ex h3{margin:2px 0 0;font-size:19px;line-height:1.25;letter-spacing:-.01em}
/* diagrama y transporte */
.fig{display:flex;flex-direction:column;gap:12px}
.fig .figbar{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.fig .figbar .kplayb{width:60px;height:60px}
.fig .figbar .kplayb > span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.fig .figbar .kic.on{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent-text,var(--accent))}
.fig .minimet{border:0;background:color-mix(in srgb,var(--fg) 7%,transparent);border-radius:999px;padding:4px}
.fig .minimet .icon-btn{border-radius:50%}
.figst{text-align:center;font:600 13px var(--font-body);min-height:18px;color:var(--accent-text,var(--accent))}
.figst:empty{display:none}
/* opciones como interruptores */
.figopts{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:6px;padding:6px;border-radius:16px;background:color-mix(in srgb,var(--fg) 5%,transparent)}
.ftog{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 7px;border:0;border-radius:12px;background:none;color:var(--fg);cursor:pointer;font:inherit;min-width:0}
.ftog svg{width:20px;height:20px;color:var(--muted)}
.ftog b{font-size:13px;font-weight:700;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ftog small{font-size:11px;color:var(--muted);white-space:nowrap}
.ftog:hover{background:color-mix(in srgb,var(--fg) 7%,transparent)}
.ftog.on{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.ftog.on svg{color:var(--accent-text,var(--accent))}
@media(max-width:420px){.figopts[style*="--n:4"]{grid-template-columns:repeat(2,minmax(0,1fr))}.ftog{flex-direction:row;justify-content:flex-start;display:grid;grid-template-columns:20px minmax(0,1fr);column-gap:8px;padding:8px 10px;text-align:left}.ftog svg{grid-row:1/3;align-self:center}}
/* pasos numerados en círculos */
.ex ol.steps{list-style:none;padding:0;margin:0;counter-reset:st;display:flex;flex-direction:column;gap:10px}
.ex ol.steps li{counter-increment:st;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;line-height:1.45}
.ex ol.steps li::before{content:counter(st);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--font-body);color:var(--muted);background:color-mix(in srgb,var(--fg) 8%,transparent);margin-top:-1px}
/* meta */
.goal{display:flex;gap:10px;align-items:flex-start;border:0;border-radius:14px;padding:12px 14px;background:color-mix(in srgb,var(--good) 11%,transparent)}
.goal .gi{width:22px;height:22px;border-radius:50%;flex:none;background:var(--good);color:#04130b;display:grid;place-items:center;margin-top:1px}
.goal .gi svg{width:13px;height:13px}
/* barra del ejercicio: temporizador y «hecho» como píldoras */
.exbar{padding-top:12px;border-top:1px solid var(--hair,var(--line))}
.exbar .btn{border-radius:999px}
.exbar .btn.ok.on{background:var(--good);color:#04130b;border-color:transparent}
/* bloques de la lección */
.widget{border-radius:20px;border-color:var(--hair,var(--line));padding:16px}
.box{border-radius:20px;border-color:var(--hair,var(--line));background:var(--surface)}
.box li{line-height:1.5}
.trick{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 14%,var(--surface)),var(--surface));border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.prose{line-height:1.6}
.prose .blockh{font-size:12px}
/* botones de escuchar de los diagramas: píldora rellena, como el resto */
.pbtn{border:0;border-radius:999px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent-text,var(--accent));padding:8px 16px 8px 14px;gap:8px;min-height:40px}
.pbtn:hover{background:color-mix(in srgb,var(--accent) 26%,transparent)}
/* ===================== portada de bienvenida (entrar con Google) ===================== */
#welcome{position:fixed;inset:0;z-index:200;background:var(--bg);overflow:hidden;display:flex;align-items:flex-end;justify-content:center;transition:opacity .3s ease,transform .3s ease}
#welcome.out{opacity:0;transform:scale(1.02);pointer-events:none}
html.welcome-on{overflow:hidden}
.wmos{position:absolute;left:50%;top:-6%;width:170%;display:grid;grid-template-columns:repeat(6,1fr);gap:14px;transform:translateX(-50%) rotate(-12deg);opacity:.75;animation:wdrift 40s linear infinite alternate}
.wmos .acov{border-radius:12px}
@keyframes wdrift{from{transform:translateX(-50%) rotate(-12deg) translateY(0)}to{transform:translateX(-50%) rotate(-12deg) translateY(-8%)}}
@media(prefers-reduced-motion:reduce){.wmos{animation:none}}
.wfade{position:absolute;inset:0;background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 10%,transparent) 0%,color-mix(in srgb,var(--bg) 55%,transparent) 38%,var(--bg) 66%)}
.wbox{position:relative;width:100%;max-width:440px;padding:24px 24px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}

.wgoogle{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:54px;border:0;border-radius:999px;background:#fff;color:#1f1f1f;font:600 16px var(--font-body);cursor:pointer;box-shadow:0 10px 30px -12px rgba(0,0,0,.6);white-space:nowrap}
.wgoogle svg{width:22px;height:22px;flex:none}
.wgoogle:disabled{opacity:.7}
.wskip{border:0;background:none;color:var(--fg);font:600 15px var(--font-body);padding:10px 16px;cursor:pointer;border-radius:999px}
.wskip:hover{background:color-mix(in srgb,var(--fg) 8%,transparent)}
.wsmall{margin:0;color:var(--muted);font-size:12.5px;line-height:1.4;max-width:320px}
/* bloques pedagógicos de las lecciones */
.box.aim{border-color:color-mix(in srgb,var(--accent) 35%,transparent);background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.box.aim li::marker{color:var(--accent-text)}
.lstep .stepk{display:flex;align-items:center;gap:10px;font:700 19px/1.25 var(--font-display);letter-spacing:-.01em;margin:6px 0 8px}
.lstep .stepk span{flex:none;font:700 12px var(--font-body);letter-spacing:.04em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:4px 10px}
.keyi{padding:16px 18px;border-radius:var(--r);border-left:4px solid var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.keyi p:last-child{margin:4px 0 0;font-size:17px;line-height:1.5;font-weight:500}
.box.chk details{border-top:1px solid var(--hair);padding:10px 0}

.box.chk summary{cursor:pointer;font-weight:600;list-style:none;display:flex;gap:10px;align-items:flex-start}

.figstep{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:6px;border-radius:16px;background:color-mix(in srgb,var(--fg) 5%,transparent)}

function guitarVoicing(p,shift){
  const pc=(p.pc+shift+120)%12,t=chType(p.suf),bass=p.bass==null?null:(p.bass+shift+120)%12,key=pc+'|'+t+'|'+bass;
  if(GUITAR_VCACHE[key])return GUITAR_VCACHE[key];
  let frets=null;
  const nm=US12S[pc].replace('♯','#')+TSUF[t],oc=GUITAR_OC.find(c=>c[0]===nm);
  if(oc)frets=oc[2].slice();
  else{
    const e=(pc-4+12)%12,a=(pc-9+12)%12,eS=ESHAPE[t],aS=ASHAPE[t]||ASHAPE.maj;
    const useE=eS&&(e<=a||!aS)&&e>0,base=useE?e:a,sh=useE?eS:aS;
    frets=sh.map(f=>f==null?null:f+base);
  }
  // acorde con bajo (G/B, E/G♯): el bajo va en la cuerda más grave que lo alcance sin estirar la mano; si no cabe, lo toca el bajista
  if(bass!=null){const fr=frets.filter(x=>x!=null&&x>0),lo=fr.length?Math.min(...fr):0,hi=fr.length?Math.max(...fr):0;
    for(let i=0;i<3;i++){const s=6-i;let f=(bass-GUITAR_PC[s]+12)%12;if(f>0&&f<lo-1&&f+12<=hi+2)f+=12;const ok=f===0||(Math.max(hi,f)-Math.min(lo||f,f)<=3);
      if(ok){for(let j=0;j<i;j++)frets[j]=null;frets[i]=f;break}}}
  const midi=frets.map((f,i)=>f==null?null:GUITAR_MIDI[6-i]+f).filter(x=>x!=null),strs=frets.map((f,i)=>f==null?null:6-i).filter(x=>x!=null);
  return GUITAR_VCACHE[key]={frets,midi,strs,root:36+((bass!=null?bass:pc)<4?(bass!=null?bass:pc)+12:(bass!=null?bass:pc))};
}
function guitarPluck(m,t,d,v,o){
  if(SMP.ready&&m>=37&&m<=79)return smpPlay('g',m,t,d,(v||.2)*1.15,o);
  const c=AC,K=ksBuffer(Math.round(m)),src=c.createBufferSource(),g=c.createGain(),lp=c.createBiquadFilter();
  src.buffer=K.b;src.playbackRate.value=K.rate;
  lp.type='lowpass';lp.frequency.value=m<55?3200:5200;lp.Q.value=.4;
  const vol=Math.min(1,(v||.2)*3.2),end=t+Math.min(d,2.3);
  g.gain.setValueAtTime(vol,t);g.gain.setValueAtTime(vol,Math.max(t,end-.12));g.gain.linearRampToValueAtTime(.0001,end);
  src.connect(lp);lp.connect(g);g.connect(out());src.start(t);src.stop(end+.02);
  return{g,end};
}

/* Quién toca cada golpe: D/I = mano derecha/izquierda, PD/PI = pie derecho/izquierdo (baterista diestro). */
const LIMB={D:'Mano derecha',I:'Mano izquierda',PD:'Pie derecho',PI:'Pie izquierdo'};
function limbOf(g,row,i){
  if(row==='bd')return'PD';if(row==='hf')return'PI';
  const rows=Object.keys(g.rows),cyms=['hh','rd','cr','cb'];
  if(g.hands&&(row==='sn'||rows.length===1))return g.hands[i]==='I'?'I':'D';
  // un solo instrumento rápido (tresillos, semicorcheas): manos alternadas
  if(rows.length===1&&g.sub>=3)return i%2?'I':'D';
  if(cyms.includes(row))return'D';
  // fills: si en ese golpe no suena ningún platillo, las manos se alternan
  const cymNow=cyms.some(r=>g.rows[r]&&g.rows[r][i]&&g.rows[r][i]!=='-');
  if(['t1','t2','ft'].includes(row)||!cymNow&&g.cat==='Fills')return i%2?'I':'D';
  return'I';
}
const cellName=(g,i)=>{const p=i%g.sub,b=Math.floor(i/g.sub)%g.meter+1;return p===0?String(b):(p===1&&g.sub===2||p===2&&g.sub===4?'y':COUNT[g.sub][p])+(p?' del '+b:'')};
// texto de dónde cae cada instrumento («Tarola · mano izquierda: 2 y 4»)
function rowDesc(g,row){
  const line=g.rows[row],n=line.length,on=[...line].map((c,i)=>c!=='-'?i:-1).filter(i=>i>=0),bars=g.bars||1,per=n/bars;
  const first=on.filter(i=>i<per);
  let where;
  if(on.length===n)where={1:'todos los tiempos',2:'corcheas parejas',3:'tresillos parejos',4:'semicorcheas parejas'}[g.sub];
  else if(first.length>6)where='casi todas las '+({2:'corcheas',3:'notas del tresillo',4:'semicorcheas'}[g.sub]||'notas');
  else{const names=first.map(i=>cellName(g,i));where=names.length?names.length===1?'en el '+names[0]:'en '+names.slice(0,-1).join(', ')+' y '+names[names.length-1]:'';
    if(bars>1&&on.some(i=>i>=per))where+=(where?'; ':'')+'en el compás 2 cambia (míralo en la rejilla)'}
  const limbs=[...new Set(on.map(i=>limbOf(g,row,i)))].map(l=>LIMB[l].toLowerCase()).join(' y ');
  return{row,n:ROWS[row].n,limbs,where};
}

 ['Sostener los tiempos sin click','Contratiempo es la mitad entre pulsos, la «y». Groove es un patrón que se repite. Hi-hat son los dos platillos pequeños; bombo es el tambor grave del pedal; tarola es el tambor con bordones.','Cuenta 1, 2, 3, 4 y toca la tarola en 2 y 4. Si eliges click en 2 y 4, click y tarola coinciden; sigues contando 1 y 3.','El click cambia de lugar; tu cuenta permanece.','¿Qué sostienes con click solo en el 1?','Los otros tres pulsos y la llegada al siguiente 1.','rock'],
 ['Conservar el tempo durante el silencio','Click intermitente significa que el metrónomo alterna compases audibles y silenciosos. Un compás de 4/4 dura cuatro pulsos.','A 80 bpm, toca cuatro compases con click y cuatro sin él. Mantén la misma cuenta; el siguiente click debe coincidir con tu bombo en 1.','El silencio también tiene duración exacta.','¿Qué haces cuando se calla el click?','Sigues contando y tocando a la misma velocidad.','rock'],
 ['Mantener el hi-hat parejo al sumar piezas','Hi-hat cerrado significa mantener juntos sus dos platillos con el pedal izquierdo. Acentuar es tocar un golpe un poco más fuerte.','Cuenta 1 y 2 y 3 y 4 y en el hi-hat. Agrega bombo en 1 y 3, después tarola en 2 y 4, sin mover los ocho golpes iniciales.','Suma una pieza a la vez.','¿Qué debe permanecer al agregar el bombo?','Los espacios iguales entre golpes del hi-hat.','e'],
 ['Encajar el bombo con el bajo','El bolsillo es la sensación de ritmo estable compartido. Una síncopa coloca un golpe entre pulsos. Medio tiempo deja la tarola en el 3 de cada compás de cuatro.','En el rock básico, bombo en 1 y 3, tarola en 2 y 4. Escucha el bajo de la banda y conserva esas entradas.','Escucha el bajo sin abandonar tu cuenta.','¿Qué cambia al pasar a medio tiempo?','La tarola pasa a un golpe en el 3; el tempo puede seguir igual.','rock'],
 ['Volver al primer pulso después de un fill','Fill es una frase corta de enlace. Los toms son tambores sin bordones; el tom de piso es el más grave. El platillo crash marca una llegada.','En el patrón de dos compases, toca el groove y reemplaza el tiempo 4 del segundo por 4 e y a en tarola. Bombo y platillo entran en el siguiente 1.','El fill ocupa su espacio; no adelanta la llegada.','¿Cuánto dura un fill de un tiempo?','Un pulso, aunque tenga cuatro golpes.','fill1'],
 ['Controlar los extremos de velocidad','Tempo es la velocidad medida en bpm. Subdividir por dentro es contar partes del pulso aunque no las toques.','A 56 bpm cuenta 1 e y a entre cada click; toca solo en el número. En el entrenador, aumenta cuatro bpm después de cuatro compases.','La velocidad llega con movimiento cómodo y preciso.','¿Qué haces si aparece tensión?','Baja el tempo y reduce la fuerza del movimiento.','slow'],
 ['Cambiar el volumen sin cambiar el pulso','Dinámica es la intensidad del sonido. Crescendo significa aumentar gradualmente el volumen. Nota fantasma es un golpe muy suave.','Toca cuatro compases suaves y cuatro fuertes a 84 bpm. En la rejilla, el punto pequeño indica fantasma y el acento indica golpe fuerte.','La fuerza y la velocidad son controles distintos.','¿Una nota fantasma debe caer a tiempo?','Sí, aunque suene muy suave. El micrófono no evalúa su volumen.','ghost'],
 ['Leer y tocar subdivisiones ternarias','Ternario divide cada pulso en tres. Shuffle toca la primera y tercera partes. En 6/8 hay dos pulsos grandes de tres corcheas; en 12/8, cuatro. El vals en 3/4 agrupa tres pulsos y puede dividirlos en dos.','Cuenta 1 ta ti, 2 ta ti. Toca en el número y en ti para el shuffle; deja ta vacío.','No conviertas el shuffle en dos partes iguales.','¿Son lo mismo 3/4 y 6/8?','No: aquí 3/4 son tres pulsos y 6/8 son dos pulsos con tres partes.','shuffle'],
 ['Reconocer patrones de varios estilos','El aro es el borde de la tarola; un golpe de aro produce un sonido seco. Polka alterna bombo y tarola. Dembow usa un patrón sincopado repetido.','En cumbia, bombo en 1 y 3, aro en 2 y 4 y hi-hat en corcheas; acentúa cada «y» sin adelantarla.','Repetir con precisión hace reconocible el estilo.','¿Qué cambia entre estos estilos?','La ubicación de golpes, silencios y acentos, además del tempo.','cumbia'],
 ['Preparar el tempo y la entrada de tu banda','Setlist es la lista ordenada de canciones de un ensayo o concierto. Cuenta de entrada son los pulsos previos que indican cuándo empezar.','Guarda una canción a 90 bpm y compás 4/4. Escucha el click y cuenta 1, 2, 3, 4; todos entran en el siguiente 1.','Anota el tempo y verifica tu cuenta antes de entrar.','¿Qué comparas al grabar un ensayo?','El tempo del inicio y del final de cada canción.','q']

function drumPlayer(){return DB.drumPlayer!==false}
function drumKey(key){const p=chParse(key||'C');return{pc:p?.pc||0,minor:!!p?.minor}}
function drumBeatById(id){const g=GROOVES[id];return g?{id,n:g.n,key:'C',beats:id==='vals'?3:4}:null}
function drumBandStyles(g){return Object.keys(GROOVES).filter(id=>GROOVES[id][g.meter===3?3:4]&&(g.sub===3?GROOVES[id].sub===3:GROOVES[id].sub!==3)).map(id=>({...drumBeatById(id),beats:g.meter===3?3:4}))}
const DRUM_BAND={nodes:[],rendering:Promise.resolve()};
function drumBandRender(id,bpm,key,meter){
 const work=async()=>{await loadSamples();const beats=meter===3?3:4,Q=GROOVES[id].sub,spb=60/bpm,pc=key?.pc||0;
  const names=[0,5,7,0].map(iv=>US_NAMES[(pc+iv)%12]+(key?.minor?'m':''));
  const steps=Array.from({length:4*beats*Q},(_,k)=>({G:id,bt:beats,i:k%(beats*Q),p:chParse(names[Math.floor(k/(beats*Q))]),sh:0,spb,bar:Math.floor(k/(beats*Q)),ci:k%(beats*Q)}));
  const before=DB.drumPlayer;DB.drumPlayer=true;let buf;try{buf=await bandRender(steps,spb/Q)}finally{DB.drumPlayer=before}
  return{parts:[buf],loop:4*beats*spb,bars:4,acordes:names,beat:{...drumBeatById(id),beats}};
 };const promise=DRUM_BAND.rendering.then(work);DRUM_BAND.rendering=promise.catch(()=>{});return promise;
}
function drumBandPlay(res,t0,vol){drumBandStop();const c=ac();for(const buf of res.parts){const node=c.createBufferSource(),gain=c.createGain();node.buffer=buf;node.loop=true;node.loopEnd=res.loop;gain.gain.value=vol??.9;node.connect(gain);gain.connect(out());node.start(t0);DRUM_BAND.nodes.push({node,gain})}}
function drumBandStop(){for(const {node,gain} of DRUM_BAND.nodes){try{node.stop();gain.disconnect()}catch(e){}}DRUM_BAND.nodes=[];bandStop()}

 const name=grooveFor(id,beats),groove=GROOVES[name],src=groove[beats===3?3:4],rows={};
 for(const [key,row] of Object.entries(DRUM_MAP))if(src[key]&&/[^-.]/.test(src[key]))rows[row]=src[key].replace(/\./g,'-');

  ks.forEach(k=>{const d=new Date(k+'T12:00:00');if(prev&&Math.round((d-prev)/864e5)===1)c++;else c=1;prev=d;b=Math.max(b,c)});return b}
const mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
const sd=a=>{if(a.length<2)return 0;const m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)*(x-m),0)/(a.length-1))};
const med=a=>{if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y);return s[Math.floor(s.length/2)]};

  const seen=new Set(DB.ses.map(s=>s.ts));DB.ses=DB.ses.concat((o.ses||[]).filter(s=>!seen.has(s.ts))).sort((a,b)=>a.ts-b.ts).slice(-120);

function mergeVal(a,b){
  if(a==null)return b;if(b==null)return a;
  if(typeof a==='number'&&typeof b==='number')return Math.max(a,b);
  if(typeof a==='boolean'||typeof b==='boolean')return!!(a||b);
  if(Array.isArray(a)||Array.isArray(b))return(Array.isArray(a)&&a.length>=(Array.isArray(b)?b.length:0))?a:b;
  if(typeof a==='object'&&typeof b==='object'){const o=Object.assign({},a);for(const k in b)o[k]=mergeVal(a[k],b[k]);return o}
  return a;
}

        <div class="runbox"><div class="gridbox">${grooveGrid(gg)}</div><div class="kitwrap small">${kitSVG(gg)}</div></div>
        ${mode==='tap'?padsHTML(gg):`<div class="micbar"><span>${IC.mic}</span><div class="meter"><i id="mlv"></i></div></div>`}
        <div class="coach-controls"><button class="btn" id="stop">${IC.stop}Detener</button><button class="btn" id="again">${IC.redo}Reiniciar</button></div>`;
      const ph=$('#phase',root),rd=$('#round',root),fbv=$('#fbv',root),fbt=$('#fbt',root),fb=$('#fb',root),bar=$('#rbar',root);
      const hits=[];let exp=[],matched=new Set();
      const onHit=(t,pad)=>{if(!run||!exp.length)return;if(t<exp[0].t-.3||t>run.end+.2)return;hits.push({t,pad});
        let best=null,bd=.12;for(const e of exp){if(matched.has(e))continue;if(mode==='tap'&&e.pad!==pad)continue;const d=Math.abs(t-e.t);if(d<bd){bd=d;best=e}}
        const off=best?(t-best.t)*1000:null,cl=best?gradeOf(off)[0]:'miss';if(best){matched.add(best);gridMark(root,best.i,cl)}
        fbv.textContent=best?(off>0?'+':'')+Math.round(off)+' ms':'—';fbt.textContent=best?offTxt(off):'Golpe de más';fb.className='vnote '+({ok:'hit',mid:'low',bad:'high',miss:'quiet'}[cl]);
        if(mode==='tap'){const b=$(`[data-pad="${pad}"]`,root);if(b)padFlash(b,cl)}};
      if(mode==='tap')unpads=padsMount(root,(t,pad)=>{hit({plat:'hh',tar:'sn',bom:'bd'}[pad],ac().currentTime+.005,'x');onHit(t,pad)});else{MIC.onHit=(t)=>onHit(t-micLat(),null);live=()=>{const m=$('#mlv',root);if(m)m.style.width=Math.min(100,MIC.lv*250)+'%'};document.addEventListener('miclv',live)}
      run={end:Infinity};
      grooveRun({id:'coach',g:gg,bpm,loops:listen+loops,click:true,drums:L=>L<listen,band:st.k==='band'?band:null,
        onStart:s=>{exp=expectedHits(gg,s.T0+listen*n*s.step,s.step,loops,mode);run.end=s.end;run.T0=s.T0},
        onCount:(b,first)=>{ph.textContent='Cuenta: '+b;ph.classList.remove('sing');rd.textContent=listen?'Primero escucha una vuelta':'Entra en el 1'},
        onStep:(i,L)=>{lightStep(root,gg,i);
          if(i===0)$$('.dgrid .ok,.dgrid .mid,.dgrid .bad,.dgrid .miss',root).forEach(x=>x.classList.remove('ok','mid','bad','miss'));
          if(L<listen){ph.textContent='Escucha';ph.classList.remove('sing');rd.textContent='Así suena · tú entras en la siguiente vuelta'}
          else{ph.textContent='Ahora tú';ph.classList.add('sing');rd.textContent=`Vuelta ${L-listen+1} de ${loops}`}

        onEnd:()=>{const res=scoreHits(exp,hits,{pads:mode==='tap'});stopAll();result(res,bpm,mode)}});
      root.onclick=e=>{const b=e.target.closest('button');if(!b||b.dataset.pad)return;if(b.id==='stop'){stopAll();intro()}if(b.id==='again')exercise()};

    function result(R,bpm,mode){

        ${offs.length?stripSVG(offs):''}
        <p class="coach-tip">${scoreTip(R)}${R.pct<.4&&spdOf(st.id)==='lento'?' La próxima vez empieza en Lento.':''}</p>

        <div class="row how-actions"><button class="btn" id="again">${IC.redo}Repetir</button>${single?`<a class="btn" href="#/groove/${st.id}">Ver el groove</a>`:''}</div>
        ${!single||S.i<S.steps.length-1?`<button class="kplayb how-go" id="next" aria-label="Siguiente">${IC.next}<span>${single?'Listo':'Siguiente'}</span></button><p class="cap">${single?'':`Sigue solo en <span class="next-ring" id="ring">6</span>`}</p>`:`<a class="kplayb how-go" href="#/grooves" aria-label="Más grooves">${IC.grid}<span>Más</span></a>`}
      </div>`;
      if(!single){let n=6;const ring=$('#ring',root);const tk=()=>{n--;if(!ring.isConnected)return;ring.textContent=n;ring.style.setProperty('--progress',((6-n)/6*360)+'deg');if(n<=0)next();else T(tk,1000)};T(tk,1000)}
      root.onclick=e=>{const b=e.target.closest('button');if(!b)return;clearT();if(b.id==='again')exercise();if(b.id==='next'){if(single)location.hash='#/groove/'+st.id;else next()}};
    }
    function next(){
      stopAll();S.i++;if(!single){DB.sess=S;save()}
      if(S.i>=S.steps.length){summary();return}intro();
    }
    function summary(){
      const done=S.res.filter(x=>x&&!x.skipped),avg=mean(done.map(x=>x.p));
      root.innerHTML=head('Sesión terminada')+`<div class="coach-center"><span class="coach-cover dcover">${coverArt(218,TART.groove[1],null,'fin')}</span><h1>¡Sesión completa!</h1>

        <ol class="session-steps sumlist">${S.steps.map((s,i)=>{const x=S.res[i];return`<li class="${x&&!x.skipped?'done':''}"><span>${x&&!x.skipped?IC.check:i+1}</span><b>${KIND[s.k][0]}: ${esc(G[s.id].n)}</b><small>${x?x.skipped?'Saltado':Math.round(x.p*100)+' % · '+'★'.repeat(x.stars):''}</small></li>`}).join('')}</ol>

      root.onclick=null;
    }
    if(!single&&S.i>=S.steps.length)summary();else intro();
    return()=>{destroyed=true;stopAll();if(live)document.removeEventListener('miclv',live);micStop();COACH=null};
  }};

// Rejilla: un bloque por compás; filas = instrumentos, columnas = golpes; abajo la cuenta y quién toca (D/I/pies)
function grooveGrid(g,o){
  o=o||{};const n=gSteps(g),bars=g.bars||1,per=n/bars,rows=ROW_ORDER.filter(r=>g.rows[r]);
  let h=`<div class="dgrid" style="--n:${per}">`;
  for(let b=0;b<bars;b++){
    h+=`<div class="dbar">${bars>1?`<span class="dbn">Compás ${b+1}</span>`:''}`;
    rows.forEach(r=>{const muted=o.muted&&o.muted.includes(r);
      h+=`<div class="drow${muted?' you':''}" data-row="${r}"><span class="dlab" title="${ROWS[r].n}">${ROWS[r].a}</span>`;
      for(let j=0;j<per;j++){const i=b*per+j,c=g.rows[r][i]||'-',beat=j%g.sub===0;
        h+=`<span class="dc${beat?' b':''}" data-i="${i}">${c==='-'?'':`<i class="dn ${c==='X'?'acc':c==='g'?'gh':c==='o'?'op':''}"></i>`}</span>`}
      h+='</div>'});
    h+=`<div class="drow dcount"><span class="dlab"></span>`;
    for(let j=0;j<per;j++){const p=j%g.sub,bt=Math.floor(j/g.sub)%g.meter+1;h+=`<span class="dk${p===0?' b':''}" data-i="${b*per+j}">${p===0?bt:COUNT[g.sub][p]}</span>`}
    h+='</div>';
    if(o.limbs!==false){h+=`<div class="drow dlimb"><span class="dlab" title="Manos">${IC.hand}</span>`;
      for(let j=0;j<per;j++){const i=b*per+j,ls=[...new Set(rows.filter(r=>g.rows[r][i]&&g.rows[r][i]!=='-'&&!['bd','hf'].includes(r)).map(r=>limbOf(g,r,i)))];
        h+=`<span class="dk" data-i="${i}">${ls.join('')}</span>`}
      h+='</div>'}
    h+='</div>';
  }
  return h+'</div>';
}
// ilumina la columna i (−1 apaga) y hace destellar las notas que suenan
function gridNow(root,i){
  if(!root)return;$$('.dgrid .now',root).forEach(x=>x.classList.remove('now'));
  if(i<0)return;$$(`.dgrid [data-i="${i}"]`,root).forEach(x=>{x.classList.add('now');const d=x.firstElementChild;if(d&&d.animate&&!RMOT.matches)d.animate([{transform:'scale(1.45)'},{transform:'scale(1)'}],{duration:180,easing:'ease-out'})});
}
// marca una nota de la rejilla con el color de su calificación
function gridMark(root,i,cls){const c=root&&$$(`.dgrid .drow:not(.dcount):not(.dlimb) [data-i="${i}"]`,root);(c||[]).forEach(x=>{x.classList.remove('ok','mid','bad','miss');if(cls)x.classList.add(cls)})}

const KITPOS={cr:[62,38,27],hh:[44,118,24],t1:[128,62,23],t2:[188,60,23],rd:[272,52,33],cb:[226,104,11],sn:[110,148,29],ft:[250,150,33],bd:[176,180,0],hf:[40,176,0]};
function kitSVG(g,extra){

  let s=`<svg class="kit ${extra||''}" viewBox="0 0 320 215" role="img" aria-label="Batería vista desde arriba: se ilumina lo que suena y quién lo toca">`;

  ['t1','t2','sn','ft'].forEach(r=>{const[x,y,rr]=KITPOS[r];s+=`<circle class="kdr${used.has(r)||r==='sn'&&used.has('rim')?' use':''}" data-r="${r}" cx="${x}" cy="${y}" r="${rr}"/>`});
  [['cr','Platillo'],['hh','Hi-hat'],['t1','Tom 1'],['t2','Tom 2'],['rd','Ride'],['sn','Tarola'],['ft','Tom de piso']].forEach(([r,n])=>{const[x,y,rr]=KITPOS[r];s+=`<text class="kpl" x="${x}" y="${y+rr+12}">${n}</text>`});

/* ---------- reproductor: cuenta de entrada, click, batería (toda, nada o sin las filas que tocas tú), banda y fin ---------- */
const GRUN={};
function grooveRun(o){
  const g=o.g,n=gSteps(g),step=60/o.bpm/g.sub,bar=g.meter*g.sub,cnt=o.count===false?0:bar*(g.meter===2?2:1);
  const st={T0:0,step,n,cnt,end:null,o};Object.assign(GRUN,st);
  let ended=false;
  seqStart(o.id||'grv',o.label||g.n,()=>step,(s,t)=>{
    if(s===0){st.T0=GRUN.T0=t+cnt*step;if(o.loops)st.end=GRUN.end=st.T0+o.loops*n*step;if(o.band)drumBandPlay(o.band,st.T0,o.bandVol);if(o.onStart)o.onStart(st)}
    if(s<cnt){if(s%g.sub===0)tick(t,s%bar===0?'acc':'beat');return}
    const k=s-cnt,i=k%n,loop=Math.floor(k/n);
    if(o.loops&&loop>=o.loops){if(!ended){ended=true;const c=ac();setTimeout(()=>{if(SEQ.id!==(o.id||'grv'))return;grooveStop();if(o.onEnd)o.onEnd(st)},Math.max(0,(t-c.currentTime+.45+outLat())*1000))}return}
    const click=typeof o.click==='function'?o.click(loop):o.click;
    if(click&&i%g.sub===0)tick(t,i%bar===0?'acc':'beat');
    const drums=typeof o.drums==='function'?o.drums(loop):o.drums;
    if(drums)for(const r in g.rows){const c=g.rows[r][i];if(c&&c!=='-'&&!(o.muted||[]).includes(r)){if(g.grace&&r==='sn'&&c==='X')for(let j=g.grace;j>0;j--)hit(r,Math.max(AC.currentTime,t-j*.018),'g');hit(r,t,c)}}
  },(s)=>{
    if(s<cnt){if(o.onCount&&s%g.sub===0)o.onCount(Math.floor(s/g.sub)%g.meter+1,s===0);return}
    const k=s-cnt,i=k%n,loop=Math.floor(k/n);if(o.loops&&loop>=o.loops)return;
    if(o.onStep)o.onStep(i,loop);
  });
  return st;
}
function grooveStop(){if(SEQ.id)seqStop();drumBandStop()}
// ilumina la rejilla y la batería al compás de lo que suena (para ejemplos y el reproductor)
function lightStep(root,g,i,muted){
  gridNow(root,i);
  for(const r in g.rows){const c=g.rows[r][i];if(c&&c!=='-')kitFlash(root,r,limbOf(g,r,i))}
  if(i%g.sub===0)beatPulse(root,i%(g.meter*g.sub)===0);
}

const LAT={Do:0,Re:2,Mi:4,Fa:5,Sol:7,La:9,Si:11},ANG={C:0,D:2,E:4,F:5,G:7,A:9,B:11};

  const r=(m[1] in LAT?LAT[m[1]]:ANG[m[1]])+accOf(m[2]);

const TAB_RX=/^\s*[eBGDAEbgda]\s*\|[-\d|hpbrx\/\\~*.() ]{4,}$/;

// datos de la página de donde se copió (afinación, capo, dificultad…): no son letra
const META_RX=/^\s*(tuning|afinaci[oó]n|capo|cejilla|key|tonalidad|difficulty|dificultad|strumming|rasgueo|author|autor|bpm|tempo)\s*:/i;

function detectKey(all){

const EN_RX=/\b(the|and|you|my|is|of|in|to|me|your|when|what|oh|i'm|it's|down|love)\b/gi;

      S.set[k]=1;if(k==='title'||k==='t')S.title=v;else if(k==='artist'||k==='a'||k==='st'||k==='subtitle')S.artist=v;else if(k==='key')S.key=chParse(v);

   (o medio compás si hay muchos) y la letra se reparte entre acordes; las sílabas antes del primer acorde

/* ---------- portadas: se buscan en el catálogo de iTunes (título + artista) y se guardan en DB.art ----------

function coverWatch(root){

  if(!X.some(Boolean))return null;

  const LY=new Uint8Array(M);TL.lines.forEach(L=>{const b=TL.ev.filter(e=>e.type==='lit'&&e.li===L.li).map(e=>e.b);if(!b.length)return;
    for(let i=Math.max(0,Math.floor(Math.min(...b)));i<=Math.min(M-1,Math.floor(Math.max(...b)));i++)LY[i]=1});

  // aquí solo los medios: la guitarra cambia justo en el cambio; el bajo a veces se adelanta con la quinta
  const mt=(j,p)=>j<0||j>=C.length?0:chordMatch(p,best.k,C[j],BS[j],0);

    const jc=F[bc],w=bt,df=(j,a,b)=>{let s=0;for(let i=a;i<b;i++)s+=mt(j+i,ce.p)-mt(j+i,pv);return s/(b-a)};

  if(V&&L0){const j0=Math.round(gridIdx(grid,T[L0.li]));let bj=-1;for(let d=0;d<=12&&bj<0;d++)for(const j of d?[j0-d,j0+d]:[j0])if(bj<0&&j>=0&&j+1<V.length&&V[j]>=.5&&V[j+1]>=.5&&((V[j-1]??0)+(V[j-2]??0)+(V[j-3]??0))/3<.4)bj=j; // antes, ~3 pulsos sin voz (no una pausa entre sílabas)

// posición (en pulsos, con fracción) de un tiempo dentro de la rejilla, y su inversa
function gridIdx(g,t){const n=g.length;if(n<2)return 0;if(t<=g[0])return(t-g[0])/(g[1]-g[0]);if(t>=g[n-1])return n-1+(t-g[n-1])/(g[n-1]-g[n-2]);

  }};
}

/* Arrangements with no percussion in Guitar receive a drum practice part here only.

for(const groove of Object.values(GROOVES))for(const beats of [3,4]){
 const part=groove[beats];if(!part)continue;
 if(!Object.keys(DRUM_MAP).some(k=>part[k]&&/[^-.]/.test(part[k]))){
  const base=beats===3?G.vals:G.rock;
  for(const [key,row] of [['k','bd'],['s','sn'],['h','hh']])part[key]=Array.from({length:beats*groove.sub},(_,i)=>i%(groove.sub/base.sub)===0?base.rows[row][Math.floor(i/(groove.sub/base.sub))]||'-':'-').join('');
 }
}
