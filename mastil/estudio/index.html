}

<script>
/* Roka audio v1: independiente de DOM, sesiones y controles de cualquier app. */
const RokaAudio = (() => {
  let context, silent;
  const rooms = new WeakMap();
  function ac() {
    if (!context) context = new (globalThis.AudioContext || globalThis.webkitAudioContext)({latencyHint:'interactive'});
    return context;
  }
  async function unlockAudio() {
    const c = ac();
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (_) {}
    // Un elemento multimedia saca a iOS del canal de sonidos de interfaz.
    if (!silent && typeof Audio !== 'undefined') {
      silent = new Audio('data:audio/wav;base64,UklGRiYAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQIAAAAAAA==');
      silent.setAttribute('playsinline','');
    }
    if (silent) silent.play().catch(() => {});
    await c.resume();
    const s = c.createBufferSource(); s.buffer = c.createBuffer(1,1,22050); s.connect(c.destination); s.start();
    return c;
  }
  function outLat(c = context) { return c ? Math.max(0, (c.outputLatency || 0) + (c.baseLatency || 0)) : 0; }
  function room(c) {
    if (rooms.has(c)) return rooms.get(c);
    const n = Math.floor(c.sampleRate * 1.4), b = c.createBuffer(2,n,c.sampleRate);
    let seed = 127;
    for (let ch=0;ch<2;ch++) {
      const d=b.getChannelData(ch);
      for(let i=0;i<n;i++) { seed=(Math.imul(seed,1664525)+1013904223)|0; d[i]=(seed/2147483648)*Math.pow(1-i/n,3.2); }
    }
    rooms.set(c,b); return b;
  }
  function reverb(c, destination, wet=.16) {
    const node=c.createConvolver(), gain=c.createGain(); node.buffer=room(c); gain.gain.value=wet;
    node.connect(gain); gain.connect(destination); return node;
  }
  return {ac,unlockAudio,outLat,room,reverb};
})();
const ac=RokaAudio.ac, unlockAudio=RokaAudio.unlockAudio, outLat=RokaAudio.outLat;

/* Manifiestos ampliables; no se copian muestras ni se cambia su licencia. */
const PACKS = {
  guitarra:{id:'guitarra',nombre:'Guitarra acústica',autor:'Nicholaus Brosowsky',licencia:'CC BY 3.0',url:'https://github.com/nbrosowsky/tonejs-instruments',credito:'tonejs-instruments. Recortes a 3 s, mono, MP3 64 kbps; afinación corregida al reproducir.',tipo:'instrumento',base:'../samples/',notas:Object.fromEntries([
    ['D2',38,2],['E2',40,-3],['Fs2',42,1],['Gs2',44,-5],['As2',46,2],['C3',48,-4],['D3',50,2],['E3',52,-3],['Fs3',54,3],['Gs3',56,-13],['As3',58,11],['C4',60,6],['D4',62,2],['E4',64,-3],['Fs4',66,17],['Gs4',68,3],['As4',70,11],['C5',72,6],['D5',74,-21]
  ].map(([n,m,cents])=>[m,{archivo:'g-'+n+'.mp3',cents}]))},
  bajo:{id:'bajo',nombre:'Bajo eléctrico',autor:'Nicholaus Brosowsky',licencia:'CC BY 3.0',url:'https://github.com/nbrosowsky/tonejs-instruments',credito:'tonejs-instruments. Recortes a 2.4 s, mono, MP3 56 kbps; afinación corregida al reproducir.',tipo:'instrumento',base:'../samples/',notas:Object.fromEntries([
    ['E1',28,7],['G1',31,-4],['As1',34,2],['Cs2',37,1],['E2',40,-3],['G2',43,0],['As2',46,2],['Cs3',49,1],['E3',52,-3],['G3',55,8]
  ].map(([n,m,cents])=>[m,{archivo:'b-'+n+'.mp3',cents}]))},
  bateria:{id:'bateria',nombre:'Black Pearl · AVL Drumkits',autor:'Glen MacArthur',licencia:'CC BY-SA 3.0',url:'https://www.bandshed.net/avldrumkits/',credito:'19 golpes. Capas de fuerza seleccionadas, recortes de 0.2–2.2 s con desvanecido, normalización, mono, MP3 64 kbps. Las muestras modificadas conservan CC BY-SA 3.0.',tipo:'bateria',base:'../samples/',golpes:Object.fromEntries('kick1 kick2 snare1 snare2 rim hat1 hat2 hatp hato ride bell crash tom ftom clap tamb cow mara click'.split(' ').map(n=>[n,'d-'+n+'.mp3']))}
};
const SAMPLE_CACHE='roka-estudio-muestras-v1';
const loadedPacks=new Map(), pendingPacks=new Map();
async function loadPack(id) {
  if(loadedPacks.has(id)) return loadedPacks.get(id);
  if(pendingPacks.has(id)) return pendingPacks.get(id);
  const manifest=PACKS[id]; if(!manifest) throw Error('Pack desconocido: '+id);
  const job=(async()=>{
    const ctx=ac(), samples={}; let cache;
    try { if(globalThis.caches) cache=await caches.open(SAMPLE_CACHE); } catch(_) {}
    const entries=Object.entries(manifest.notas||manifest.golpes);
    // Cuatro decodificaciones simultáneas como máximo en teléfonos.
    let cursor=0;
    await Promise.all(Array.from({length:4},async()=>{
      while(cursor<entries.length) {
        const [key,value]=entries[cursor++], meta=typeof value==='string'?{archivo:value,cents:0}:value;
        const url=new URL(manifest.base+meta.archivo,document.baseURI).href;
        let response=cache && await cache.match(url);
        if(!response) { response=await fetch(url); if(!response.ok) throw Error('No se pudo cargar '+meta.archivo); if(cache) await cache.put(url,response.clone()); }
        const buf=await ctx.decodeAudioData(await response.arrayBuffer());
        const d=buf.getChannelData(0), limit=Math.min(d.length,buf.sampleRate*.35|0);
        let peak=0; for(let i=0;i<limit;i++) peak=Math.max(peak,Math.abs(d[i]));
        if(peak<.00001) throw Error('Muestra vacía: '+meta.archivo);
        let onset=0; while(onset<limit && Math.abs(d[onset])<peak*.06) onset++;
        samples[key]={buf,off:Math.max(0,onset-24)/buf.sampleRate,norm:.5/peak,cents:meta.cents||0};
      }
    }));
    const pack={manifest,samples}; loadedPacks.set(id,pack); return pack;
  })();
  pendingPacks.set(id,job);
  try { return await job; } finally { pendingPacks.delete(id); }
}
function sampleVoice(sample,midiDelta,t,dur,vel,options={}) {
  const c=options.context||ac(), destination=options.destination||c.destination;
  t=Math.max(t,c.currentTime||0); // la humanización nunca debe mandar una nota antes de tiempo cero
  const src=c.createBufferSource(), gain=c.createGain(), filter=c.createBiquadFilter();
  src.buffer=sample.buf; src.playbackRate.value=2**((midiDelta-sample.cents/100)/12);
  const length=Math.max(.01,Math.min(dur,(sample.buf.duration-sample.off)/src.playbackRate.value));
  const end=t+length, release=Math.min(.07,length*.25);
  gain.gain.setValueAtTime(0,t); gain.gain.linearRampToValueAtTime(Math.max(0,vel)*sample.norm,t+.001);
  gain.gain.setValueAtTime(Math.max(0,vel)*sample.norm,Math.max(t+.001,end-release)); gain.gain.linearRampToValueAtTime(0,end);
  filter.type='lowpass'; filter.frequency.value=options.lowpass||10000;
  src.connect(filter); filter.connect(gain);
  let output=gain;
  if(c.createStereoPanner) { const p=c.createStereoPanner(); p.pan.value=options.pan||0; gain.connect(p); output=p; }
  output.connect(destination);
  if(options.wet>0 && options.reverb) { const send=c.createGain(); send.gain.value=options.wet; output.connect(send); send.connect(options.reverb); }
  src.start(t,sample.off); src.stop(end+.002); return {source:src,gain,end};
}
function playSample(pack,nota,t,dur,vel,options={}) {
  const p=typeof pack==='string'?loadedPacks.get(pack):pack;
  if(!p) throw Error('Carga el pack antes de tocarlo.');
  const keys=Object.keys(p.samples).map(Number), nearest=keys.reduce((a,b)=>Math.abs(b-nota)<Math.abs(a-nota)?b:a);
  return sampleVoice(p.samples[nearest],nota-nearest,t,dur,vel,options);
}
function drumHit(nombre,t,vel=.7,options={}) {
  const p=loadedPacks.get(options.pack||'bateria'), s=p && p.samples[nombre];
  if(!s) throw Error('Golpe no disponible: '+nombre);
  return sampleVoice(s,0,t,s.buf.duration,vel,options);
}

/* Metales y teclados CC0 (VSCO 2 Community Edition, Versilian Studios; piano y órgano de Simon Dalzell / Ivy Audio).
   Notas medidas con YIN (nota MIDI real y centésimos) en samples/cc0/manifest.json; aquí van copiadas para funcionar sin conexión. */

/* Teoría mínima compartida: nombres de notas, tonalidades y acordes por grado (I, ii, V7, ♭VII…). */
const NOTE_ES=['Do','Do♯','Re','Mi♭','Mi','Fa','Fa♯','Sol','La♭','La','Si♭','Si'];
const NOTE_US=['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const pcMod=n=>((n%12)+12)%12;
const noteName=(pc,us)=>(us?NOTE_US:NOTE_ES)[pcMod(pc)];
// «La», «Fa#», «Sib», «C», «Bb», «am» → clase de altura (y menor si termina en m)
function parseKey(s){
  if(s==null)return null;s=String(s).trim();const minor=/m(enor)?$/i.test(s)&&!/^mi$/i.test(s);s=s.replace(/\s*m(enor)?$/i,'');
  const es={do:0,re:2,mi:4,fa:5,sol:7,la:9,si:11},us={c:0,d:2,e:4,f:5,g:7,a:9,b:11};
  const m=s.toLowerCase().match(/^(do|re|mi|fa|sol|la|si|[a-g])\s*([#♯b♭])?/);if(!m)return null;
  let pc=(es[m[1]]??us[m[1]]);if(m[2]==='#'||m[2]==='♯')pc++;if(m[2]==='b'||m[2]==='♭')pc--;return{pc:pcMod(pc),minor};
}
const SCALE_MAJ=[0,2,4,5,7,9,11],SCALE_MIN=[0,2,3,5,7,8,10];
const ROMAN={i:0,ii:1,iii:2,iv:3,v:4,vi:5,vii:6};
// grado → {pc, q:'maj'|'min'|'dim'|'7'|'m7'} en la tonalidad (keyPc, menor)
function chordOf(deg,keyPc,minor){
  const m=String(deg).match(/^([♭b#♯]?)(vii|vi|v|iv|iii|ii|i)(°|7|m7|maj7)?$/i);if(!m)return{pc:keyPc,q:'maj'};
  const idx=ROMAN[m[2].toLowerCase()],sc=minor?SCALE_MIN:SCALE_MAJ;let pc=keyPc+sc[idx];
  if(m[1]==='b'||m[1]==='♭')pc--;if(m[1]==='#'||m[1]==='♯')pc++;
  const upper=m[2]===m[2].toUpperCase();let q=m[3]==='°'?'dim':upper?'maj':'min';if(m[3]==='7')q=upper?'7':'m7';if(m[3]==='m7')q='m7';if(m[3]==='maj7')q='maj7';
  return{pc:pcMod(pc),q,deg};
}
const QUAL={maj:[0,4,7],min:[0,3,7],dim:[0,3,6],'7':[0,4,7,10],m7:[0,3,7,10],maj7:[0,4,7,11]};
const chordTones=c=>QUAL[c.q]||QUAL.maj;
const chordLabel=(c,us)=>noteName(c.pc,us)+({maj:'',min:'m',dim:'°','7':'7',m7:'m7',maj7:'maj7'}[c.q]||'');
// nota MIDI de la clase pc dentro de [lo, lo+11]
const pcIn=(pc,lo)=>lo+pcMod(pc-lo);

// valida que cada línea mida un compás exacto (beats×4 celdas) y use solo símbolos conocidos
function beatCheck(b){
  const errs=[],L=b.beats*4,ok={drum:/^[Xx-]+$/,b:/^[R357OA.\-]+$/,g:/^[DdUuXx0-4.\-]+$/,x:/^[Xx.\-]+$/};
  for(const[pn,p]of Object.entries(b.parts))for(const[k,v]of Object.entries(p)){
    const re=k==='b'?ok.b:k==='g'?ok.g:k==='x'?ok.x:ok.drum;
    if(!re.test(v))errs.push(`${b.id}.${pn}.${k}: símbolo desconocido`);
    if(v.length!==L&&!(re===ok.drum&&v.length<L))errs.push(`${b.id}.${pn}.${k}: mide ${v.length}, debe medir ${L}`);
  }
  return errs;
}

/* Genera un beat en pistas separadas (batería, bajo, armonía, metales) con OfflineAudioContext y los packs grabados.
   renderBeat({id, parte:'A'|'B'|'F', compases, bpm, tono:{pc,minor}, prog:índice}) → {bateria,bajo,armonia,metales, dur, acordes}
   Los AudioBuffer resultantes se usan como clips en cualquier app (estudio, bajo, batería…). */
const DRUM_MAP={k:['kick2','kick1',.95,-.03,.04],s:['snare2','snare1',.72,.04,.22],r:['rim','rim',.6,.1,.12],l:['clap','clap',.55,-.05,.2],
  h:['hat2','hat1',.4,.3,.06],o:['hato','hato',.42,.3,.15],p:['hatp','hatp',.35,.3,.05],y:['ride','ride',.4,-.25,.14],c:['crash','crash',.5,-.2,.22],
  t:['tom','tom',.6,.15,.18],f:['ftom','ftom',.65,-.15,.18],m:['mara','mara',.38,.2,.08],a:['tamb','tamb',.38,-.2,.1],w:['cow','cow',.4,.12,.1]};
const BEAT_PACKS=b=>['bateria',b.inst.bajo||'bajo',b.inst.arm,b.inst.met?'trompeta':null,b.inst.met?'trombon':null].filter(Boolean);
async function beatPacks(b){await Promise.all(BEAT_PACKS(b).map(id=>loadPack(id)))}
function beatChords(b,tono,progIdx,compases){
  const prog=b.prog[progIdx%b.prog.length]||b.prog[0],key=tono||parseKey(b.key);
  return Array.from({length:compases},(_,i)=>chordOf(prog[i%prog.length],key.pc,key.minor));
}
// pequeñas variaciones para que no suene a máquina (siempre las mismas para el mismo beat: generador con semilla)
function rng(seed){let s=seed|0||1;return()=>((s=Math.imul(s^s>>>15,2246822507)^Math.imul(s^s>>>13,3266489909))>>>0)/4294967296}
async function renderBeat(o){

  await beatPacks(b);

  const chords=beatChords(b,o.tono,o.prog||0,comp),dur=comp*L*step+1.2,sr=44100;
  const swing=t=>t; // reservado: swing por estilo
  const make=async(fill)=>{const c=new OfflineAudioContext(2,Math.ceil(dur*sr),sr),bus=c.createGain();bus.connect(c.destination);
    const rev=RokaAudio.reverb(c,bus,.9);const any=fill(c,bus,rev);if(!any)return null;return c.startRendering()};
  const R=rng((o.seed||7)+comp*31+bpm);
  const tAt=(bar,i)=>bar*L*step+i*step+(i%4===2?b.swing*step:0);
  const lineFor=k=>Object.prototype.hasOwnProperty.call(part,k)?part[k]:null;
  // batería
  const bateria=await make((c,bus,rev)=>{let n=0;
    for(let bar=0;bar<comp;bar++)for(const k of Object.keys(DRUM_MAP)){const line=lineFor(k);if(!line)continue;const[strong,soft,lvl,pan,wet]=DRUM_MAP[k];
      for(let i=0;i<line.length;i++){const ch=line[i];if(ch!=='X'&&ch!=='x')continue;
        const hum=(bar===0&&i===0)||k==='k'&&i===0?0:(R()-.5)*.010,v=(ch==='X'?1:.62)*lvl*(.92+R()*.16);
        drumHit(ch==='X'?strong:soft,Math.max(0,tAt(bar,i)+hum),v,{context:c,destination:bus,pan,reverb:rev,wet});n++}}
    // crash de entrada en estilos con platillo
    if(o.entrada&&/rock|pop|banda|polka|norteno/.test(b.id)){drumHit('crash',0,.45,{context:c,destination:bus,pan:-.2,reverb:rev,wet:.2});n++}
    return n});
  // bajo (o tuba)

  const bajo=await make((c,bus,rev)=>{const line=lineFor('b');if(!line)return 0;let n=0;
    for(let bar=0;bar<comp;bar++){const ch=chords[bar],nx=chords[(bar+1)%comp],root=pcIn(ch.pc,bLo),tones=chordTones(ch);
      for(let i=0;i<line.length;i++){const s=line[i];if(!'R357OA'.includes(s))continue;
        let j=i+1;while(j<line.length&&line[j]==='.')j++;

  const armonia=!ap?null:await make((c,bus,rev)=>{const line=lineFor('g');if(!line)return 0;let n=0;
    for(let bar=0;bar<comp;bar++){const ch=chords[bar],tones=chordTones(ch),r=pcIn(ch.pc,ap==='guitarra'?47:48);

      const old=S.bpm;if(newBpm)S.bpm=Math.max(50,Math.min(200,Math.round(newBpm)));if(newKey)S.tono=newKey;
      const ratio=old/S.bpm;let audio=false;for(const t of S.pistas)for(const c of t.clips){if(c.fuente.beat){c.inicio*=ratio;c.dur*=ratio;BUF.delete(c.id)}else audio=true}
      E.loop.a*=ratio;E.loop.b*=ratio;stop();persist();paintLanes();await ensureBuffers(S);paintLanes();if(audio)toast('Los beats cambiaron; tus grabaciones y audios no cambian de tono ni de tempo.');
    }
    // ---------- eventos ----------
    r.addEventListener('click',async e=>{
      const tb=e.target.closest('.mtabs [data-tab]');if(tb){studio.dataset.tab=tb.dataset.tab;$$('.mtabs [data-tab]',r).forEach(x=>x.setAttribute('aria-pressed',String(x===tb)));if(tb.dataset.tab==='pistas')requestAnimationFrame(paintLanes);return}
      const go=e.target.closest('[data-go]');if(go){studio.dataset.tab=innerWidth<860?'beats':'pistas';if(innerWidth>=860)$('#libl',r).scrollTop=0;return}
      const g=e.target.closest('[data-gen]');if(g){gen=g.dataset.gen;$$('[data-gen]',r).forEach(x=>x.setAttribute('aria-pressed',String(x===g)));paintLib();return}
      const cp=e.target.closest('[data-comp]');if(cp){comp=cp.dataset.comp;$$('[data-comp]',r).forEach(x=>x.setAttribute('aria-pressed',String(x===cp)));paintLib();return}
      const bp=e.target.closest('[data-bp]');if(bp){previewBeat(bp.closest('.bcard'),bp);return}
      const ba=e.target.closest('[data-badd]');if(ba){addBeat(ba.closest('.bcard'));return}
      const d=e.target.closest('[data-dt]');if(d){dt=d.dataset.dt;paintDock();return}
      const hm=e.target.closest('[data-hm]');if(hm){const t=S.pistas.find(p=>p.id===hm.closest('[data-t]').dataset.t);t[hm.dataset.hm]=!t[hm.dataset.hm];refreshMix();persist();paintHeads();return}
      const ca=e.target.closest('[data-ca]');if(ca){const[t,c]=clipOf(sel);if(!c)return;const a=ca.dataset.ca;
        if(a==='del'){t.clips=t.clips.filter(x=>x!==c);if(c.fuente.audio&&!S.pistas.some(p=>p.clips.some(x=>x.fuente.audio===c.fuente.audio)))audDel(c.fuente.audio).catch(()=>{});sel=null}
        else if(a==='dup'){const n=Object.assign({},c,{id:uid(),inicio:c.inicio+c.dur,fuente:JSON.parse(JSON.stringify(c.fuente))});t.clips.push(n);BUF.set(n.id,BUF.get(c.id));sel=n.id}
        else if(a==='split'){const at=position();if(at<=c.inicio+.05||at>=c.inicio+c.dur-.05){toast('Pon el cursor dentro del clip para dividirlo.');return}const n=Object.assign({},c,{id:uid(),inicio:at,offset:c.offset+(at-c.inicio),dur:c.inicio+c.dur-at,fuente:JSON.parse(JSON.stringify(c.fuente))});c.dur=at-c.inicio;t.clips.push(n);BUF.set(n.id,BUF.get(c.id))}
        else if(a==='loop'){E.loop={on:true,a:c.inicio,b:c.inicio+c.dur};if(E.playing)play(S,E.loop.a)}
        persist();paintLanes();paintDock();paintLoop();return}
      const tdel=e.target.closest('[data-tdel]');if(tdel){const id=tdel.closest('[data-t]').dataset.t,t=S.pistas.find(p=>p.id===id);if(!confirm(`¿Quitar la pista «${t.nombre}» y sus clips?`))return;S.pistas=S.pistas.filter(p=>p!==t);E.chains.delete(id);persist();repaint();return}
      const st=e.target.closest('[data-s]');if(st){const a=st.dataset.s;
        if(a==='wav'){toast('Preparando la mezcla…');try{download(await exportMix(S),S.nombre.replace(/[^\wáéíóúñ -]/gi,'')+'.wav')}catch(err){toast(esc(err.message))}}
        else if(a==='stems'){toast('Preparando las pistas…');for(const t of S.pistas){if(!t.clips.length)continue;try{download(await exportMix(S,t.id),S.nombre+' - '+t.nombre+'.wav')}catch(err){}}}
        else if(a==='json')download(new Blob([sessionJSON(S)],{type:'application/json'}),S.nombre+'.roka.json');
        else if(a==='delete'){if(!confirm('¿Borrar esta sesión y sus grabaciones? No se puede deshacer.'))return;stop();for(const t of S.pistas)for(const c of t.clips)if(c.fuente.audio)audDel(c.fuente.audio).catch(()=>{});await sesDel(S.id);location.hash='#/'}
        return}
    });
    r.addEventListener('input',e=>{
      const hv=e.target.closest('[data-hv]');if(hv){const t=S.pistas.find(p=>p.id===hv.closest('[data-t]').dataset.t);t.vol=+hv.value;refreshMix();persist();return}
      const mx=e.target.closest('[data-mx]');if(mx){const k=mx.dataset.mx,v=+mx.value;if(k==='master'){S.master.vol=v}else{const t=S.pistas.find(p=>p.id===mx.closest('[data-t]').dataset.t);if(k==='vol'||k==='pan'||k==='rev')t[k]=v;else t.eq[+k.slice(2)]=v}refreshMix();persist();return}
      if(e.target.id==='roff'){DB.recOff=+e.target.value;save();$('#roffv',r).textContent=DB.recOff+' ms'}
      if(e.target.id==='sname'){S.nombre=e.target.value.slice(0,60)||'Sesión';persist()}
    });
    r.addEventListener('change',async e=>{
      if(e.target.id==='cnt'){DB.count=e.target.checked;save();return}
      if(e.target.id==='tbpm'){retune(+e.target.value,null);return}
      if(e.target.id==='tkey'||e.target.id==='tmin'){retune(null,{pc:+$('#tkey',r).value,minor:$('#tmin',r).value==='1'});return}
      const cpart=e.target.closest('[data-cpart]');if(cpart){const[t,c]=clipOf(sel);c.fuente.beat.parte=cpart.value;BUF.delete(c.id);c.nombre=c.nombre.replace(/· .*$/,'· '+(cpart.value==='F'?'relleno':cpart.value));await ensureBuffers(S);persist();paintLanes();return}
      const fi=e.target.id==='fimp'||e.target.matches('[data-imp2]');if(fi&&e.target.files[0]){const f=e.target.files[0];e.target.value='';
        toast('Importando '+esc(f.name)+'…');try{const b=await ac().decodeAudioData(await f.arrayBuffer());const aid=uid();await audPut(aid,f);const t={id:uid(),nombre:f.name.replace(/\.[^.]+$/,'').slice(0,28),rol:'audio',vol:.85,pan:0,mute:false,solo:false,eq:[0,0,0],rev:0,clips:[]};
          const c={id:uid(),inicio:snap(E.cursor),dur:b.duration,offset:0,nombre:t.nombre,fuente:{audio:aid}};t.clips.push(c);S.pistas.push(t);BUF.set(c.id,b);persist();repaint();toast('Audio importado')}catch(err){toast('No pude leer ese archivo. Prueba con MP3, M4A o WAV.')}}
    });
    // transporte
    $('#tplay',r).onclick=()=>{if(E.rec){finishRec();return}if(E.playing)stop();else play(S,E.cursor);paintTransport()};
    $('#tstop',r).onclick=()=>{if(E.rec){finishRec();return}stop();E.cursor=E.loop.on?E.loop.a:0;paintTransport()};
    $('#trec',r).onclick=async()=>{if(E.rec){finishRec();return}if(await recStart(S))paintTransport()};
    $('#tloop',r).onclick=()=>{E.loop.on=!E.loop.on;if(E.loop.b<=E.loop.a)E.loop.b=E.loop.a+barDur(S)*4;paintLoop();if(E.playing)play(S,position())};
    $('#tmet',r).onclick=e=>{DB.metro=!DB.metro;save();e.currentTarget.setAttribute('aria-pressed',String(DB.metro));if(E.playing)play(S,position())};
    $('#zin',r).onclick=()=>{pps=Math.min(260,pps*1.4);paintLanes()};$('#zout',r).onclick=()=>{pps=Math.max(12,pps/1.4);paintLanes()};
    async function finishRec(){const res=await recStop(S);paintTransport();if(!res){toast('La grabación fue muy corta.');return}
      const aid=uid();await audPut(aid,wavBlob(res.buf));const n=S.pistas.filter(p=>p.rol==='voz').length+1;const t={id:uid(),nombre:'Grabación '+n,rol:'voz',vol:.9,pan:0,mute:false,solo:false,eq:[0,0,0],rev:.18,clips:[]};
      const c={id:uid(),inicio:res.start,dur:res.buf.duration,offset:0,nombre:'Grabación '+n,fuente:{audio:aid}};t.clips.push(c);S.pistas.push(t);BUF.set(c.id,res.buf);sel=c.id;persist();repaint();toast('Grabación guardada')}
    // regla: mover el cursor (Mayús + arrastrar = región de ciclo)
    $('#ruler',r).addEventListener('pointerdown',e=>{const x0=e.clientX-lin.getBoundingClientRect().left,t0=snap(x0/pps);
      if(e.shiftKey){const mv=ev=>{const t1=snap((ev.clientX-lin.getBoundingClientRect().left)/pps);E.loop={on:true,a:Math.min(t0,t1),b:Math.max(t0,t1)+.001};paintLoop()};const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up)};addEventListener('pointermove',mv);addEventListener('pointerup',up);return}
      E.cursor=x0/pps;if(E.playing)play(S,E.cursor)});
    // clips: mover y recortar (se ajustan a medio tiempo)
    rows.addEventListener('pointerdown',e=>{const el=e.target.closest('.clip');if(!el)return;const[t,c]=clipOf(el.dataset.c);if(!c)return;
      sel=c.id;$$('.clip.sel',rows).forEach(x=>x.classList.remove('sel'));el.classList.add('sel');paintDock();
      const mode=e.target.classList.contains('hl')?'l':e.target.classList.contains('hr')?'r':'m',x0=e.clientX,o={inicio:c.inicio,dur:c.dur,offset:c.offset},b=BUF.get(c.id),maxD=b?b.duration:1e9;el.setPointerCapture(e.pointerId);let moved=false;
      const mv=ev=>{const dx=(ev.clientX-x0)/pps;if(Math.abs(ev.clientX-x0)>3)moved=true;
        if(mode==='m')c.inicio=snap(o.inicio+dx);
        else if(mode==='l'){let ni=snap(o.inicio+dx);ni=Math.max(o.inicio-o.offset,Math.min(o.inicio+o.dur-.1,ni));c.offset=o.offset+(ni-o.inicio);c.dur=o.dur-(ni-o.inicio);c.inicio=ni}
        else{let ne=snap(o.inicio+o.dur+dx);ne=Math.max(o.inicio+.1,Math.min(o.inicio+(maxD-o.offset),ne));c.dur=ne-o.inicio}
        el.style.left=c.inicio*pps+'px';el.style.width=Math.max(8,c.dur*pps)+'px';if(mode!=='m')drawClip(el)};
      const up=()=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);if(moved){persist();paintDock();if(mode!=='m')drawClip(el)}};
      el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up)});
    // desplazamiento vertical sincronizado de cabeceras y carriles
    lanes.addEventListener('scroll',()=>{heads.parentNode.scrollTop=lanes.scrollTop});
    const key=e=>{if(e.target.matches('input,select,textarea'))return;if(e.code==='Space'){e.preventDefault();$('#tplay',r).click()}else if(e.key==='r'||e.key==='R')$('#trec',r).click();else if((e.key==='Delete'||e.key==='Backspace')&&sel){const b=$('[data-ca="del"]',r);if(b)b.click()}};
    document.addEventListener('keydown',key);
    let rz=0;const onRz=()=>{clearTimeout(rz);rz=setTimeout(paintLanes,200)};addEventListener('resize',onRz);
    const onT=()=>paintTransport();document.addEventListener('transport',onT);
    // cursor, reloj, medidores
    const meterBuf=new Uint8Array(512);const lvl=an=>{an.getByteTimeDomainData(meterBuf);let m=0;for(const v of meterBuf)m=Math.max(m,Math.abs(v-128));return m/128};
    const frame=()=>{if(!alive)return;const p=position();$('#ph',r).style.left=p*pps+'px';$('#clock',r).textContent=fmtT(p);
      if(E.playing){const x=p*pps;if(x>lanes.scrollLeft+lanes.clientWidth-40||x<lanes.scrollLeft)lanes.scrollLeft=Math.max(0,x-60)}
      if(dt==='mezcla'&&E.master){for(const t of S.pistas){const ch=E.chains.get(t.id),el=$(`[data-meter="${t.id}"]`,r);if(ch&&el)el.style.width=Math.min(100,lvl(ch.an)*140)+'%'}const mm=$('[data-meter="master"]',r);if(mm)mm.style.width=Math.min(100,lvl(E.master.an)*140)+'%'}
      raf=requestAnimationFrame(frame)};frame();
    return()=>{alive=false;cancelAnimationFrame(raf);removeEventListener('resize',onRz);document.removeEventListener('keydown',key);document.removeEventListener('transport',onT);if(E.rec)recStop(S);stop(true);if(preview)preview.forEach(s=>{try{s.stop()}catch(e){}});E.chains.clear();clearTimeout(saveT);S.editada=Date.now();sesPut(S).catch(()=>{})};
  }};
}

/* ---------- rutas: #/ sesiones · #/s/<id> estudio · #/licencias · #/nueva?tono=La&bpm=92&genero=cumbia&desde=guitarra ---------- */
let UNMOUNT=null;
async function route(){
  const raw=location.hash.replace(/^#\/?/,''),[path,qs]=raw.split('?'),p=path.split('/'),q=new URLSearchParams(qs||'');
  if(p[0]==='nueva'){const k=parseKey(q.get('tono')),S=newSession({tono:k,bpm:+q.get('bpm')||null,genero:q.get('genero'),desde:q.get('desde')});await sesPut(S);location.replace('#/s/'+S.id+'?beats=1'+(S.genero?'&genero='+S.genero:''));return}
  const v=p[0]==='s'&&p[1]?viewStudio(p[1],q):p[0]==='licencias'?viewLicenses():viewHome();
  if(UNMOUNT){try{UNMOUNT()}catch(e){}UNMOUNT=null}
  const old=$('#app'),pg=old.cloneNode(false);old.replaceWith(pg);pg.innerHTML=v.html;
  document.title=p[0]==='s'?'Estudio · Om Estudio':'Om Estudio';
  if(v.mount)UNMOUNT=(await v.mount(pg))||null;
  if(q.get('genero')){const b=$(`[data-gen="${(beatById(q.get('genero'))||{}).gen}"]`,pg);if(b)b.click()}
}
document.body.insertAdjacentHTML('afterbegin','<div id="app"></div>');
window.addEventListener('hashchange',route);route();
if('serviceWorker' in navigator&&location.protocol!=='file:')addEventListener('load',()=>{navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{const chk=()=>reg.update().catch(()=>{});document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk()})}).catch(()=>{})});


</script>
