 E({id:'1d',t:'Juego: encuentra la nota',min:2,steps:['Abre el juego con el botón de abajo (trastes 0 a 5, solo naturales).','Toca en el mástil la nota que aparece arriba, tantas veces como puedas en un minuto.','Juégalo de nuevo y trata de superar tu récord.'],goal:'Logras 15 aciertos en un minuto.',game:{mode:'find',range:5,str:0,nat:1}}),
 E({id:'1e',t:'Una nota en las seis cuerdas',min:4,bpm:50,steps:['Elige Sol y tócalo en la cuerda 6 (traste 3).','Usa octavas y la cuerda al aire para encontrarlo en las seis cuerdas, de grave a agudo: un toque por pulso.','Repite con La, Do y Re.','Di en voz alta la cuerda y el traste de cada una.'],goal:'Encuentras cualquier nota en las seis cuerdas en menos de 15 segundos.',fig:pts([[6,3,'Sol','root'],[5,10,'Sol'],[4,5,'Sol'],[3,0,'Sol'],[2,8,'Sol'],[1,3,'Sol']])}),
 {box:'Errores comunes',ul:['Aprender las notas solo cuerda por cuerda: usa las octavas para saltar de una cuerda a otra.','Olvidar que el traste 12 repite la cuerda al aire.','Creer que entre Mi y Fa o entre Si y Do falta un sostenido: no existe.','Contar siempre desde el traste 0: apóyate en las referencias de los trastes 5, 7 y 12.']},
 {trick:['Las cuerdas 6 y 1 son las dos Mi: aprende una y tendrás las dos.','Traste 12 = la cuerda al aire, una octava arriba.','Mi–Fa y Si–Do: semitono natural, sin sostenido en medio.','Octava: cuerdas 6→4 y 5→3 suben 2 trastes; cuerdas 4→2 y 3→1 suben 3.','Do Re Mi Fa Sol La Si = C D E F G A B (cifrado americano).']}]},
{id:2,part:1,title:'Intervalos: la distancia es la emoción',sub:'Semitonos, formas y carácter',
 lead:'Cada distancia entre dos notas suena distinto. Aprende a verla y a oírla.',
 blocks:[
 {p:'Un intervalo es la distancia entre dos notas, medida en <span class="hl">semitonos</span> (un traste). Cada distancia tiene un carácter reconocible: la tercera menor suena sombría, la mayor luminosa, la quinta justa abierta y estable.'},
 {w:'intervals'},
 E({id:'2a',t:'Terceras sobre una cuerda',min:3,bpm:60,steps:['Toca Do en la cuerda 5, traste 3.','Toca la tercera menor tres trastes arriba (traste 6, Mi♭) y vuelve a Do.','Toca la tercera mayor cuatro trastes arriba (traste 7, Mi) y vuelve a Do.','Alterna menor y mayor, un toque por pulso, y nombra en voz alta el carácter: sombría o luminosa.'],goal:'Distingues las dos terceras con los ojos cerrados.',fig:pts([[5,3,'Do','root'],[5,6,'♭3'],[5,7,'3']])}),
 {p:'No hace falta memorizar tablas: aprende la forma sobre el mástil. En la misma cuerda, +3 trastes es una tercera menor y +4 una mayor. En la cuerda siguiente, el mismo traste es una cuarta justa y +2 trastes una quinta justa. Entre las cuerdas 3 y 2 hay un traste menos de distancia y todo se corre un traste.'},
 E({id:'2b',t:'Quintas: el power chord',min:4,bpm:80,steps:['Raíz en la cuerda 6 y quinta en la cuerda 5, dos trastes arriba.','Toca Mi5 (0–2), Sol5 (3–5), La5 (5–7) y Do5 (8–10): dos golpes por acorde.','Añade la octava en la cuerda 4, mismo traste que la quinta.','Repite con la raíz en la cuerda 5: Re5, Mi5 y Sol5.'],goal:'Cambias entre los cuatro power chords sin perder un golpe.',fig:pts([[6,3,'1','root'],[5,5,'5'],[4,5,'8']],{to:7})}),
 E({id:'2c',t:'Cuartas apiladas',min:2,steps:['Toca el traste 5 de las cuerdas 6, 5, 4 y 3: cada nota es una cuarta justa sobre la anterior.','En la cuerda 2 usa el traste 6 para mantener la cuarta (la excepción de la cuerda Si).','Escucha qué abierto suena: así se afina la guitarra.'],goal:'Explicas por qué la cuerda 2 se corre un traste.',fig:pts([[6,5],[5,5],[4,5],[3,5],[2,6]],{to:8})}),
 E({id:'2d',t:'Canta antes de tocar',min:3,steps:['Toca una raíz y, sin tocar nada más, canta la tercera mayor.','Comprueba tocándola: cuatro trastes arriba.','Repite con la quinta, la cuarta y la octava.','Usa el diagrama de intervalos de arriba para escuchar los que dudes.'],goal:'Aciertas cuatro de cinco intervalos cantados.'}),
 {box:'Errores comunes',ul:['Contar el traste de la raíz como uno: la raíz es el cero.','Confundir cuarta aumentada y quinta disminuida: suenan igual (tritono) y cambian de nombre según el contexto.','Olvidar la excepción entre las cuerdas 3 y 2.','Aprender solo la forma o solo el oído: combina ambos.']},
 {sec:'Referencias para el oído',p:'Algunas melodías conocidas ayudan a reconocer distancias. El inicio de «Estrellita» (Do–Do–Sol–Sol) salta una quinta justa. El inicio de «Cumpleaños feliz» sube una segunda mayor y después una cuarta justa. Busca las tuyas y asócialas a cada intervalo.'},
 {trick:['3ª menor = 3 semitonos · 3ª mayor = 4 · 4ª justa = 5 · 5ª justa = 7 · octava = 12.','Misma cuerda: +3 trastes → 3ª menor; +4 → 3ª mayor.','Cuerda siguiente: mismo traste → 4ª; +2 trastes → 5ª (cuerdas 3 y 2: un traste más).','Oído: menor = sombrío, mayor = luminoso, tritono = inestable.']}]},
{id:3,part:2,title:'Escalas y tonalidades: la regla madre',sub:'Una fórmula para las doce tonalidades',
 lead:'Una receta de distancias que funciona desde cualquier nota.',
 blocks:[
 {p:'Una escala mayor es una receta: <span class="hl">tono, tono, semitono, tono, tono, tono, semitono</span>. Esa fórmula funciona desde cualquier nota, y por eso una sola forma sirve para las doce tonalidades.'},
 {w:'scale'},
 E({id:'3a',t:'Do mayor en una sola cuerda',min:3,bpm:60,steps:['Empieza en la cuerda 5, traste 3 (Do).','Sube aplicando la fórmula: trastes 3, 5, 7, 8, 10, 12, 14 y 15.','Di el grado de cada nota (1 a 8) mientras la tocas.','Marca con más fuerza los dos semitonos: 3–4 y 7–8.'],goal:'Tocas la escala en una cuerda diciendo los grados, de ida y vuelta.',fig:pts([[5,3,'1','root'],[5,5,'2'],[5,7,'3'],[5,8,'4'],[5,10,'5'],[5,12,'6'],[5,14,'7'],[5,15,'8','root']],{to:15})}),
 E({id:'3b',t:'La forma de una octava',min:4,bpm:60,steps:['Sol mayor desde la cuerda 6: trastes 3, 5 y 7.','Cuerda 5: trastes 3, 5 y 7.','Cuerda 4: trastes 4 y 5 (Fa♯ y Sol).','Sube y baja una nota por pulso; luego dos notas por pulso; sube 5 bpm cada vez que salga limpio.'],goal:'Tocas la forma a corcheas a 80 bpm sin errores.',fig:pts([[6,3,'1','root'],[6,5,'2'],[6,7,'3'],[5,3,'4'],[5,5,'5'],[5,7,'6'],[4,4,'7'],[4,5,'8','root']],{to:8})}),
 {p:'Una tonalidad es la escala más los acordes que nacen de ella. Tocar «en Sol mayor» significa que todas las notas y acordes salen de esa escala, con Sol como centro de reposo. Cada nota recibe un número, su <b>grado</b>: así puedes trasladar cualquier idea a otra tonalidad sin pensar en nombres.'},
 E({id:'3c',t:'Mueve la forma',min:4,bpm:70,steps:['Toca la misma forma empezando en el traste 5: es La mayor.','Ahora desde el traste 8: Do mayor.','Ahora desde el traste 1: Fa mayor.','Antes de cada repetición, di el nombre de la tónica.'],goal:'Tocas la escala mayor en cuatro tonalidades con una sola forma.',fig:pts([[6,5,'1','root'],[6,7,'2'],[6,9,'3'],[5,5,'4'],[5,7,'5'],[5,9,'6'],[4,6,'7'],[4,7,'8','root']],{to:10})}),
 E({id:'3d',t:'Toca por grados',min:3,steps:['Con la forma de Sol toca 1–3–5–8 y de regreso.','Toca 1–2–3–1 y 5–4–3–2–1.','Mueve la forma a La mayor y repite los mismos números.'],goal:'Los mismos números suenan igual en las dos tonalidades.',fig:pts([[6,3,'1','root'],[6,7,'3'],[5,5,'5'],[4,5,'8','root'],[5,5,'5'],[6,7,'3'],[6,3,'1','root'],[6,5,'2'],[6,7,'3'],[6,3,'1','root']],{to:8})}),
 E({id:'3e',t:'Transporta una melodía',min:5,steps:['«Cumpleaños feliz» en grados: 5 5 6 5 1 7 · 5 5 6 5 2 1 · 5 5 5 3 1 7 6 · 4 4 3 1 2 1 (el tercer 5 es una octava arriba).','Tócala en Do mayor (5 = Sol).','Tócala en Sol mayor y en La mayor usando la forma de una octava.'],goal:'Tocas la melodía en tres tonalidades sin escribir los nombres de las notas.'}),
 {box:'Errores comunes',ul:['Memorizar nombres de notas sin los grados: no podrás transportar.','Olvidar que los semitonos caen entre el 3 y el 4, y entre el 7 y el 8.','Confundir tonalidad con escala: la tonalidad incluye acordes y un centro.','Aprender doce formas distintas: es una sola forma que se mueve.']},
 {sec:'Transportar sin sufrir',p:'Si una canción está en Do y tu voz alcanza mejor en Re, sube todo un tono: cada grado se mueve dos semitonos. Como los grados no cambian, la melodía y las relaciones entre acordes se conservan.'},
 {trick:['Fórmula: T T S T T T S.','Grados clave: 1 tónica, 4 subdominante, 5 dominante.','Cada tonalidad tiene sostenidos o bemoles fijos (lección 9).','Para transportar, mueve la forma y conserva los grados.']}]},
{id:4,part:2,title:'Los modos, sin misticismo',sub:'Mismas notas, otra casa',
 lead:'Un modo es la escala mayor vista desde otra de sus notas.',
 blocks:[
 {p:'Un modo no es una escala nueva: es la misma escala mayor empezando por otro grado. Re dórico usa exactamente las notas de Do mayor, pero <span class="hl">Re es el centro de reposo</span>.'},
 {w:'mode'},
 E({id:'4a',t:'Mapa de modos en Do',min:4,bpm:60,steps:['Toca la escala de Do mayor siete veces, empezando cada vez en una nota distinta: Do, Re, Mi, Fa, Sol, La y Si.','Antes de cada vuelta di el nombre del modo: jónico, dórico, frigio, lidio, mixolidio, eólico, locrio.','Termina siempre en la nota donde empezaste.'],goal:'Nombras los siete modos en orden sin mirar.',fig:pts([[5,3,'Do','root'],[5,5,'Re'],[4,2,'Mi'],[4,3,'Fa'],[4,5,'Sol'],[3,2,'La'],[3,4,'Si'],[3,5,'Do','root']],{to:6})}),
 {p:'Lo que cambia es el carácter. Compara cada modo con la escala mayor: una o dos notas se alteran y eso basta para cambiar el color. Para tocarlo bien, apóyate en un acorde que fije el centro: la pista lo hace por ti.'},
 E({id:'4b',t:'Re dórico sobre su acorde',min:4,steps:['Inicia la pista: alterna Re menor y Sol mayor.','Toca solo notas de Do mayor, pero empieza y termina tus frases en Re.','Acentúa la sexta (Si): es la nota que hace dórico al modo.'],goal:'Tus frases suenan menores, pero cálidas, y terminan en Re.',track:{k:2,p:'dorico',st:'balada',bpm:72}}),
 E({id:'4c',t:'Sol mixolidio con sabor a rock',min:4,steps:['Inicia la pista: Sol – Fa – Do – Sol.','Toca Sol mayor, pero cambia el Fa♯ por Fa natural.','Busca el Fa sobre el acorde de Fa y escucha cómo encaja.'],goal:'Escuchas la diferencia entre Fa♯ (mayor) y Fa (mixolidio).',track:{k:1,p:'mixo',st:'rock',bpm:96}}),
 E({id:'4d',t:'Fa lidio flotante',min:3,steps:['Inicia la pista: Fa mayor y Sol mayor.','Toca las notas de Do mayor centradas en Fa.','Detente en Si (la cuarta aumentada) sobre el acorde de Fa y escucha el color.'],goal:'Reconoces el sonido brillante del lidio.',track:{k:11,p:'lidio',st:'balada',bpm:70}}),
 {box:'Qué modo sobre qué acorde (tonalidad mayor)',ul:['I → jónico · ii → dórico · iii → frigio','IV → lidio · V → mixolidio','vi → eólico · vii° → locrio']},
 {box:'Errores comunes',ul:['Creer que cada modo exige notas nuevas: son las de la mayor.','Tocar el modo sin un acorde que fije el centro: sonará como la mayor.','Memorizar siete formas por tonalidad: aprende una escala y mueve el centro.','Usar el locrio como centro estable.']},
 {trick:['Modo = escala mayor desde otro grado: 1 jónico, 2 dórico, 3 frigio, 4 lidio, 5 mixolidio, 6 eólico, 7 locrio.','Dórico = menor con 6ª mayor.','Mixolidio = mayor con 7ª menor.','Lidio = mayor con 4ª aumentada.','No cambias de notas: cambias de centro.']}]},
{id:5,part:2,title:'Acordes: de dónde salen realmente',sub:'Terceras apiladas y escala armonizada',
 lead:'Un acorde es una pila de terceras sacada de la escala.',
 blocks:[
 {p:'Toma una nota, salta una de la escala, toma la siguiente, salta otra y toma la siguiente: <span class="hl">raíz, tercera y quinta</span>. Si la tercera es mayor, el acorde es mayor; si es menor, el acorde es menor.'},
 {w:'chord',types:['maj','min','dim','aug']},
 E({id:'5a',t:'Tríadas en tres cuerdas',min:4,bpm:60,steps:['Do mayor en las cuerdas 3, 2 y 1: trastes 5, 5 y 3.','Baja un traste la nota de la cuerda 2: ahora es Do menor (la tercera bajó).','Mueve la forma al traste 7 (Re) y al traste 2 (La).','Alterna mayor y menor cuatro pulsos cada una.'],goal:'Conviertes cualquier tríada mayor en menor sin pensarlo.',fig:pts([[3,5,'1','root'],[2,5,'3'],[1,3,'5']],{to:7})}),
 E({id:'5b',t:'Encuentra la tercera',min:3,steps:['En los acordes abiertos de Mi, La y Re, localiza la nota que es tercera.','Bájala un semitono para convertirlos en Mi menor, La menor y Re menor.','Escucha el cambio de luminoso a sombrío.'],goal:'Señalas la tercera de los tres acordes.',fig:chords(ch('E','Em','A','Am','D','Dm'))}),
 {w:'harm'},
 {p:'Al armar un acorde sobre cada grado de la escala mayor, las notas ya vienen dadas: mayores en I, IV y V; menores en ii, iii y vi; disminuido en vii. Por eso los acordes de una canción se llevan bien entre sí.'},
 E({id:'5c',t:'La escala armonizada',min:5,bpm:70,steps:['Toca en orden: Do, Rem, Mim, Fa, Sol, Lam y Si° (x2343x).','Cuatro golpes por acorde.','Di el grado en voz alta mientras tocas: I, ii, iii, IV, V, vi, vii°.','Repite en Sol mayor usando la tabla de arriba.'],goal:'Tocas los siete acordes de dos tonalidades nombrando los grados.',fig:chords(ch('C','Dm','Em','F','G','Am','Bdim'))}),
 E({id:'5d',t:'Arpegios 1–3–5',min:3,bpm:60,steps:['Arpegio de Do: Do (5/3), Mi (4/2), Sol (3/0), Do (2/1), Mi (1/0).','Toca nota por nota, una por pulso, de ida y vuelta.','Haz lo mismo con La menor.'],goal:'Escuchas cada nota del acorde por separado.',fig:pts([[5,3,'1','root'],[4,2,'3'],[3,0,'5'],[2,1,'1','root'],[1,0,'3']],{to:5})}),
 {box:'Errores comunes',ul:['Creer que mayor y menor se distinguen por la raíz: se distinguen por la tercera.','Olvidar que el acorde del grado vii es disminuido.','Memorizar acordes por tonalidad en vez de armarlos con la regla.','Omitir la tercera: es la nota que define el carácter.']},
 {sec:'Inversiones',p:'El mismo acorde puede tener la tercera o la quinta como nota más grave. Las notas son las mismas; cambia cuál suena abajo. En guitarra aparecen solas al tocar un acorde en distintas zonas del mástil (lección 7).'},
 {trick:['Mayor 1–3–5 · menor 1–♭3–5.','Disminuido 1–♭3–♭5 · aumentado 1–3–♯5.','Escala mayor: I ii iii IV V vi vii°.','Mayores: I, IV, V. Menores: ii, iii, vi.']}]},
{id:6,part:2,title:'Séptimas, tensiones y color',sub:'Cuatro notas y más',
 lead:'Añade una nota y cambia el color sin cambiar la función.',
 blocks:[
 {p:'Añadir una cuarta nota a la pila de terceras da una <span class="hl">séptima</span>. Con séptima mayor el acorde suena suave y nostálgico (maj7); con séptima menor sobre un acorde mayor aparece el dominante (7), que pide resolver.'},
 {w:'chord',types:['maj7','dom7','m7','m7b5','sus2','sus4','add9','dom9'],init:{k:0,t:'dom7'}},
 E({id:'6a',t:'De tríada a séptima',min:4,bpm:60,steps:['Toca Do (x32010), luego Do maj7 (x32000), luego Do7 (x32310). Cuatro golpes cada uno.','Escucha qué nota cambia: Do, Si, Si♭.','Toca La menor (x02210) y La m7 (x02010).'],goal:'Describes con tus palabras el color de cada acorde.',fig:chords(ch('C','Cmaj7','C7','Am','Am7'))}),
 E({id:'6b',t:'ii – V – I con séptimas',min:4,steps:['Inicia la pista: Rem7 – Sol7 – Do maj7.','Rasguea junto a la pista: Rem7 (xx0211), Sol7 (320001), Do maj7 (x32000).','Escucha la séptima de cada acorde bajar un semitono al siguiente: Do → Si y Fa → Mi.'],goal:'Cambias de acorde a tiempo durante cuatro vueltas.',track:{k:0,p:'iivi',st:'balada',bpm:70}}),
 {p:'Las tensiones (9, 11, 13) son notas de la escala una octava arriba: la 9 es la 2, la 11 es la 4 y la 13 es la 6. Dan color sin cambiar la función del acorde.'},
 {w:'harm',init:{k:0,sev:1}},
 E({id:'6c',t:'Acordes sus que resuelven',min:3,bpm:70,steps:['Re sus4 (xx0233) dos pulsos y Re (xx0232) dos pulsos.','La sus2 (x02200) y La (x02220).','Combina: Re sus4 – Re – La sus2 – La.'],goal:'Sientes que el sus pide volver al acorde normal.',fig:chords(ch('Dsus4','D','Asus2','A'),2)}),
 E({id:'6d',t:'Las séptimas de la escala',min:5,bpm:70,steps:['Toca en orden: Do maj7, Rem7, Mim7, Fa maj7, Sol7, Lam7 y Si m7♭5 (x2323x).','Cuatro golpes por acorde.','Señala cuál es el único dominante (Sol7).'],goal:'Tocas los siete acordes con séptima sin detenerte.',fig:chords(ch('Cmaj7','Dm7','Em7','Fmaj7','G7','Am7','Bm7b5'))}),
 {box:'Errores comunes',ul:['Poner séptima mayor en un dominante: el dominante lleva ♭7.','Creer que m7♭5 es raro: es el acorde del grado vii.','Cargar tensiones en todos los acordes: úsalas con intención.','Confundir sus con add: sus quita la tercera, add la conserva.']},
 {sec:'La séptima baja, la tercera recibe',p:'En ii–V–I, la séptima de cada acorde baja un semitono hasta la tercera del siguiente: Do (7ª de Rem7) baja a Si (3ª de Sol7) y Fa (7ª de Sol7) baja a Mi (3ª de Do maj7). Por eso esta cadencia suena tan natural.'},
 {trick:['maj7: suave · 7: tensión · m7: cálido · m7♭5: inestable.','9 = 2, 11 = 4, 13 = 6.','sus sustituye la 3ª por la 2ª o la 4ª.','El 7 dominante lleva un tritono entre su 3ª y su 7ª.']}]},
{id:7,part:3,title:'CAGED: el mástil completo sobre una idea',sub:'Cinco formas que cubren todo el cuello',
 lead:'Cinco acordes abiertos convertidos en formas móviles.',
 blocks:[
 {p:'Los cinco acordes abiertos más comunes (<b>C, A, G, E y D</b>) son cinco formas. Al desplazarlas con cejilla sirven para cualquier tonalidad. Juntas cubren todo el mástil y <span class="hl">siempre aparecen en el mismo orden</span>: C, A, G, E, D y vuelta a empezar.'},
 {w:'caged'},
 E({id:'7a',t:'Las cinco formas de Do',min:5,bpm:60,steps:['Abierta: forma de C (x32010).','Traste 3: forma de A (x35553).','Traste 5: forma de G (8–7–5–5–5–8, toca solo las cuerdas 4, 3 y 2 si te cuesta).','Traste 8: forma de E (8–10–10–9–8–8). Traste 10: forma de D (xx10–12–13–12).','Cuatro golpes por forma y di dónde está la raíz.'],goal:'Recorres las cinco formas de Do sin mirar el diagrama.',fig:chords([['C · forma C',[null,3,2,0,1,0]],['C · forma A',[null,3,5,5,5,3]],['C · forma G',[8,7,5,5,5,8]],['C · forma E',[8,10,10,9,8,8]],['C · forma D',[null,null,10,12,13,12]]])}),
 E({id:'7b',t:'La raíz primero',min:3,steps:['Para Re, encuentra sus raíces en las cuerdas 6, 5 y 4.','Arma alrededor de cada raíz la forma que le corresponde: E (cuerda 6), A o C (cuerda 5), D (cuerda 4).','Repite con Sol.'],goal:'Construyes tres formas de un acorde partiendo de la raíz.'}),
 {p:'Elige una tonalidad y una forma: la raíz (en rojo) marca el centro del acorde en cada zona. Esa misma zona sirve después para tocar la escala y el arpegio.'},
 E({id:'7c',t:'I – IV – V en una sola zona',min:4,bpm:80,steps:['En Sol: Sol (forma E, traste 3), Do (forma A, traste 3) y Re (forma A, traste 5).','Cuatro golpes cada uno, sin mover la mano más de dos trastes.','Repite en La: traste 5 y 7.'],goal:'Cambias de acorde sin saltar por el mástil.',fig:chords([['G · forma E',[3,5,5,4,3,3]],['C · forma A',[null,3,5,5,5,3]],['D · forma A',[null,5,7,7,7,5]],['G · forma E',[3,5,5,4,3,3]]])}),
 E({id:'7d',t:'Escala dentro del acorde',min:4,bpm:60,steps:['Toca La con la forma de E en el traste 5.','Sin mover la mano, toca la pentatónica de La menor, caja 1.','Observa que las notas del acorde están dentro de la caja.'],goal:'Pasas del acorde a la escala sin cambiar de zona.',fig:boxFig(3,'min',1,10)}),
 {box:'Errores comunes',ul:['Tocar la forma sin identificar la raíz: pierdes el centro.','Aprender CAGED solo como acordes, sin relacionarlo con escalas.','Pensar que hay una forma mejor: todas son válidas.','Saltarte el orden: las formas siempre se enlazan C–A–G–E–D.']},
 {trick:['Orden sobre el mástil: C – A – G – E – D.','Raíz por forma: C→cuerda 5 · A→5 · G→6 · E→6 · D→4.','La cejilla mueve la forma: el traste indica la distancia a la forma abierta.','Reconoce la forma y sabrás qué escala va en esa zona.']}]},
{id:8,part:3,title:'Progresiones: por qué las canciones funcionan',sub:'Funciones y números romanos',

async function cloudInit(){
  if(!cloudOn()||CLOUD.app)return;
  try{
    const [A,U,F]=await Promise.all([import(FBU('app')),import(FBU('auth')),import(FBU('firestore'))]);

    if(window.__FB_EMU){M.connectAuthEmulator(CLOUD.auth,window.__FB_EMU.auth,{disableWarnings:true});M.connectFirestoreEmulator(CLOUD.db,window.__FB_EMU.host,window.__FB_EMU.port)}

function mergeVal(a,b){
  if(a==null)return b;if(b==null)return a;
  if(typeof a==='number'&&typeof b==='number')return Math.max(a,b);
  if(typeof a==='boolean'||typeof b==='boolean')return!!(a||b);
  if(Array.isArray(a)||Array.isArray(b))return(Array.isArray(a)&&a.length>=(Array.isArray(b)?b.length:0))?a:b;
  if(typeof a==='object'&&typeof b==='object'){const o=Object.assign({},a);for(const k in b)o[k]=mergeVal(a[k],b[k]);return o}
  return a;
}

  if((!DB.songs||!DB.songs.length)&&Array.isArray(d.songs))DB.songs=d.songs;
  if(DB.onb==null&&d.onb)DB.onb=d.onb;
  CLOUD.group=d.group||null;persist();await cloudPush(true);
}

async function cloudCreateGroup(name){
  const M=CLOUD.M;let code=genCode();for(let i=0;i<4;i++){const s=await M.getDoc(M.doc(CLOUD.db,'groups',code));if(!s.exists())break;code=genCode()}

async function cloudJoin(code){
  const M=CLOUD.M;code=code.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length!==6)throw{code:'x',msg:'El código tiene 6 letras y números.'};
  const s=await M.getDoc(M.doc(CLOUD.db,'groups',code));if(!s.exists())throw{code:'x',msg:'Ese código no existe. Revísalo con tu maestro.'};
  if(CLOUD.group&&CLOUD.group!==code)await cloudLeave(true);
  CLOUD.group=code;await cloudPush(true);return s.data().name;
}

async function cloudMyGroups(){
  const M=CLOUD.M,q=M.query(M.collection(CLOUD.db,'groups'),M.where('owner','==',CLOUD.user.uid)),gs=await M.getDocs(q),out=[];
  for(const g of gs.docs){const ms=await M.getDocs(M.collection(CLOUD.db,'groups',g.id,'members'));out.push({code:g.id,name:g.data().name,members:ms.docs.map(m=>Object.assign({uid:m.id},m.data()))})}
  return out.sort((a,b)=>a.name.localeCompare(b.name));
}

function cloudMount(r){
  const err=t=>{const e=$('#clerr',r);if(e){e.hidden=!t;e.textContent=t||''}};
  const busy=async(fn)=>{if(CLOUD.busy)return;CLOUD.busy=true;err('');try{await fn()}catch(e){err(e&&e.msg?e.msg:cloudMsg(e))}finally{CLOUD.busy=false}};
  if(CLOUD.user){
    if(CLOUD.group)cloudGroupName(CLOUD.group).then(n=>{const e=$('#clgname',r);if(e&&n)e.textContent=n+' ('+CLOUD.group+')'});
    (CLOUD.groups?Promise.resolve(CLOUD.groups):cloudMyGroups()).then(gs=>{CLOUD.groups=gs;const e=$('#clgroups',r);if(e)e.innerHTML=groupsHTML(gs)}).catch(e=>{const el=$('#clgroups',r);if(el)el.innerHTML=`<p class="msg err">${cloudMsg(e)}</p>`});
  }
  r.addEventListener('click',e=>{
    const b=e.target.closest('[data-cl]');if(!b)return;const k=b.dataset.cl;
    if(k==='google')busy(cloudGoogle);
    else if(k==='in'||k==='new')busy(()=>cloudEmail($('#clmail',r).value.trim(),$('#clpass',r).value,k==='new'));
    else if(k==='out')busy(async()=>{await CLOUD.M.signOut(CLOUD.auth)});
    else if(k==='join')busy(async()=>{const n=await cloudJoin($('#clcode',r).value);toast(`Te uniste a la clase «${esc(n)}».`);cloudRefresh()});
    else if(k==='leave')busy(()=>cloudLeave());
    else if(k==='create')busy(async()=>{const n=$('#clgnew',r).value.trim();if(!n)throw{msg:'Ponle nombre a la clase.'};const c=await cloudCreateGroup(n);toast(`Clase creada. Código: ${c}`,5000);cloudRefresh()});
    else if(k==='copy'){const c=b.dataset.code,t=`Únete a mi clase en Roka Guitar for All: abre ${location.href.split('#')[0]}#/cuenta y escribe el código ${c}`;navigator.clipboard&&navigator.clipboard.writeText(t).then(()=>toast('Invitación copiada. Pégala en WhatsApp.'),()=>toast('Código: '+c,5000))}
  });
}

function figStatus(id,t){const e=document.querySelector(`[data-fx="st"][data-id="${id}"]`);if(e)e.textContent=t}
function figStop(){if(SEQ.id==='fig')seqStop()}
function figStart(x,preview){
  const F=x.fig,st=figState(x),own='fig:'+x.id+(preview?':p':'');
  OWNER=own;
  if(F.type==='seq'){
    const {seq}=seqData(F);
    const order=preview||!st.updown||seq.length<3?seq:seq.concat(seq.slice(1,-1).reverse());
    const per=preview?1:st.per,count=preview?0:4*per;
    seqStart('fig',(preview?'Escuchando · ':'Siguiendo · ')+x.t,()=>preview?.34:60/figBpm(x)/per,(s,t)=>{
      if(s<count){if(s%per===0)tick(t,s===0?'acc':'beat');return}
      const k=s-count;if(preview&&k>=order.length)return;
      const i=k%order.length;
      if(!preview&&k%per===0)tick(t,(k/per)%4===0?'acc':'beat');
      if(preview||(st.guide&&!st.mic))pluck(midiOf(order[i][0],order[i][1]),t,preview?.6:60/figBpm(x)/per*1.5,.22);
    },s=>{
      if(s<count){figLight(x.id,null);figStatus(x.id,'Cuenta: '+(Math.floor(s/per)+1));return}
      const k=s-count;
      if(preview&&k>=order.length){if(OWNER===own)seqStop();return}
      const i=k%order.length;
      if(!preview&&st.mic)fmStep(x,i,order);
      figLight(x.id,order[i][0],order[i][1]);
      figStatus(x.id,preview?'Nota '+(i+1)+' de '+order.length:'Nota '+(i+1)+' de '+order.length+(st.mic&&FM.total?` · aciertos ${FM.hits} de ${FM.total}`:'')+(st.updown&&order.length>seq.length&&!st.mic?(i<seq.length?' · subiendo':' · bajando'):''));
    });
  }else{
    const L=F.list.length,beats=preview?1:st.beats,count=preview?0:4;
    seqStart('fig',(preview?'Escuchando · ':'Siguiendo · ')+x.t,()=>preview?1.1:60/figBpm(x),(s,t)=>{
      if(s<count){tick(t,s===0?'acc':'beat');return}
      const k=s-count;if(preview&&k>=L)return;
      const ci=Math.floor(k/beats)%L,first=k%beats===0;
      if(!preview)tick(t,first?'acc':'beat');
      if(first&&(preview||st.guide))chordMidiF(F.list[ci][1]).forEach((m,j)=>pluck(m,t+j*.022,preview?1:60/figBpm(x)*beats*.95,.17));
    },s=>{
      if(s<count){figStatus(x.id,'Cuenta: '+(s+1));return}
      const k=s-count;
      if(preview&&k>=L){if(OWNER===own)seqStop();return}
      const ci=Math.floor(k/beats)%L;
      if(k%beats===0)figChord(x.id,F,ci);
      figStatus(x.id,'Acorde '+(ci+1)+' de '+L+(preview?'':' · pulso '+(k%beats+1)));
    });
  }
  paintFig();
}

const FM={id:null,target:null,prev:null,hits:0,total:0,round:0,last:-1,run:0,ownMic:false,results:[]};
async function fmStart(x){
  if(!TUN.stream){
    toast('Activando el micrófono… toca cerca del teléfono.');
    let err=null;await tunerStart(fmPitch,e=>{err=e});
    if(err||!TUN.stream){toast({denied:'El micrófono está bloqueado. Permite el acceso en los ajustes del navegador.',nomic:'No se encontró un micrófono.',nosupport:'Este navegador no permite usar el micrófono aquí.'}[err]||'No se pudo activar el micrófono.',5000);return}
    FM.ownMic=true;
  }
  Object.assign(FM,{id:x.id,target:null,prev:null,hits:0,total:0,round:0,last:-1,run:0,results:[]});
  const el=document.querySelector(`[data-fig="${x.id}"]`);if(el)$$('.dg',el).forEach(d=>d.classList.remove('hit','miss'));
  figStart(x,false);paintFig();
}
function fmDot(t,cls){const el=document.querySelector(`[data-fig="${FM.id}"]`);if(!el||!t)return;$$(`.dg[data-s="${t.s}"][data-f="${t.f}"]`,el).forEach(d=>{d.classList.remove('hit','miss');d.classList.add(cls)})}

function fmStep(x,i,order){
  if(i===0&&FM.total>0&&FM.last!==-1){fmClose(FM.prev&&FM.prev.t);fmClose(FM.target);FM.prev=null;FM.target=null;fmRound(x)}
  if(FM.target){const p=FM.target;FM.prev={t:p,until:performance.now()+280};setTimeout(()=>{if(FM.prev&&FM.prev.t===p){fmClose(p);FM.prev=null}},300)}
  const [s,f]=order[i];FM.target={s,f,m:midiOf(s,f),hit:false,done:false};FM.last=i;
}
function fmRound(x){
  FM.round++;const pct=Math.round(FM.hits/FM.total*100);FM.results.push(pct);
  DB.figbest=DB.figbest||{};if(!DB.figbest[x.id]||pct>DB.figbest[x.id]){DB.figbest[x.id]=pct;save()}
  toast(`Ronda ${FM.round}: ${FM.hits} de ${FM.total} notas (${pct} %)${pct>=90?' · ¡excelente!':pct>=70?' · vas bien':' · baja el tempo y repite'}`,3500);
  FM.hits=0;FM.total=0;
  setTimeout(()=>{const el=document.querySelector(`[data-fig="${x.id}"]`);if(el)$$('.dg',el).forEach(d=>d.classList.remove('hit','miss'))},700);
}
function fmFinish(){if(FM.target&&!FM.target.done&&FM.target.hit)fmClose(FM.target);FM.target=null;FM.prev=null}
function fmSummary(){const best=(DB.figbest||{})[FM.id];const last=FM.results.length?FM.results[FM.results.length-1]:Math.round(FM.hits/Math.max(1,FM.total)*100);return`Última ronda: ${last} %`+(best!=null?` · mejor: ${best} %`:'')}
function fmPitch(fr){
  if(!fr||!FM.id||!(SEQ.id==='fig'&&OWNER==='fig:'+FM.id)){FM.run=0;return}
  const n=Math.round(69+12*Math.log2(fr/440)),pc=((n%12)+12)%12;
  FM.run=(FM.lastPc===pc)?FM.run+1:1;FM.lastPc=pc;if(FM.run<2)return;
  const ok=t=>t&&!t.hit&&!t.done&&((t.m%12)===pc);
  if(ok(FM.target)){FM.target.hit=true;fmDot(FM.target,'hit')}
  else if(FM.prev&&performance.now()<FM.prev.until&&ok(FM.prev.t)){FM.prev.t.hit=true;fmDot(FM.prev.t,'hit')}

const ROM={I:'uno',II:'dos',III:'tres',IV:'cuatro',V:'cinco',VI:'seis',VII:'siete'};

const sentences=html=>{const t=String(html).replace(/<[^>]+>/g,'');return t.split(/(?<=[.!?])\s+(?=[A-ZÁÉÍÓÚÑ¿«0-9])/).map(s=>s.trim()).filter(Boolean)};
const NOTEPC={do:0,re:2,mi:4,fa:5,sol:7,la:9,si:11};
function mentions(text){
  const ev=[];let m;
  const r1=/cuerda (\d)[^.;]{0,40}?traste (\d+)/gi;while((m=r1.exec(text)))ev.push({i:m.index+m[0].length-m[2].length,s:+m[1],f:+m[2]});
  const r2=/cuerda (\d):? trastes? ((?:\d+(?:, | y )?)+)/gi;while((m=r2.exec(text))){const base=m.index+m[0].indexOf(m[2]);let n,r=/\d+/g;while((n=r.exec(m[2])))ev.push({i:base+n.index,s:+m[1],f:+n[0]})}
  const r3=/\b(Do|Re|Mi|Fa|Sol|La|Si)( sostenido| bemol)? \((\d+)\)/g;while((m=r3.exec(text))){let pc=NOTEPC[m[1].toLowerCase()];if(m[2]===' sostenido')pc=(pc+1)%12;if(m[2]===' bemol')pc=(pc+11)%12;ev.push({i:m.index,f:+m[3],pc})}
  const r4=/\((\d)\/(\d+)\)/g;while((m=r4.exec(text)))ev.push({i:m.index,s:+m[1],f:+m[2]});
  const r5=/\btrastes? (\d+)(?:, (\d+))?(?:,? y (\d+))?/gi;while((m=r5.exec(text))){if(ev.some(e=>Math.abs(e.i-m.index)<30))continue;[m[1],m[2],m[3]].forEach((v,k)=>{if(v!=null)ev.push({i:m.index+m[0].indexOf(v),f:+v})})}

function speak(text,onB){
  return new Promise(res=>{
    if(!HAS_TTS){setTimeout(res,600);return}
    const u=new SpeechSynthesisUtterance(text);u.lang=(NARR.voice&&NARR.voice.lang)||'es-MX';if(NARR.voice)u.voice=NARR.voice;u.rate=DB.narrRate||1;
    let got=false,done=false;const fin=()=>{if(!done){done=true;res()}};
    u.onboundary=e=>{got=true;if(onB)onB(e.charIndex||0)};u.onend=fin;u.onerror=fin;
    try{speechSynthesis.speak(u)}catch(e){fin();return}
    const cps=14*(DB.narrRate||1);
    if(onB)NARR.timers.push(setTimeout(()=>{if(!got&&!done){/* sin eventos de palabra: avanzar por tiempo estimado */const t0=Date.now(),iv=setInterval(()=>{if(done||got){clearInterval(iv);return}onB((Date.now()-t0+400)/1000*cps)},120);NARR.timers.push(iv)}},400));
    NARR.timers.push(setTimeout(fin,Math.max(4000,text.length/cps*1000*2.2+3000)));

  }
}
async function narrRun(){
  const tok=++NARR.tok;
  while(NARR.on&&!NARR.paused&&NARR.tok===tok&&NARR.i<NARR.items.length){
    const item=NARR.items[NARR.i];
    $$('.narr').forEach(e=>e.classList.remove('narr'));clearLit();
    if(item.el){item.el.classList.add('narr');if(item.li)item.li.classList.add('narr');const tgt=item.li||item.el,r=tgt.getBoundingClientRect();if(r.top<80||r.bottom>innerHeight-140)tgt.scrollIntoView({block:'center',behavior:'smooth'})}
    paintNarr();
    const text=sayText(item.text),box=diagramFor(item.el),ev=box?mentions(text):[];let k=0;
    await speak(text,ev.length?ci=>{while(k<ev.length&&ev[k].i<=ci+6){litDot(box,ev[k]);k++}}:null);
    if(NARR.tok!==tok)return;
    while(k<ev.length){litDot(box,ev[k]);k++}
    if(item.demo){await demo(item,tok);if(NARR.tok!==tok)return}
    await wait(ev.length?500:150);

}
function narrStart(l,root){

const PULSE={n:4,beat:0,count:0,hideT:null,el:null};

  if(v===undefined)v=kind==='acc'?'bar':kind==='beat'?'beat':null;
  if(!DB.metMute){
    const k=kind==='acc'&&!acc1()?'beat':kind;

  setTimeout(()=>pulseBeat(v==='bar'),Math.max(0,(t-AC.currentTime)*1000+lat));

function pulseBeat(isBar){

  else{PULSE.count++;PULSE.beat=Math.min(PULSE.beat+1,11);if(PULSE.beat>=PULSE.n)PULSE.n=PULSE.beat+1}

function detectPitch(buf,sr){

  for(let i=1;i<n/2;i++)if(Math.abs(buf[n-i])<th){r2=n-i;break}

  for(let l=0;l<=maxLag+1;l++){let s=0;for(let j=0;j<n-l;j++)s+=b[j]*b[j+l];c[l]=s}
  let d=0;while(d<maxLag&&c[d]>c[d+1])d++;

  if(mp<1)return -1;
  let T=mp;const x1=c[T-1],x2=c[T],x3=c[T+1],a=(x1+x3-2*x2)/2,bb=(x3-x1)/2;if(a)T=T-bb/(2*a);

    host.innerHTML=`<div class="game-top"><span class="tm" id="gtl">${fmt(left)}</span><span class="tm">Aciertos: <b id="gsc">${st.score}</b></span><button class="btn sm" data-g="quit">Terminar</button></div><div class="bar" style="margin:10px 0"><i id="gbar" style="width:${left/60*100}%"></i></div>${q}<div id="gb">${board({dots})}</div>${names}`;

function viewRoutine(){

  if(b.w){ws.push(b);return`<div class="widget" data-wi="${ws.length-1}"></div>`}
  if(b.ex)return exCard(b.ex);
  if(b.sec)return`<div class="prose"><p class="blockh">${b.sec}</p><p>${b.p}</p></div>`;
  if(b.box)return`<div class="box"><p class="blockh">${b.box}</p>${b.ul?`<ul>${b.ul.map(t=>`<li>${t}</li>`).join('')}</ul>`:`<ol>${b.ol.map(t=>`<li>${t}</li>`).join('')}</ol>`}</div>`;
  if(b.trick)return`<div class="box trick"><p class="blockh">Hoja de trucos</p><ul>${b.trick.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
  if(b.p)return`<p class="prose">${b.p}</p>`;
  return'<div></div>';
}
function viewPractice(){
  return{title:'Practicar',html:`<div class="lhead"><span class="eyebrow">Herramientas</span><h1>Practicar</h1></div>
  <a class="card tool" href="#/practicar/rutina"><span class="ic">${IC.cal}</span><span><b>Rutina diaria</b><span>10, 15 o 30 minutos guiados con temporizador.</span></span></a>
  <div class="grid2">${toolCards()}</div>
  <a class="card tool" href="#/logros"><span class="ic">${achIcon('award')}</span><span><b>Logros</b><span>${ACH.filter(a=>(DB.ach||{})[a[0]]).length} de ${ACH.length} desbloqueados.</span></span></a>`};
}
function viewReference(){
  const R=[['canciones','Canciones','Progresiones famosas para tocar con pista.',IC.wave],['notas','Mapa de notas','Todas las notas del mástil, del traste 0 al 12.',IC.grid],['acordes','Acordes abiertos','26 acordes con digitación y sonido.',IC.book],['explorar','Explorador','Escalas, modos, acordes, CAGED y más en las 12 tonalidades.',IC.play2],['glosario','Glosario','Los términos de la teoría en idioma humano.',IC.book]];
  return{title:'Referencia',html:`<div class="lhead"><span class="eyebrow">Consulta rápida</span><h1>Referencia</h1></div><div class="grid2">${R.map(([k,n,d,ic])=>`<a class="card tool" href="#/referencia/${k}"><span class="ic">${ic}</span><span><b>${n}</b><span>${d}</span></span></a>`).join('')}</div>`};
}
let NOTENAT=0;
function viewNotes(){
  const board=()=>{const all=[];for(let s=1;s<=6;s++)for(let f=0;f<=12;f++){const pc=(OPEN_PC[s]+f)%12,nat=NATPC.includes(pc);if(NOTENAT&&!nat)continue;all.push({s,f,t:PCS[pc][0],k:nat?'note':'dim'})}return fretboard({dots:all,label:'Mapa de notas'})};
  return{title:'Mapa de notas',back:'#/referencia',html:`<div class="card"><div class="row" style="margin-bottom:12px"><div class="seg"><button data-n="0" aria-pressed="${!NOTENAT}">Las 12</button><button data-n="1" aria-pressed="${!!NOTENAT}">Solo naturales</button></div></div><div id="nb">${board()}</div><p class="cap">Toca cualquier nota para escucharla. Naturales en color; sostenidos en contorno.</p></div>`,
  mount(r){$$('[data-n]',r).forEach(b=>b.onclick=()=>{NOTENAT=+b.dataset.n;$$('[data-n]',r).forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('#nb',r).innerHTML=board()})}};
}
function viewChords(){return{title:'Acordes abiertos',back:'#/referencia',html:`<div class="widget" id="ocw"></div>`,mount(r){mountWidget($('#ocw',r),{w:'openchords'})}}}
const EXPL=[['scale','Escala mayor'],['mode','Modos'],['chord','Acordes'],['harm','Armonía'],['penta','Pentatónicas'],['caged','CAGED'],['intervals','Intervalos'],['circle','Círculo'],['prog','Progresiones']];
let EXSEL='scale';
function viewExplore(){
  return{title:'Explorador',back:'#/referencia',html:`<div class="chips" id="exs">${EXPL.map(([k,l])=>`<button class="chip" data-e="${k}" aria-pressed="${k===EXSEL}">${l}</button>`).join('')}</div><div class="widget" id="exw"></div>`,
  mount(r){
    const m=()=>{const spec=EXSEL==='chord'?{w:'chord',types:Object.keys(CT),init:{k:0,t:'maj'}}:{w:EXSEL};const h=$('#exw',r),n=h.cloneNode(false);h.replaceWith(n);mountWidget(n,spec)};
    $$('[data-e]',r).forEach(b=>b.onclick=()=>{EXSEL=b.dataset.e;$$('[data-e]',r).forEach(x=>x.setAttribute('aria-pressed',String(x===b)));m()});m();
  }};
}
function viewGlossary(){return{title:'Glosario',back:'#/referencia',html:`<div class="gl">${GLOS.map(g=>`<div><b>${g[0]}</b><span>${g[1]}</span></div>`).join('')}</div>`}}
/* ---------- enrutador ---------- */
const NAV=[['#/','Inicio',IC.home,''],['#/lecciones','Lecciones',IC.book,'leccion'],['#/practicar','Practicar',IC.play2,'practicar'],['#/cancionero','Canciones',IC.note,'cancionero'],['#/referencia','Referencia',IC.grid,'referencia']];
let UNMOUNT=null;
function route(){
  const h=location.hash.replace(/^#\/?/,''),p=h.split('/');
  let v;
  if(!p[0])v=viewHome();
  else if(p[0]==='lecciones')v=viewLessons();
  else if(p[0]==='leccion')v=viewLesson(+p[1],p[2]);
  else if(p[0]==='cuenta')v=viewAccount();
  else if(p[0]==='apariencia')v=viewLook();
  else if(p[0]==='practicar')v=({metronomo:viewMetronome,afinador:viewTuner,juego:viewGame,pistas:viewTracks,rutina:viewRoutine,reto:viewReto,grabar:viewRecorder,lento:viewSlow}[p[1]]||viewPractice)();
  else if(p[0]==='logros')v=viewAch();
  else if(p[0]==='cancionero')v=p[1]==='ver'?viewSongPlay(p[2]||'',p[3]==='lento'):p[1]==='editar'?viewSongEdit(p[2]||'nueva'):viewSongbook();
  else if(p[0]==='referencia')v=({canciones:viewSongs,notas:viewNotes,acordes:viewChords,explorar:viewExplore,glosario:viewGlossary}[p[1]]||viewReference)();
  else v=viewHome();
  if(UNMOUNT){try{UNMOUNT()}catch(e){}UNMOUNT=null}
  if(SEQ.id==='fig')seqStop();
  const sec=p[0]===''?'':p[0]==='lecciones'?'leccion':p[0]==='logros'?'practicar':p[0];
  $$('[data-nav]').forEach(a=>{const on=a.dataset.nav===sec;if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  $('#ttl').textContent=v.title;
  const bk=$('#back');bk.hidden=!v.back;if(v.back)bk.href=v.back;
  // página nueva en cada vista: así no se acumulan los clics de vistas anteriores
  const old=$('#page'),pg=old.cloneNode(false);old.replaceWith(pg);pg.innerHTML=v.html;
  document.title=v.title==='Roka Guitar for All'?v.title:v.title+' · Roka Guitar for All';
  if(v.mount)UNMOUNT=v.mount(pg)||null;
  if(!(p[0]==='leccion'&&p[2]))window.scrollTo(0,0);
  paintPlayer();
}
/* ---------- clics globales ---------- */
document.addEventListener('click',e=>{
  const x=e.target.closest('[data-x]');if(x&&exAction(x))return;
  const dg=e.target.closest('.dg');
  if(dg&&dg.dataset.s&&!e.target.closest('#gamehost,#rtgame')){playNotes([OPEN_MIDI[+dg.dataset.s]+ +dg.dataset.f],'chord');return}
  const pl=e.target.closest('[data-play]');if(pl){const L=pl.dataset.play.split(',').map(Number),st=+pl.dataset.step||.5;playNotes(L,pl.dataset.mode,st);lightSequence(pl,L,pl.dataset.mode,st);return}
  const sq=e.target.closest('[data-seq]');if(sq){playSeq(sq.dataset.seq.split('|').map(c=>c.split('.').map(Number)),+sq.dataset.beat||1)}
});
/* ---------- arranque ---------- */
document.body.insertAdjacentHTML('afterbegin',`<div class="shell">
 <nav class="side" aria-label="Secciones"><div class="brand"><span class="logo">${logo()}</span>Roka<br>Guitar for All</div>${NAV.map(([h,l,ic,k])=>`<a href="${h}" data-nav="${k}">${ic}${l}</a>`).join('')}</nav>
 <main><header class="topbar"><div class="in"><a class="icon-btn" id="back" href="#/" aria-label="Volver" hidden>${IC.back}</a><span class="ttl" id="ttl"></span></div></header><div class="page" id="page"></div></main>
</div>
<nav class="tabs" aria-label="Secciones">${NAV.map(([h,l,ic,k])=>`<a class="tab" href="${h}" data-nav="${k}">${ic}${l}</a>`).join('')}</nav>`);
checkAch(true);persist();
window.addEventListener('hashchange',route);
route();
/* Actualizaciones: busca versión nueva al abrir y al volver a la app; avisa cuando está lista. */
function showUpdate(){
  if(document.getElementById('upd'))return;
  const d=document.createElement('div');d.id='upd';d.className='player upd';
  d.innerHTML='<span class="dotlive"></span><span class="pl">Hay una versión nueva de la app</span><button class="btn sm pri" id="updgo">Actualizar</button>';
  document.body.appendChild(d);d.querySelector('#updgo').onclick=()=>location.reload();
}
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  let hadCtl=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadCtl){hadCtl=true;return}if(!SEQ.id&&!TMR.id)location.reload();else showUpdate()});
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
      const chk=()=>reg.update().catch(()=>{});
      document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk()});
      setInterval(chk,30*60*1000);chk();
    }).catch(()=>{});
  });
}


</script>
</body>
