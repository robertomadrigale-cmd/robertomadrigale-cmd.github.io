<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mades Guitar Hero</title>
<meta name="description" content="Teoría visual para guitarra con ejercicios, metrónomo, afinador, juego del mástil y pistas para improvisar.">
<meta name="theme-color" content="#0c111c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4efe4" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mades GH">
<link rel="preload" href="fonts/source-sans-3-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/barlow-condensed-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Concept: estudio nocturno — mástil como regla visual, barras de vidrio, ámbar para lo que se toca y rojo para la raíz. */
@font-face{font-family:'Barlow Condensed';font-weight:800;font-display:swap;src:url(fonts/barlow-condensed-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Source Sans 3';font-weight:400;font-display:swap;src:url(fonts/source-sans-3-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Source Sans 3';font-weight:600;font-display:swap;src:url(fonts/source-sans-3-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Source Sans 3';font-weight:700;font-display:swap;src:url(fonts/source-sans-3-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:600;font-display:swap;src:url(fonts/ibm-plex-mono-latin-600-normal.woff2) format('woff2')}
:root{
  --font-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --font-body:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;
  --accent:#e8a23a;--accent-ink:#1b1305;
  --bg:#0c111c;--surface:#151d30;--surface2:#1d2843;--fg:#f2ede3;--muted:#98a4bd;--line:#2a3857;
  --glass:rgba(16,22,36,.72);--accent-text:#f0b24f;--root:#ea6f50;--good:#62c394;--bad:#ea6f50;--blue:#6db3e0;
  --nav-h:64px;color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4efe4;--surface:#fffaf1;--surface2:#ebe2cf;--fg:#1a2236;--muted:#586380;--line:#d6cab0;--glass:rgba(250,246,238,.78);--accent-text:#955700;--root:#bf4128;--good:#2b8559;--bad:#bf4128;--blue:#2f7cae;color-scheme:light}}
:root[data-theme="light"]{--bg:#f4efe4;--surface:#fffaf1;--surface2:#ebe2cf;--fg:#1a2236;--muted:#586380;--line:#d6cab0;--glass:rgba(250,246,238,.78);--accent-text:#955700;--root:#bf4128;--good:#2b8559;--bad:#bf4128;--blue:#2f7cae;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{background-image:var(--art,none);background-attachment:fixed;background-repeat:no-repeat;background-size:100% 100%}
.card,.ex,.widget{box-shadow:inset 0 1px 0 color-mix(in srgb,var(--fg) 5%,transparent),0 10px 28px -20px rgba(0,0,0,.6)}
.glow{background:linear-gradient(95deg,var(--fg) 20%,var(--accent-text) 60%,var(--root));-webkit-background-clip:text;background-clip:text;color:transparent}
/* selector de temas */
.thgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.thm{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px;border-radius:14px;border:2px solid var(--line);background:var(--ts);color:var(--tf);cursor:pointer;min-width:0}
.thm .thp{display:flex;gap:6px;align-items:flex-end;width:100%;height:52px;border-radius:9px;margin-bottom:6px;padding:8px;background:var(--tart),var(--tb);border:1px solid color-mix(in srgb,var(--tf) 12%,transparent)}
.thm .thp i{width:16px;height:16px;border-radius:50%;background:var(--ta)}
.thm .thp i:nth-child(2){background:var(--tr)}
.thm .thp i:nth-child(3){width:auto;flex:1;height:4px;border-radius:4px;align-self:center;background:var(--tm)}
.thm b{font:800 18px/1.05 var(--font-display);text-transform:uppercase;letter-spacing:.01em}
.thm small{font-size:12px;color:var(--tm);line-height:1.25}
.thm[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.thm.auto{--tb:var(--bg);--ts:var(--surface);--tf:var(--fg);--tm:var(--muted);--ta:var(--accent);--tr:var(--root);--tart:linear-gradient(90deg,#0c111c 50%,#f4efe4 50%)}
body{font:400 17px/1.6 var(--font-body);min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
h1,h2{font-family:var(--font-display);font-weight:800;text-transform:uppercase;line-height:.95;letter-spacing:.005em;text-wrap:balance}
h1{font-size:clamp(38px,9vw,60px)}
h2{font-size:clamp(28px,6.5vw,40px)}
h3{font:700 19px/1.25 var(--font-body)}
:focus-visible{outline:3px solid var(--accent-text);outline-offset:2px}
/* shell */
.shell{display:flex;min-height:100vh}
.side{display:none}
main{flex:1;min-width:0;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 72px)}
.topbar{position:sticky;top:0;z-index:20;background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.topbar .in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:56px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.topbar .ttl{flex:1;min-width:0;font:600 13px var(--font-mono);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid transparent;background:none;display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:hover{background:var(--surface)}
.icon-btn svg{width:22px;height:22px}
.page{max-width:880px;margin:0 auto;padding-block:24px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab{height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font:600 11px var(--font-body);letter-spacing:.02em}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent-text)}
@media (min-width:900px){
  .tabs{display:none}
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;width:236px;flex:none;padding:24px 14px;border-right:1px solid var(--line);background:var(--surface)}
  .side .brand{display:flex;align-items:center;gap:10px;font:600 13px var(--font-mono);letter-spacing:.14em;text-transform:uppercase;padding:6px 10px 22px}
  .side .brand svg{width:26px;height:26px}
  .side a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;text-decoration:none;color:var(--muted);font-weight:600}
  .side a svg{width:22px;height:22px}
  .side a:hover{background:var(--surface2);color:var(--fg)}
  .side a[aria-current="page"]{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent-text)}
  main{padding-bottom:96px}
}
/* mini reproductor */
.player{position:fixed;z-index:29;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 10px);width:min(560px,calc(100% - 24px));display:flex;align-items:center;gap:10px;background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:8px 8px 8px 14px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
@media (min-width:900px){.player{bottom:18px;left:calc(50% + 118px)}}
.player .pl{flex:1;min-width:0;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .dotlive{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
/* elementos */
.eyebrow{font:600 12px var(--font-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--accent-text)}
.sub{color:var(--muted);font-size:18px;max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}
.hl{background:linear-gradient(transparent 62%,color-mix(in srgb,var(--accent) 38%,transparent) 62%);color:var(--accent-text);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{border-color:var(--good);color:var(--good)}
.btn.ok.on{background:var(--good);color:#0b1a12;border-color:var(--good)}
.btn svg{width:18px;height:18px;flex:none}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font:800 34px/1 var(--font-display)}
.stat span{font:500 12px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.tool{display:flex;gap:14px;align-items:center;text-decoration:none;color:var(--fg)}
.tool .ic{width:48px;height:48px;border-radius:14px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent-text);display:grid;place-items:center;flex:none}
.tool .ic svg{width:26px;height:26px}
.tool b{display:block;font-size:17px}
.tool span{font-size:14px;color:var(--muted)}
a.card:hover{border-color:var(--accent)}
.list{display:flex;flex-direction:column;gap:10px}
.lrow{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--fg);padding:14px 16px}
.mn{font:800 22px var(--font-display);background:var(--accent);color:var(--accent-ink);border-radius:9px;min-width:40px;height:40px;display:grid;place-items:center;flex:none}
.mn.done{background:var(--good);color:#0b1a12}
.lrow .mt{flex:1;min-width:0}
.lrow .mt b{display:block;line-height:1.25}
.lrow .mt span{font-size:14px;color:var(--muted)}
.lrow .cnt{font:500 12px var(--font-mono);color:var(--muted);white-space:nowrap}
.parth{margin-top:10px}
/* lección */
.lhead{display:flex;flex-direction:column;gap:12px}
.lead{font:800 26px/1.05 var(--font-display);text-transform:uppercase;color:var(--accent-text);text-wrap:balance}
.prose{max-width:66ch}
.blockh{font:600 12px var(--font-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--accent-text);margin-bottom:10px}
.widget{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.controls{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.cl{display:block;font:500 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font:600 14px var(--font-body);padding:8px 12px;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;display:inline-flex;align-items:baseline;gap:6px}
.chip i{font:500 10px var(--font-mono);font-style:normal;opacity:.7}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cap{margin-top:10px;font-size:15px;color:var(--muted)}
.cap b{color:var(--fg)}
.pbtn{font:600 14px var(--font-body);padding:8px 14px;min-height:40px;border-radius:10px;border:1px solid var(--accent);background:transparent;color:var(--accent-text);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.pbtn::before{content:"";border-left:9px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent}
.pbtn:hover{background:color-mix(in srgb,var(--accent) 15%,transparent)}
.row-act{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.box{border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.box ul,.box ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.box li::marker{color:var(--accent-text)}
.trick{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
/* ejercicio */
.ex{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:16px;background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.ex.done{border-left-color:var(--good)}
.ex .eh{display:flex;align-items:flex-start;gap:12px}
.ex .tag{font:600 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent-text)}
.ex.done .tag{color:var(--good)}
.ex h3{margin-top:2px}
.ex .meta{font:500 12px var(--font-mono);color:var(--muted);white-space:nowrap;margin-left:auto;padding-top:2px}
.ex ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.ex ol li::marker{font:600 13px var(--font-mono);color:var(--accent-text)}
.goal{font-size:15px;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px dashed var(--line)}
.goal b{color:var(--good)}
.exbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.minimet{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:12px;padding:3px;background:var(--bg)}
.minimet .v{font:600 14px var(--font-mono);min-width:64px;text-align:center}
.minimet .icon-btn{width:36px;height:36px;border-radius:9px}
.tm{font:600 15px var(--font-mono);font-variant-numeric:tabular-nums}
/* mástil */
.fbwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.fb{display:block;width:100%;height:auto;margin:0 auto}
.fb .wood{fill:var(--surface2)}
.fb .fret{stroke:var(--line);stroke-width:1.6}
.fb .nut{stroke:var(--muted);stroke-width:5}
.fb .str{stroke:var(--muted);opacity:.9}
.fb .inlay{fill:var(--line)}
.fb .num{fill:var(--muted);font:500 11px var(--font-mono);text-anchor:middle}
.fb .slab{fill:var(--muted);font:500 11px var(--font-mono);text-anchor:middle;dominant-baseline:central}
.fb .mute{fill:var(--muted);font:700 15px var(--font-body);text-anchor:middle;dominant-baseline:central}
.fb .zone{fill:var(--accent);opacity:.14}
.fb .dot{fill:var(--accent)}
.fb .dot.root{fill:var(--root)}
.fb .dot.dim{fill:none;stroke:var(--muted);stroke-width:1.5}
.fb .dot.faint{fill:var(--accent);opacity:.28}
.fb .dot.blue{fill:var(--blue)}
.fb .dot.good{fill:var(--good)}
.fb .dot.bad{fill:var(--bad)}
.fb .dot.ct{fill:var(--accent)}
.fb .dtxt{fill:var(--accent-ink);font:700 11px var(--font-body);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.fb .dtxt.sm{font-size:9px}
.fb .dtxt.r{fill:var(--root-ink,#fff)}
.fb .dtxt.dm{fill:var(--muted);font-weight:600}
.fb .dg{cursor:pointer}
.fb .cell{fill:transparent;cursor:pointer}
.fb .cell:hover{fill:color-mix(in srgb,var(--accent) 22%,transparent)}
.hint{display:none;font:500 11px var(--font-mono);color:var(--muted);margin:0 0 4px}
@media (max-width:640px){.hint{display:block}}
.strip{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.nt{display:flex;flex-direction:column;align-items:center;min-width:44px;padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);line-height:1.15}
.nt b{font-size:16px}.nt small{font:500 10px var(--font-mono);color:var(--muted)}
.nt.r{border-color:var(--root)}
.ts{font:700 12px var(--font-mono);width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.ts.t{background:var(--accent);color:var(--accent-ink)}
.ts.s{background:var(--root);color:var(--root-ink,#fff)}
.hrow{display:grid;grid-template-columns:44px 1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.hrow .rn{font:800 20px var(--font-display);color:var(--accent-text)}
.hrow .sy{font-weight:700;font-size:18px}
.hrow .no{font-size:13px;color:var(--muted)}
.fn{font:600 10px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.fn.T{color:var(--good);border-color:var(--good)}.fn.S{color:var(--accent-text);border-color:var(--accent)}.fn.D{color:var(--root);border-color:var(--root)}
.pchip{display:flex;flex-direction:column;align-items:center;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);min-width:64px}
.pchip b{font-size:18px}.pchip small{font:500 11px var(--font-mono);color:var(--muted)}
.pchip.T{border-color:var(--good)}.pchip.S{border-color:var(--accent)}.pchip.D{border-color:var(--root)}
.pchip.cur{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.pchip.cur small{color:var(--accent-ink)}
.cc circle{fill:var(--bg);stroke:var(--line);stroke-width:1.5;cursor:pointer}
.cc text{fill:var(--fg);font:700 15px var(--font-body);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.cc.m circle{fill:var(--surface)}
.cc.m text{font-size:12px;font-weight:600;fill:var(--muted)}
.cc.nb circle{stroke:var(--accent);stroke-width:2.5}
.cc.sel circle{fill:var(--accent);stroke:var(--accent)}
.cc.sel text{fill:var(--accent-ink)}
.cc.m.sel circle{fill:var(--root);stroke:var(--root)}.cc.m.sel text{fill:var(--root-ink,#fff)}
.cctr{fill:var(--muted);font:500 11px var(--font-mono);text-anchor:middle}
.order{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:12px 0 0;padding:0}
.order li{border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14px;background:var(--bg)}
.order li.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.order b{font-family:var(--font-display);font-size:18px;margin-right:6px}
select{font:600 15px var(--font-body);padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);min-height:42px;max-width:100%}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:6px}
.steps label{display:flex;flex-direction:column;gap:4px;font:500 11px var(--font-mono);color:var(--muted)}
.gl{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.gl div{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}
.gl b{display:block;color:var(--accent-text)}
.gl span{font-size:15px;color:var(--muted)}
/* herramientas */
.big{font:800 clamp(64px,18vw,112px)/1 var(--font-display);font-variant-numeric:tabular-nums;text-align:center}
.beats{display:flex;justify-content:center;gap:10px;margin:8px 0}

let LEFTY=false;
function fretboard(o){

  const start=from===0?1:from,cols=to-start+1,x0=left+lane,wood=cols*W,totalW=x0+wood+10,bottom=top+5*H,totalH=bottom+36;
  const X=x=>LEFTY?totalW-x:x,R=(x,w)=>LEFTY?totalW-x-w:x;
  const y=s=>top+(s-1)*H,cx=f=>X(f===0?x0-lane/2-1:x0+(f-start+.5)*W);
  let g=`<rect class="wood" x="${R(x0,wood)}" y="${top-10}" width="${wood}" height="${5*H+20}" rx="4"/>`;
  (o.zones||[]).forEach(z=>{const a=Math.max(z[0],start),b=Math.min(z[1],to);if(b>=a)g+=`<rect class="zone" x="${R(x0+(a-start)*W,(b-a+1)*W)}" y="${top-10}" width="${(b-a+1)*W}" height="${5*H+20}"/>`});
  for(let f=start;f<=to;f++){
    const m=f%12;
    if([3,5,7,9].includes(m))g+=`<circle class="inlay" cx="${cx(f)}" cy="${top+2.5*H}" r="5"/>`;
    if(m===0)g+=`<circle class="inlay" cx="${cx(f)}" cy="${top+1.5*H}" r="5"/><circle class="inlay" cx="${cx(f)}" cy="${top+3.5*H}" r="5"/>`;
  }
  for(let i=0;i<=cols;i++){const x=X(x0+i*W);g+=`<line class="${i===0&&from===0?'nut':'fret'}" x1="${x}" y1="${top-10}" x2="${x}" y2="${bottom+10}"/>`}
  for(let s=1;s<=6;s++){g+=`<line class="str" x1="${X(x0)}" x2="${X(x0+wood)}" y1="${y(s)}" y2="${y(s)}" stroke-width="${(.8+(s-1)*.45).toFixed(2)}"/><text class="slab" x="${X(14)}" y="${y(s)}">${'eBGDAE'[s-1]}</text>`}
  for(let f=start;f<=to;f++)g+=`<text class="num" x="${cx(f)}" y="${bottom+30}">${f}</text>`;
  if(from===0)(o.muted||[]).forEach(s=>{g+=`<text class="mute" x="${cx(0)}" y="${y(s)}">×</text>`});
  (o.dots||[]).forEach(d=>{
    if(d.f<from||(d.f===0&&from>0)||d.f>to)return;
    const t=d.t==null?'':String(d.t),k=d.k||'note';
    g+=`<g class="dg" data-s="${d.s}" data-f="${d.f}"><circle class="dot ${k}" cx="${cx(d.f)}" cy="${y(d.s)}" r="10"/>${t?`<text class="dtxt${t.length>2?' sm':''}${k==='root'?' r':''}${k==='dim'?' dm':''}" x="${cx(d.f)}" y="${y(d.s)}">${esc(t)}</text>`:''}</g>`;
  });
  if(o.tap)for(let s=1;s<=6;s++)for(let f=from;f<=to;f++){
    if(f===0&&from>0)continue;
    const x=f===0?left:x0+(f-start)*W,w=f===0?lane:W;
    g+=`<rect class="cell" data-s="${s}" data-f="${f}" x="${R(x,w)}" y="${y(s)-H/2}" width="${w}" height="${H}"/>`;
  }
  const hint=totalW*.78>360?`<p class="hint">Desliza para ver todo el mástil ${LEFTY?'←':'→'}</p>`:'';
  return`${hint}<div class="fbwrap"${LEFTY?' dir="rtl"':''}><svg class="fb" viewBox="0 0 ${totalW} ${totalH}" style="min-width:${Math.round(totalW*.78)}px;max-width:${Math.round(totalW*1.7)}px" role="img" aria-label="${esc(o.label||'Diagrama del mástil de guitarra')}">${g}</svg></div>`;
}

function pentaData(s){

const CH={C:[null,3,2,0,1,0],Cmaj7:[null,3,2,0,0,0],C7:[null,3,2,3,1,0],Dm:[null,null,0,2,3,1],Dm7:[null,null,0,2,1,1],D:[null,null,0,2,3,2],D7:[null,null,0,2,1,2],Dsus4:[null,null,0,2,3,3],E:[0,2,2,1,0,0],Em:[0,2,2,0,0,0],Em7:[0,2,0,0,0,0],F:[1,3,3,2,1,1],Fmaj7:[null,null,3,2,1,0],G:[3,2,0,0,0,3],G7:[3,2,0,0,0,1],A:[null,0,2,2,2,0],Am:[null,0,2,2,1,0],Am7:[null,0,2,0,1,0],Asus2:[null,0,2,2,0,0],Bdim:[null,2,3,4,3,null],Bm7b5:[null,2,3,2,3,null],Bb:[null,1,3,3,3,1],Eb:[null,6,8,8,8,6]};
const ch=(...names)=>names.map(n=>[n.replace('b5','♭5').replace('Bb','B♭').replace('Eb','E♭').replace('dim','°'),CH[n]]);
const E=(o)=>({ex:o});
const LESSONS=[
{id:1,part:1,title:'El mástil deja de ser un laberinto',sub:'Notas, octavas y puntos de referencia',
 lead:'Seis cuerdas, doce trastes, doce notas. Ese es todo el mapa.',
 blocks:[
 {p:'El mástil parece enorme porque se aprende cuerda por cuerda. En realidad solo existen <span class="hl">12 notas distintas</span> y cada 12 trastes el patrón vuelve a empezar. Aprende dónde viven las notas naturales (Do, Re, Mi, Fa, Sol, La, Si); el resto son sostenidos que caen entre ellas.'},
 {w:'noteFinder'},
 {p:'Hay dos puntos que conviene memorizar: entre <b>Mi y Fa</b>, y entre <b>Si y Do</b>, no hay nota intermedia. Todas las demás naturales están separadas por un tono, con un sostenido en medio.'},
 E({id:'1a',t:'Las naturales de la cuerda 6',min:3,steps:['Toca la cuerda 6 al aire y di en voz alta «Mi».','Sube nombrando solo las naturales: Mi (0), Fa (1), Sol (3), La (5), Si (7), Do (8), Re (10), Mi (12).','Baja del traste 12 al 0 con los mismos nombres.','Repite con los ojos cerrados, guiándote por los puntos del mástil.'],goal:'Nombras las ocho posiciones de ida y vuelta sin detenerte.',fig:natOn(6)}),
 E({id:'1b',t:'Lo mismo en la cuerda 5',min:3,steps:['Cuerda 5 al aire: La.','Sube: La (0), Si (2), Do (3), Re (5), Mi (7), Fa (8), Sol (10), La (12).','Fíjate en los dos semitonos: Si–Do (2–3) y Mi–Fa (7–8).','Alterna: una nota en la cuerda 6 y la misma nota en la cuerda 5.'],goal:'Encuentras cualquier natural de las cuerdas 6 y 5 en menos de dos segundos.',fig:natOn(5)}),

 {p:'La misma nota se repite en cuerdas distintas siguiendo siempre la misma forma. Con la forma de octava, cada nota que encuentres te regala un segundo punto de referencia.'},
 E({id:'1c',t:'Octavas al pulso',min:4,bpm:60,steps:['Toca Fa en la cuerda 6 (traste 1) en el tiempo 1 y su octava en la cuerda 4 (traste 3) en el tiempo 3.','Sigue con Sol, La, Si, Do y Re: un par por compás.','Repite desde la cuerda 5: La (0) con La en la cuerda 3 (traste 2), y sigue subiendo.','Cuando salga limpio, sube el metrónomo a 72.'],goal:'Recorres seis octavas seguidas sin perder el pulso.',fig:pts([[6,1,'Fa','root'],[4,3,'Fa'],[6,3,'Sol','root'],[4,5,'Sol'],[6,5,'La','root'],[4,7,'La']])}),
 E({id:'1d',t:'Juego: encuentra la nota',min:2,steps:['Abre el juego con el botón de abajo (trastes 0 a 5, solo naturales).','Toca en el mástil la nota que aparece arriba, tantas veces como puedas en un minuto.','Juégalo de nuevo y trata de superar tu récord.'],goal:'Logras 15 aciertos en un minuto.',game:{mode:'find',range:5,str:0,nat:1}}),
 E({id:'1e',t:'Una nota en las seis cuerdas',min:4,bpm:50,steps:['Elige Sol y tócalo en la cuerda 6 (traste 3).','Usa octavas y la cuerda al aire para encontrarlo en las seis cuerdas, de grave a agudo: un toque por pulso.','Repite con La, Do y Re.','Di en voz alta la cuerda y el traste de cada una.'],goal:'Encuentras cualquier nota en las seis cuerdas en menos de 15 segundos.',fig:pts([[6,3,'Sol','root'],[5,10,'Sol'],[4,5,'Sol'],[3,0,'Sol'],[2,8,'Sol'],[1,3,'Sol']])}),
 {box:'Errores comunes',ul:['Aprender las notas solo cuerda por cuerda: usa las octavas para saltar de una cuerda a otra.','Olvidar que el traste 12 repite la cuerda al aire.','Creer que entre Mi y Fa o entre Si y Do falta un sostenido: no existe.','Contar siempre desde el traste 0: apóyate en las referencias de los trastes 5, 7 y 12.']},
 {trick:['Las cuerdas 6 y 1 son las dos Mi: aprende una y tendrás las dos.','Traste 12 = la cuerda al aire, una octava arriba.','Mi–Fa y Si–Do: semitono natural, sin sostenido en medio.','Octava: cuerdas 6→4 y 5→3 suben 2 trastes; cuerdas 4→2 y 3→1 suben 3.','Do Re Mi Fa Sol La Si = C D E F G A B (cifrado americano).']}]},
{id:2,part:1,title:'Intervalos: la distancia es la emoción',sub:'Semitonos, formas y carácter',
 lead:'Cada distancia entre dos notas suena distinto. Aprende a verla y a oírla.',
 blocks:[
 {p:'Un intervalo es la distancia entre dos notas, medida en <span class="hl">semitonos</span> (un traste). Cada distancia tiene un carácter reconocible: la tercera menor suena sombría, la mayor luminosa, la quinta justa abierta y estable.'},
 {w:'intervals'},
 E({id:'2a',t:'Terceras sobre una cuerda',min:3,bpm:60,steps:['Toca Do en la cuerda 5, traste 3.','Toca la tercera menor tres trastes arriba (traste 6, Mi♭) y vuelve a Do.','Toca la tercera mayor cuatro trastes arriba (traste 7, Mi) y vuelve a Do.','Alterna menor y mayor, un toque por pulso, y nombra en voz alta el carácter: sombría o luminosa.'],goal:'Distingues las dos terceras con los ojos cerrados.',fig:pts([[5,3,'Do','root'],[5,6,'♭3'],[5,7,'3']])}),
 {p:'No hace falta memorizar tablas: aprende la forma sobre el mástil. En la misma cuerda, +3 trastes es una tercera menor y +4 una mayor. En la cuerda siguiente, el mismo traste es una cuarta justa y +2 trastes una quinta justa. Entre las cuerdas 3 y 2 hay un traste menos de distancia y todo se corre un traste.'},
 E({id:'2b',t:'Quintas: el power chord',min:4,bpm:80,steps:['Raíz en la cuerda 6 y quinta en la cuerda 5, dos trastes arriba.','Toca Mi5 (0–2), Sol5 (3–5), La5 (5–7) y Do5 (8–10): dos golpes por acorde.','Añade la octava en la cuerda 4, mismo traste que la quinta.','Repite con la raíz en la cuerda 5: Re5, Mi5 y Sol5.'],goal:'Cambias entre los cuatro power chords sin perder un golpe.',fig:pts([[6,3,'1','root'],[5,5,'5'],[4,5,'8']],{to:7})}),
 E({id:'2c',t:'Cuartas apiladas',min:2,steps:['Toca el traste 5 de las cuerdas 6, 5, 4 y 3: cada nota es una cuarta justa sobre la anterior.','En la cuerda 2 usa el traste 6 para mantener la cuarta (la excepción de la cuerda Si).','Escucha qué abierto suena: así se afina la guitarra.'],goal:'Explicas por qué la cuerda 2 se corre un traste.',fig:pts([[6,5],[5,5],[4,5],[3,5],[2,6]],{to:8})}),
 E({id:'2d',t:'Canta antes de tocar',min:3,steps:['Toca una raíz y, sin tocar nada más, canta la tercera mayor.','Comprueba tocándola: cuatro trastes arriba.','Repite con la quinta, la cuarta y la octava.','Usa el diagrama de intervalos de arriba para escuchar los que dudes.'],goal:'Aciertas cuatro de cinco intervalos cantados.'}),
 {box:'Errores comunes',ul:['Contar el traste de la raíz como uno: la raíz es el cero.','Confundir cuarta aumentada y quinta disminuida: suenan igual (tritono) y cambian de nombre según el contexto.','Olvidar la excepción entre las cuerdas 3 y 2.','Aprender solo la forma o solo el oído: combina ambos.']},
 {sec:'Referencias para el oído',p:'Algunas melodías conocidas ayudan a reconocer distancias. El inicio de «Estrellita» (Do–Do–Sol–Sol) salta una quinta justa. El inicio de «Cumpleaños feliz» sube una segunda mayor y después una cuarta justa. Busca las tuyas y asócialas a cada intervalo.'},
 {trick:['3ª menor = 3 semitonos · 3ª mayor = 4 · 4ª justa = 5 · 5ª justa = 7 · octava = 12.','Misma cuerda: +3 trastes → 3ª menor; +4 → 3ª mayor.','Cuerda siguiente: mismo traste → 4ª; +2 trastes → 5ª (cuerdas 3 y 2: un traste más).','Oído: menor = sombrío, mayor = luminoso, tritono = inestable.']}]},
{id:3,part:2,title:'Escalas y tonalidades: la regla madre',sub:'Una fórmula para las doce tonalidades',
 lead:'Una receta de distancias que funciona desde cualquier nota.',
 blocks:[
 {p:'Una escala mayor es una receta: <span class="hl">tono, tono, semitono, tono, tono, tono, semitono</span>. Esa fórmula funciona desde cualquier nota, y por eso una sola forma sirve para las doce tonalidades.'},
 {w:'scale'},
 E({id:'3a',t:'Do mayor en una sola cuerda',min:3,bpm:60,steps:['Empieza en la cuerda 5, traste 3 (Do).','Sube aplicando la fórmula: trastes 3, 5, 7, 8, 10, 12, 14 y 15.','Di el grado de cada nota (1 a 8) mientras la tocas.','Marca con más fuerza los dos semitonos: 3–4 y 7–8.'],goal:'Tocas la escala en una cuerda diciendo los grados, de ida y vuelta.',fig:pts([[5,3,'1','root'],[5,5,'2'],[5,7,'3'],[5,8,'4'],[5,10,'5'],[5,12,'6'],[5,14,'7'],[5,15,'8','root']],{to:15})}),
 E({id:'3b',t:'La forma de una octava',min:4,bpm:60,steps:['Sol mayor desde la cuerda 6: trastes 3, 5 y 7.','Cuerda 5: trastes 3, 5 y 7.','Cuerda 4: trastes 4 y 5 (Fa♯ y Sol).','Sube y baja una nota por pulso; luego dos notas por pulso; sube 5 bpm cada vez que salga limpio.'],goal:'Tocas la forma a corcheas a 80 bpm sin errores.',fig:pts([[6,3,'1','root'],[6,5,'2'],[6,7,'3'],[5,3,'4'],[5,5,'5'],[5,7,'6'],[4,4,'7'],[4,5,'8','root']],{to:8})}),
 {p:'Una tonalidad es la escala más los acordes que nacen de ella. Tocar «en Sol mayor» significa que todas las notas y acordes salen de esa escala, con Sol como centro de reposo. Cada nota recibe un número, su <b>grado</b>: así puedes trasladar cualquier idea a otra tonalidad sin pensar en nombres.'},
 E({id:'3c',t:'Mueve la forma',min:4,bpm:70,steps:['Toca la misma forma empezando en el traste 5: es La mayor.','Ahora desde el traste 8: Do mayor.','Ahora desde el traste 1: Fa mayor.','Antes de cada repetición, di el nombre de la tónica.'],goal:'Tocas la escala mayor en cuatro tonalidades con una sola forma.',fig:pts([[6,5,'1','root'],[6,7,'2'],[6,9,'3'],[5,5,'4'],[5,7,'5'],[5,9,'6'],[4,6,'7'],[4,7,'8','root']],{to:10})}),
 E({id:'3d',t:'Toca por grados',min:3,steps:['Con la forma de Sol toca 1–3–5–8 y de regreso.','Toca 1–2–3–1 y 5–4–3–2–1.','Mueve la forma a La mayor y repite los mismos números.'],goal:'Los mismos números suenan igual en las dos tonalidades.',fig:pts([[6,3,'1','root'],[6,7,'3'],[5,5,'5'],[4,5,'8','root'],[5,5,'5'],[6,7,'3'],[6,3,'1','root'],[6,5,'2'],[6,7,'3'],[6,3,'1','root']],{to:8})}),
 E({id:'3e',t:'Transporta una melodía',min:5,steps:['«Cumpleaños feliz» en grados: 5 5 6 5 1 7 · 5 5 6 5 2 1 · 5 5 5 3 1 7 6 · 4 4 3 1 2 1 (el tercer 5 es una octava arriba).','Tócala en Do mayor (5 = Sol).','Tócala en Sol mayor y en La mayor usando la forma de una octava.'],goal:'Tocas la melodía en tres tonalidades sin escribir los nombres de las notas.'}),
 {box:'Errores comunes',ul:['Memorizar nombres de notas sin los grados: no podrás transportar.','Olvidar que los semitonos caen entre el 3 y el 4, y entre el 7 y el 8.','Confundir tonalidad con escala: la tonalidad incluye acordes y un centro.','Aprender doce formas distintas: es una sola forma que se mueve.']},
 {sec:'Transportar sin sufrir',p:'Si una canción está en Do y tu voz alcanza mejor en Re, sube todo un tono: cada grado se mueve dos semitonos. Como los grados no cambian, la melodía y las relaciones entre acordes se conservan.'},
 {trick:['Fórmula: T T S T T T S.','Grados clave: 1 tónica, 4 subdominante, 5 dominante.','Cada tonalidad tiene sostenidos o bemoles fijos (lección 9).','Para transportar, mueve la forma y conserva los grados.']}]},
{id:4,part:2,title:'Los modos, sin misticismo',sub:'Mismas notas, otra casa',
 lead:'Un modo es la escala mayor vista desde otra de sus notas.',
 blocks:[
 {p:'Un modo no es una escala nueva: es la misma escala mayor empezando por otro grado. Re dórico usa exactamente las notas de Do mayor, pero <span class="hl">Re es el centro de reposo</span>.'},
 {w:'mode'},
 E({id:'4a',t:'Mapa de modos en Do',min:4,bpm:60,steps:['Toca la escala de Do mayor siete veces, empezando cada vez en una nota distinta: Do, Re, Mi, Fa, Sol, La y Si.','Antes de cada vuelta di el nombre del modo: jónico, dórico, frigio, lidio, mixolidio, eólico, locrio.','Termina siempre en la nota donde empezaste.'],goal:'Nombras los siete modos en orden sin mirar.',fig:pts([[5,3,'Do','root'],[5,5,'Re'],[4,2,'Mi'],[4,3,'Fa'],[4,5,'Sol'],[3,2,'La'],[3,4,'Si'],[3,5,'Do','root']],{to:6})}),
 {p:'Lo que cambia es el carácter. Compara cada modo con la escala mayor: una o dos notas se alteran y eso basta para cambiar el color. Para tocarlo bien, apóyate en un acorde que fije el centro: la pista lo hace por ti.'},
 E({id:'4b',t:'Re dórico sobre su acorde',min:4,steps:['Inicia la pista: alterna Re menor y Sol mayor.','Toca solo notas de Do mayor, pero empieza y termina tus frases en Re.','Acentúa la sexta (Si): es la nota que hace dórico al modo.'],goal:'Tus frases suenan menores, pero cálidas, y terminan en Re.',track:{k:2,p:'dorico',st:'balada',bpm:72}}),
 E({id:'4c',t:'Sol mixolidio con sabor a rock',min:4,steps:['Inicia la pista: Sol – Fa – Do – Sol.','Toca Sol mayor, pero cambia el Fa♯ por Fa natural.','Busca el Fa sobre el acorde de Fa y escucha cómo encaja.'],goal:'Escuchas la diferencia entre Fa♯ (mayor) y Fa (mixolidio).',track:{k:1,p:'mixo',st:'rock',bpm:96}}),
 E({id:'4d',t:'Fa lidio flotante',min:3,steps:['Inicia la pista: Fa mayor y Sol mayor.','Toca las notas de Do mayor centradas en Fa.','Detente en Si (la cuarta aumentada) sobre el acorde de Fa y escucha el color.'],goal:'Reconoces el sonido brillante del lidio.',track:{k:11,p:'lidio',st:'balada',bpm:70}}),
 {box:'Qué modo sobre qué acorde (tonalidad mayor)',ul:['I → jónico · ii → dórico · iii → frigio','IV → lidio · V → mixolidio','vi → eólico · vii° → locrio']},
 {box:'Errores comunes',ul:['Creer que cada modo exige notas nuevas: son las de la mayor.','Tocar el modo sin un acorde que fije el centro: sonará como la mayor.','Memorizar siete formas por tonalidad: aprende una escala y mueve el centro.','Usar el locrio como centro estable.']},
 {trick:['Modo = escala mayor desde otro grado: 1 jónico, 2 dórico, 3 frigio, 4 lidio, 5 mixolidio, 6 eólico, 7 locrio.','Dórico = menor con 6ª mayor.','Mixolidio = mayor con 7ª menor.','Lidio = mayor con 4ª aumentada.','No cambias de notas: cambias de centro.']}]},
{id:5,part:2,title:'Acordes: de dónde salen realmente',sub:'Terceras apiladas y escala armonizada',
 lead:'Un acorde es una pila de terceras sacada de la escala.',
 blocks:[
 {p:'Toma una nota, salta una de la escala, toma la siguiente, salta otra y toma la siguiente: <span class="hl">raíz, tercera y quinta</span>. Si la tercera es mayor, el acorde es mayor; si es menor, el acorde es menor.'},
 {w:'chord',types:['maj','min','dim','aug']},
 E({id:'5a',t:'Tríadas en tres cuerdas',min:4,bpm:60,steps:['Do mayor en las cuerdas 3, 2 y 1: trastes 5, 5 y 3.','Baja un traste la nota de la cuerda 2: ahora es Do menor (la tercera bajó).','Mueve la forma al traste 7 (Re) y al traste 2 (La).','Alterna mayor y menor cuatro pulsos cada una.'],goal:'Conviertes cualquier tríada mayor en menor sin pensarlo.',fig:pts([[3,5,'1','root'],[2,5,'3'],[1,3,'5']],{to:7})}),
 E({id:'5b',t:'Encuentra la tercera',min:3,steps:['En los acordes abiertos de Mi, La y Re, localiza la nota que es tercera.','Bájala un semitono para convertirlos en Mi menor, La menor y Re menor.','Escucha el cambio de luminoso a sombrío.'],goal:'Señalas la tercera de los tres acordes.',fig:chords(ch('E','Em','A','Am','D','Dm'))}),
 {w:'harm'},
 {p:'Al armar un acorde sobre cada grado de la escala mayor, las notas ya vienen dadas: mayores en I, IV y V; menores en ii, iii y vi; disminuido en vii. Por eso los acordes de una canción se llevan bien entre sí.'},
 E({id:'5c',t:'La escala armonizada',min:5,bpm:70,steps:['Toca en orden: Do, Rem, Mim, Fa, Sol, Lam y Si° (x2343x).','Cuatro golpes por acorde.','Di el grado en voz alta mientras tocas: I, ii, iii, IV, V, vi, vii°.','Repite en Sol mayor usando la tabla de arriba.'],goal:'Tocas los siete acordes de dos tonalidades nombrando los grados.',fig:chords(ch('C','Dm','Em','F','G','Am','Bdim'))}),
 E({id:'5d',t:'Arpegios 1–3–5',min:3,bpm:60,steps:['Arpegio de Do: Do (5/3), Mi (4/2), Sol (3/0), Do (2/1), Mi (1/0).','Toca nota por nota, una por pulso, de ida y vuelta.','Haz lo mismo con La menor.'],goal:'Escuchas cada nota del acorde por separado.',fig:pts([[5,3,'1','root'],[4,2,'3'],[3,0,'5'],[2,1,'1','root'],[1,0,'3']],{to:5})}),
 {box:'Errores comunes',ul:['Creer que mayor y menor se distinguen por la raíz: se distinguen por la tercera.','Olvidar que el acorde del grado vii es disminuido.','Memorizar acordes por tonalidad en vez de armarlos con la regla.','Omitir la tercera: es la nota que define el carácter.']},
 {sec:'Inversiones',p:'El mismo acorde puede tener la tercera o la quinta como nota más grave. Las notas son las mismas; cambia cuál suena abajo. En guitarra aparecen solas al tocar un acorde en distintas zonas del mástil (lección 7).'},
 {trick:['Mayor 1–3–5 · menor 1–♭3–5.','Disminuido 1–♭3–♭5 · aumentado 1–3–♯5.','Escala mayor: I ii iii IV V vi vii°.','Mayores: I, IV, V. Menores: ii, iii, vi.']}]},
{id:6,part:2,title:'Séptimas, tensiones y color',sub:'Cuatro notas y más',
 lead:'Añade una nota y cambia el color sin cambiar la función.',
 blocks:[
 {p:'Añadir una cuarta nota a la pila de terceras da una <span class="hl">séptima</span>. Con séptima mayor el acorde suena suave y nostálgico (maj7); con séptima menor sobre un acorde mayor aparece el dominante (7), que pide resolver.'},
 {w:'chord',types:['maj7','dom7','m7','m7b5','sus2','sus4','add9','dom9'],init:{k:0,t:'dom7'}},
 E({id:'6a',t:'De tríada a séptima',min:4,bpm:60,steps:['Toca Do (x32010), luego Do maj7 (x32000), luego Do7 (x32310). Cuatro golpes cada uno.','Escucha qué nota cambia: Do, Si, Si♭.','Toca La menor (x02210) y La m7 (x02010).'],goal:'Describes con tus palabras el color de cada acorde.',fig:chords(ch('C','Cmaj7','C7','Am','Am7'))}),
 E({id:'6b',t:'ii – V – I con séptimas',min:4,steps:['Inicia la pista: Rem7 – Sol7 – Do maj7.','Rasguea junto a la pista: Rem7 (xx0211), Sol7 (320001), Do maj7 (x32000).','Escucha la séptima de cada acorde bajar un semitono al siguiente: Do → Si y Fa → Mi.'],goal:'Cambias de acorde a tiempo durante cuatro vueltas.',track:{k:0,p:'iivi',st:'balada',bpm:70}}),
 {p:'Las tensiones (9, 11, 13) son notas de la escala una octava arriba: la 9 es la 2, la 11 es la 4 y la 13 es la 6. Dan color sin cambiar la función del acorde.'},
 {w:'harm',init:{k:0,sev:1}},
 E({id:'6c',t:'Acordes sus que resuelven',min:3,bpm:70,steps:['Re sus4 (xx0233) dos pulsos y Re (xx0232) dos pulsos.','La sus2 (x02200) y La (x02220).','Combina: Re sus4 – Re – La sus2 – La.'],goal:'Sientes que el sus pide volver al acorde normal.',fig:chords(ch('Dsus4','D','Asus2','A'),2)}),
 E({id:'6d',t:'Las séptimas de la escala',min:5,bpm:70,steps:['Toca en orden: Do maj7, Rem7, Mim7, Fa maj7, Sol7, Lam7 y Si m7♭5 (x2323x).','Cuatro golpes por acorde.','Señala cuál es el único dominante (Sol7).'],goal:'Tocas los siete acordes con séptima sin detenerte.',fig:chords(ch('Cmaj7','Dm7','Em7','Fmaj7','G7','Am7','Bm7b5'))}),
 {box:'Errores comunes',ul:['Poner séptima mayor en un dominante: el dominante lleva ♭7.','Creer que m7♭5 es raro: es el acorde del grado vii.','Cargar tensiones en todos los acordes: úsalas con intención.','Confundir sus con add: sus quita la tercera, add la conserva.']},
 {sec:'La séptima baja, la tercera recibe',p:'En ii–V–I, la séptima de cada acorde baja un semitono hasta la tercera del siguiente: Do (7ª de Rem7) baja a Si (3ª de Sol7) y Fa (7ª de Sol7) baja a Mi (3ª de Do maj7). Por eso esta cadencia suena tan natural.'},
 {trick:['maj7: suave · 7: tensión · m7: cálido · m7♭5: inestable.','9 = 2, 11 = 4, 13 = 6.','sus sustituye la 3ª por la 2ª o la 4ª.','El 7 dominante lleva un tritono entre su 3ª y su 7ª.']}]},
{id:7,part:3,title:'CAGED: el mástil completo sobre una idea',sub:'Cinco formas que cubren todo el cuello',
 lead:'Cinco acordes abiertos convertidos en formas móviles.',
 blocks:[
 {p:'Los cinco acordes abiertos más comunes (<b>C, A, G, E y D</b>) son cinco formas. Al desplazarlas con cejilla sirven para cualquier tonalidad. Juntas cubren todo el mástil y <span class="hl">siempre aparecen en el mismo orden</span>: C, A, G, E, D y vuelta a empezar.'},
 {w:'caged'},
 E({id:'7a',t:'Las cinco formas de Do',min:5,bpm:60,steps:['Abierta: forma de C (x32010).','Traste 3: forma de A (x35553).','Traste 5: forma de G (8–7–5–5–5–8, toca solo las cuerdas 4, 3 y 2 si te cuesta).','Traste 8: forma de E (8–10–10–9–8–8). Traste 10: forma de D (xx10–12–13–12).','Cuatro golpes por forma y di dónde está la raíz.'],goal:'Recorres las cinco formas de Do sin mirar el diagrama.',fig:chords([['C · forma C',[null,3,2,0,1,0]],['C · forma A',[null,3,5,5,5,3]],['C · forma G',[8,7,5,5,5,8]],['C · forma E',[8,10,10,9,8,8]],['C · forma D',[null,null,10,12,13,12]]])}),
 E({id:'7b',t:'La raíz primero',min:3,steps:['Para Re, encuentra sus raíces en las cuerdas 6, 5 y 4.','Arma alrededor de cada raíz la forma que le corresponde: E (cuerda 6), A o C (cuerda 5), D (cuerda 4).','Repite con Sol.'],goal:'Construyes tres formas de un acorde partiendo de la raíz.'}),
 {p:'Elige una tonalidad y una forma: la raíz (en rojo) marca el centro del acorde en cada zona. Esa misma zona sirve después para tocar la escala y el arpegio.'},
 E({id:'7c',t:'I – IV – V en una sola zona',min:4,bpm:80,steps:['En Sol: Sol (forma E, traste 3), Do (forma A, traste 3) y Re (forma A, traste 5).','Cuatro golpes cada uno, sin mover la mano más de dos trastes.','Repite en La: traste 5 y 7.'],goal:'Cambias de acorde sin saltar por el mástil.',fig:chords([['G · forma E',[3,5,5,4,3,3]],['C · forma A',[null,3,5,5,5,3]],['D · forma A',[null,5,7,7,7,5]],['G · forma E',[3,5,5,4,3,3]]])}),

 {box:'Errores comunes',ul:['Tocar la forma sin identificar la raíz: pierdes el centro.','Aprender CAGED solo como acordes, sin relacionarlo con escalas.','Pensar que hay una forma mejor: todas son válidas.','Saltarte el orden: las formas siempre se enlazan C–A–G–E–D.']},
 {trick:['Orden sobre el mástil: C – A – G – E – D.','Raíz por forma: C→cuerda 5 · A→5 · G→6 · E→6 · D→4.','La cejilla mueve la forma: el traste indica la distancia a la forma abierta.','Reconoce la forma y sabrás qué escala va en esa zona.']}]},
{id:8,part:3,title:'Progresiones: por qué las canciones funcionan',sub:'Funciones y números romanos',
 lead:'Salir de casa, tensar, regresar.',
 blocks:[
 {p:'Cada acorde de la tonalidad cumple una función. La <b>tónica</b> (I) es el reposo; la <b>subdominante</b> (IV, ii) se aleja del reposo; la <b>dominante</b> (V) crea tensión que <span class="hl">pide volver</span>. Una progresión es un pequeño viaje: salir, tensar, regresar.'},
 {w:'prog'},
 E({id:'8a',t:'I – V – vi – IV con pista',min:5,steps:['Inicia la pista en Sol: Sol – Re – Mim – Do.','Rasguea con ella cuatro vueltas.','Cambia la tonalidad a Re y luego a La en el reproductor y repite.'],goal:'Tocas la misma progresión en tres tonalidades.',track:{k:1,p:'pop',st:'balada',bpm:76}}),
 E({id:'8b',t:'Siente la función',min:3,bpm:70,steps:['Toca Do – Fa – Sol y detente en Sol: escucha la tensión.','Resuelve a Do.','Ahora toca Fa – Sol – Lam: es una cadencia rota, el oído esperaba Do.'],goal:'Explicas por qué Sol pide volver a Do.',fig:chords(ch('C','F','G','C','F','G','Am'))}),
 {p:'Escribir progresiones con números romanos las vuelve universales: I–V–vi–IV es la misma canción en cualquier tonalidad. Cambia el tono, no el patrón.'},
 E({id:'8c',t:'Blues en La',min:5,steps:['Inicia la pista: blues de 12 compases en La.','Rasguea La7, Re7 y Mi7 siguiendo el cambio.','Cuenta los compases: 4 en La7, 2 en Re7, 2 en La7, Mi7, Re7, La7, Mi7.'],goal:'Llegas al final de tres vueltas sin perderte.',track:{k:3,p:'blues',st:'rock',bpm:88}}),
 E({id:'8d',t:'Escribe con números',min:5,steps:['Elige una canción que sepas tocar.','Escribe sus acordes y su tonalidad.','Conviértelos a números romanos con la tabla de la lección 5.','Tócala en otra tonalidad usando solo los números.'],goal:'Transportas una canción real sin buscarla en internet.'}),
 {box:'Errores comunes',ul:['Creer que una progresión solo funciona en una tonalidad.','Olvidar que vi es menor y su carácter es distinto al de I.','Tocar todos los acordes con el mismo ritmo: la función se siente con acentos y silencios.','Cambiar de acorde sin pensar en la función del siguiente.']},
 {sec:'Sustituciones sencillas',p:'Dos acordes que comparten dos notas pueden reemplazarse: iii sustituye a I (Mi menor y Do mayor comparten Mi y Sol), ii a IV, y vii° a V. Prueba en I–IV–V–I cambiar IV por ii y el I final por vi.'},
 {trick:['T: I, vi, iii · S: IV, ii · D: V, vii°.','I–V–vi–IV, I–vi–IV–V e I–IV–V cubren cientos de canciones.','ii–V–I: la cadencia básica del jazz.','Blues de 12 compases: I (4) · IV (2) · I (2) · V IV I V.']}]},
{id:9,part:3,title:'El círculo de quintas y la modulación',sub:'Doce tonalidades en un solo mapa',
 lead:'Las tonalidades vecinas comparten casi todo.',
 blocks:[
 {p:'El círculo de quintas ordena las doce tonalidades por su cantidad de sostenidos o bemoles. Cada paso a la derecha <span class="hl">sube una quinta</span> y añade un sostenido; a la izquierda baja una quinta y añade un bemol. Dentro, cada tonalidad mayor tiene su relativa menor.'},
 {w:'circle'},
 E({id:'9a',t:'Dibuja el círculo',min:5,steps:['En una hoja, dibuja doce posiciones como un reloj.','Escribe Do arriba y avanza por quintas hacia la derecha: Sol, Re, La, Mi, Si, Fa♯.','Avanza por cuartas hacia la izquierda: Fa, Si♭, Mi♭, La♭, Re♭.','Añade dentro la relativa menor de cada una.'],goal:'Dibujas el círculo completo de memoria en menos de dos minutos.'}),
 E({id:'9b',t:'Recorre el círculo con acordes',min:4,bpm:70,steps:['Toca Do – Sol – Re – La – Mi subiendo por quintas, dos golpes cada uno.','Regresa por cuartas: Do – Fa – Si♭ – Mi♭.','Escucha cómo cada cambio suena natural.'],goal:'Recorres nueve tonalidades sin detenerte.',fig:chords(ch('C','G','D','A','E','C','F','Bb','Eb'),2)}),
 {p:'Las tonalidades vecinas comparten casi todas sus notas y acordes, por eso las canciones modulan a la dominante o a la subdominante con naturalidad. Un <b>acorde pivote</b>, común a las dos tonalidades, hace de puente.'},
 E({id:'9c',t:'Modula con un pivote',min:4,bpm:70,steps:['En Do: Do – Lam – Fa – Sol – Do.','Usa Lam como pivote (es ii de Sol): Lam – Re7 – Sol.','Quédate en Sol: Sol – Mim – Do – Re – Sol.'],goal:'Escuchas el momento en que cambia la casa.',fig:chords(ch('C','Am','F','G','C','Am','D7','G','Em','C','D','G'))}),
 {box:'Errores comunes',ul:['Memorizar el círculo sin entender la regla: cada quinta, un sostenido más.','Confundir Fa♯ y Sol♭ mayor: es la misma tonalidad escrita distinto.','Creer que modular exige un pivote: es un recurso, no la única vía.','Olvidar que la relativa menor comparte armadura.']},
 {sec:'Trucos para la armadura',p:'Los sostenidos llegan siempre en el mismo orden: Fa, Do, Sol, Re, La, Mi, Si; los bemoles, al revés. Con sostenidos, toma el último y sube un semitono: es la tónica. Con bemoles, la tónica es el penúltimo (con un solo bemol, la tonalidad es Fa).'},
 {trick:['Sentido horario: +1 sostenido por paso (+5ª).','Sentido antihorario: +1 bemol por paso (+4ª).','Relativa menor: sexto grado de la mayor.','Vecinas: IV y V comparten 6 de 7 notas.']}]},
{id:10,part:4,title:'Improvisar con intención',sub:'Cinco cajas y notas objetivo',
 lead:'La caja es la forma; la intención está en dónde empiezas y dónde terminas.',
 blocks:[
 {p:'La pentatónica tiene cinco notas que casi nunca chocan con el acorde: por eso funciona en blues, rock y pop. La pentatónica menor de La y la mayor de Do <span class="hl">usan las mismas notas</span>.'},
 {w:'penta'},
 E({id:'10a',t:'Caja 1 al metrónomo',min:4,bpm:60,steps:['Pentatónica de La menor, caja 1, traste 5.','Sube y baja una nota por pulso.','Luego dos notas por pulso.','Sube 5 bpm cada vez que salga limpia.'],goal:'Tocas la caja a corcheas a 90 bpm.',fig:boxFig(3,'min',1,10)}),
 E({id:'10b',t:'Tres notas, una frase',min:4,steps:['Inicia la pista de blues en La.','Improvisa solo con La, Do y Re de la caja 1.','Toca dos compases y deja dos de silencio.','Varía el ritmo, no las notas.'],goal:'Tus frases suenan a pregunta y respuesta.',track:{k:3,p:'blues',st:'rock',bpm:84}}),
 {p:'Aprende las cinco cajas, que cubren todo el mástil, y enlázalas. Después añade intención: apunta a las notas del acorde en los tiempos fuertes y termina las frases en la raíz o en otra nota del acorde.'},
 E({id:'10c',t:'Une la caja 1 y la 2',min:4,bpm:60,steps:['Sube por la caja 1 hasta la cuerda 3.','Desliza un dedo dos trastes y sigue en la caja 2.','Baja por la caja 2 y regresa a la 1.'],goal:'Cruzas de una caja a otra sin detenerte.',fig:boxFig(3,'min',0,12,[5,10])}),
 E({id:'10d',t:'Apunta al acorde',min:5,steps:['Inicia la pista en La menor: Lam – Fa – Do – Sol.','Termina cada frase en la raíz del acorde que suena.','Cuando lo domines, termina en su tercera.'],goal:'Cada final de frase coincide con el acorde.',track:{k:3,p:'menor',st:'balada',bpm:72}}),
 E({id:'10e',t:'Pentatónica mayor en ranchera',min:5,steps:['Inicia la pista ranchera en Sol.','Toca la pentatónica mayor de Sol (las mismas cajas que Mi menor).','Prueba terceras en pares: Si–Re, Do–Mi, Re–Sol, como en un requinto.'],goal:'Tu melodía suena alegre y termina en Sol.',track:{k:1,p:'ranchera',st:'ranchera',bpm:120}}),
 {box:'Errores comunes',ul:['Tocar la caja de arriba abajo sin frases: una escala no es una melodía.','Usar siempre la caja 1: enlaza al menos dos.','Olvidar el acorde de fondo: la intención nace de él.','Abusar de la blue note: úsala de paso.']},
 {sec:'Frases con pregunta y respuesta',p:'Una buena frase tiene dos o cuatro notas, un silencio y otra frase que le responde. Alterna notas largas y cortas y deja que el silencio también hable.'},

      chIdx.forEach((i,j)=>{let s=Math.round(pos[i]*slots);s=Math.max(s,prev+1);s=Math.min(s,slots-(n-j));s=Math.max(s,0);prev=s;pcs[i].t=start+s*slotB;anc.push({p:pos[i],t:pcs[i].t})});
      anc.push({p:1,t:start+dur});
      pcs.forEach((pc,i)=>{if(pc.p)return;let lo=anc[0],hi=anc[anc.length-1];
        for(const x of anc){if(x.p<=pos[i])lo=x;else{hi=x;break}}
        pc.t=hi.p>lo.p?lo.t+(pos[i]-lo.p)/(hi.p-lo.p)*(hi.t-lo.t):lo.t});
    }
    pcs.forEach((pc,pi)=>{if(pc.text.trim())ev.push({b:pc.t,type:'lit',li,pi});if(pc.p)ev.push({b:pc.t,type:'chord',p:pc.p,li,pi})});
    ev.push({b:start,type:'line',li});
    lines.push({li,start,dur});
    b=start+dur;
  });
  total=b;
  return{ev,lines,total};
}

function capoHint(key,shift){
  const target=(key.pc+shift+120)%12,easy=key.minor?[9,4,2]:[0,7,2,9,4];
  for(let c=0;c<=7;c++){const shape=(target-c+12)%12;if(easy.includes(shape))return c===0?'Se toca con acordes abiertos, sin capo.':`Truco: capo en el traste ${c} y toca con las formas de ${noteName(shape,false,DB.notation==='es')}${key.minor?'m':''}.`}
  return'';
}

  mount(r){

      },s=>{

        (BK[a]||[]).forEach(e=>{

const TUN={stream:null,an:null,src:null,iv:null,buf:null,hist:[]};
function detectPitch(buf,sr){
  let n=buf.length,rms=0;for(let i=0;i<n;i++)rms+=buf[i]*buf[i];rms=Math.sqrt(rms/n);
  if(rms<.01)return -1;
  let r1=0,r2=n-1;const th=.2;
  for(let i=0;i<n/2;i++)if(Math.abs(buf[i])<th){r1=i;break}
  for(let i=1;i<n/2;i++)if(Math.abs(buf[n-i])<th){r2=n-i;break}
  const b=buf.subarray(r1,r2);n=b.length;
  const maxLag=Math.min(n-1,Math.floor(sr/60)),c=new Float32Array(maxLag+2);
  for(let l=0;l<=maxLag+1;l++){let s=0;for(let j=0;j<n-l;j++)s+=b[j]*b[j+l];c[l]=s}
  let d=0;while(d<maxLag&&c[d]>c[d+1])d++;
  let mv=-1,mp=-1;for(let i=d;i<=maxLag;i++)if(c[i]>mv){mv=c[i];mp=i}
  if(mp<1)return -1;
  let T=mp;const x1=c[T-1],x2=c[T],x3=c[T+1],a=(x1+x3-2*x2)/2,bb=(x3-x1)/2;if(a)T=T-bb/(2*a);
  const f=sr/T;return f>60&&f<1200?f:-1;
}
async function tunerStart(onData,onErr){

    const c=ac();TUN.stream=s;TUN.src=c.createMediaStreamSource(s);TUN.an=c.createAnalyser();TUN.an.fftSize=2048;
    TUN.src.connect(TUN.an);TUN.buf=new Float32Array(TUN.an.fftSize);TUN.hist=[];

  $$('[data-nav]').forEach(a=>{const on=a.dataset.nav===sec;if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  $('#ttl').textContent=v.title;
  const bk=$('#back');bk.hidden=!v.back;if(v.back)bk.href=v.back;
  // página nueva en cada vista: así no se acumulan los clics de vistas anteriores
  const old=$('#page'),pg=old.cloneNode(false);old.replaceWith(pg);pg.innerHTML=v.html;
  document.title=v.title==='Mades Guitar Hero'?v.title:v.title+' · Mades Guitar Hero';
  if(v.mount)UNMOUNT=v.mount(pg)||null;
  if(!(p[0]==='leccion'&&p[2]))window.scrollTo(0,0);
  paintPlayer();
}
/* ---------- clics globales ---------- */
document.addEventListener('click',e=>{
  const x=e.target.closest('[data-x]');if(x&&exAction(x))return;
  const dg=e.target.closest('.dg');
  if(dg&&dg.dataset.s&&!e.target.closest('#gamehost,#rtgame')){playNotes([OPEN_MIDI[+dg.dataset.s]+ +dg.dataset.f],'chord');return}
  const pl=e.target.closest('[data-play]');if(pl){const L=pl.dataset.play.split(',').map(Number),st=+pl.dataset.step||.5;playNotes(L,pl.dataset.mode,st);lightSequence(pl,L,pl.dataset.mode,st);return}
  const sq=e.target.closest('[data-seq]');if(sq){playSeq(sq.dataset.seq.split('|').map(c=>c.split('.').map(Number)),+sq.dataset.beat||1)}
});
/* ---------- arranque ---------- */
document.body.insertAdjacentHTML('afterbegin',`<div class="shell">
 <nav class="side" aria-label="Secciones"><div class="brand"><span class="logo">${logo()}</span>Mades<br>Guitar Hero</div>${NAV.map(([h,l,ic,k])=>`<a href="${h}" data-nav="${k}">${ic}${l}</a>`).join('')}</nav>
 <main><header class="topbar"><div class="in"><a class="icon-btn" id="back" href="#/" aria-label="Volver" hidden>${IC.back}</a><span class="ttl" id="ttl"></span></div></header><div class="page" id="page"></div></main>
</div>
<nav class="tabs" aria-label="Secciones">${NAV.map(([h,l,ic,k])=>`<a class="tab" href="${h}" data-nav="${k}">${ic}${l}</a>`).join('')}</nav>`);
checkAch(true);persist();
window.addEventListener('hashchange',route);
route();
if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}


</script>
