  {box:'Errores comunes',ul:['Empezar directo con las notas más agudas.','Cantar a todo volumen para calentar.','Seguir cantando con dolor o ronquera.']},
  {trick:['Respiración → trino → sirena → escala → arpegio → nota larga.','Agua todo el día.','Nada de gritar ni carraspear.','15 minutos diarios valen más que 2 horas un día.']}]}];
const lessonArt=i=>{const l=LESSONS.find(x=>x.id===i);return coverArt(l.hue,l.motif,i,'l'+i)};
const doneCount=l=>{const xs=ALLEX.filter(x=>!l||x.lesson===l);return[xs.filter(x=>DB.done[x.id]).length,xs.length]};
const nextEx=()=>ALLEX.find(x=>!DB.done[x.id]);

/* ---------- carril de tono: barras de las notas que vienen y la línea de tu voz ----------
   Todo va en «tiempo de audio» (AC.currentTime). Lo que se ve va retrasado outLat() para coincidir con lo que se oye,
   y las lecturas del micrófono se marcan con ese mismo tiempo (MIC en 3-pitch.js), así que se califican contra la barra que ves. */
const cssv=k=>getComputedStyle(document.documentElement).getPropertyValue('--'+k).trim();
function laneColors(){return{fg:cssv('fg'),muted:cssv('muted'),line:cssv('line'),acc:cssv('accent'),acct:cssv('accent-text'),root:cssv('root'),good:cssv('good'),bad:cssv('bad'),bg:cssv('surface')}}
// valor objetivo en el tiempo t (las sirenas se deslizan de una nota a la siguiente)
const tgtAt=(g,t)=>g.m2==null?g.m:g.m+(g.m2-g.m)*Math.max(0,Math.min(1,(t-g.t0)/(g.t1-g.t0)));
const scoreCol=(C,s)=>s>=.7?C.good:s>=.4?'#f5b43c':C.root;
function laneDraw(cv,st,now){
  const C=st.C,dpr=Math.min(2,devicePixelRatio||1),W=cv.clientWidth,H=cv.clientHeight;
  if(!W||!H)return;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
  const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);
  const PH=W*.3,SEC=st.sec||4,pps=(W-PH)/SEC,past=PH/pps;
  // la ventana vertical sigue a las notas que se ven, con suavidad
  let lo=99,hi=0;st.targets.forEach(g=>{if(g.t1>now-past&&g.t0<now+SEC){lo=Math.min(lo,g.m,g.m2==null?99:g.m2);hi=Math.max(hi,g.m,g.m2==null?0:g.m2)}});
  if(st.fixed){lo=Math.min(lo,st.fixed[0]);hi=Math.max(hi,st.fixed[1])}
  if(lo>hi){lo=st.vlo||57;hi=st.vhi||69}
  lo-=3;hi+=3;if(hi-lo<12){const c=(lo+hi)/2;lo=c-6;hi=c+6}
  if(st.vlo==null){st.vlo=lo;st.vhi=hi}else{st.vlo+=(lo-st.vlo)*.06;st.vhi+=(hi-st.vhi)*.06}
  const L=st.vlo,Hh=st.vhi,py=(H-16)/(Hh-L),Y=m=>H-8-(m-L)*py,X=t=>PH+(t-now)*pps;
  // renglones de semitono: Do marcado con su nombre, naturales tenues
  x.font='600 10px system-ui,-apple-system,Segoe UI,sans-serif';x.textBaseline='middle';
  for(let m=Math.ceil(L);m<=Hh;m++){const pc=pcOf(m),y=Y(m);if(!NATPC.includes(pc))continue;
    x.globalAlpha=pc===0?.55:.22;x.strokeStyle=C.line;x.lineWidth=pc===0?1.2:1;x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke();
    if(pc===0||st.labels){x.globalAlpha=pc===0?.85:.5;x.fillStyle=C.muted;x.fillText(nnTxt(m),4,y>16?y-7:y+8)}}
  x.globalAlpha=1;
  // barras
  const bh=Math.max(7,Math.min(22,py*.85));
  st.targets.forEach(g=>{
    if(g.t1<now-past-.2||g.t0>now+SEC+.2)return;
    const x0=X(g.t0)+1,x1=X(g.t1)-1,done=g.t1<now&&g.n>0,sc=done?g.h/g.n:0;
    const col=g.ph==='L'?C.muted:done?scoreCol(C,sc):C.acc;
    if(g.m2!=null){x.lineCap='round';x.lineWidth=bh;x.strokeStyle=col;x.globalAlpha=g.ph==='L'?.28:done?.75:.45;x.beginPath();x.moveTo(x0,Y(g.m));x.lineTo(x1,Y(g.m2));x.stroke();x.globalAlpha=1;return}
    x.globalAlpha=g.ph==='L'?.3:done?.8:(g.t0<=now&&g.t1>now)?.75:.5;x.fillStyle=col;
    const w=Math.max(4,x1-x0),r=Math.min(bh/2,w/2),y0=Y(g.m)-bh/2;
    x.beginPath();x.roundRect?x.roundRect(x0,y0,w,bh,r):x.rect(x0,y0,w,bh);x.fill();x.globalAlpha=1;
    if(g.syl&&w>14){x.fillStyle=C.fg;x.globalAlpha=.9;x.font='600 11px system-ui,-apple-system,Segoe UI,sans-serif';x.fillText(g.syl.slice(0,Math.max(1,Math.floor(w/7))),x0+4,y0-8);x.globalAlpha=1}
  });
  // línea de ahora
  x.strokeStyle=C.fg;x.globalAlpha=.35;x.lineWidth=1.5;x.beginPath();x.moveTo(PH,0);x.lineTo(PH,H);x.stroke();x.globalAlpha=1;
  // tu voz
  const tr=st.trail;x.lineWidth=3;x.lineCap='round';x.lineJoin='round';
  for(let i=1;i<tr.length;i++){const a=tr[i-1],b=tr[i];if(a.m==null||b.m==null||b.t-a.t>.15||b.t<now-past)continue;
    x.strokeStyle=b.hit?C.good:b.off?C.root:C.fg;x.beginPath();x.moveTo(X(a.t),Y(a.m));x.lineTo(X(b.t),Y(b.m));x.stroke()}
  const last=tr[tr.length-1];
  if(last&&last.m!=null&&now-last.t<.2){const yy=Y(last.m);x.fillStyle=last.hit?C.good:C.fg;x.shadowColor=x.fillStyle;x.shadowBlur=12;x.beginPath();x.arc(PH,Math.max(6,Math.min(H-6,yy)),6,0,7);x.fill();x.shadowBlur=0}
}
/* Arma una sesión con barras (targets), sonidos programados (ev) y tramos con letrero (segs). */
function drillSpec(d,o){
  const c=comfy(),span=Math.max(...d.pat.map(p=>p[0]==null?0:p[0])),beat=60/(o.bpm||d.bpm);
  const roots=[];for(let r=c.lo;r+span<=c.hi&&roots.length<8;r++)roots.push(r);
  if(!roots.length)roots.push(c.lo);
  if(o.dir==='ud')for(let i=roots.length-2;i>=0&&roots.length<14;i--)roots.push(roots[i]);
  const T0=AC.currentTime+.6,targets=[],ev=[],segs=[];let t=T0;
  const plen=d.pat.reduce((a,p)=>a+p[1],0)*beat;
  roots.forEach((R,ri)=>{
    ['L','S'].forEach(ph=>{
      if(ph==='S'&&o.mode==='junto')return;
      const s0=t;segs.push({t0:s0-(ph==='S'?beat:0),t1:s0+plen,ph:o.mode==='junto'?'J':ph,ri,R});
      if(ph==='L'||o.mode==='junto')ev.push({t:s0,fn:tt=>chordPad(R-12,tt,plen,.05)});
      d.pat.forEach((p,i)=>{
        const[off,b]=p,dur=b*beat;
        if(off!=null){
          const m=R+off,nx=d.glide&&d.pat[i+1]?R+d.pat[i+1][0]:null;
          targets.push({t0:t,t1:t+dur,m,m2:nx,ph:o.mode==='junto'?'S':ph,ri,n:0,h:0});
          if(ph==='L'||o.mode==='junto'){const tt=t,dd=dur;ev.push({t:tt,fn:z=>d.glide?guideTone(m,z,dd,ph==='L'?.2:.12,nx):o.mode==='junto'?guideTone(m,z,dd*.95,.12):piano(m,z,dd*.95,.24)})}
        }
        t+=dur;
      });
      // un pulso de respiro con click; antes de que cantes suena el acorde de tu nota
      if(ph==='L'){ev.push({t,fn:z=>{tick(z,'acc',null);chordPad(R-12,z,beat*.9,.04)}})}
      t+=beat;
    });
  });
  // clicks suaves en cada pulso mientras cantas
  segs.filter(s=>s.ph!=='L').forEach(s=>{for(let b=s.t0+beat;b<s.t1-.01;b+=beat)ev.push({t:b,fn:z=>tickSound(z,'sub')})});
  return{targets,ev:ev.sort((a,b)=>a.t-b.t),segs,end:t,rounds:roots.length,beat};
}
// transpone la melodía al centro de tu zona cómoda (de semitono en semitono)
function songShift(S){
  const ms=S.lines.flatMap(l=>(l.mel||[]).filter(n=>n.m!=null).map(n=>n.m)),c=comfy();
  return Math.round((c.lo+c.hi)/2-(Math.min(...ms)+Math.max(...ms))/2);
}
const CHPC={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function songSpec(S,o){
  const beat=60/(S.bpm*(o.speed||1)),sh=o.shift||0,T0=AC.currentTime+.5,targets=[],ev=[],segs=[],lines=[];
  for(let b=0;b<S.beats;b++)ev.push({t:T0+b*beat,fn:z=>tick(z,b?'beat':'acc',b?'beat':'bar')});
  let t=T0+S.beats*beat;segs.push({t0:T0,t1:t,ph:'C'});
  S.lines.forEach((L,li)=>{
    if(!L.mel)return;const l0=t;let si=-1;
    L.mel.forEach(n=>{
      const dur=n.d*beat;
      if(n.m!=null){
        if(!n.cont)si++;const syl=L.syl[si],m=n.m+sh;
        targets.push({t0:t,t1:t+dur,m,ph:'S',li,si,n:0,h:0,syl:n.cont?'':(syl?syl.x:'')});
        if(o.guide){const tt=t;ev.push({t:tt,fn:z=>guideTone(m,z,dur*.94,.13)})}
        if(!n.cont&&syl&&syl.ch&&o.chords){const ch=syl.ch.match(/^([A-G])([#b]?)(m(?!aj))?/);if(ch){let r=CHPC[ch[1]]+(ch[2]==='#'?1:ch[2]==='b'?-1:0)+sh;r=((r%12)+12)%12+48;if(r>55)r-=12;const tt=t;ev.push({t:tt,fn:z=>chordPad(r,z,beat*S.beats*.9,.05,!!ch[3])})}}
      }
      t+=dur;
    });
    lines.push({li,t0:l0,t1:t});segs.push({t0:l0,t1:t,ph:'S',li});
  });
  return{targets,ev:ev.sort((a,b)=>a.t-b.t),segs,end:t,lines,beat};
}
let PRACTICE=null; // la sesión en curso (para revisarla desde la consola)
/* Corre la sesión: programa el sonido 0.25 s adelante, dibuja y califica cada lectura del micrófono. */
function practiceRun(cv,spec,o){
  const st={C:laneColors(),targets:spec.targets,trail:[],sec:o.sec||4,labels:o.labels,fixed:o.fixed};
  let ei=0,raf=0,seg=-1,cur=null,alive=true;
  const tol=(DB.tol||50)/100;
  const frame=()=>{
    if(!alive)return;
    while(ei<spec.ev.length&&spec.ev[ei].t<AC.currentTime+.25){const e=spec.ev[ei++];if(e.t>AC.currentTime-.02)e.fn(e.t)}
    const now=AC.currentTime-outLat();
    const si=spec.segs.findIndex(s=>now>=s.t0&&now<s.t1);if(si!==seg){seg=si;o.onSeg&&o.onSeg(spec.segs[si]||null)}
    const g=spec.targets.find(x=>now>=x.t0&&now<x.t1)||null;if(g!==cur){cur=g;o.onNote&&o.onNote(g,now)}
    laneDraw(cv,st,now);
    if(now>spec.end+.4){stop(true);return}
    raf=requestAnimationFrame(frame);
  };
  const onMic=d=>{
    if(!alive)return;const s={t:d.t,m:d.m,hit:false,off:false};
    const g=spec.targets.find(x=>d.t>=x.t0&&d.t<x.t1);
    if(g&&g.ph==='S'){
      const grace=Math.min(.18,(g.t1-g.t0)*.3);
      if(d.t>=g.t0+grace&&d.t<g.t1-.03){g.n++;if(d.m!=null&&Math.abs(d.m-tgtAt(g,d.t))<=tol){g.h++;s.hit=true}else if(d.m!=null)s.off=true}
      else if(d.m!=null&&Math.abs(d.m-tgtAt(g,d.t))<=tol)s.hit=true;
    }
    st.trail.push(s);if(st.trail.length>400)st.trail.splice(0,100);
    o.onPitch&&o.onPitch(d,g);
  };
  const stop=fin=>{if(!alive)return;alive=false;cancelAnimationFrame(raf);if(MIC.on===onMic)MIC.on=null;o.onEnd&&o.onEnd(fin?spec:null)};
  if(MIC.stream)MIC.on=onMic;
  raf=requestAnimationFrame(frame);
  return PRACTICE={stop:()=>stop(false),st,onMic};
}
// calificación: promedio de las notas que cantaste (cada nota = fracción del tiempo dentro de la tolerancia)
function specScore(spec){const gs=spec.targets.filter(g=>g.ph==='S'&&g.n>0);if(!gs.length)return null;return gs.reduce((a,g)=>a+g.h/g.n,0)/gs.length}

/* ---------- narrador: lee la lección en voz alta (voz del dispositivo, español) ----------
   Versión del narrador de Roka Guitar sin el mástil: lee cada bloque y lo resalta. */
const NARR={on:false,paused:false,items:[],i:0,lesson:null,voice:null,tok:0,timers:[]};
const HAS_TTS='speechSynthesis' in window&&'SpeechSynthesisUtterance' in window;
function pickVoice(){
  if(!HAS_TTS)return null;const vs=speechSynthesis.getVoices();
  const by=p=>vs.find(v=>v.lang&&v.lang.toLowerCase().replace('_','-').startsWith(p));
  return by('es-mx')||by('es-us')||by('es-419')||by('es-es')||by('es')||null;
}
if(HAS_TTS){speechSynthesis.onvoiceschanged=()=>{NARR.voice=pickVoice()};NARR.voice=pickVoice()}
function sayText(html){
  let t=String(html).replace(/<[^>]+>/g,'').replace(/[«»“”]/g,'');
  // «Do3» → «Do 3»; ♯/♭ y abreviaturas se leen completas
  t=t.replace(/\b(Do|Re|Mi|Fa|Sol|La|Si)([♯♭]?)(\d)\b/g,'$1$2 $3');
  t=t.replace(/♭/g,' bemol').replace(/♯/g,' sostenido').replace(/±/g,'más o menos ');
  t=t.replace(/(\d)-(\d)-(\d)-(\d)/g,'$1, $2, $3, $4').replace(/(\d)-(\d)-(\d)/g,'$1, $2, $3');
  t=t.replace(/\s*[–·→]\s*/g,', ').replace(/\bbpm\b/gi,'pulsos por minuto').replace(/%/g,' por ciento').replace(/\s+/g,' ').trim();
  return t;
}
const sentences=html=>{const t=String(html).replace(/<[^>]+>/g,'');return t.split(/(?<=[.!?])\s+(?=[A-ZÁÉÍÓÚÑ¿«0-9])/).map(s=>s.trim()).filter(Boolean)};
function buildNarration(l,root){
  const it=[],blk=i=>root.querySelector(`[data-nb="${i}"]`),head=root.querySelector('.lhead');
  it.push({el:head,text:`Lección ${l.id}. ${l.title}. ${l.lead}`});
  l.blocks.forEach((b,i)=>{
    const el=blk(i);if(!el)return;
    if(b.step){it.push({el,text:b.step+'. '+b.t+'.'});sentences(b.p).forEach(s=>it.push({el,text:s}))}
    else if(b.aim){const lis=$$('li',el);it.push({el,text:'Al terminar podrás:'});b.aim.forEach((t,k)=>it.push({el,li:lis[k],text:t}))}
    else if(b.key){it.push({el,text:'La idea clave.'});sentences(b.key).forEach(s=>it.push({el,text:s}))}
    else if(b.check){it.push({el,text:'Compruébalo. Contesta antes de ver la respuesta.'});b.check.forEach(([q])=>it.push({el,text:q}))}
    else if(b.box||b.trick){const lis=$$('li',el),arr=b.ul||b.ol||b.trick;it.push({el,text:(b.box||'Hoja de trucos')+'.'});arr.forEach((t,k)=>it.push({el,li:lis[k],text:t}))}
    else if(b.ex){const x=b.ex,lis=$$('ol li',el);it.push({el,text:`Ejercicio: ${x.t}.`});x.steps.forEach((s,k)=>it.push({el,li:lis[k],text:s}));it.push({el,li:el.querySelector('.goal'),text:'Lo logras cuando: '+x.goal})}
    else if(b.p)sentences(b.p).forEach(s=>it.push({el,text:s}));
  });
  it.push({el:null,text:'Fin de la lección. Ahora haz los ejercicios con la app.'});
  return it;
}
function speak(text){
  return new Promise(res=>{
    if(!HAS_TTS){setTimeout(res,600);return}
    const u=new SpeechSynthesisUtterance(text);u.lang=(NARR.voice&&NARR.voice.lang)||'es-MX';if(NARR.voice)u.voice=NARR.voice;u.rate=DB.narrRate||1;
    let done=false;const fin=()=>{if(!done){done=true;res()}};
    u.onend=fin;u.onerror=fin;
    try{speechSynthesis.speak(u)}catch(e){fin();return}
    NARR.timers.push(setTimeout(fin,Math.max(4000,text.length/(14*(DB.narrRate||1))*1000*2.2+3000)));
  });
}
const wait=ms=>new Promise(r=>NARR.timers.push(setTimeout(r,ms)));
async function narrRun(){
  const tok=++NARR.tok;
  while(NARR.on&&!NARR.paused&&NARR.tok===tok&&NARR.i<NARR.items.length){
    const item=NARR.items[NARR.i];
    $$('.narr').forEach(e=>e.classList.remove('narr'));
    if(item.el){item.el.classList.add('narr');if(item.li)item.li.classList.add('narr');const tgt=item.li||item.el,r=tgt.getBoundingClientRect();if(r.top<80||r.bottom>innerHeight-140)tgt.scrollIntoView({block:'center',behavior:'smooth'})}
    paintNarr();
    await speak(sayText(item.text));
    if(NARR.tok!==tok)return;
    await wait(150);
    if(NARR.tok!==tok)return;
    NARR.i++;
  }
  if(NARR.tok===tok&&NARR.i>=NARR.items.length)narrStop();
}
function narrStart(l,root){
  if(!HAS_TTS){toast('Este navegador no tiene voz para leer en voz alta.');return}
  narrStop(true);seqStop();
  NARR.on=true;NARR.paused=false;NARR.lesson=l.id;NARR.items=buildNarration(l,root);NARR.i=0;
  try{speechSynthesis.cancel()}catch(e){}
  paintNarr();narrRun();
}
function narrCancel(){NARR.tok++;NARR.timers.forEach(t=>clearTimeout(t));NARR.timers=[];try{HAS_TTS&&speechSynthesis.cancel()}catch(e){}}
function narrStop(silent){
  narrCancel();NARR.on=false;NARR.paused=false;
  $$('.narr').forEach(e=>e.classList.remove('narr'));
  const b=$('#narrbar');if(b)b.remove();if(!silent)paintNarr();
}
function narrJump(d){if(!NARR.on)return;narrCancel();NARR.i=Math.max(0,Math.min(NARR.items.length-1,NARR.i+d));NARR.paused=false;narrRun()}
function narrToggle(){if(!NARR.on)return;if(NARR.paused){NARR.paused=false;narrRun()}else{NARR.paused=true;narrCancel()}paintNarr()}
function paintNarr(){
  const btn=$('[data-narr="start"]');

  let bar=$('#narrbar');

   <span class="pl"><b>${NARR.paused?'En pausa':item.li?'Paso':'Leyendo'}</b> · ${NARR.i+1} de ${NARR.items.length}</span>
   <span class="seg">${[.85,1,1.2].map(v=>`<button data-narr="rate" data-v="${v}" aria-pressed="${(DB.narrRate||1)===v}">${v===1?'1×':v+'×'}</button>`).join('')}</span>
   <button class="icon-btn" data-narr="stop" aria-label="Cerrar">${IC.x}</button>`;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-narr]');if(!b)return;const a=b.dataset.narr;
  if(a==='start'){if(NARR.on){narrStop();return}const l=LESSONS.find(x=>x.id===+b.dataset.l);if(l)narrStart(l,$('#page'))}

const PULSE={n:4,beat:0,count:0,hideT:null,el:null};

/* Todos los clicks de la app pasan por aquí. v: 'bar' (tiempo 1), 'beat' o null (subdivisión). */
function tick(t,kind,v){
  if(v===undefined)v=kind==='acc'?'bar':kind==='beat'?'beat':null;

      go.innerHTML=playLbl(false,P[3],'',R.ph==='idle'?TKIC.mic:R.ph==='done'?IC.check:IC.next);

      $('#rdock',r).textContent=MIC.stream?'Escuchando…':R.ph==='done'?'Listo':'Micrófono apagado';$('#rre',r).hidden=R.ph==='idle';

/* ---------- respiración ---------- */
const BR={mode:'448',cycles:5};
function viewBreath(){

      $('#brtx',r).textContent=BR.mode==='448'?'Inhala 4 tiempos por la nariz, sostén 4 y suelta 8 con una «sss» pareja. Cinco ciclos.':'Inhala abajo y di «sss» parejo cerca del teléfono. La app cuenta mientras suene.';
      $('#brcap',r).textContent=BR.mode==='448'?'Mano en el ombligo: al inhalar la panza sale, los hombros no suben. Al sostener, no cierres la garganta: es como si siguieras inhalando.':'Meta: 15 segundos hoy, 25 en un mes. Lo que cuenta es que el sonido sea igual del principio al final.';
      $('#brbest',r).textContent=DB.breath?'Récord '+DB.breath.toFixed(1)+' s':'';
      $('#brdock',r).textContent=run?(BR.mode==='sss'?'Escuchando…':'Respirando'):'Listo';
      const m=$('#tmeta',r);if(m)m.textContent=BR.mode==='448'?'Guiada · 5 ciclos de 16 segundos':'Mide tu «sss» con el micrófono';
    };
    const stop=()=>{clearInterval(iv);iv=null;run=false;micStop();scale(.55);n.textContent=BR.mode==='448'?'4':'0';l.textContent='Listo';WAKE=Math.max(0,WAKE-(BR._w||0));BR._w=0;wake(false);paint()};
    const guided=()=>{
      ac();t0=performance.now();run=true;WAKE++;BR._w=1;wake(true);let lastSec=-1;
      iv=setInterval(()=>{
        const e=(performance.now()-t0)/1000,cyc=Math.floor(e/16),p=e%16;
        if(cyc>=BR.cycles){stop();bell();markDay();toast(logo()+'<span>Cinco ciclos completos. Buen aire.</span>');DB.today.respira=today();save();return}
        let ph,k,s;if(p<4){ph='Inhala';k=4-Math.floor(p);s=.55+.45*(p/4)}else if(p<8){ph='Sostén';k=8-Math.floor(p);s=1}else{ph='Suelta «sss»';k=16-Math.floor(p);s=1-.45*((p-8)/8)}
        scale(s);n.textContent=k;l.textContent=ph+' · ciclo '+(cyc+1)+' de '+BR.cycles;
        const sec=Math.floor(e);if(sec!==lastSec){lastSec=sec;if(AC)tickSound(AC.currentTime+.01,p<.5||Math.abs(p-4)<.5||Math.abs(p-8)<.5?'beat':'sub')}
      },80);
    };
    const measure=async()=>{
      $('#brmsg',r).innerHTML='';
      const ok=await micStart(()=>{},k=>{$('#brmsg',r).innerHTML=micErrHTML(k)});if(!ok)return;
      run=true;noise=0;on=0;cur=0;peak=0;const tStart=performance.now();l.textContent='Silencio… midiendo el ruido';
      iv=setInterval(()=>{

          else{l.textContent='Di «sss» parejo';}
        }else if(!on)l.textContent='Inhala abajo… y «sss»';
      },50);
      paint();
    };

    r.addEventListener('click',e=>{const b=e.target.closest('[data-brm]');if(!b)return;if(run)stop();BR.mode=b.dataset.brm;$$('[data-brm]',r).forEach(x=>x.setAttribute('aria-pressed',String(x===b)));n.textContent=BR.mode==='448'?'4':'0';paint()});

    });

// −19 → «1 octava y 7 semitonos abajo»
function shDesc(s){if(!s)return'Tono original';const a=Math.abs(s),o=Math.floor(a/12),k=a%12;return[o?o+(o>1?' octavas':' octava'):'',k?k+(k>1?' semitonos':' semitono'):''].filter(Boolean).join(' y ')+(s<0?' abajo':' arriba')}
function lyricHTML(S){return S.lines.map((L,li)=>`<p class="lyl" data-li="${li}">${L.syl.map((s,si)=>`<span class="syl" data-si="${si}">${esc(s.x)}</span>${s.sp?' ':''}`).join('')}</p>`).join('')}
function viewSing(id){
  const S=songById(id);if(!S)return viewSongs();
  const O={shift:DB['shift:'+id]!=null?DB['shift:'+id]:songShift(S),guide:DB.sguide!==false,chords:DB.schords!==false,speed:1};
  return{title:S.title,back:'#/canciones',html:`<div class="kplay tplay sing">
  ${toolHead('s'+id,S.title,S.artist,[SONGHUE[id]||218,SONGM[id]])}
  ${toolBar([['key','Tono',TKIC.key],['guide','Voz guía',TKIC.guide],['speed','Velocidad',TKIC.tempo],['tol','Tolerancia',TKIC.tol]])}
  ${toolPanels([['key','Tono',`<div class="row" style="justify-content:center"><button class="kic" data-sh="-1" aria-label="Medio tono abajo">${IC.minus}</button><span class="kkey" id="shv" style="min-width:110px;text-align:center;font-size:17px;line-height:1.2"></span><button class="kic" data-sh="1" aria-label="Medio tono arriba">${IC.plus}</button></div><div class="chips" style="justify-content:center;margin-top:8px"><button class="chip" data-sh="auto">Ajustar a mi voz</button></div>`],
    ['guide','Voz guía',`<div class="chips"><button class="chip" data-tg="guide" aria-pressed="${O.guide}">Melodía guía</button><button class="chip" data-tg="chords" aria-pressed="${O.chords}">Acordes de piano</button></div><p class="cap" style="margin:6px 0 0">Con audífonos la calificación es más exacta: sin ellos el micrófono también oye la guía.</p>`],
    ['speed','Velocidad',chipRow('speed','Velocidad',[{v:.75,l:'75 %'},{v:.9,l:'90 %'},{v:1,l:'Normal'}],1)],
    ['tol','Tolerancia',chipRow('tol','Tolerancia',[{v:25,l:'Estricta',s:'±25 cents'},{v:50,l:'Normal',s:'±50'},{v:75,l:'Relajada',s:'±75'}],DB.tol||50)]])}
  <div class="card dstage"><canvas class="lane" id="lane" aria-label="Notas de la melodía y línea de tu voz"></canvas></div>
  <div class="lyrics" id="lyr">${lyricHTML(S)}</div>

  ${toolDock(`<span class="tm" id="ddock"></span><div class="ktrans"><button class="kplayb" id="dgo"></button></div><span class="tm" id="dbest"></span>`)}
  </div>`,
  mount(r){
    const go=$('#dgo',r),cv=$('#lane',r),ly=$('#lyr',r);let run=null,spec=null,alive=true;
    const shTxt=()=>O.shift===songShift(S)?'A tu voz':(O.shift>0?'+':'')+O.shift;
    const tv=toolMount(r,()=>({key:shTxt(),guide:O.guide?'Con guía':'Sin guía',speed:O.speed===1?'Normal':Math.round(O.speed*100)+' %',tol:TOLL[DB.tol||50],meta:`${S.bpm} bpm · ${S.beats}/4 · tono ${O.shift===0?'original':O.shift===songShift(S)?'ajustado a tu voz':(O.shift>0?'+':'')+O.shift+' semitonos'}`}));
    const paint=()=>{go.innerHTML=playLbl(!!run,'Cantar','Detener');$('#shv',r).textContent=shDesc(O.shift);const b=DB.best['song:'+id];$('#dbest',r).textContent=b!=null?'Récord '+Math.round(b*100)+' %':'';$('#ddock',r).textContent=run?(MIC.stream?'Calificando':'Sin micrófono'):'Lista';tv()};
    const clearLy=()=>{ly.classList.remove('live');$$('.lyl',ly).forEach(p=>p.classList.remove('cur','nxt','past'));$$('.syl',ly).forEach(s=>{s.classList.remove('go','hit','miss');s.style.removeProperty('--sd')})};
    const setLine=li=>{ly.classList.add('live');$$('.lyl',ly).forEach(p=>{const k=+p.dataset.li;p.classList.toggle('cur',k===li);p.classList.toggle('nxt',k===li+1);p.classList.toggle('past',k<li)});const c=$(`.lyl[data-li="${li}"]`,ly);if(c){const rc=c.getBoundingClientRect();if(rc.top<innerHeight*.25||rc.bottom>innerHeight*.75)c.scrollIntoView({block:'center',behavior:'smooth'})}};
    let lastLi=-1,lastG=null;
    const onNote=(g)=>{
      if(lastG&&lastG.n>0){const sp=$(`.lyl[data-li="${lastG.li}"] .syl[data-si="${lastG.si}"]`,ly);if(sp){const s=lastG.h/lastG.n;sp.classList.toggle('hit',s>=.6);sp.classList.toggle('miss',s<.3)}}
      lastG=g;if(!g)return;
      if(g.li!==lastLi){lastLi=g.li;setLine(g.li)}
      if(g.syl!==''){const sp=$(`.lyl[data-li="${g.li}"] .syl[data-si="${g.si}"]`,ly);if(sp){let end=g.t1;spec.targets.forEach(x=>{if(x.li===g.li&&x.si===g.si&&x.t1>end)end=x.t1});sp.style.setProperty('--sd',(end-g.t0).toFixed(2)+'s');sp.classList.add('go')}}
    };
    const preview=()=>{if(!ac())return;spec=songSpec(S,O);const st={C:laneColors(),targets:spec.targets,trail:[],sec:4};const t=spec.targets[0].t0-.6;const p=()=>{if(alive&&!run)laneDraw(cv,st,t)};p();setTimeout(p,60)};
    const finish=sp=>{
      run=null;micStop();
      if(!sp){clearLy();paint();preview();return}
      const sc=specScore(sp);markDay();
      if(sc==null){$('#dres',r).innerHTML='<div class="card center"><p class="sub" style="margin:0">Canción completa. Activa el micrófono para que la app te califique.</p></div>';paint();return}
      const prev=DB.best['song:'+id],rec=prev==null||sc>prev;if(rec)DB.best['song:'+id]=sc;save();
      const rows=spec.lines.map(L=>{const gs=sp.targets.filter(g=>g.li===L.li&&g.n>0);return[String(L.li+1),gs.length?gs.reduce((a,g)=>a+g.h/g.n,0)/gs.length:0]});
      $('#dres',r).innerHTML=resultHTML(sc,rows,rec?'¡Nuevo récord!':'Récord: '+Math.round(prev*100)+' %','<p class="cap" style="margin:0">Cada barra es un renglón de la letra. Repite los renglones bajos a 75 % de velocidad.</p><button class="btn" data-again>'+IC.redo+'Otra vez</button>');
      if(rec&&sc>=.7)bell();paint();$('#dres',r).scrollIntoView({block:'nearest',behavior:'smooth'});
    };
    const start=async()=>{
      $('#dres',r).innerHTML='';$('#dmsg',r).innerHTML='';if(!ac())return;clearLy();lastLi=-1;lastG=null;
      await micStart(null,k=>{$('#dmsg',r).innerHTML=micErrHTML(k)+'<p class="cap">Puedes cantar sin calificación.</p>'});
      spec=songSpec(S,O);
      run=practiceRun(cv,spec,{sec:4,onNote,onSeg:s=>{if(s&&s.ph==='C')ly.classList.add('live')},onEnd:finish});
      paint();
    };
    go.onclick=()=>{if(run){run.stop();return}start()};
    r.addEventListener('click',e=>{
      if(e.target.closest('[data-again]')){start();return}
      const sh=e.target.closest('[data-sh]');if(sh){O.shift=sh.dataset.sh==='auto'?songShift(S):Math.max(-12,Math.min(12,O.shift+ +sh.dataset.sh));DB['shift:'+id]=O.shift;save();if(run)run.stop();preview();paint();return}
      const tg=e.target.closest('[data-tg]');if(tg){const k=tg.dataset.tg;O[k]=!O[k];DB[k==='guide'?'sguide':'schords']=O[k];save();tg.setAttribute('aria-pressed',String(O[k]));paint();return}
      const s=e.target.closest('[data-set]');if(s){const k=s.dataset.set;if(k==='speed')O.speed=+s.dataset.v;else if(k==='tol')DB.tol=+s.dataset.v;save();$$(`[data-set="${k}"]`,r).forEach(x=>x.setAttribute('aria-pressed',String(x===s)));if(run&&k==='speed')run.stop();preview();paint()}
    });
    paint();preview();
    return()=>{alive=false;if(run)run.stop();micStop()};
  }};
}

   <div class="row" style="justify-content:center"><button class="btn pri" data-onb="rango">${IC.range}Medir mi rango ahora</button><button class="btn sm" data-onb="no">Luego</button></div></div>`;
  document.body.appendChild(d);
  d.addEventListener('click',e=>{const b=e.target.closest('[data-onb]');if(!b)return;const k=b.dataset.onb;
    if(k==='grave'||k==='aguda'){DB.vt=k;save();$$('[data-onb="grave"],[data-onb="aguda"]',d).forEach(x=>x.classList.toggle('pri',x===b));return}
    DB.onb=1;save();d.remove();if(k==='rango')location.hash='#/practicar/rango';else route()});
}
function viewLessons(){
  return{title:'Lecciones',html:`<div class="lhead"><span class="eyebrow">${LESSONS.length} lecciones · ${ALLEX.length} ejercicios</span><h1>Lecciones</h1><p class="sub">Técnica vocal paso a paso: primero el aire, luego el sonido, la afinación, tu rango y el cuidado de tu voz.</p></div>
  <section class="albsec"><div class="albs">${LESSONS.map(l=>lessonAlb(l.id)).join('')}</div></section>`};
}
function refreshProgress(){const el=$('#lprog');if(!el)return;const l=+el.dataset.l,[d,t]=doneCount(l);el.querySelector('i').style.width=(d/t*100)+'%';const c=$('#lcnt');if(c)c.textContent=`${d} de ${t} ejercicios hechos`}
function viewLesson(id,exId){
  const l=LESSONS.find(x=>x.id===id);if(!l)return viewLessons();
  const body=l.blocks.map((b,bi)=>blockHTML(b).replace(/^(\s*<\w+)/,`$1 data-nb="${bi}"`)).join('');
  const prev=LESSONS.find(x=>x.id===id-1),next=LESSONS.find(x=>x.id===id+1),[d,t]=doneCount(id);
  return{title:'Lección '+id,back:'#/lecciones',html:`
  <div class="lhead"><div class="lhero"><span class="acov">${lessonArt(id)}</span><div><span class="eyebrow">Lección ${id} de ${LESSONS.length}</span><h1>${l.title}</h1></div></div><p class="lead">${l.lead}</p>
  ${HAS_TTS?`<div><button class="btn pri" data-narr="start" data-l="${id}">${IC.voice}Escuchar la lección</button></div>`:''}
  <div><div class="bar" id="lprog" data-l="${id}"><i style="width:${d/t*100}%"></i></div><p class="cap" id="lcnt" style="margin-top:6px">${d} de ${t} ejercicios hechos</p></div></div>
  ${body}
  <div class="row" style="justify-content:space-between">${prev?`<a class="btn" href="#/leccion/${prev.id}">${IC.back}Lección ${prev.id}</a>`:'<span></span>'}${next?`<a class="btn pri" href="#/leccion/${next.id}">Lección ${next.id}</a>`:''}</div>`,
  mount(r){
    paintEx(r);paintNarr();
    if(exId){const el=$('#ex-'+exId,r);if(el)setTimeout(()=>el.scrollIntoView({block:'start',behavior:'smooth'}),60)}
    return()=>narrStop(true);
  }};
}
function viewPractice(){
  return{title:'Practicar',html:`<div class="lhead"><span class="eyebrow">Herramientas y calentamientos</span><h1>Practicar</h1></div>
  ${warmCard()}
  <div class="grid2">${toolCards()}</div>
  <section><div class="sech"><h2>Calentamientos</h2></div><p class="cap" style="margin:-4px 0 12px">La app toca el patrón, tú lo repites y el micrófono te califica nota por nota. Cada ronda sube medio tono dentro de tu rango.</p><div class="albs">${DRILLS.map(drillAlb).join('')}</div></section>`};
}
function viewWarmup(){
  const step=(k,i)=>{const done=DB.today[k]===today();if(k==='respira')return`<a class="srow wrow${done?' done':''}" href="#/practicar/respiracion"><span class="sart">${coverArt(180,TART.breath[1],null,'wr')}</span><span class="st"><b>${i+1}. Respiración 4-4-8</b><span>Cinco ciclos para despertar el aire</span></span><span class="wk">${done?IC.check:''}</span></a>`;
    const d=drillById(k);return`<a class="srow wrow${done?' done':''}" href="#/practicar/ej/${k}"><span class="sart">${drillArt(d)}</span><span class="st"><b>${i+1}. ${d.t}</b><span>${d.sub} · ${d.syl}${DB.best[k]!=null?' · récord '+Math.round(DB.best[k]*100)+' %':''}</span></span><span class="wk">${done?IC.check:''}</span></a>`};
  const nx=WARMUP.find(k=>DB.today[k]!==today());
  return{title:'Calentamiento de hoy',back:'#/practicar',html:`<div class="kplay tplay">
  ${toolHead('rt','Calentamiento de hoy','10 minutos · de suave a fuerte')}
  <div class="slist">${WARMUP.map(step).join('')}</div>
  <p class="cap">Descansa 20 segundos entre ejercicios. Cada paso se palomea al terminarlo; mañana empieza de nuevo.</p>
  ${toolDock(`<span class="tm">${warmDone()} de ${WARMUP.length} hechos</span><div class="ktrans"><a class="kplayb" href="${nx?(nx==='respira'?'#/practicar/respiracion':'#/practicar/ej/'+nx):'#/canciones'}" aria-label="${nx?'Siguiente paso':'Cantar una canción'}">${IC.play}<span>${nx?'Siguiente':'Cantar'}</span></a></div><span></span>`)}
  </div>`,mount(r){const m=$('#tmeta',r);if(m)m.textContent=warmDone()===WARMUP.length?'Completo por hoy':'Haz los pasos en orden'}};
}
function viewSongs(){
  return{title:'Canciones',html:`<div class="lhead"><span class="eyebrow">Canta con la línea de tu voz</span><h1>Canciones</h1><p class="sub">Melodías tradicionales y ejercicios cantados. La app las pone en el tono de tu voz; la letra se ilumina sílaba por sílaba.</p></div>
  <div class="slist">${SONGLIST.map(s=>{const b=DB.best['song:'+s.id];return`<a class="srow" href="#/canciones/${s.id}"><span class="sart">${songArt(s)}</span><span class="st"><b>${esc(s.title)}</b><span>${esc(s.artist)}${b!=null?' · récord '+Math.round(b*100)+' %':''}</span></span><span class="sk">${s.bpm} bpm</span></a>`}).join('')}</div>
  <p class="cap">Próximamente: pega la letra de tus canciones favoritas como en el cancionero de Roka Guitar.</p>`};
}
/* ---------- enrutador ---------- */
const NAV=[['#/','Inicio',IC.home,''],['#/lecciones','Lecciones',IC.book,'leccion'],['#/practicar','Practicar',IC.mic,'practicar'],['#/canciones','Canciones',IC.note,'canciones']];
let UNMOUNT=null;
function route(){
  const h=location.hash.replace(/^#\/?/,''),p=h.split('/');
  let v;
  if(UNMOUNT){try{UNMOUNT()}catch(e){}UNMOUNT=null}
  if(!p[0])v=viewHome();
  else if(p[0]==='lecciones')v=viewLessons();
  else if(p[0]==='leccion')v=viewLesson(+p[1],p[2]);
  else if(p[0]==='practicar')v=p[1]==='ej'?viewDrill(p[2]):({afinador:viewTuner,rango:viewRange,respiracion:viewBreath,metronomo:viewMetronome,calentamiento:viewWarmup}[p[1]]||viewPractice)();
  else if(p[0]==='canciones')v=p[1]?viewSing(p[1]):viewSongs();
  else v=viewHome();
  const sec=p[0]===''?'':p[0]==='lecciones'?'leccion':p[0];
  $$('[data-nav]').forEach(a=>{const on=a.dataset.nav===sec;if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  $('#ttl').textContent=v.title;
  const bk=$('#back');bk.hidden=!v.back;if(v.back)bk.href=v.back;
  // página nueva en cada vista: así no se acumulan los clics de vistas anteriores
  const old=$('#page'),pg=old.cloneNode(false);old.replaceWith(pg);pg.innerHTML=v.html;
  document.title=v.title==='Roka Couch Vocal'?v.title:v.title+' · Roka Couch Vocal';
  if(v.mount)UNMOUNT=v.mount(pg)||null;
  if(!(p[0]==='leccion'&&p[2]))window.scrollTo(0,0);
}
/* ---------- arranque ---------- */
document.body.insertAdjacentHTML('afterbegin',`<div class="shell">
 <nav class="side" aria-label="Secciones"><div class="brand"><span class="logo">${logo()}</span>Roka<br>Couch Vocal</div>${NAV.map(([h,l,ic,k])=>`<a href="${h}" data-nav="${k}">${ic}${l}</a>`).join('')}</nav>
 <main><header class="topbar"><div class="in"><a class="icon-btn" id="back" href="#/" aria-label="Volver" hidden>${IC.back}</a><span class="ttl" id="ttl"></span></div></header><div class="page" id="page"></div></main>
</div>
<nav class="tabs" aria-label="Secciones">${NAV.map(([h,l,ic,k])=>`<a class="tab" href="${h}" data-nav="${k}">${ic}${l}</a>`).join('')}</nav>`);
save();
window.addEventListener('hashchange',route);
route();
/* Actualizaciones: busca versión nueva al abrir y al volver a la app; avisa cuando está lista. */
function showUpdate(){
  if(document.getElementById('upd'))return;
  const d=document.createElement('div');d.id='upd';d.className='player upd';
  d.innerHTML='<span class="dotlive"></span><span class="pl">Hay una versión nueva de la app</span><button class="btn sm pri" id="updgo">Actualizar</button>';
  document.body.appendChild(d);d.querySelector('#updgo').onclick=()=>location.reload();
}
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  let hadCtl=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadCtl){hadCtl=true;return}if(!SEQ.id&&!MIC.stream)location.reload();else showUpdate()});
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
      const chk=()=>reg.update().catch(()=>{});
      document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk()});
      setInterval(chk,30*60*1000);chk();
    }).catch(()=>{});
  });
}


</script>
</body>
</html>
